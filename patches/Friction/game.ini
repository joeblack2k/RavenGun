; Voorbereid in pass 1 (docs/goal-90-native.md): profiel uit het TeknoParrot-sjabloon, herkenning gemeten aan de NAS-map "Friction"
; (alleen gelezen), invoerroute gekozen naar het EmulationProfile. Niet gestart.

[Game]
Name = Friction
Profile = Friction
Executable = Friction.exe
Type = OpenParrot
EmulationProfile = Friction
ProfileRevision = 5

[Launch]
Mode = direct
; DXVK en de native D3DX9_42 + D3DCompiler_42 uit de DirectX-redist van Steam (docs/redist.md): met Wine's d3dx9 compileerden de
; HLSL-shaders niet ("Shader UI_VS is not supported"); hiermee komen de laadschermen in beeld (2026-10-15). Daarna blijft het level
; zwart, ook op 1920x1080 en met de echte invoerindeling: open.
Dxvk = true
NativeDlls = d3dx9_42, d3dcompiler_42

[Wine]
; Direct3D 9 via DXVK: met wined3d faalt CD3D9HLSLShaderProgram::isSupported ("Shader UI_VS is not supported by the target hardware", 2026-10-14).
Prefix = ravengun-test-dxvk
DllOverrides = d3d9=n,b
Runner = wrapper

[Display]
; Gemeten 2026-10-15 (rg-compat-meetdraad, perf): onder gamescope draait de hoofddraad eindeloos in UpdateWindow
; (NtUserRedrawWindow: Wine's berichtenlus, process_wine_clipcursor/clip_fullscreen_window, ~100.000 contextwissels per s), zowel
; schermvullend als in een venster; beeld zwart. Zonder gamescope (schermvullend, 1920x1080) tekent hij wel: "ALLOCATING MEMORY
; POOLS" met 60 fps; daarna zwart met 4 draw calls en 7 fps, en het venster verdwijnt achter het bureaublad. Nog niet opgelost;
; daarom blijft gamescope hier aan (dan staat er tenminste geen bureaublad op de tv).
; Met rg-compat RG_COMPAT_PAINT=1 (UpdateWindow stuurt WM_PAINT een keer, zoals Windows) en Windowed = 1 op 1920x1080 komt hij
; onder gamescope wel in beeld: "LOADING LEVEL" met plaatje, ~7 fps; daarna stopt hij na ~2,5 min zelf (exitcode 0). Nog niet in
; dit profiel: hij is daarmee nog niet speelbaar.
Gamescope = true
GamescopePath = /usr/bin/gamescope

[Input]
Route = tp-shm
Layout = Friction
Note = tp-shm, indeling Friction (TeknoParrotUi FrictionPipe)

[Status]
Status = working
Note = WERKT (2026-10-17, gespeeld in muismodus, 5,5 min: munt (INSERT COINS -> PRESS START), START, levelkeuze, in het spel met score). Start via dubbelklik (2026-10-17): met Windowed = 1 in gamescope de attract (FRICTION, 2 COINS PER PLAY), beeld 4:3. Spelen nog niet gemeten.
NoteEN = WORKING (2026-10-17, played in mouse mode for 5.5 min: coin, start, level select, in the game with score). Starts by double-click (2026-10-17): with Windowed = 1 under gamescope the attract shows (4:3). Play not measured.


