[Patch: Healthbar-hoogte (0x2AACFC)]
Enabled = false
Kind = memory
Category = graphics
AppliedBy = core
Module = game.exe
Offset = 0x2AACFC
Action = replace-bytes
Size = 4
Find = 00 C0 30 44
Replace = 00 C0 24 44
Note = De waarde hoort bij de resolutie. In de exe staat 707.0 (768 - 61); de kern schrijft ResHeight - 61.0 met ResHeight uit .\TeknoParrot.ini. Onze game.ini staat op 1280x720, dus het Replace hier is 659.0 (720 - 61). Zet je de resolutie anders, dan moet Replace mee.
Source = OpenParrot TypeX2Generic.cpp (GPL-3.0), regel 2147
Reason = OpenParrot-commentaar: "Change 2D Health Bars to sit at correct height with new resolution". De kern leest ResolutionHeight uit .\TeknoParrot.ini (standaard 768, regel 2144) en schrijft hier ResHeight - 61.0 in. Alleen documentatie: RavenGun past dit niet toe (AppliedBy = core). De Find is op onze dump gemeten en is wat de fabrikant erin zette: 707.0, dus voor 768 lijnen (768 - 61 = 707.0).

