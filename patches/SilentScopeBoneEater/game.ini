; Silent Scope: Bone Eater (Konami, 64 bits, TeknoMacaw). Een geweer met scope; de scope komt bij ons als overlay op hetzelfde scherm.
[Game]
Name = Silent Scope: Bone Eater
Profile = SilentScopeBoneEater
Executable = arkndd.dll
Type = TeknoMacaw
EmulationProfile = KonamiAcio
Is64Bit = true
ProfileRevision = 17
Patreon = true

[Launch]
Mode = direct
; DXVK: met wined3d bleef het zwart (2026-10-17)
Dxvk = true
; Wine's GdipPrivateAddMemoryFont neemt geen TrueType-collectie aan; het spel stopte met "No font loaded or no font families data
; in font file" (WindowsFont.cpp). De drie collecties die gamendd.dll via GDI+ laadt worden in de view face 0 als losse font.
ViewRealDirs = data/font
ViewTtcAsTtf = data/font/df_heiseigothic_w5.ttc, data/font/df_heiseigothic_w7.ttc, data/font/df_sougei_w5.ttc

[Display]
Gamescope = true

[Input]
Route = tp-shm
Layout = KonamiAcio

[Status]
Status = untested
Note = Start via dubbelklik (2026-10-17): TeknoMacaw64 met DXVK in gamescope, regio Asia: WARNING-scherm in het Engels, daarna de attract (ranglijst, FREE PLAY). Het beeld is staand (de kast heeft een staand scherm), midden in 16:9. Nodig: DXVK (met wined3d zwart) en ViewTtcAsTtf (Wine's GDI+ neemt geen .ttc aan). Invoer (KonamiAcio) nog niet gemeten.
NoteEN = Starts by double-click (2026-10-17): TeknoMacaw64 with DXVK in gamescope, region Asia: English warning, then the attract (ranking, free play). Portrait picture centred in 16:9 (the cabinet has a portrait screen). Input not measured yet.

; Profiel uit TeknoParrot-sjabloon GameProfiles/SilentScopeBoneEater.xml, revisie 17 (scripts/import-tp-profiles.py). Met de hand: Input API RawInput, DisplayMode Windowed (gamescope), Region Asia (Engels), Screen Layout Single Screen Scope.
