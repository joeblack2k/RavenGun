; Drop-in van RavenGun voor Mario Kart Arcade GP DX (Namco ES3, 32-bits PE onder Wine).
;
; rg-mfcam.dll   de Media Foundation-camera van RavenGun (tools/rg-mfcam/rg_mfcam.cpp; bouwen: scripts/build-mfcam.sh)
;
; WAAROM
; ------
; Het spel maakt een spelersfoto met de camera van de kast en zoekt die via Media Foundation (MF.dll!MFEnumDeviceSources, daarna
; MFCreateSourceReaderFromMediaSource). Wine kent daar geen videocamera's: MFEnumDeviceSources geeft er 0 (gemeten in mf.dll van
; proton-11.0-2). Deze DLL zet die ene invoer in de importtabel van MK_AGP3_FINAL.exe om en biedt de camera van de daemon aan
; (het beeld staat in /dev/shm/ravengun_Camera zolang de daemon de camera voor deze game aan heeft: [Camera] Use = game).
; Zonder dat bestand roept hij gewoon de oorspronkelijke functie aan: dan is alles zoals zonder drop-in.
;
; HOE JE CONTROLEERT DAT HIJ GELADEN IS
; -------------------------------------
;   1. rg-direct --plan MarioKartDX: bij dropin_lines staat rg-mfcam.dll met TP_PRELOAD_DLL;
;   2. in de view staat na de start rg-mfcam.log met als eerste regel "rg-mfcam geladen in ...MK_AGP3_FINAL.exe" en daarna
;      "importtabel: MF.dll!MFEnumDeviceSources omgezet". Zonder dat logboek is de DLL niet geladen;
;   3. vraagt het spel om een camera, dan staat er "MFEnumDeviceSources #1 (VIDCAP): 1 camera", "ActivateObject", "Start: ..."
;      en "beeld 1 geleverd".

[rg-mfcam.dll]
To = .
Preload = true
; Een Windows-PE-DLL, geen ELF: niet in LD_AUDIT (docs/dropins.md, "Audit = false").
Audit = false
