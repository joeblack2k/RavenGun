; RavenGun drop-in for Mario Kart Arcade GP DX (Namco ES3, 32-bit PE under Wine).
;
; rg-mfcam.dll   RavenGun's in-process helper for this game (tools/rg-mfcam/rg_mfcam.cpp; build: tools/dev/build-mfcam.sh).
;                It started as the Media Foundation camera and now also stands in for the cabinet hardware and services
;                the game expects, so the game runs without the closed TeknoParrot core. Each part has its own switch
;                in Env below; with the TeknoParrot core in the process every part stays off.
;
; WHY
; ---
; The game takes a player photo with the cabinet camera and finds it through Media Foundation (MF.dll!MFEnumDeviceSources,
; then MFCreateSourceReaderFromMediaSource). Wine has no video cameras there: MFEnumDeviceSources returns 0 (measured in mf.dll
; of proton-11.0-2). This DLL redirects that one import of MK_AGP3_FINAL.exe and offers the daemon's camera (the picture is in
; /dev/shm/ravengun_Camera while the daemon has the camera on for this game: [Camera] Use = game). Without that file it calls
; the original function: then everything is as without the drop-in.
;
; HOW TO CHECK THAT IT IS LOADED
; ------------------------------
;   1. rg-direct --plan MarioKartDX: dropin_lines lists rg-mfcam.dll with TP_PRELOAD_DLL;
;   2. after a start the view has rg-mfcam.log; its first line names MK_AGP3_FINAL.exe, then the redirected imports. Without
;      that log the DLL was not loaded;
;   3. when the game asks for a camera the log shows "MFEnumDeviceSources #1 (VIDCAP): 1 camera", "ActivateObject", "Start: ..."
;      and "frame 1 delivered".

[rg-mfcam.dll]
To = .
Preload = true
; A Windows PE DLL, not ELF: not in LD_AUDIT (docs/dropins.md, "Audit = false").
Audit = false
; The parts, all on by default (each one is described at the top of rg_mfcam.cpp and in its header):
;   RG_JVS_COMPORT=COM3      JVS: the game opens COM3 (CreateFileA at 0x8AC1F2); that becomes the pipe \\.\pipe\TeknoParrot_JVS
;                            (the bridge rg-jvsbridge makes it, the daemon is the MKDX board behind it).
;   RG_STR_COMPORT=COM1      the STR board (steering, force feedback status) on COM1, answered by a thread in the DLL (str_board.h).
;   RG_WINDOWED=1            start the game windowed, like TeknoParrot's Windowed=1 (window_mode.h); gamescope scales it.
;   RG_BNGRW=fake            the two Banapass card readers of bngrw.dll, without a card (bngrw_fake.h).
;   RG_SHAREK_FAKE=1         the ShareK client object (content distribution between cabinets) answers "distribution off".
;   RG_DRIVE_FIXUP=F         the game's F:/ paths go to the view (drive_fix.h); without it its settings stay *.tmp.
;   RG_DONGLE=fake           the USB dongle (usb_dongle.h): the game walks the USB tree for vendor 0B9A product 0C10 and checks
;                            the serial number string. RG_DONGLE_USB / RG_DONGLE_SERIAL describe the device. The serial is not
;                            taken from any real dongle: it is built from the format the game checks (0x607D18: twelve digits,
;                            "2710", a digit 0-4 or 9, any digit, "02", four digits).
;   RG_AMAUTH_FAKE=1         the AMAuthd IAuth object (ALL.Net authentication) in the process, as an offline cabinet.
;   RG_CONTENT_ROUTER=192.168.112.254  the store content router answers the game's pings (content_router.h). The address is
;                            the game's own (MK_AGP3_FINAL.exe 0x9B0800); without a reply the game shows E05-01 at boot
;                            and E05-05 (local network error) two minutes later.
;   RAVENGUN_PATCHMEM_FILE   the memory patches in patchmem.txt (ravengun-patchmem32.dll).
Env = RG_JVS_COMPORT=COM3;RG_STR_COMPORT=COM1;RG_WINDOWED=1;RG_BNGRW=fake;RG_SHAREK_FAKE=1;RG_DRIVE_FIXUP=F;RG_DONGLE=fake;RG_DONGLE_USB=0b9a:0c10;RG_DONGLE_SERIAL=271010020001;RG_AMAUTH_FAKE=1;RG_CONTENT_ROUTER=192.168.112.254;RAVENGUN_PATCHMEM_FILE=patchmem.txt

; rg-compat.dll  the measuring tool of docs/rg-compat.md. Not a preload (that slot belongs to rg-mfcam.dll); rg-mfcam loads
;                it itself when RG_COMPAT_SAMPLE is set. It writes the hottest spots per thread to %TEMP%\rg-compat-<pid>.txt
;                in the prefix.
[rg-compat.dll]
To = .

; ravengun-patchmem32.dll  our own memory engine (memory/src, docs/memory-engine.md). The preload slot belongs to
;                          rg-mfcam.dll, which loads the engine itself when RAVENGUN_PATCHMEM_FILE is set. See patchmem.txt.
[ravengun-patchmem32.dll]
To = .

[patchmem.txt]
To = .
