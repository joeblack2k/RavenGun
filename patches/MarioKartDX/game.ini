; Mario Kart Arcade GP DX (Namco ES3, 32-bits Windows, D3D11). Profielmap MarioKartDX; de spelmap op de NAS is
; "Mario Kart DX" en dat is versie 1.18.16 (Data/DongleData en Data/Phys aanwezig, geen AMCUS/WritableConfig.ini: de indeling van
; 1.18.16 in findings/mkdx_research.md). Het profiel hieronder volgt daarom het TeknoParrot-sjabloon MKDX118.xml (revisie 12).
; Er is geen sjabloon met de naam MarioKartDX, dus scripts/import-tp-profiles.py werkt hier niet; de profielsecties zijn met de hand
; uit MKDX118.xml overgenomen (zelfde velden, typen en standaardwaarden).
;
; Start: rg-direct (geen TeknoParrotUi, geen script). De keten is dezelfde als bij TeknoParrot: lader + de gesloten 32-bits kern
; (TeknoParrot/TeknoParrot.dll) + MK_AGP3_FINAL.exe. Netwerk, invoer en camera: zie NETWERK-INVOER-CAMERA.md in deze map.

[Game]
Name = Mario Kart Arcade GP DX
Profile = MarioKartDX
Type = TeknoParrot
EmulationProfile = NamcoMkdx
Executable = MK_AGP3_FINAL.exe
ProfileRevision = 12
; ZWART BEELD (open, 2026-10-18): op de kast start sharek.ps1 in een lus ShareK\ShareK.exe, de
; content-distributie-server tussen kasten. Het spel praat daar via ipccl.dll (ShareK-client) mee
; en blijft op een zwart beeld wachten tot die server er is. De engine KAN hem als tweede
; programma starten (HasTwoExecutables + LaunchSecondExecutableFirst + [Identify] Path2 +
; [Launch] SecondWait, buiten gamescope), maar ShareK.exe valt onder wine-mono zelf om:
; "System.NullReferenceException at ShareK.Program.Main [0x0002d]" (ook los, met
; ShareK.exe.config ernaast). Hij leest E:\WritableConfig.ini; een zelfgemaakte variant hielp
; niet. Nodig: echt .NET Framework 4.5 in de prefix, of uitzoeken welke configwaarde Main als
; eerste leest (mono's ConfigurationManager?). Zonder die server blijft het beeld zwart.

[Launch]
; Zonder TeknoParrotUi: de daemon start de game zelf (rg-direct) en is het JVS-bord achter de pipe TeknoParrot_JVS.
Mode = direct
; De hoofdthread 16 MiB stapel in plaats van de 1 MiB uit de PE-kop (SizeOfStackReserve 0x100000, gemeten met objdump -p).
; Onder Wine krijgt de hoofdthread precies die waarde. TeknoParrot start deze game onder Wine (Winlator) zelf ook vanaf een kopie van
; MK_AGP3_FINAL.exe met dezelfde naam en 16 MiB stapel (TeknoParrotUI-bron, Tools/InputMethodAudit/AndroidManagedImportTest.cs:
; "Mario Kart DX patches an exact-name sixteen MiB stack copy"; requiredStackReserve = 16L * 1024L * 1024L). De engine zet die kopie
; in de view (MK_AGP3_FINAL.exe wordt een lokaal bestand van 7,4 MB, de koppeling naar de NAS blijft als
; MK_AGP3_FINAL.exe.ravengun-orig staan); op de NAS verandert niets. Zie NETWERK-INVOER-CAMERA.md, "Stopt na 27 s".
StackReserve = 16M
; Direct3D 10 via DXVK (Vulkan) in plaats van wined3d (OpenGL), docs/dxvk.md. Met wined3d ontbrak de hele 2D-laag (geen tekst,
; geen menu's, geen FREE PLAY) en gaf het logboek 144.000 keer GL_INVALID_OPERATION; met DXVK v2.7.1 staat alles in beeld (2026-10-15).
Dxvk = true
; Het eerste effect (0x835e20 -> 0x838940) is Polygon2D_D3D10.fx als HLSL-BRON (D3DX10CreateEffectFromFileA, fx_4_0); de 23 andere
; laadt het voorgecompileerd (*.cfx). Wine's d3dx10_43 compileert deze bron niet: 0x80004001 (E_NOTIMPL), gemeten 2026-10-15 met de
; pHResult-reparatie van rg-mfcam.dll (zonder die reparatie las het spel stapelrommel, NETWERK-INVOER-CAMERA.md 5e). Het spel levert
; het effect ook voorgecompileerd mee (Polygon2D_D3D10.cfx); Wine's d3dx10 slaat de compiler over voor een blok dat met DXBC begint.
; Daarom wordt het .fx in de VIEW een symlink naar het .cfx (niets op de NAS). Zie NETWERK-INVOER-CAMERA.md, 5d.
ViewLinks = Data/System/Shader/Polygon2D_D3D10.fx -> Data/System/Shader/Polygon2D_D3D10.cfx
; De Engelse fanvertaling ([Mod english] hieronder) staat standaard aan; "none" = het Japanse origineel. In de app: Properties,
; "Language". De gepatchte bestanden komen alleen in de view (via een lokale cache), nooit op de NAS.
Mod = english

; MKDX English Mod 2023 (Harm, Deidos, TattooHanz, Genjuro, Seam; github.com/Harmmmm/MKDX-English-Mod), voor versie 1.18: teksten
; (txbn), texturen in de .pac-archieven en een paar losse texturen. files.csv per regel: doel (in de gamemap), bestand (in Root),
; offset of "replace". Bij een offset schrijft de patcher van de mod (MKDX-Patcher-1.18.exe) het hele bestand op die plaats in het doel;
; "replace" vervangt het doel. De patcher weigert een andere exe dan md5 d37248b8711df6a92e04acef8f59a874 (= ExeSha256 hieronder).
; Ophalen: scripts/fetch-mods.py (install-user.sh doet het ook), naar <data>/mods/MarioKartDX/english/files; niet in git.
[Mod english]
