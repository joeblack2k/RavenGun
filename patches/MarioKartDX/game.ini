PrefixMode = Isolated


; GEMETEN 2026-10-19 10:45-10:52 (F): de twee per-prefix-stappen werken en zijn hier precies
; opgeschreven. Draai ze EEN keer per prefix, vanuit de view-wortel (views/MarioKartDX), met de
; wine van de lader en ZONDER WINEARCH (de prefix is 64-bits; met WINEARCH=win32 weigert wine):
;     WINEPREFIX=<prefixen>/MarioKartDX wine PreprocessAmAuth.exe -wait
; Dat schrijft WritableConfig.ini in de view (views/MarioKartDX/TeknoParrot/E/WritableConfig.ini,
; een echte map in de schrijflaag; de NAS blijft onaangeroerd, met find gecontroleerd) en zegt
; "Checking.ErrorCode : 0 / outPath : WritableConfig.ini / Ok!". In een lege map zeggen dezelfde
; stappen "INI file reading failed" -- het programma heeft zijn eigen bestanden naast zich nodig,
; dus niet in /tmp proberen.
; De klasse zelf staat al in de prefix: HKLM\Software\Classes\CLSID\{4603BB03-058D-43D9-B96F-
; 639BE908C1ED} met LocalServer32 (nagekeken in system.reg). registreren kan met
;     WINEPREFIX=<prefixen>/MarioKartDX wine regsvr32.exe AMCUS/iauthdll.dll
; Wat nog mist: dit automatisch laten gebeuren. De motor kent geen sleutel voor "een keer per
; prefix" ([Launch] kent alleen Mode, View*, SecondWait/SecondArguments en [Loader] Build/Core/Exe),
; dus dat vraagt een motorwijziging of een drop-in die het bij de eerste start doet.
; CORRECTIE EN VERVOLG 2026-10-19 10:54 (F): het bestand moet in de map van AMAuthd staan, niet in
; TeknoParrot/E. PreprocessAmAuth.exe -wait (gedraaid vanuit de VIEW-WORTEL, daar staan zijn eigen
; bestanden) schrijft WritableConfig.ini in TeknoParrot/E/; AMAuthd zoekt het in zijn EIGEN map
; (cwd), dus kopieer het daarna naar AMCUS/:
;     cp views/MarioKartDX/TeknoParrot/E/WritableConfig.ini views/MarioKartDX/AMCUS/
; (AMCUS is een echte map in de schrijflaag; de NAS blijft onaangeroerd -- met find gecontroleerd.)
; Vanuit AMCUS zelf PreprocessAmAuth draaien werkt NIET ("INI file reading failed"): dat programma
; wil zijn eigen bestanden naast zich.
; GEMETEN: met WritableConfig.ini in AMCUS/ blijft AMAuthd.exe -- direct onder wine gestart, zonder
; onze kern -- gewoon draaien (vier processen, geen foutregel). Met onze kern erin stopt hij meteen:
; het laderlogboek zegt "Failed to Load DLL! (Error 4)". De tweede exe (AMAuthd) is dus een gewone
; server die NIET met onze kern geladen moet worden; de motor kent geen sleutel om per exe een andere
; kern (of geen kern) te kiezen. Dat is de volgende stap voor (F).
