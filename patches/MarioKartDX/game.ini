; Mario Kart Arcade GP DX (Namco ES3, 32-bit Windows, D3D11). Profile folder MarioKartDX; the game folder on the NAS is
; "Mario Kart DX", which is version 1.18.16 (Data/DongleData and Data/Phys present, no AMCUS/WritableConfig.ini: the 1.18.16
; layout in findings/mkdx_research.md). The profile below therefore follows the TeknoParrot template MKDX118.xml (revision 12).
; There is no template named MarioKartDX, so scripts/import-tp-profiles.py does not work here; the profile sections were copied
; by hand from MKDX118.xml (same fields, types and defaults).
;
; Start: rg-direct (no TeknoParrotUi, no script). By default with RavenGun's own core and no TeknoParrot files at all; the
; cabinet hardware and services the game expects are stood in for by the drop-in (dropin/dropin.ini, rg-mfcam.dll) and a few
; memory patches (dropin/patchmem.txt). Network, input and camera: see NETWERK-INVOER-CAMERA.md in the research notes.

[Game]
; Two exes: first AMCUS/AMAuthd.exe (Namco's ALL.Net server), then the game. AMAuthd only starts on the TeknoParrot route
; ([Launch] SecondCore below).
Executable2 = AMCUS/AMAuthd.exe
HasTwoExecutables = true
LaunchSecondExecutableFirst = true
Name = Mario Kart Arcade GP DX
Profile = MarioKartDX
Type = TeknoParrot
EmulationProfile = NamcoMkdx
Executable = MK_AGP3_FINAL.exe
ProfileRevision = 12
;
; SHAREK (2026-10-19): on the cabinet init_w10.ps1 does two things: `RegAsm.exe .\ipccl.dll` (the .NET ShareK client) and then
; ShareK\ShareK.exe in a loop via sharek.ps1. The game talks to that server through ipccl.dll. ShareK.exe falls over under
; wine-mono (NullReferenceException in Main) and needs real .NET Framework 4.5. Our route does not use it: the drop-in answers
; the ShareK client in the process (RG_SHAREK_FAKE) and patchmem.txt opens the status gate at 0x48149A
; (docs/research/namco/README.md).
;
; ALL.NET IAUTH (measured 2026-10-19): at startup the game asks CoCreateInstance(CLSID {4603BB03-058D-43D9-B96F-639BE908C1ED},
; CLSCTX_LOCAL_SERVER, IID {045A5150-...}) and got CLASS_E_CLASSNOTREG. Needed per prefix: first PreprocessAmAuth.exe -wait
; (which writes WritableConfig.ini) and then registering AMCUS/iauthdll.dll with regsvr32; then that call returns hr 0. The
; engine does that itself, once per prefix: see [Launch] PrefixSetup below. On our route the drop-in answers IAuth in the
; process as an offline cabinet (RG_AMAUTH_FAKE).
[Launch]
; Folders the game writes in itself (owner decision 2026-10-19): in the view a real folder with a copy of the NAS content,
; never a link to the NAS. Relative to the root of the view (the working directory). Mario Kart writes WritableConfig.ini in AMCUS/.
ViewWritable = AMCUS
; One-time steps per prefix (owner decision 2026-10-19; engine feature since review 13): the steps below run once per prefix and
; get ONE stamp for the whole list (<prefix>/.ravengun-prefixsetup/<sha256 of the list>.done). A copy step runs again when its
; target is missing (the stamp is per prefix, the target per view).
; MEASURED 2026-10-19 12:14 on a FRESH prefix (a copy, with the old WritableConfig.ini removed): PreprocessAmAuth.exe -wait writes
; its file to <prefix>\drive_c\windows\WritableConfig.ini (not to the game folder and not to TeknoParrot/E/), and with
; prefix:drive_c/windows/... as source it then lands in the view. The runner rebuilds the source with the prefix of that moment
; (review 13, point 4), so plan and start cannot drift apart.
PrefixSetup = run . PreprocessAmAuth.exe -wait | copy prefix:drive_c/windows/WritableConfig.ini WritableConfig.ini | copy prefix:drive_c/windows/WritableConfig.ini AMCUS/WritableConfig.ini | run AMCUS regsvr32.exe /s iauthdll.dll
; The second exe (AMAuthd, the ALL.Net server) is not a game: with our core in it, it stops at once with
; "Failed to Load DLL! (Error 4)" (measured 2026-10-19). That is why it starts bare.
SecondBare = true
; And only with the TeknoParrot core (Properties > Online play = TeknoParrot), which talks to it for online play. On our own
; core the drop-in answers IAuth inside the game (RG_AMAUTH_FAKE), so AMAuthd is not needed; it only put a console window on
; the desktop at every start (the owner asked about it, 2026-10-20).
SecondCore = teknoparrot
; Wine's HID bus stays off the host's hidraw devices, so the Steam Controller keeps its gamepad device while the game runs
; (the reasoning and the measurement are in the file itself).
Registry = data/winebus-no-hidraw.reg
Mode = direct
; The main thread gets a 16 MiB stack instead of the 1 MiB in the PE header (SizeOfStackReserve 0x100000, measured with objdump -p).
; Under Wine the main thread gets exactly that value. TeknoParrot also starts this game under Wine (Winlator) from a copy of
; MK_AGP3_FINAL.exe with the same name and a 16 MiB stack (TeknoParrotUI source, Tools/InputMethodAudit/AndroidManagedImportTest.cs:
; "Mario Kart DX patches an exact-name sixteen MiB stack copy"; requiredStackReserve = 16L * 1024L * 1024L). The engine puts that
; copy in the view (MK_AGP3_FINAL.exe becomes a local file of 7.4 MB, the link to the NAS stays as MK_AGP3_FINAL.exe.ravengun-orig);
; nothing changes on the NAS. See NETWERK-INVOER-CAMERA.md, "Stops after 27 s".
StackReserve = 16M
; Direct3D 10 through DXVK (Vulkan) instead of wined3d (OpenGL), docs/dxvk.md. With wined3d the whole 2D layer was missing (no text,
; no menus, no FREE PLAY) and the log showed GL_INVALID_OPERATION 144,000 times; with DXVK v2.7.1 everything is on screen (2026-10-15).
Dxvk = true
; The first effect (0x835e20 -> 0x838940) is Polygon2D_D3D10.fx as HLSL SOURCE (D3DX10CreateEffectFromFileA, fx_4_0); the other 23
; are loaded precompiled (*.cfx). Wine's d3dx10_43 does not compile this source: 0x80004001 (E_NOTIMPL), measured 2026-10-15 with
; the pHResult repair of rg-mfcam.dll (without that repair the game read stack garbage, NETWERK-INVOER-CAMERA.md 5e). The game also
; ships the effect precompiled (Polygon2D_D3D10.cfx); Wine's d3dx10 skips the compiler for a blob that starts with DXBC.
; So in the VIEW the .fx becomes a symlink to the .cfx (nothing on the NAS). See NETWERK-INVOER-CAMERA.md, 5d.
ViewLinks = Data/System/Shader/Polygon2D_D3D10.fx -> Data/System/Shader/Polygon2D_D3D10.cfx
; The English fan translation ([Mod english] below) is on by default; "none" = the Japanese original. In the app: Properties,
; "Language". The patched files only go into the view (through a local cache), never onto the NAS.
Mod = english

; MKDX English Mod 2023 (Harm, Deidos, TattooHanz, Genjuro, Seam; github.com/Harmmmm/MKDX-English-Mod), for version 1.18: texts
; (txbn), textures in the .pac archives and a few loose textures. files.csv per line: target (in the game folder), file (in Root),
; offset or "replace". With an offset the mod's patcher (MKDX-Patcher-1.18.exe) writes the whole file at that place in the target;
; "replace" replaces the target. The patcher refuses any exe other than md5 d37248b8711df6a92e04acef8f59a874 (= ExeSha256 below).
; Fetch: scripts/fetch-mods.py (install-user.sh does it too), to <data>/mods/MarioKartDX/english/files; not in git.
[Mod english]
Title = English fan translation (MKDX English Mod 2023)
Url = https://codeload.github.com/Harmmmm/MKDX-English-Mod/tar.gz/328c2458330cf50a1b77deb143c188b7921201f9
Root = files-1.18
List = files.csv
TreeSha256 = 9d6306b77343c80600df8e2a07c5c3e74fb9107cf688bb3ab701279f3e286003
ExeSha256 = 3c4862309b8a2943b46d9b917f1a28fb900691bbf6201280429e6817e861b785

[Loader]
; By default WITHOUT TeknoParrot (owner's choice 2026-10-17): our own OpenParrot core, generic route (drive letter redirection F:/G:
; from patch 0004), and the drop-in (rg-mfcam.dll) for JVS over COM3 and the rest of the cabinet. ALL.Net is answered offline in
; the process: the game plays offline.
; In the app: Properties > Options > "Online play": Core = teknoparrot puts the closed TeknoParrot core back (needed for online play
; on TeknoParrot's community server; needs the user's TeknoParrot folder; every part of the drop-in then switches itself off).
Core = ravengun
; The loader's default route (RemoteThread = off from _defaults/TeknoParrot.ini): main thread suspended, core loaded with LoadLibrary
; ON the main thread, the core hooks the entry point itself. With that the game reached "Have fun :)" and a swapchain on
; 2026-10-14 20:10/20:13.
; NOT the parked-entrypoint route (EntryPointMs + TP_LOADER_MANAGED_INIT): that gave a #UD at 0x8C753D on 2026-10-14 21:00. The
; closed core 1.0.0.3761 ignores TP_LOADER_MANAGED_INIT and writes E9 + rel32 at the entry point itself in DllMain (remote thread),
; while the main thread is still running the spin loop EB FE there; it executes E9 FE 06 00 00 = jmp 0x8C6E3F+0x6FE = 0x8C753D, in
; the middle of an instruction (f0 = lock prefix for a call). See NETWERK-INVOER-CAMERA.md, section 5c. TeknoParrot itself uses that
; preset only on Android (Box64) and only for MKDX/MKDXUSA106; MKDX118 (1.18) has no Android recipe.
; Trying the parked route again is only possible with a loader carrying RavenGun patch 0008 (thread suspended first, original bytes
; back): in the user layer EntryPointMs = 3000, [Env] TP_LOADER_MANAGED_INIT = 1 and if needed Path = (folder with that loader).

[Display]
; Full screen through gamescope (the profile is on Windowed = 1, 1360x768; gamescope scales that window to the whole screen).
; Was off for a while (2026-10-19) while a black screen was being diagnosed; that was not gamescope (the ShareK gate,
; dropin/patchmem.txt), so it is on again.
Gamescope = true
GamescopePath = /usr/bin/gamescope

[Input]
; As TeknoParrotUi does it (JvsSetup.cs: NamcoMkdx = JVS board NBGI_MarioKart3, Namco commands, 0x18 switches; PipeFactory.cs:
; BanapassButton): wheel, gas, brake and buttons as real JVS packets over the pipe TeknoParrot_JVS to the daemon's MKDX board
; (packaging/jvs-boards.json), and the Banapass card as bit 0 of offset 8 in the shared memory (layout MKDX).
Route = jvs
Board = MKDX
Layout = MKDX
JvsTransport = pipe
Note = JVS over the pipe TeknoParrot_JVS to the daemon's Namco MKDX board (wheel = channel 0, gas = 1, brake = 2; Item, Mario button, Enter, card, Menu Up/Down, Start, Service, Test, coin). The card button also sets bit 0 of offset 8 in the shared memory (BanapassButton).

[Gamepad]
; A gamepad (Xbox controller, Steam Controller) is the wheel and the pedals. Assign in the app: Controllers > Gamepads (a single pad
; becomes player 1 by itself). Each line: <button or axis of the pad> = <signal>; the rest follows the default layout (docs/gamepad.md).
; The signals are those of the MKDX JVS board: trigger = Item, reload = Mario button, grenade = Enter (menu), aux1 = Banapass card,
; btn1/btn2 = Menu Up/Down. So the Move buttons (trigger = Item, ...) and the pad both work.
LeftX = wheel
RT = gas
LT = brake
A = trigger
B = reload
X = grenade
Y = aux1
LB = btn1
RB = btn2
DPadUp = btn1
DPadDown = btn2
Start = start
Back = coin
; Test (the test menu): F2 of the virtual keyboard (the daemon turns that into the board's test switch), on the right stick.
RS = key:f2

[Camera]
; The player photo: the game uses the camera IN the game (Media Foundation). The daemon puts the picture of its camera (the PS Eye)
; for this game in /dev/shm/ravengun_Camera as soon as the IO bridge for this game starts, and the drop-in rg-mfcam.dll offers it in
; the game process as a camera (Wine itself knows no video cameras). "No camera" in the app (Settings, Camera for games) wins.
; The game only asks for the camera when it is on in the test menu (Game settings > Namcam (camera) = ON; set 2026-10-17). The PS Eye
; normally tracks the Move (short exposure); what is still too dark gets a boosted luma (CameraFeedWriter, up to 8x).
Use = game
Device = auto
; Mario Kart does not track the Move (wheel and buttons go through the pad or the Move's buttons): while the game runs the camera is
; on automatic exposure, gain and white balance, for a good photo (the owner, 2026-10-17). tracking = the daemon's own settings
; (dark, for the Move's sphere).
Exposure = photo

