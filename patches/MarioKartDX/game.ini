Url = https://codeload.github.com/Harmmmm/MKDX-English-Mod/tar.gz/328c2458330cf50a1b77deb143c188b7921201f9
Root = files-1.18
List = files.csv
TreeSha256 = 9d6306b77343c80600df8e2a07c5c3e74fb9107cf688bb3ab701279f3e286003
ExeSha256 = 3c4862309b8a2943b46d9b917f1a28fb900691bbf6201280429e6817e861b785

[Loader]
; Standaard ZONDER TeknoParrot (keuze eigenaar 2026-10-17): onze eigen OpenParrot-kern, generieke route (schijfletter-omleiding F:/G: uit
; patch 0004), en JVS-over-COM3 in de drop-in (rg-mfcam.dll, RG_JVS_COMPORT). ALL.Net/AMAuthd bestaat dan niet: het spel speelt offline.
; In de app: Properties > Options > "Online play": Core = teknoparrot zet de gesloten TeknoParrot-kern terug (nodig voor online spelen
; op de gemeenschapsserver van TeknoParrot; vraagt de TeknoParrot-map van de gebruiker, de dropin zet zijn JVS-omleiding dan zelf uit).
Core = ravengun
; De standaardroute van de lader (RemoteThread = off uit _defaults/TeknoParrot.ini): hoofdthread stil, kern via LoadLibrary OP de
; hoofdthread, de kern haakt zelf het startpunt. Daarmee haalde de game op 2026-10-14 20:10/20:13 al "Have fun :)" en een swapchain.
; NIET de parked-entrypoint-route (EntryPointMs + TP_LOADER_MANAGED_INIT): die gaf op 2026-10-14 21:00 een #UD op 0x8C753D. De
; gesloten kern 1.0.0.3761 negeert TP_LOADER_MANAGED_INIT en schrijft in DllMain (remote thread) zelf E9 + rel32 op het startpunt,
; terwijl de hoofdthread daar nog op de spinlus EB FE draait; die voert E9 FE 06 00 00 uit = jmp 0x8C6E3F+0x6FE = 0x8C753D, midden
; in een instructie (f0 = lock-prefix voor een call). Zie NETWERK-INVOER-CAMERA.md, sectie 5c. TeknoParrot zelf gebruikt die preset
; alleen op Android (Box64) en alleen voor MKDX/MKDXUSA106; MKDX118 (1.18) heeft geen Android-recept.
; Parked-route opnieuw proberen kan alleen met een lader met RavenGun-patch 0008 (thread eerst stil, originele bytes terug): in de
; gebruikerslaag EntryPointMs = 3000, [Env] TP_LOADER_MANAGED_INIT = 1 en zo nodig Path = (map met die lader).

[Display]
; Beeldvullend via gamescope (het profiel staat op Windowed = 1, 1360x768; gamescope schaalt dat venster naar het hele scherm).
Gamescope = true
GamescopePath = /usr/bin/gamescope

[Input]
; Zoals TeknoParrotUi het doet (JvsSetup.cs: NamcoMkdx = JVS-bord NBGI_MarioKart3, Namco-commando's, 0x18 schakelaars; PipeFactory.cs:
; BanapassButton): stuur, gas, rem en knoppen als echte JVS-pakketten over de pipe TeknoParrot_JVS naar het bord MKDX van de daemon
; (packaging/jvs-boards.json), en de Banapass-kaart als bit 0 van offset 8 in het gedeelde geheugen (indeling MKDX).
Route = jvs
Board = MKDX
Layout = MKDX
JvsTransport = pipe
Note = JVS over de pipe TeknoParrot_JVS naar het Namco-bord MKDX van de daemon (stuur = kanaal 0, gas = 1, rem = 2; Item, Mario-knop, Enter, kaart, Menu Up/Down, Start, Service, Test, munt). De kaartknop zet ook bit 0 van offset 8 in het gedeelde geheugen (BanapassButton). Nog niet gemeten.

[Gamepad]
; Een gamepad (Xbox-controller, Steam Controller) is het stuur en de pedalen. Toewijzen in de app: Controllers > Gamepads (een enkele pad
; wordt vanzelf speler 1). Elke regel: <knop of as van de pad> = <signaal>; de rest volgt de standaardindeling (docs/gamepad.md).
; De signalen zijn die van het JVS-bord MKDX: trigger = Item, reload = Mario-knop, grenade = Enter (menu), aux1 = Banapass-kaart,
; btn1/btn2 = Menu Up/Down. Zo werken de Move-knoppen (trekker = Item, ...) en de pad allebei.
LeftX = wheel
RT = gas
LT = brake
A = trigger
B = reload
X = grenade
Y = aux1
LB = btn1
RB = btn2
DPadUp = btn1
DPadDown = btn2
Start = start
Back = coin
; Test (het testmenu): F2 van het virtuele toetsenbord (de daemon maakt daar de testschakelaar van het bord van), op de rechterstick.
RS = key:f2

[Camera]
; De spelersfoto: het spel gebruikt de camera IN het spel (Media Foundation). De daemon zet het beeld van zijn camera (de PS Eye)
; voor deze game in /dev/shm/ravengun_Camera zodra de IO-brug voor deze game start, en de drop-in rg-mfcam.dll biedt dat in het
; spelproces aan als camera (Wine zelf kent geen videocamera's). "Geen camera" in de app (Settings, Camera for games) wint.
; Het spel vraagt de camera alleen als ze in het testmenu aan staat (ゲーム設定 > ナムカム(カメラ)の使用 = ON; 2026-10-17 gezet). De PS Eye
; staat normaal op het volgen van de Move (korte belichting); wat dan nog te donker is krijgt een versterkte luma (CameraFeedWriter, tot 8x).
Use = game
Device = auto
; De Move wordt in Mario Kart niet gevolgd (stuur en knoppen gaan via de pad of de knoppen van de Move): zolang de game draait staat
; de camera op automatische belichting, gain en witbalans, voor een goede foto (de eigenaar, 2026-10-17). tracking = de eigen
; instellingen van de daemon (donker, voor de bol van de Move).
Exposure = photo

[Status]
Status = working
Note = Standaard zonder TeknoParrot-kern (offline; nog niet op de tv gemeten). Online spelen: Properties > Online play = TeknoParrot (vraagt TeknoParrot). Stand op de gesloten kern: WERKT op onze eigen route (2026-10-15): dubbelklik in RavenGun, rg-direct zonder TeknoParrotUi, 16 MiB stapel, DXVK ([Launch] Dxvk), Polygon2D-ViewLink en de d3dx10-pHResult-reparatie in rg-mfcam.dll. Gespeeld met een gamepad (5,5 min, twee rondes): Item (A) start en bevestigt, linkerstick stuurt, RT gas, LT rem; de kast staat op FREE PLAY. Banapass-kaarten nog open. Zie NETWERK-INVOER-CAMERA.md, 5e. 2026-10-17: Engels (Mod = english, de MKDX English Mod 2023): titel, menu's, kaartvraag, karakterkeuze, fotostap, modi, cups en tips in het Engels; testmenu, opstartcheck en de evenementbanner blijven Japans. Camera: in het testmenu (TEST vasthouden, Menu Up/Down = LB/RB, Enter = X) stond ゲーム設定 > ナムカム(カメラ)の使用 op OFF; nu ON (de fabriekswaarde, groen) en bewaard: opstartcheck "ナムカム(カメラ)チェック OK", de fotostap toont het live beeld van de PS Eye; met [Camera] Exposure = photo goed belicht (luma 90 in plaats van 10). Netwerk: ALL.Net-licentie OK, update- en gameserver LINK OK, online check 0 ms en 0 % verlies (de gemeenschapsserver van TeknoParrot); lokale netwerkcheck NG en E05-01/E05-04 blijven (ook met de echte gateway). Online spelen WERKT (2026-10-17): met de PlayerId van de eigenaar in de gebruikerslaag ([Config] Network/PlayerId, het Mario Kart-ID van het TeknoParrot-account) vond National Battle tegenstanders ("Searching for opponents") en reed de race tegen drie online ghosts.
NoteEN = Default without the TeknoParrot core (offline; not measured on the TV yet). Online play: Properties > Online play = TeknoParrot (needs TeknoParrot). State on the closed core: WORKING on our own route (2026-10-15): double-click in RavenGun, rg-direct without TeknoParrotUi, 16 MiB stack, DXVK ([Launch] Dxvk), the Polygon2D view link and the d3dx10 pHResult repair in rg-mfcam.dll. Played with a gamepad (5.5 min, two races): Item (A) starts and confirms, left stick steers, RT gas, LT brake; the cabinet is on FREE PLAY. Banapass cards still open. See NETWERK-INVOER-CAMERA.md, 5e. 2026-10-17: English (Mod = english, the MKDX English Mod 2023): title, menus, card question, character select, photo step, modes, cups and tips in English; the test menu, boot check and the event banner stay Japanese. Camera: in the test menu (hold TEST, Menu Up/Down = LB/RB, Enter = X) Game settings > Namcam (camera) was OFF; now ON (the factory value) and kept: boot check "camera check OK", the photo step shows the live PS Eye picture; with [Camera] Exposure = photo it is properly exposed (luma 90 instead of 10). Network: ALL.Net license OK, update and game server LINK OK, online check 0 ms and 0 % loss (TeknoParrot's community server); the local network check stays NG and E05-01/E05-04 remain (also with the real gateway). Online play WORKS (2026-10-17): with the owner's PlayerId in the user layer ([Config] Network/PlayerId, the Mario Kart ID of the TeknoParrot account) National Battle found opponents ("Searching for opponents") and raced against three online ghosts.

