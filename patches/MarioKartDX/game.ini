[Gamepad]
; VOORBEREID, NIET GEMETEN: Mario Kart Arcade GP DX is nog nooit gestart (zie [Status]). Een stuurspel zonder lightgun; met een gamepad
; (Xbox-controller, Steam Controller) wordt de pad het stuur en de pedalen. Toewijzen in de app: Controllers > Gamepads.
; Elke regel: <knop of as van de pad> = <signaal>; de rest volgt de standaardindeling (docs/gamepad.md). Waar deze signalen in het
; spel binnenkomen (indeling of bord) wordt pas vastgelegd als het spel draait.
LeftX = wheel
RT = gas
LT = brake
; Itemknop en Mario-knop (de twee knoppen op het stuur van de kast).
A = btn1
B = btn2
Start = start
Back = coin

