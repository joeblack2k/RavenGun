;
; ZWART BEELD (open, 2026-10-19): op de kast doet init_w10.ps1 twee dingen: `RegAsm.exe .\ipccl.dll`
; (de .NET-ShareK-client) en dan ShareK\ShareK.exe in een lus via sharek.ps1. Het spel praat via
; ipccl.dll met die server en blijft op een zwart beeld wachten zolang die er niet is.
; Wat nu WEL gemeten is (docs/research/namco/README.md):
;  - ShareK.exe valt onder wine-mono om (NullReferenceException in Main); met winetricks dotnet48
;    loopt hij (let op: winetricks zet de prefix op win7, terugzetten met winetricks -q win81);
;  - de COM-klasse van ipccl.dll ontbrak; RegAsm.exe /codebase ipccl.dll registreert hem;
;  - de engine KAN een tweede programma starten (HasTwoExecutables + Executable2 in [Game],
;    [Identify] Path2 en [Launch] SecondWait, buiten gamescope), maar ShareK.exe valt onder
;    wine-mono zelf om: "System.NullReferenceException at ShareK.Program.Main [0x0002d]" (ook los,
;    met ShareK.exe.config ernaast). Hij leest E:\WritableConfig.ini; een zelfgemaakte variant
;    hielp niet. Nodig: echt .NET Framework 4.5 in de prefix. Zonder die server blijft het zwart.
;  - Daarna loopt het spel door (>70 s) maar blijft het beeld zwart; volgende vraag: waar wacht de
;    client op (luistert ShareK.exe op de poort/pijp die ipccl.dll zoekt? E: is bij ons niet gemapt).
;
; GEMETEN 2026-10-19: de ALL.Net-IAuth van AMAuthd werkt. Het spel vraagt bij het opstarten
; CoCreateInstance(CLSID {4603BB03-058D-43D9-B96F-639BE908C1ED}, CLSCTX_LOCAL_SERVER,
; IID {045A5150-...}) en kreeg altijd CLASS_E_CLASSNOTREG. Nodig per prefix, HANDMATIG: eerst
; PreprocessAmAuth.exe -wait (dat WritableConfig.ini schrijft) en daarna AMCUS/iauthdll.dll
; registreren met regsvr32; dan geeft die aanroep hr 0. Die twee stappen zitten (nog) niet in de
; engine. Het beeld blijft daarna nog zwart -- zie docs/research/namco/README.md,
; "de IAuth-klasse van AMAuthd werkt nu".
; Zonder TeknoParrotUi: de daemon start de game zelf (rg-direct) en is het JVS-bord achter de pipe TeknoParrot_JVS.
[Launch]
; Mappen waar de game zelf in schrijft (besluit eigenaar 2026-10-19): in de view een echte map
; met een kopie van de NAS-inhoud, nooit een koppeling naar de NAS. Relatief aan de wortel van
