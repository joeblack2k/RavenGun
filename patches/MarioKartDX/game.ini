[Wine]
; Own prefix (prefixes/MarioKartDX) instead of the prefix shared by all games: the ShareK server demands real .NET (dotnet48) and
; the ShareK client a COM registration (RegAsm.exe /codebase ipccl.dll). Those two do not belong in the other games' prefix.
; Rebuilding: cp -a prefixes/shared/wine prefixes/MarioKartDX; winetricks -q dotnet48; winetricks -q win81 (dotnet48 sets the
; prefix to win7); RegAsm.exe /codebase <view>/ipccl.dll.
PrefixMode = Isolated
; Since review 13 (2026-10-19) the one-time prefix steps are an engine feature ([Launch] PrefixSetup, SecondBare above). The steps
; run with the loader's wine and WITHOUT WINEARCH (the prefix is 64-bit; with WINEARCH=win32 wine refuses). The class is registered
; with regsvr32.exe /s: without /s the program waits for its own window and the start stalls (the runner aborts a step after
; RG_PREFIXSTAP_TIMEOUT seconds, default 180, and fails the start). MEASURED 2026-10-19 12:13-12:14 on a fresh prefix: the four
; steps run, the file lands in AMCUS/ and in the root of the view, AMAuthd keeps running and the stamp is there.
