; Mario Kart Arcade GP DX (Namco ES3, 32-bits Windows, D3D11). Profielmap MarioKartDX; de spelmap op de NAS is
; "Mario Kart DX" en dat is versie 1.18.16 (Data/DongleData en Data/Phys aanwezig, geen AMCUS/WritableConfig.ini: de indeling van
; 1.18.16 in findings/mkdx_research.md). Het profiel hieronder volgt daarom het TeknoParrot-sjabloon MKDX118.xml (revisie 12).
; Er is geen sjabloon met de naam MarioKartDX, dus scripts/import-tp-profiles.py werkt hier niet; de profielsecties zijn met de hand
; uit MKDX118.xml overgenomen (zelfde velden, typen en standaardwaarden).
;
; Start: rg-direct (geen TeknoParrotUi, geen script). De keten is dezelfde als bij TeknoParrot: lader + de gesloten 32-bits kern
; (TeknoParrot/TeknoParrot.dll) + MK_AGP3_FINAL.exe. Netwerk, invoer en camera: zie NETWERK-INVOER-CAMERA.md in deze map.

[Game]
Name = Mario Kart Arcade GP DX
Profile = MarioKartDX
Type = TeknoParrot
EmulationProfile = NamcoMkdx
Executable = MK_AGP3_FINAL.exe
ProfileRevision = 12

[Launch]
; Zonder TeknoParrotUi: de daemon start de game zelf (rg-direct) en is het JVS-bord achter de pipe TeknoParrot_JVS.
Mode = direct
; De hoofdthread 16 MiB stapel in plaats van de 1 MiB uit de PE-kop (SizeOfStackReserve 0x100000, gemeten met objdump -p).
; Onder Wine krijgt de hoofdthread precies die waarde. TeknoParrot start deze game onder Wine (Winlator) zelf ook vanaf een kopie van
; MK_AGP3_FINAL.exe met dezelfde naam en 16 MiB stapel (TeknoParrotUI-bron, Tools/InputMethodAudit/AndroidManagedImportTest.cs:
; "Mario Kart DX patches an exact-name sixteen MiB stack copy"; requiredStackReserve = 16L * 1024L * 1024L). De engine zet die kopie
; in de view (MK_AGP3_FINAL.exe wordt een lokaal bestand van 7,4 MB, de koppeling naar de NAS blijft als
; MK_AGP3_FINAL.exe.ravengun-orig staan); op de NAS verandert niets. Zie NETWERK-INVOER-CAMERA.md, "Stopt na 27 s".
StackReserve = 16M
; Het eerste effect dat het spel laadt (0x835e20 -> 0x838940) is Polygon2D_D3D10.fx, als HLSL-BRON: D3DX10CreateEffectFromFileA met
; profiel fx_4_0. Alle 23 andere effecten laadt het voorgecompileerd (*.cfx). Wine's d3dx10_43 compileert bron via vkd3d-shader
; (D3DCompile) en die kan dit effect vermoedelijk niet aan (shaderarrays met een variabele index, uniform-parameters); dan geeft
; 0x838940 NULL en leest 0x835e60 (mov ecx,[eax]) adres 0: de toegangsfout van 2026-10-14 23:24. De game levert hetzelfde effect
; voorgecompileerd mee (Polygon2D_D3D10.cfx, fxc 9.29.952.3111, met Render/RenderQuad/ChainLine), en Wine's d3dx10 slaat de
; compiler over voor een blok dat met DXBC begint. Daarom wordt het .fx in de VIEW een symlink naar het .cfx (niets op de NAS).
; Zie NETWERK-INVOER-CAMERA.md, 5d.
ViewLinks = Data/System/Shader/Polygon2D_D3D10.fx -> Data/System/Shader/Polygon2D_D3D10.cfx

[Loader]
; De standaardroute van de lader (RemoteThread = off uit _defaults/TeknoParrot.ini): hoofdthread stil, kern via LoadLibrary OP de
; hoofdthread, de kern haakt zelf het startpunt. Daarmee haalde de game op 2026-10-14 20:10/20:13 al "Have fun :)" en een swapchain.
; NIET de parked-entrypoint-route (EntryPointMs + TP_LOADER_MANAGED_INIT): die gaf op 2026-10-14 21:00 een #UD op 0x8C753D. De
; gesloten kern 1.0.0.3761 negeert TP_LOADER_MANAGED_INIT en schrijft in DllMain (remote thread) zelf E9 + rel32 op het startpunt,
; terwijl de hoofdthread daar nog op de spinlus EB FE draait; die voert E9 FE 06 00 00 uit = jmp 0x8C6E3F+0x6FE = 0x8C753D, midden
; in een instructie (f0 = lock-prefix voor een call). Zie NETWERK-INVOER-CAMERA.md, sectie 5c. TeknoParrot zelf gebruikt die preset
; alleen op Android (Box64) en alleen voor MKDX/MKDXUSA106; MKDX118 (1.18) heeft geen Android-recept.
; Parked-route opnieuw proberen kan alleen met een lader met RavenGun-patch 0008 (thread eerst stil, originele bytes terug): in de
; gebruikerslaag EntryPointMs = 3000, [Env] TP_LOADER_MANAGED_INIT = 1 en zo nodig Path = (map met die lader).

[Display]
; Beeldvullend via gamescope (het profiel staat op Windowed = 1, 1360x768; gamescope schaalt dat venster naar het hele scherm).
Gamescope = true
GamescopePath = /usr/bin/gamescope

[Input]
; Zoals TeknoParrotUi het doet (JvsSetup.cs: NamcoMkdx = JVS-bord NBGI_MarioKart3, Namco-commando's, 0x18 schakelaars; PipeFactory.cs:
; BanapassButton): stuur, gas, rem en knoppen als echte JVS-pakketten over de pipe TeknoParrot_JVS naar het bord MKDX van de daemon
; (packaging/jvs-boards.json), en de Banapass-kaart als bit 0 van offset 8 in het gedeelde geheugen (indeling MKDX).
Route = jvs
Board = MKDX
Layout = MKDX
JvsTransport = pipe
Note = JVS over de pipe TeknoParrot_JVS naar het Namco-bord MKDX van de daemon (stuur = kanaal 0, gas = 1, rem = 2; Item, Mario-knop, Enter, kaart, Menu Up/Down, Start, Service, Test, munt). De kaartknop zet ook bit 0 van offset 8 in het gedeelde geheugen (BanapassButton). Nog niet gemeten.

[Gamepad]
; Een gamepad (Xbox-controller, Steam Controller) is het stuur en de pedalen. Toewijzen in de app: Controllers > Gamepads (een enkele pad
; wordt vanzelf speler 1). Elke regel: <knop of as van de pad> = <signaal>; de rest volgt de standaardindeling (docs/gamepad.md).
; De signalen zijn die van het JVS-bord MKDX: trigger = Item, reload = Mario-knop, grenade = Enter (menu), aux1 = Banapass-kaart,
; btn1/btn2 = Menu Up/Down. Zo werken de Move-knoppen (trekker = Item, ...) en de pad allebei.
LeftX = wheel
RT = gas
LT = brake
A = trigger
B = reload
X = grenade
Y = aux1
LB = btn1
RB = btn2
DPadUp = btn1
DPadDown = btn2
Start = start
Back = coin
; Test (het testmenu): F2 van het virtuele toetsenbord (de daemon maakt daar de testschakelaar van het bord van), op de rechterstick.
RS = key:f2

[Camera]
; De spelersfoto: het spel gebruikt de camera IN het spel (Media Foundation). De daemon zet het beeld van zijn camera (de PS Eye)
; voor deze game in /dev/shm/ravengun_Camera zodra de IO-brug voor deze game start, en de drop-in rg-mfcam.dll biedt dat in het
; spelproces aan als camera (Wine zelf kent geen videocamera's). "Geen camera" in de app (Settings, Camera for games) wint.
Use = game
Device = auto

[Status]
Status = untested
Note = Eerste starts via rg-direct (2026-10-14 20:10 en 20:13): weg na 27 s zonder JVS; vermoedelijk de hoofdthread die zijn stapel van 1 MiB opmaakt. Met 16 MiB stapel en de parked-entrypoint-route (21:00): #UD op 0x8C753D, een race tussen de kern die het startpunt haakt en de spinlus van de lader (NETWERK-INVOER-CAMERA.md, 5c). Nu: 16 MiB stapel ([Launch] StackReserve) op de standaardroute van de lader; nog niet gemeten. Route jvs over de pipe naar het Namco-bord MKDX (stuur, gas, rem via een gamepad), ALL.Net/AMCUS door de gesloten kern in het spelproces ([Network] in teknoparrot.ini, zoals TeknoParrot), camera via de daemon en de drop-in rg-mfcam.dll (Media Foundation; Wine zelf kent geen videocamera's). Zie NETWERK-INVOER-CAMERA.md.
NoteEN = First starts through rg-direct (2026-10-14) ended after 27 s without opening JVS; most likely the main thread running out of its 1 MiB stack. With a 16 MiB stack and the parked-entry-point route (21:00) it died with #UD at 0x8C753D: the closed core hooks the entry point byte by byte while the loader's EB FE spin loop is still running there (NETWERK-INVOER-CAMERA.md, 5c). Now a 16 MiB stack ([Launch] StackReserve) on the loader's standard route; not measured yet. jvs route over the pipe to the Namco board MKDX (wheel, gas, brake from a gamepad), ALL.Net/AMCUS answered by the closed core inside the game process ([Network] in teknoparrot.ini, as TeknoParrot does), camera from the daemon through the drop-in rg-mfcam.dll (Media Foundation; Wine itself has no video capture devices). See NETWERK-INVOER-CAMERA.md.

