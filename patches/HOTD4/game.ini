[Controls]
trigger = Shoot | Fires the gun.
reload = Reload | Reloads your gun. Aiming off the screen reloads too.
offscreen = Reload off-screen | Point the gun away from the screen and pull the trigger to reload.
grenade = Grenade | Throws a grenade.

[Status]
Status = working
Note = Start op de Lindbergh-route (2026-10-18, gemeten): dubbelklik op The House of the Dead 4, lindbergh.so met stackalign, JVS via de daemon. Titel 'The Pandora's box is opening' met PRESS START en daarna de attract/demo met P1, munitie en zombies; meer dan 5 minuten zonder crash. De map is Rev C (hod4M.elf, spel-ID 0xe213414d), niet de Special. Munt, START en richten zijn nog niet apart gemeten.
NoteEN = Starts on the Lindbergh route (2026-10-18, measured): double-click The House of the Dead 4, lindbergh.so with stackalign, JVS through the daemon. Title 'The Pandora's box is opening' with PRESS START, then the attract/demo with P1, ammo and zombies; more than 5 minutes without a crash. The folder is Rev C (hod4M.elf, game ID 0xe213414d), not the Special. Coin, START and aiming have not been measured separately yet.

[Input]
Route = jvs
Board = Lindbergh
Note = Lindbergh-route: lindbergh.so geeft de JVS-pakketten van het baseboard door aan de pty van de daemon (/dev/ttyRG0 in de sandbox); de daemon is het bord Lindbergh uit packaging/jvs-boards.json.

