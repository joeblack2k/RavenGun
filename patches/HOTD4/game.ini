; Bediening voor de knoppen-uitleg bij de eerste start (docs/per-game-patches.md, "Bediening per game"); labels uit het
; TeknoParrot-profiel (GameProfiles/<P>.xml), "Not confirmed yet" = de werking is nog niet gemeten.
[Controls]
trigger = Shoot | Fires the gun.
reload = Reload | Reloads your gun. Aiming off the screen reloads too.
offscreen = Reload off-screen | Point the gun away from the screen and pull the trigger to reload.
grenade = Grenade | Throws a grenade.

[Status]
Status = working
Note = Lindbergh route, no TeknoParrot (2026-10-20, measured headless through the daemon): the game starts and the attract runs; coin (key 5) raises CREDIT(S) 0 -> 1 -> 2 and START (key 1) starts a real session: the chapter 1 intro movie, the 'ESCAPE / CHAPTER 1' card, the in-game stage and then GAME OVER ('All hope is lost...'), after which the game returns to the attract. The gun cursor follows the aim (test-pattern points), but the gun itself is not calibrated yet in the game's EEPROM: a large aim change moves the cursor only a little, so the test menu's gun adjustment is still needed. Measured 2026-10-18: title 'The Pandora's box is opening' with PRESS START, attract/demo with P1, ammo and zombies, more than 5 minutes without a crash; the folder is Rev C (hod4M.elf, game ID 0xe213414d), not the Special. STILL BROKEN: the in-game picture. After the chapter card the screen is uniformly white (luma 255) while the 2D layer still draws (subtitle bars), and the attract's own video and 3D scenes render fine; with radeonsi instead of zink it was white too (2026-10-15). Without that picture ammo, reload and grenade cannot be seen, so the trigger, reload (off-screen and the reload button) and grenade are UNMEASURED. Holding TEST (key 0) makes the game exit.
NoteEN = Lindbergh route, no TeknoParrot (2026-10-20, measured headless through the daemon): the game starts and the attract runs; coin (key 5) raises CREDIT(S) 0 -> 1 -> 2 and START (key 1) starts a real session: the chapter 1 intro movie, the 'ESCAPE / CHAPTER 1' card, the in-game stage and then GAME OVER ('All hope is lost...'), after which the game returns to the attract. The gun cursor follows the aim (test-pattern points), but the gun itself is not calibrated yet in the game's EEPROM: a large aim change moves the cursor only a little, so the test menu's gun adjustment is still needed. Measured 2026-10-18: title 'The Pandora's box is opening' with PRESS START, attract/demo with P1, ammo and zombies, more than 5 minutes without a crash; the folder is Rev C (hod4M.elf, game ID 0xe213414d), not the Special. STILL BROKEN: the in-game picture. After the chapter card the screen is uniformly white (luma 255) while the 2D layer still draws (subtitle bars), and the attract's own video and 3D scenes render fine; with radeonsi instead of zink it was white too (2026-10-15). Without that picture ammo, reload and grenade cannot be seen, so the trigger, reload (off-screen and the reload button) and grenade are UNMEASURED. Holding TEST (key 0) makes the game exit.

