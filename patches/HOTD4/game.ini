; Bediening voor de knoppen-uitleg bij de eerste start (docs/per-game-patches.md, "Bediening per game"); labels uit het
; TeknoParrot-profiel (GameProfiles/<P>.xml), "Not confirmed yet" = de werking is nog niet gemeten.
[Controls]
trigger = Shoot | Fires the gun.
reload = Reload | Reloads your gun. Aiming off the screen reloads too.
offscreen = Reload off-screen | Point the gun away from the screen and pull the trigger to reload.
grenade = Grenade | Throws a grenade.

[Status]
Status = untested
Note = Lindbergh route, no TeknoParrot. Measured headless through the daemon, 2026-10-20/21. The white in-game picture is fixed by lindbergh-loader patch 0005 (third_party/lindbergh-loader/patches/0005-hod4-leaked-texture-units.patch). The game left texture units 1..N enabled after its multitexture path, so the scene composite drew their texel instead of the scene. The loader with that patch must be rebuilt and installed (scripts/build-lindbergh-loader.sh) before the fix is active. Free play is on (lindbergh.ini FREEPLAY = 1): START alone starts a game. The engine writes CPU_FREQ_GHZ from the measured TSC, so the game runs at the right speed; without it the intro ran about 1.4x too fast. Measured in play, with the fix active: the trigger fires, with muzzle sparks and bullet holes where the aim points (test-pattern 0.15,0.2 and 0.85,0.8), and the ammo column drops by one per shot. The reload button refills the ammo. Off-screen plus trigger refills the ammo. The grenade is thrown and the grenade count drops 3 -> 2. START on the CONTINUE screen continues the game. Calibration is already right: the test menu's GUN MARK CHECK puts the mark on 0.25 and 0.75, and the EEPROM was not changed. In the test menu's INPUT TEST, the trigger, GUN BUTTON (grenade), SCREEN OUT (reload) and START all respond, and GUN X/Y cover 00..ff. The wrong 3D colours (purple-blue walls, purple/green surfaces in the 'HOLD YOUR FIRE' cutscene, invisible zombies) are fixed by lindbergh-loader patch 0006 (0006-hod4-std-shader-varyings.patch). None of the game's 1599 standard material shader programs linked on Mesa, because the fragment shader reads varyings that the vertex shader does not write. With 0006, all of them link, and the cutscene, the elevator doors and the corridor match reference pictures of the arcade (2026-10-21). Patches 0005 and 0006 are only active once the loader is rebuilt and installed. Status untested until the owner plays it with the PS Move.
