Note = Oude notitie (2026-10-17, blijkt een start OP DE GESLOTEN KERN: het profiel had toen geen [Loader]-regel): met Windowed = 1 in gamescope het eigen scherm PLEASE CALIBRATE THE GUN. 2026-10-21 GEMETEN: game.exe is een vlakke geheugenimage (byte op bestandsafstand X hoort bij RVA X) met een verouderde sectietabel; de importmap (RVA 0x27297c0, in .protect) wordt daardoor 0x10a000 bytes te vroeg gelezen en lijkt leeg. Na tools/dev/pe-flat-fix.py leest de importmap wel: 15 descriptoren (KERNEL32, SETUPAPI, USER32, d3d9, DINPUT8, DSOUND, WINMM, GDI32, ADVAPI32, ole32, OLEAUT32, MSVCR71) en de namen komen uit het spel zelf. Onder Wine met gamescope headless (prefix prefixes/Coopers9) laadt die kopie al die DLL's plus onze d3d9 (DXVK) en DINPUT8 en loopt ~40 s ZONDER exceptie (de oude crash op 0x4fd8aed0 is weg), daarna sluit hij met code 0. Beeld nog niet gezien: de volgende stap is waarom hij sluit en hoe de gecorrigeerde image in de dubbelklik-route komt. Details: docs/research/wartran/README.md, sectie van 2026-10-21 07:30.
NoteEN = HASP / PROTECTION LANE 2026-10-21 17:40 (headless, deepcode). The protection call table at 0x512000 is REBUILT at run time from the game itself. Measured with game.exe (a flat image, so RVA == file offset) and tools/dev/pe-flat-fix.py: the dump's import table is the PACKER's minimal one (15 descriptors, 55 imports: 40 KERNEL32 plus one each for SETUPAPI, USER32, d3d9, DINPUT8, DSOUND, WINMM, GDI32, ADVAPI32, ole32, OLEAUT32, MSVCR71), but the game's own code calls through 989 sites in .text/.protect that use a second table at 0x512000 in .data instead. The packer filled that table at run time with the addresses those APIs had on the machine the dump came from (Windows XP): slot 232 = 0x4FD8AED0 = d3d9 Direct3DCreate9 (so the old crash address was never 'unmapped protection memory', it was XP's d3d9 at 0x4FD80000), kernel32 at 0x7C80xxxx, msvcr71 at 0x7C36-0x7C39, ole32 at 0x774C, user32/gdi32 at 0x77E4, advapi32 at 0x77F4, plus 68 slots holding 0x0313xxxx and a few 0x02B1xxxx (the packer's own stubs, whose code is not in the dump). Pairing each import slot's stored XP value with its descriptor name gives 53 XP addresses (tools/rg-c9-table/genmap.py -> rg_c9_map.h); 31 of the 256 table slots resolve through that map, the other 209 are answered by a logging stub. rg-c9-table.dll does this in the game process (tools/rg-c9-table, built with build.sh). It takes the one TP_PRELOAD_DLL of this game and loads rg-compat.dll itself: a DINPUT8.dll drop-in does NOT load, because the core resolves the imports of a title lazily (RG_MAPLOG shows SETUPAPI, USER32, d3d9, WINMM, GDI32, ADVAPI32 and ole32 but no DINPUT8.dll, DSOUND.dll, OLEAUT32.dll or MSVCR71.dll). MEASURED RESULT: the game now gets far past the old crash. Its own code calls the REAL Direct3DCreate9 (DXVK initialises: 'pApplicationName: game.exe', RADV device), the REAL RegisterClassExA (slot 200) and CreateWindowExA (slot 199), 397 regions are mapped and the message/window procedure runs (0x4024c0 -> 0x401080). Then it jumps into 0x0001006A, which VirtualQuery reports as MEM_FREE/PAGE_NOACCESS: that is the packer's runtime trampoline area (the XP process had code at 0x00010000), i.e. the same unpack step the dump does not contain. BLOCKED there for the protection lane: the table is rebuilt and the APIs behind it reach the game, but the packer's generated trampolines at 0x00010000 are not in the dump. Slots the game calls that the XP map cannot name are answered per slot with RG_C9_API / RG_C9_POP (196, 197, 198: one NULL argument, result ignored, measured from the runtime code with RG_C9_DUMP); RG_C9_VEH logs the first fault. Next for whoever takes it: either reconstruct the trampolines at 0x00010000 from the call sites, or find what writes 0x0001006A into the game's structure at 0x55E3C8. 2026-10-21: the 2026-10-17 "PLEASE CALIBRATE THE GUN" start was on the closed TeknoParrot core (the profile had no [Loader] section then). With our own path the exe looked unstartable because game.exe is a flat memory image whose section table still points at the packed original: the import directory (RVA 0x27297c0, inside .protect) was read 0x10a000 bytes early and looked empty. After tools/dev/pe-flat-fix.py the import table parses (15 descriptors: KERNEL32, SETUPAPI, USER32, d3d9, DINPUT8, DSOUND, WINMM, GDI32, ADVAPI32, ole32, OLEAUT32, MSVCR71; names read from the dump itself), Wine loads all of them plus our d3d9 (DXVK) and DINPUT8, and the process runs ~40 s with no exception (the old 0x4fd8aed0 crash is gone), then exits with code 0. No picture yet. Reference run on the closed core (2026-10-21 07:26, installed profile with the [Loader] section removed, gamescope headless): the unchanged NAS exe does show its own "PLEASE CALIBRATE THE GUN" screen, so the closed core is what makes this dump run. What our own path lacks: the game does not call the descriptor imports directly, it jumps through a second table at 0x512000 in .rdata (49 thunks over 47 slots; no descriptor FirstThunk; slots hold XP addresses and 0x0313xxxx stubs of protection memory the dump does not contain). Slot 0x5123a0 holds 0x4FD8AED0 - the exact address of every crash measured - and it is the first call after static init (entry 0x402480 -> 0x4010d0 -> jmp [0x5123a0]). That table has to be rebuilt slot by slot from the game own code; reading it from a reference run is blocked by kernel.yama.ptrace_scope=1. STEP 1 OF THE PROTECTION LANE, 2026-10-21 18:00 (static, no bench): the packer's memory is reached from the game's code ONLY through the 0x512000 table. Measured with tools/dev/rg-c9-refs.py (capstone 5.0.7, python3 -m venv + pip install capstone): a linear sweep of .text (0x401000-0x50f22c, 361512 instructions) finds NO call/jmp rel32 into 0x00010000-0x0001FFFF, 0x02B10000-0x02B1FFFF or 0x03130000-0x0313FFFF; the only immediates in those ranges are constants (0x10000 buffer sizes, 0x15180 = 86400 s, 0x186a0 = 100000) or jump-table bytes read as code (e.g. 'mov esp, 0x10424'), none of them a code address. .protect is not code: 1239747 bytes at entropy 4.76 that a linear sweep decodes into self-referential garbage (its own tail at RVA 0x2710000 is what the sweep 'jumps' to as 0x02B1xxxx), so the tool sweeps .text only and takes .protect on request (--include-protect). The table at 0x512000 carries every real reference: 155 of its 256 slots are used by 504 sites in .text -- 47 slots/110 sites hold 0x0313xxxx, 2 slots/5 sites hold 0x02B1xxxx, 106 slots/389 sites hold an XP system address. All 115 packer-memory sites are CALLs and none is a jmp, so there is no tail-jump out of a game function: no stolen code so far (85 of the 110 read eax after the call = API-like, 25 ignore it). The literal 0x0001006A does not occur anywhere in the 41 MB image (0 hits of the dword) and no instruction names the 0x10000 area, so the run's jump to 0x0001006A cannot come from static code: it is a pointer the game loads at run time. Where from: at the fault ebp = 0x55E3C8, and that is the window procedure's own object -- 0x4024C0 is `mov ecx,0x55e3c8; jmp 0x401080`, the static thiscall thunk of the registered WNDPROC, so the crash reads a function pointer out of that object (or out of a vtable it points to) and calls it; [0x55e3c8] holds 0x90192 in the dump and the object is otherwise zero. The two table calls in the window procedure now have names: slot 195 (cell 0x51230c, dump value 0x7e3ac17e) is called with exactly (hwnd, msg, wParam, lParam) -- ecx reloaded from [esp+0xc] = hwnd, eax from [esp+0x18] = lParam, pushed in reverse and popped by `ret 0x10` -- i.e. DefWindowProcA, and slot 196 (cell 0x512310, 0x7e3aca5a) is called with one NULL argument when msg==WM_DESTROY or (msg==WM_KEYDOWN and wParam==0x91), right after [this+0x8c]=0, result ignored (PostQuitMessage(0) by shape, unproven). Both are in a 0x7E3Axxxx cluster of ~20 slots that the descriptor map does not have (it names user32/gdi32 at 0x77E4xxxx), so that cluster is a second XP module base and step 2 has to name it from its call sites too. NEXT: step 2, name the 47 0x0313xxxx slots and the 2 0x02B1xxxx slots from their 115 call sites (argument counts, string constants, eax use), answer each with a premapped stub, and find the writer of the code pointer the window procedure calls. STEP 2, FIRST RUNTIME PASS (bench, deepcode, 2026-10-21 18:13-18:28). The logging stub of rg-c9-table had a stack bug, and it WAS the 'jump into 0x0001006A': the stub pushes its slot index before `call c9_common`, and c9_common returned without dropping it, so the stub's popfd ate the index, popal shifted by one dword and `ret` popped the slot's *return value* as its return address. 0x0001006A was simply the caller's own EAX; with RG_C9_RET=198:1 the fault moved to EIP=1 and with RG_C9_CBRET=198 a callback stub was entered with no return address. Fixed: c9_common now ends with `ret $4`, and the saved-EAX pointer is 40(%esp) (the EAX slot of pushal), not 12(%esp) (saved EDI), so a stub really answers its return value. MEASURED AFTER THE FIX (no exception at all): slot 198 is called with one NULL argument right after the first CreateWindowExA and the game continues; it then calls slot 166 (msvcr71-block XP 0x7c37c3a0) from 0x45c884 inside the D3D init helper 0x401433 -> 0x45c868, the run reaches 'done: resolved 40, stubbed 200, 256 cells seen' with NO fault, and the game process then ends ~31 s after the start (the loader lingers, the IO bridge logs 'de game is weg'), exit silent and no window presented (gamescopectl writes no file). So the protection no longer kills it; what is left is the game's own D3D init giving up. The candidate is the check at 0x4013B0 (`cmp [esp+0x148], 0xfffe0100; jb error5`): 0xfffe0100 is D3DPS_VERSION(1,0), so it is a pixel-shader-version test against the D3DCAPS9 that GetDeviceCaps filled at [esp+0x7c] (0x40113a, vtbl+0x38), and on failing it does MessageBoxA(0, 'ERROR(5)', 'NGUN2', MB_ICONHAND) and sets error 5. NEXT: log that local and the GetDeviceCaps HRESULT (RG_C9_DUMP on the caps), name slot 166, and see whether CreateDevice (vtbl+0x40 at 0x4013EE with the 7 present-parameters arguments) is reached. Named slots in this pass (all from the call sites, now real APIs in the drop-in): 195 user32!DefWindowProcA, 196 user32!PostQuitMessage, 199 CreateWindowExA, 200 RegisterClassExA, 201 user32!MessageBoxA (called with hwnd 0, 'ERROR(5)', 'NGUN2', 0x10), 106 kernel32!OutputDebugStringA, 149 MSVCR71!sprintf (cdecl, `add esp,0xc`), 56 kernel32!GetProcAddress (asked for 'WSAStartup', 'SetupDiGetClassDevsA', 'LoadRegTypeLib', 'IsWow64Process', 'MessageBoxA', 'Out32'), 76 kernel32!CreateFileA (\\.\FEnteDev and \\.\HARDLOCK.VXD, GENERIC_READ|WRITE, INVALID_HANDLE_VALUE), 87 kernel32!LocalAlloc and 89 kernel32!LocalFree (flags 0x40, 28 free sites). The table's own layout is the program's IAT grouped per DLL, which is how the unnamed slots can be narrowed: slots 0-12 advapi32 (registry, the ATL registrar 0x403C70 with the RGS keywords Delete/NoRemove/ForceRemove/Val in .rdata), 18-41 gdi32 (0x77E4xxxx), 43-126 kernel32 (0x7C80/0x7C91/0x7C92), 128-191 msvcr71 (0x7C36-0x7C3B), 195-215 user32 (0x7E3A-0x7E3D: RegisterClassExA 0x7E3A7C39, MessageBoxA 0x7E3D07EA), 217-230 winmm, 234-240 ole32. NOTE: registry writes from the ATL registrar return ERROR_SUCCESS (0) from a stub anyway, so that group needs no names to boot. SECOND RUNTIME PASS (bench, deepcode, 2026-10-21 18:30-18:44). Naming the allocation path moved it: slot 166 is the game's operator new (0x50F014 is `jmp [0x512298]`), and with it real the D3D init gets past its allocation, CreateDevice SUCCEEDS (the vtbl+0x40 call at 0x4013EE returns >= 0 and 0x40145B runs) and the game reaches ShowWindow/UpdateWindow per window (slots 202 = 0x7E3AAF56 with (hwnd, style) and 215 = 0x7E3AAEAB with (hwnd), both real user32 now) and then a winmm timer path (slot 220/219 from 0x40691F/0x40692A with five arguments of which one is a callback, i.e. timeSetEvent/timeKillEvent). Two smaller drift bugs fixed on the way: slot 240 (ole32, called with one NULL argument at 0x401462) popped 0 arguments, so the D3D init function's stack cookie check at 0x50EE47 failed and __report_gsfailure ran (measured: breakpoint 0x80000003 at 0x50EE46 with slot 92 reporting 3); with RG_C9_POP=240:1 the cookie check passes. The current end: a fault at EIP=0x00000056 right after the winmm timer callback is installed (fault chain starts at rva+7143 = 0x407143 and contains rva+15e3c8 = the app object 0x55E3C8), and at EIP=0x003F1000 in the run before it: both values sit in the app object (0x55E3C8 + fields hold 0x0001006A, 0x003F1000 and 0x00000056), so the game takes a code pointer out of that object or out of a vtable it points to and calls it -- the same class of hole as the trampolines, now per object instead of per IAT slot. NEXT: log the object graph (dump 0x55E3C8 and the vtable behind it at each window/timer step) and decide whether those fields are hwnds (Wine hwnd values look like 0x1006A!) or packer pointers before filling them. THIRD RUNTIME PASS (bench, deepcode, 2026-10-21 18:34-18:40). The audio/sound-init block at 0x406910 now runs clean: slot 220 (winmm, called with one argument) and 219 (winmm, no arguments, its result stored as a 32-bit time base), slot 50 = kernel32!QueryPerformanceCounter (proof: `lea eax,[esp+8]; push eax; call; fild qword [esp+8]; fdivr qword [0x516bc8]`, so a 64-bit counter divided by a constant) and slot 161 (msvcr71, one argument, and the caller does `add esp,4` right after -> CDECL). THE ARGUMENT-POP RULE, measured the hard way: msvcr71 slots are cdecl and must keep pop 0 (the caller pops), user32/kernel32 slots are stdcall and must pop their count; one wrong pop makes the frame drift and the function returns into stack garbage (measured: EIP 0x00000056, then EIP 0x0055E3CA, both stack leftovers). Slot 240 (ole32, one argument) and 220 (winmm, one argument) join 197/198 in RG_C9_POP. After this the game enters a new subsystem at 0x4d1b50/0x4ecdca/0x4cf2b3 that calls slot 100 (the packer-heap pointer 0x02B1E1C7, twice from 0x4D1B84 with two code pointers among its arguments, i.e. a thread/waiter-style API) and slot 102 (packer stub 0x03130028, sizes 0x8000 and 0x186), both still stubs, and then faults at 0x501242 on `cmp word ptr [esi+0x10],0` with esi = 0 -- a NULL structure that one of those two calls should have returned. CORRECTION to an earlier claim in this note: nothing is unpacked in place. The live bytes at 0x4d1b24..0x4d1bb4 in the RG_C9_CALLER dump are byte-identical to the file's, so .text holds OBFUSCATED FILLER between basic blocks (dead bytes after jumps: `xchg ebp,esi`, `inc esp`, `and eax,0x15ff566f`) and the real instructions are the ones a recursive descent finds (at 0x4d1b7d: `push esi; call [0x512190]`). A linear sweep desyncs there, the recursive descent of tools/dev/rg-c9-refs.py does not. NEXT: name slots 100 and 102 from 0x4d1b50 (they are the last two calls before the NULL) and dump the object the caller expects back. FOURTH RUNTIME PASS (bench, deepcode, 2026-10-21 18:41-18:42). Slot 100 = kernel32!GetModuleHandleA, measured: its first call passes one NULL argument and the game used the 0 return as a pointer and died at 0x501242 on `cmp word ptr [esi+0x10],0` with esi = 0; named, the next fault has eax = 0x00400000 (the module base of the exe) and the game runs further, so the identification is confirmed by the return value. The run now ends at EIP=0x00000000 with eax=0x00400000 and a fault chain of rva+a4c82 / rva+258ed3c / rva+a49a3: right after asking for its own module base the game takes a code pointer out of a heap structure (0x258ED3C) or one of the 0x4A4C82/0x4A4D49 thunks and calls it, and that pointer is NULL. REMEMBER: a lightgun game needs 'ravengunctl mouse-gun --player 1 --mouse <id>' before 'game start', otherwise the daemon waits for the PS Move and starts nothing. FIFTH RUNTIME PASS AND THE STATE OF THE LANE (bench, deepcode, 2026-10-21 18:43-18:45). FOUND THE DONGLE, IN CODE: 0x4A4D30 is the hardlock/HASP device path -- LocalAlloc(LMEM_ZEROINIT, 0x2000), then CreateFileA with the device name chosen at 0x54C418/0x54C42C (\.\HARDLOCK.VXD or \.\FEnteDev), then DeviceIoControl(handle, 0x9C4024A8, buf, 0x2000, buf, 0x2000, &got, NULL) and CloseHandle; the reply is {count, then count x 16-byte entries of two 64-bit values} and the game turns each entry into a word at [table + i*4] and bits 16..31 at [table + i*4 + 2] (0x4A4DE2..0x4A4E2C), requiring got >= 8. That is the protection: the dongle supplies a table the game indexes into. tools/rg-c9-table now has three exported shims named in the drop-in (76:c9_CreateFileA, 88:c9_DeviceIoControl, 54:c9_CloseHandle): a matching device name gets a handle to NUL and the IOCTL an empty table, every other file passes straight through. They are NOT reached yet: the run dies earlier, so the dongle question is still open mechanically. WHAT KILLS IT NOW: right after slot 100 (GetModuleHandleA(NULL), return 0x00400000 in EAX at the fault) the game calls a pointer it builds from that base; that pointer is NULL, so EIP=0x00000000 with eax=00400000, ebp=0, and a stack chain of rva+a4c82 / rva+258ed3c / rva+a49a3. Exact remaining unknown: which table the game reads at 0x4D1B87-0x4D1BA7 (it stores the module base in ESI there and then loads from [0x54F3FC], 0x54F3F8) before calling through it -- that table is empty in our process and only the packer's own start-up fills it. The ps5 of the lane: no fault touches packer memory any more; D3D9Device, the two windows, ShowWindow/UpdateWindow and the winmm sound init all run against the real APIs, with 20 slots named. MEASURED 18:35-18:52 (bench, deepcode; handed over under the 30-minute rule, no game running now). (1) THE SHIMS WERE DEAD ON ARRIVAL TWICE. MinGW exports __stdcall `__declspec(dllexport)` as `c9_CreateFileA@28`, so every lookup of an undecorated name returned NULL and the cells silently stayed logging stubs (measured: 'slot[56] called from 004FB536 ... -> 00000000' while the shim logged nothing); fixed with `-Wl,--kill-at` in tools/rg-c9-table/build.sh. And naming a shim `rg-c9-table.dll!c9_X` makes Wine load a SECOND copy of the DLL for the game's calls, so the shims and the VEH/worker live in different instances (measured: the single-step arm and the device handle were invisible to the fault handler); RG_C9_API now takes the token `self!c9_X`, resolved with GetModuleHandleExA(FROM_ADDRESS) in the instance the loader already has. (2) THE HARDLOCK DEVICE PATH, MEASURED FROM THE RUNNING PROCESS: 0x4A4D30 does LocalAlloc(0x40, 0x2000) -> CreateFileA(name, 0xC0000000, 3, NULL, OPEN_EXISTING) with the name from 0x298ED38 (\\.\HARDLOCK.VXD or \\.\FEnteDev, 0x54C418/0x54C42C, picked by a Win9x/NT version test at 0x4A4D44 -> call 0x4BFE4A) -> DeviceIoControl(h, 0x9C4024A8, buf, 0x2000, buf, 0x2000, &got, NULL) -> CloseHandle; the reply is a count plus 16-byte entries of two 64-bit values and the game writes word(value&0xffff) to [table+i*4] and word(value>>16) to [table+i*4+2], and it requires got >= 8. c9_CreateFileA gives a matching device name a NUL handle, c9_DeviceIoControl answers an empty table, c9_CloseHandle closes it; all other files pass straight through (c9_LocalAlloc logs the allocator). THEY ARE NOT REACHED YET: the log has no LocalAlloc(0x40, 0x2000) and no CreateFileA from that path, because the gate in front of it, [0x54B560] ('the dongle was found'), is 0: the game's OWN enumeration uses SetupDiGetClassDevsA / SetupDiEnumDeviceInterfaces / SetupDiGetDeviceInterfaceDetailA / SetupDiDestroyDeviceInfoList, resolved at run time from module 0x7A370000 (all four resolve to real Wine exports, logged), and it finds no device. Poking 0x54B560=1 does not help yet: the game then takes the version branch and dies at EIP 0 before CreateFileA. (3) THE EIP=0 CRASH WAS A ZERO CELL. Right after GetModuleHandleA(NULL) (slot 100, now a shim: 'GetModuleHandleA("(null)") -> 00400000') the game called a table cell that was still 0 (fault: EIP 0, EAX 0x400000, EBX=ECX=EDX=0, ESI 0x4A4D49, EDI a stack pointer, [ESP] = 0x4A4C82, so the call itself executed nothing); the table has 16 zero cells and the worker skipped them. RG_C9_ZEROSTUB=1 stubs them like any unknown (13, 15, 17, 42, 127, 192, 194, 216, 231, 233, 241, 242, ... measured) and that fault is GONE. Worth knowing: `self!c9_GetModuleHandleA` is what turned the earlier test into this one, and RG_C9_NULLRET=1 (execute fault at a small/unmapped EIP -> xor eax,eax; ret) also keeps the process alive past such a call; RG_C9_STEP single-stepping is armed but Wine drops TF after one step (one 'step' line, then nothing), so it is not usable for tracing. (4) WHERE IT IS NOW: past the zero cell the game calls slot 150 (0x7C37BB2D, from 0x407162), slot 165 (0x7C385A01, from 0x41DE53) and slot 51 (packer stub 0x031306B0, from 0x41D1BE), then it sits in a C++ exception loop: slot 157 (0x7C37556C) is called millions of times from Wine's ntdll (0x7BF0E331) -- an msvcr71 SEH handler invoked as a logging stub that returns 0, so the unwind never finishes. No window is presented (gamescopectl writes no file) and the process stays alive only in that loop. NEXT STEP (best): name every msvcr71 slot from the export table of the msvcr71.dll that is in the prefix, using the anchors already identified (slot 149 = sprintf 0x7C3828D3; 0x7C365BF5 = __dllonexit), so that slot 157 becomes the real _except_handler3 and the unwinding works -- that should end the exception loop and show the next real step; after that, finish the SetupDi* enumeration (four real exports to shadow, so the game finds one interface and sets [0x54B560] itself) so the hardlock path is entered and the shims answer the device.


