General/Input API = DirectInput|XInput|RawInput MEASURED 2026-10-21 16:34-16:36 (static + bench): the HASP in this title is STATICALLY linked -- game.exe holds 208 hasp_/classic-API strings and the low-level device names \\.\HARDLOCK.VXD, \\.\FEnteDev, \\.\USBPDCOM and the HASP USB interface path \?\usb#hasp#..., and no vendor runtime DLL name at all, so the DLL-replacement emulator (docs/hasp-layer.md, hasp/src) cannot serve it; the device-emulation route is the only one. The protection call table at RVA 0x512000 (the one that crashes at slot 0x5123a0) is ZERO in the dump: the fixed image maps every section with RVA == file offset (.text 0x1000, CONST 0x111000, .rdata 0x112000, .data 0x136000-0x25f9e30, .protect 0x25fb000), 0x512000 lies inside .data and the 60 dwords there are all 0, so the addresses the earlier run showed are written at run time -- there is nothing to rebuild statically. A bench run (ravengunctl game start Coopers9, headless) again ends after ~10 s (loader 16:34:22, exitcode 0, no picture), and the game process lives in the bwrap namespace, so /proc/<pid>/maps from the host shows a different (native 0x00010000) process that exits before the sample. BLOCKED on the dongle/protection part: no static table to rebuild, the HASP is statically linked (device model needed) and the run window is too short to capture the runtime table from the host. Next if taken again: sample the maps from inside the game namespace (or log them from the drop-in) and emulate \\.\FEnteDev / \\.\HARDLOCK.VXD IOCTLs. MEASURED 2026-10-21 16:36-16:42 (bench, new instruments in rg-compat): RG_TABLE_DUMP=0x512000,256,300 read the aanroeptabel in the running process: the 256 dwords are XP system addresses (user32 0x77F4/0x77E4, gdi32/winmm 0x76B1, kernel32 0x7C80-0x7C85, ntdll 0x7C91/0x7C92, msvcr71 0x7C36-0x7C39, oleaut32 0x7712, ole32 0x7E3A) mixed with pointers into 0x0313xxxx and slot 232 (0x5123A0) = 0x4FD8AED0, the jump target of entry 0x4010D0. RG_MAPLOG/RG_PEEK show both of those areas are MEM_FREE in the process (0x4FD8AED0: staat 00010000 prot 00000001, no allocation base) -- the protection writes fixed addresses for memory it never maps. RG_PREMAP=0x03130000,0x20000|0x4FD00000,0x100000 maps them from the DLL init (confirmed: 0x4FD8AED0 becomes prot 0x40 and stays filled with our 0xCC, i.e. the game never writes there), and the run still ends after ~10 s (loader stops, exitcode 0, no picture) because it jumps into unfilled memory. So the missing piece is the protection unpack step that should fill 0x4FD00000/0x03130000; the dump does not contain it and the HASP (statically linked) is likely what feeds it. BLOCKED until that unpack is understood; instruments committed: RG_TABLE_DUMP, RG_MAPLOG, RG_PEEK, RG_PREMAP in tools/rg-compat/rg_compat.c.
