; Voorbereid in pass 1 (docs/goal-90-native.md): profiel uit het TeknoParrot-sjabloon, herkenning gemeten aan de NAS-map "Coopers's 9"
; (alleen gelezen), invoerroute gekozen naar het EmulationProfile. Niet gestart.

[Game]
Name = Coopers's 9
Profile = Coopers9
Executable = game.exe
Type = TeknoParrot
EmulationProfile = WartranTroopers
ProfileRevision = 2

[Launch]
Mode = direct

; Onze eigen lader en kern (geen TeknoParrot). Zonder deze regel kiest het profiel de gesloten
; runtime en die is er niet: rg-direct zegt dan "kern ontbreekt". Gemeten 2026-10-19.
[Loader]
Build = ravengun
Core = ravengun

[Wine]
Prefix = ravengun-test-dxvk
DllOverrides = d3d9=n,b
Runner = wrapper

[Display]
Gamescope = true
GamescopePath = /usr/bin/gamescope

[Input]
Route = tp-shm
Layout = WartranTroopers
Note = Eerste start gemeten 2026-10-19 op onze eigen lader en kern: het spel laadt (lader + OpenParrotWin32/OpenParrot.dll, "Loading core...") en valt daarna om in zijn eigen vroege start (page fault op 0x4fd8aed0, adres in geen enkele module, terugkeeradres 0x4010ed uit game.exe zelf, EDI in OpenParrot.dll). Zonder kern (Core = none) sluit het spel na ongeveer drie seconden met exitcode 0 zonder venster. Het profiel koos eerst de gesloten runtime ("kern ontbreekt") en kon dus helemaal niet starten; dat is nu opgelost. Status blijft parked; de volgende stap staat in docs/research/wartran/README.md. Oude noot: voorbereid, niet gestart: tp-shm, indeling WartranTroopers (voor de Konami-testmenu's bestaat ook WartranTroopersKonami, zie Gashaaaan)

; Bediening voor de knoppen-uitleg bij de eerste start (docs/per-game-patches.md, "Bediening per game"); labels uit het
; TeknoParrot-profiel (GameProfiles/<P>.xml), "Not confirmed yet" = de werking is nog niet gemeten.
[Controls]
trigger = Shoot | Fires the gun.

[Status]
Status = untested
Note = Start via dubbelklik (2026-10-17): met Windowed = 1 in gamescope het eigen scherm PLEASE CALIBRATE THE GUN (met 0 geen zichtbaar venster). Kalibratie en spelen nog niet gemeten. Speelproef 2026-10-17 (muismodus): 'PLEASE CALIBRATE THE GUN / PRESS TEST BUTTON': eerst het geweer kalibreren in het testmenu.
NoteEN = Starts by double-click (2026-10-17): with Windowed = 1 under gamescope it shows PLEASE CALIBRATE THE GUN. Calibration and play not measured. Play test 2026-10-17 (mouse mode): 'please calibrate the gun': calibrate in the test menu first.


