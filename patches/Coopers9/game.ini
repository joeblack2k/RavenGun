; Coopers's 9 without TeknoParrot: our own loader and core plus rg-c9-table.dll (dropin/), which rebuilds the packed dump's
; API table, answers the statically linked HASP HL and plays the parallel-port gun/IO board. Recognised from the NAS folder.

[Game]
Name = Coopers's 9
Profile = Coopers9
Executable = game.exe
Type = TeknoParrot
EmulationProfile = WartranTroopers
ProfileRevision = 2

[Launch]
; Direct3D 9 via DXVK on the engine's plain Wine and shared prefix (no wrapper script in the launch path).
Dxvk = true
Mode = direct
; The movies (data/bin/c9op, acap..., AVI with MS-MPEG4v2 / WMV3) play through DirectShow on a texture renderer; without a
; decoder the graph fails and the game calls IMediaControl::GetState on NULL (0x41C1A6). docs/gst32.md.
Gst32 = true

; Our own loader and core (no TeknoParrot). Without this section the profile picks the closed runtime, which is not
; there: rg-direct then reports a missing core. Measured 2026-10-19.
[Loader]
Build = ravengun
Core = ravengun

[Display]
Gamescope = true
GamescopePath = /usr/bin/gamescope

[Input]
Route = tp-shm
Layout = WartranTroopers
Note = The board image (layout WartranTroopers) is read by rg-c9-table.dll and played as the game's parallel-port gun/IO board (RG_C9_LPT_MAP in dropin/dropin.ini).

; Controls for the button guide at first start (docs/per-game-patches.md, "Bediening per game"); measured headless 2026-10-21
; in the game's I/O CHECK and in play.
[Controls]
trigger = Shoot | Fires the gun.
reload = Protect / reload | Raises your briefcase shield and reloads (the game's shot outside the screen).
offscreen = Shoot off-screen | Aim away from the screen and pull the trigger: shield up and a full magazine.

[Status]
Status = untested
Note = WERKT HEADLESS (2026-10-21, eigen kern, geen TeknoParrot): attract met film, munt, START, verhaalmodus, spel met score, speler 2, herladen, testmenu; 5,5 min zonder crash. Kalibratie meegeleverd (seed/expdat). Nog niet op de tv met een PS Move gespeeld.
NoteEN = WORKING HEADLESS 2026-10-21 (our own core, no TeknoParrot; Status stays untested until played on the TV with a PS Move). rg-c9-table.dll (tools/rg-c9-table) rebuilds the API table at 0x512000 (the dump's XP addresses mapped to live exports, msvcr71 7.10.7031.4 as reference), answers the statically linked HASP HL by hooking hasp_login/logout/read/decrypt with a synthetic memory image derived from the game's own checks, patches the data path z:/data/bin/ to data/bin/, and plays the parallel-port gun/IO board (inpout32 Out32/Inp32) from the board image. Gst32 for the AVI movies (MS-MPEG4v2/WMV3); without it the first START crashed on a NULL IMediaControl at 0x41C1A6. Measured headless: attract with movie, coin, START, story mode, play with score, player 2 join and shots, reload, test menu and I/O CHECK (every input, both start lamps, both recoil outputs), 5.5 min of random firing without a fault, twice (one and two players). Calibration ships as seed/expdat and seed/extdat (made in GUN SETTING with test-pattern points); without it the game stops at PLEASE CALIBRATE THE GUN. Aim after calibration, measured on the GUN SETTING marker: centre off by 0.0006 x 0.0011 of the screen, 10%/90% corners by <= 0.004 x 0.0015, 3%/97% by <= 0.004 x 0.003. Buttons: trigger, reload = shot off-screen (shield and reload), start 1/2, coin 5, test 0/F2, service F3. Recalibrate: TEST > GUN SETTING (trigger moves down, START selects) > hold START and pull the trigger, shoot the three marks, TEST, YES with START. Rumble: output bit 6/7 is the recoil solenoid of P1/P2 (a pulse per shot, 0x419470); rg-c9-table logs it, nothing routes it yet. The game draws 1280x512 letterboxed in 16:9; the calibration absorbs the bars.


