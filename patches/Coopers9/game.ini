; (alleen gelezen), invoerroute gekozen naar het EmulationProfile. Niet gestart.

[Game]
Name = Coopers's 9
Profile = Coopers9
Executable = game.exe
Type = TeknoParrot
EmulationProfile = WartranTroopers
ProfileRevision = 2

[Launch]
; Direct3D 9 via DXVK on the engine's plain Wine and shared prefix (no wrapper script in the launch path).
Dxvk = true
Mode = direct

; Onze eigen lader en kern (geen TeknoParrot). Zonder deze regel kiest het profiel de gesloten
; runtime en die is er niet: rg-direct zegt dan "kern ontbreekt". Gemeten 2026-10-19.
[Loader]
Build = ravengun
Core = ravengun

[Display]
Gamescope = true
GamescopePath = /usr/bin/gamescope

[Input]
Route = tp-shm
Layout = WartranTroopers
Note = Eerste start gemeten 2026-10-19 op onze eigen lader en kern: het spel laadt (lader + OpenParrotWin32/OpenParrot.dll, "Loading core...") en valt daarna om in zijn eigen vroege start. GEMETEN 2026-10-19 11:35 met WINEDEBUG=-all,+seh en ZONDER onze kern (rechtstreeks onder wine): dezelfde EXCEPTION_ACCESS_VIOLATION op 0x4fd8aed0 (een leesfout op een adres in geen enkele module, ebp=0x7ffd1000, eax=0xfc728db1). De crash is dus van het spel zelf en niet van onze kern. Met WINEDEBUG=-all,+relay is de laatste regel voor de crash "Starting thread proc 00402480 (arg=7FFD1000)" -- dat verklaart edx=00402480 en ebp=7ffd1000 in de crash; de draadprocedure op 0x402480 roept 0x401b30 aan, dat op zijn beurt 0x4010d0 aanroept en daarna call *%edi / call *%ebx bevat. VERONDERSTELLING: de functiewijzer in de tabel op 0x55e3c8 hoort door de statisch gelinkte HASP HL-laag gevuld te worden en staat zonder dongle op rommel. WAT DAT ZOU BEVESTIGEN: de instructie bij 0x4010d0 en 0x401b30 uit elkaar halen en laten zien welke tabel-index gelezen wordt, plus een start waarbij die tabel met een echte dongle gevuld is (die komt er niet) of een patch die de controle overslaat. Het profiel koos eerst de gesloten runtime ("kern ontbreekt") en kon dus helemaal niet starten; dat is nu opgelost. Status blijft parked; de volgende stap staat in docs/research/wartran/README.md. Oude noot: voorbereid, niet gestart: tp-shm, indeling WartranTroopers (voor de Konami-testmenu's bestaat ook WartranTroopersKonami, zie Gashaaaan)

; Bediening voor de knoppen-uitleg bij de eerste start (docs/per-game-patches.md, "Bediening per game"); labels uit het
; TeknoParrot-profiel (GameProfiles/<P>.xml), "Not confirmed yet" = de werking is nog niet gemeten.
[Controls]
trigger = Shoot | Fires the gun.

[Status]
Status = untested
Note = Oude notitie (2026-10-17, blijkt een start OP DE GESLOTEN KERN: het profiel had toen geen [Loader]-regel): met Windowed = 1 in gamescope het eigen scherm PLEASE CALIBRATE THE GUN. 2026-10-21 GEMETEN: game.exe is een vlakke geheugenimage (byte op bestandsafstand X hoort bij RVA X) met een verouderde sectietabel; de importmap (RVA 0x27297c0, in .protect) wordt daardoor 0x10a000 bytes te vroeg gelezen en lijkt leeg. Na tools/dev/pe-flat-fix.py leest de importmap wel: 15 descriptoren (KERNEL32, SETUPAPI, USER32, d3d9, DINPUT8, DSOUND, WINMM, GDI32, ADVAPI32, ole32, OLEAUT32, MSVCR71) en de namen komen uit het spel zelf. Onder Wine met gamescope headless (prefix prefixes/Coopers9) laadt die kopie al die DLL's plus onze d3d9 (DXVK) en DINPUT8 en loopt ~40 s ZONDER exceptie (de oude crash op 0x4fd8aed0 is weg), daarna sluit hij met code 0. Beeld nog niet gezien: de volgende stap is waarom hij sluit en hoe de gecorrigeerde image in de dubbelklik-route komt. Details: docs/research/wartran/README.md, sectie van 2026-10-21 07:30.
NoteEN = 2026-10-21: the 2026-10-17 "PLEASE CALIBRATE THE GUN" start was on the closed TeknoParrot core (the profile had no [Loader] section then). With our own path the exe looked unstartable because game.exe is a flat memory image whose section table still points at the packed original: the import directory (RVA 0x27297c0, inside .protect) was read 0x10a000 bytes early and looked empty. After tools/dev/pe-flat-fix.py the import table parses (15 descriptors: KERNEL32, SETUPAPI, USER32, d3d9, DINPUT8, DSOUND, WINMM, GDI32, ADVAPI32, ole32, OLEAUT32, MSVCR71; names read from the dump itself), Wine loads all of them plus our d3d9 (DXVK) and DINPUT8, and the process runs ~40 s with no exception (the old 0x4fd8aed0 crash is gone), then exits with code 0. No picture yet; next: why it exits and how the corrected image gets into the double-click path.


