Note = Oude notitie (2026-10-17, blijkt een start OP DE GESLOTEN KERN: het profiel had toen geen [Loader]-regel): met Windowed = 1 in gamescope het eigen scherm PLEASE CALIBRATE THE GUN. 2026-10-21 GEMETEN: game.exe is een vlakke geheugenimage (byte op bestandsafstand X hoort bij RVA X) met een verouderde sectietabel; de importmap (RVA 0x27297c0, in .protect) wordt daardoor 0x10a000 bytes te vroeg gelezen en lijkt leeg. Na tools/dev/pe-flat-fix.py leest de importmap wel: 15 descriptoren (KERNEL32, SETUPAPI, USER32, d3d9, DINPUT8, DSOUND, WINMM, GDI32, ADVAPI32, ole32, OLEAUT32, MSVCR71) en de namen komen uit het spel zelf. Onder Wine met gamescope headless (prefix prefixes/Coopers9) laadt die kopie al die DLL's plus onze d3d9 (DXVK) en DINPUT8 en loopt ~40 s ZONDER exceptie (de oude crash op 0x4fd8aed0 is weg), daarna sluit hij met code 0. Beeld nog niet gezien: de volgende stap is waarom hij sluit en hoe de gecorrigeerde image in de dubbelklik-route komt. Details: docs/research/wartran/README.md, sectie van 2026-10-21 07:30.
NoteEN = HASP / PROTECTION LANE 2026-10-21 17:40 (headless, deepcode). The protection call table at 0x512000 is REBUILT at run time from the game itself. Measured with game.exe (a flat image, so RVA == file offset) and tools/dev/pe-flat-fix.py: the dump's import table is the PACKER's minimal one (15 descriptors, 55 imports: 40 KERNEL32 plus one each for SETUPAPI, USER32, d3d9, DINPUT8, DSOUND, WINMM, GDI32, ADVAPI32, ole32, OLEAUT32, MSVCR71), but the game's own code calls through 989 sites in .text/.protect that use a second table at 0x512000 in .data instead. The packer filled that table at run time with the addresses those APIs had on the machine the dump came from (Windows XP): slot 232 = 0x4FD8AED0 = d3d9 Direct3DCreate9 (so the old crash address was never 'unmapped protection memory', it was XP's d3d9 at 0x4FD80000), kernel32 at 0x7C80xxxx, msvcr71 at 0x7C36-0x7C39, ole32 at 0x774C, user32/gdi32 at 0x77E4, advapi32 at 0x77F4, plus 68 slots holding 0x0313xxxx and a few 0x02B1xxxx (the packer's own stubs, whose code is not in the dump). Pairing each import slot's stored XP value with its descriptor name gives 53 XP addresses (tools/rg-c9-table/genmap.py -> rg_c9_map.h); 31 of the 256 table slots resolve through that map, the other 209 are answered by a logging stub. rg-c9-table.dll does this in the game process (tools/rg-c9-table, built with build.sh). It takes the one TP_PRELOAD_DLL of this game and loads rg-compat.dll itself: a DINPUT8.dll drop-in does NOT load, because the core resolves the imports of a title lazily (RG_MAPLOG shows SETUPAPI, USER32, d3d9, WINMM, GDI32, ADVAPI32 and ole32 but no DINPUT8.dll, DSOUND.dll, OLEAUT32.dll or MSVCR71.dll). MEASURED RESULT: the game now gets far past the old crash. Its own code calls the REAL Direct3DCreate9 (DXVK initialises: 'pApplicationName: game.exe', RADV device), the REAL RegisterClassExA (slot 200) and CreateWindowExA (slot 199), 397 regions are mapped and the message/window procedure runs (0x4024c0 -> 0x401080). Then it jumps into 0x0001006A, which VirtualQuery reports as MEM_FREE/PAGE_NOACCESS: that is the packer's runtime trampoline area (the XP process had code at 0x00010000), i.e. the same unpack step the dump does not contain. BLOCKED there for the protection lane: the table is rebuilt and the APIs behind it reach the game, but the packer's generated trampolines at 0x00010000 are not in the dump. Slots the game calls that the XP map cannot name are answered per slot with RG_C9_API / RG_C9_POP (196, 197, 198: one NULL argument, result ignored, measured from the runtime code with RG_C9_DUMP); RG_C9_VEH logs the first fault. Next for whoever takes it: either reconstruct the trampolines at 0x00010000 from the call sites, or find what writes 0x0001006A into the game's structure at 0x55E3C8. 2026-10-21: the 2026-10-17 "PLEASE CALIBRATE THE GUN" start was on the closed TeknoParrot core (the profile had no [Loader] section then). With our own path the exe looked unstartable because game.exe is a flat memory image whose section table still points at the packed original: the import directory (RVA 0x27297c0, inside .protect) was read 0x10a000 bytes early and looked empty. After tools/dev/pe-flat-fix.py the import table parses (15 descriptors: KERNEL32, SETUPAPI, USER32, d3d9, DINPUT8, DSOUND, WINMM, GDI32, ADVAPI32, ole32, OLEAUT32, MSVCR71; names read from the dump itself), Wine loads all of them plus our d3d9 (DXVK) and DINPUT8, and the process runs ~40 s with no exception (the old 0x4fd8aed0 crash is gone), then exits with code 0. No picture yet. Reference run on the closed core (2026-10-21 07:26, installed profile with the [Loader] section removed, gamescope headless): the unchanged NAS exe does show its own "PLEASE CALIBRATE THE GUN" screen, so the closed core is what makes this dump run. What our own path lacks: the game does not call the descriptor imports directly, it jumps through a second table at 0x512000 in .rdata (49 thunks over 47 slots; no descriptor FirstThunk; slots hold XP addresses and 0x0313xxxx stubs of protection memory the dump does not contain). Slot 0x5123a0 holds 0x4FD8AED0 - the exact address of every crash measured - and it is the first call after static init (entry 0x402480 -> 0x4010d0 -> jmp [0x5123a0]). That table has to be rebuilt slot by slot from the game own code; reading it from a reference run is blocked by kernel.yama.ptrace_scope=1. STEP 1 OF THE PROTECTION LANE, 2026-10-21 18:00 (static, no bench): the packer's memory is reached from the game's code ONLY through the 0x512000 table. Measured with tools/dev/rg-c9-refs.py (capstone 5.0.7, python3 -m venv + pip install capstone): a linear sweep of .text (0x401000-0x50f22c, 361512 instructions) finds NO call/jmp rel32 into 0x00010000-0x0001FFFF, 0x02B10000-0x02B1FFFF or 0x03130000-0x0313FFFF; the only immediates in those ranges are constants (0x10000 buffer sizes, 0x15180 = 86400 s, 0x186a0 = 100000) or jump-table bytes read as code (e.g. 'mov esp, 0x10424'), none of them a code address. .protect is not code: 1239747 bytes at entropy 4.76 that a linear sweep decodes into self-referential garbage (its own tail at RVA 0x2710000 is what the sweep 'jumps' to as 0x02B1xxxx), so the tool sweeps .text only and takes .protect on request (--include-protect). The table at 0x512000 carries every real reference: 155 of its 256 slots are used by 504 sites in .text -- 47 slots/110 sites hold 0x0313xxxx, 2 slots/5 sites hold 0x02B1xxxx, 106 slots/389 sites hold an XP system address. All 115 packer-memory sites are CALLs and none is a jmp, so there is no tail-jump out of a game function: no stolen code so far (85 of the 110 read eax after the call = API-like, 25 ignore it). The literal 0x0001006A does not occur anywhere in the 41 MB image (0 hits of the dword) and no instruction names the 0x10000 area, so the run's jump to 0x0001006A cannot come from static code: it is a pointer the game loads at run time. Where from: at the fault ebp = 0x55E3C8, and that is the window procedure's own object -- 0x4024C0 is `mov ecx,0x55e3c8; jmp 0x401080`, the static thiscall thunk of the registered WNDPROC, so the crash reads a function pointer out of that object (or out of a vtable it points to) and calls it; [0x55e3c8] holds 0x90192 in the dump and the object is otherwise zero. The two table calls in the window procedure now have names: slot 195 (cell 0x51230c, dump value 0x7e3ac17e) is called with exactly (hwnd, msg, wParam, lParam) -- ecx reloaded from [esp+0xc] = hwnd, eax from [esp+0x18] = lParam, pushed in reverse and popped by `ret 0x10` -- i.e. DefWindowProcA, and slot 196 (cell 0x512310, 0x7e3aca5a) is called with one NULL argument when msg==WM_DESTROY or (msg==WM_KEYDOWN and wParam==0x91), right after [this+0x8c]=0, result ignored (PostQuitMessage(0) by shape, unproven). Both are in a 0x7E3Axxxx cluster of ~20 slots that the descriptor map does not have (it names user32/gdi32 at 0x77E4xxxx), so that cluster is a second XP module base and step 2 has to name it from its call sites too. NEXT: step 2, name the 47 0x0313xxxx slots and the 2 0x02B1xxxx slots from their 115 call sites (argument counts, string constants, eax use), answer each with a premapped stub, and find the writer of the code pointer the window procedure calls.


