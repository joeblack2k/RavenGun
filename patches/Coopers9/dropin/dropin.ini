; Drop-in van RavenGun voor Coopers's 9 (eigen 32-bits engine, vlakke geheugendump met HASP HL).
; Bron en bouw: tools/rg-compat/rg_compat.c, tools/dev/build-compat.sh.
;
; Eerste meetinstrument: RG_COMPAT_EXITLOG haakt ExitProcess in de IAT van het hoofdbeeld en schrijft de
; retourketen op de stapel (alleen woorden binnen het beeld, als RVA) naar RG_DONGLE2_LOG. Het spel
; vertrekt namelijk met code 0 zonder exceptie, dus de vraag is WIE de afsluiting aanvraagt.
[rg-compat.dll]
To = .
Preload = true
Env = RG_DONGLE2_LOG=rg-exit.log;RG_COMPAT_EXITLOG=1;RG_COMPAT_IATFIX=1;RG_COMPAT_SAMPLE=700;RG_COMPAT_SAMPLE_LOG=rg-sample.txt;RG_TABLE_DUMP=0x512000,256,300;RG_MAPLOG=1;RG_PEEK=0x4FD8AED0,32;RG_PREMAP=0x03130000,0x20000|0x4FD00000,0x100000

; DINPUT8.dll: the repair of the game's own call table at 0x512000 (tools/rg-c9-table, built with
; tools/rg-c9-table/build.sh). game.exe imports DINPUT8.dll and takes only DirectInput8Create from it, so a drop-in next to
; the exe is loaded by the normal loader -- the one TP_PRELOAD_DLL of this game already carries rg-compat.dll. DllMain
; translates every table slot whose XP address is known from the game's own import descriptors into the live address of
; the same API, and puts a logging stub in the slots it cannot name (log rg-c9-table.log, returns and stack argument count
; per slot through RG_C9_RET / RG_C9_POP).
[DINPUT8.dll]
To = .
Env = RG_C9_LOG=rg-c9-table.log
