; Drop-in van RavenGun voor Coopers's 9 (eigen 32-bits engine, vlakke geheugendump met HASP HL).
;
; Een Windows-spel onder de OpenParrot-lader krijgt precies EEN TP_PRELOAD_DLL. Dit spel gebruikte die plek voor
; rg-compat.dll (meetinstrumenten: RG_COMPAT_EXITLOG haakt ExitProcess in de IAT van het hoofdbeeld en schrijft de
; retourketen op de stapel naar RG_DONGLE2_LOG; RG_TABLE_DUMP/RG_MAPLOG/RG_PEEK/RG_PREMAP horen bij de bescherming).
; rg-c9-table.dll neemt de preloadplek nu over en laadt rg-compat.dll zelf uit dezelfde map, zodat die instrumenten
; blijven werken.
;
; rg-c9-table.dll: de reparatie van de aanroeptabel op 0x512000 (tools/rg-c9-table, gebouwd met
; tools/rg-c9-table/build.sh). game.exe is een dump van een *gepakt* exe: zijn importtabel is die van de packer
; (15 descriptoren, 55 imports), maar de eigen code van het spel roept via 989 plaatsen in .text/.protect door een
; tweede tabel op 0x512000. De packer vulde die tijdens het starten met de adressen die die API's hadden op de machine
; waar de dump vandaan komt (Windows XP): slot 232 = 0x4FD8AED0 = d3d9 Direct3DCreate9, kernel32 0x7C80xxxx, msvcr71
; 0x7C36-0x7C39, ole32 0x774C, user32/gdi32 0x77E4, advapi32 0x77F4; 68 slots bevatten 0x0313xxxx en enkele 0x02B1xxxx
; (de stubs van de packer, wier code niet in de dump zit). De DLL vertaalt elke slot met een bekend XP-adres naar het
; levende adres van dezelfde API en zet in de rest een logstub; rg-c9-table.log naast de exe laat zien welke slots het
; spel werkelijk aanroept, met argumenten en vrager. RG_C9_RET=<idx:waarde;...> en RG_C9_POP=<idx:nargs;...> bepalen wat
; een stub teruggeeft en hoeveel stapelargumenten hij opruimt.
[rg-compat.dll]
To = .
Env = RG_DONGLE2_LOG=rg-exit.log;RG_COMPAT_EXITLOG=1;RG_COMPAT_VEH=1;RG_COMPAT_IATFIX=1;RG_COMPAT_SAMPLE=700;RG_COMPAT_SAMPLE_LOG=rg-sample.txt;RG_TABLE_DUMP=0x512000,256,300;RG_MAPLOG=1;RG_PEEK=0x4FD8AED0,32;RG_PREMAP=0x03130000,0x20000|0x4FD00000,0x100000

[rg-c9-table.dll]
To = .
Preload = true
; Een Windows PE-DLL, geen ELF: niet in LD_AUDIT (docs/dropins.md, "Audit = false").
Audit = false
; The slots below are named from the game's own call sites (protection lane step 2, tools/dev/rg-c9-refs.py): 200 is
; called with one WNDCLASSEX pointer, 199 with the twelve CreateWindowExA arguments, 195 with (hwnd, msg, wParam,
; lParam) popped by `ret 0x10` (DefWindowProcA), 201 with (hwnd, "ERROR(5)", "NGUN2", MB_ICONHAND), 106 with one
; string (OutputDebugStringA), 149 with (buf, "ERROR 5 %d\n", value) and `add esp,0xc` (msvcr71 sprintf, cdecl), 56
; is asked for "WSAStartup"/"SetupDiGetClassDevsA"/"LoadRegTypeLib"/"IsWow64Process" (GetProcAddress), 76 opens
; \\.\FEnteDev and \\.\HARDLOCK.VXD with GENERIC_READ|WRITE and compares against INVALID_HANDLE_VALUE (CreateFileA),
; 87/89 are the LocalAlloc/LocalFree pair (flags 0x40, 28 free sites); 166 is the game's operator new (0x50F014 is
; nothing but `jmp [0x512298]` and callers pass one size argument; returning 0 made the D3D wrapper answer
; E_OUTOFMEMORY) and 168 the operator delete next to it. 197 and 198 are two user32 slots that take one
; NULL argument and whose result nobody reads; they stay logging stubs with one argument popped, and so does 240 (the ole32 slot the D3D init calls with one
; NULL argument at 0x401462, right after CreateDevice succeeded: with 0 arguments popped the frame of that function
; is off by one dword and its stack-cookie check at 0x50EE47 fails).
Env = RG_C9_LOG=rg-c9-table.log;RG_C9_VEH=1;RG_C9_CALLER=1;RG_C9_DUMP=0x401080,128;RG_C9_POP=197:1,198:1,240:1;RG_C9_API=200:user32.dll!RegisterClassExA,199:user32.dll!CreateWindowExA,195:user32.dll!DefWindowProcA,201:user32.dll!MessageBoxA,196:user32.dll!PostQuitMessage,106:kernel32.dll!OutputDebugStringA,56:kernel32.dll!GetProcAddress,76:kernel32.dll!CreateFileA,87:kernel32.dll!LocalAlloc,89:kernel32.dll!LocalFree,149:MSVCR71.dll!sprintf,202:user32.dll!ShowWindow,215:user32.dll!UpdateWindow,166:MSVCR71.dll!??2@YAPAXI@Z,168:MSVCR71.dll!??3@YAXPAX@Z
