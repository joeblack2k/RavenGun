[Status]
Status = working
Note = WERKT op de Lindbergh-route (2026-10-15): dubbelklik in RavenGun, hodexRI.elf met lindbergh.so en librg-stackalign.so (zonder die shim viel hij op een xcb-assert in glXCreatePbuffer), /var/tmp per game, JVS via de daemon, zink. 5,5 min gespeeld in muismodus. Richten (gemeten 2026-10-22 met de eigen CONTROLLER MARK CHECK van de game): de standaardkalibratie in de EEPROM liep tot 30 px (2,2% van de breedte) uit de pas, groeiend naar de rand; na de eigen PLAYER1/PLAYER2 CONTROLLER ADJUSTMENT van de game zit elk punt binnen 3 px in x en 4 px in y. De kalibratie staat in eeprom.bin (patches/HOTDEX/seed/eeprom.bin als zaad voor een schrijflaag zonder eeprom.bin); opnieuw kalibreren staat in docs/lindbergh.md.
NoteEN = WORKING on the Lindbergh route (2026-10-15): double-click in RavenGun, hodexRI.elf with lindbergh.so and librg-stackalign.so (without the shim it died on an xcb assert in glXCreatePbuffer), /var/tmp per game, JVS through the daemon, zink. Played 5.5 min in mouse mode. Aim (test-pattern, 1360x768), measured 2026-10-22 headless through the daemon with the game's own CONTROLLER MARK CHECK in its separate test program elf/hodextestR.elf (game ID 0xd58a0053; the game's own TEST key does nothing; SERVICE = key F3 steps the cursor, TEST = key 0 selects; the game draws a blue cross for P1 and a red cross for P2 where it thinks the gun points; cross centres read from full-resolution screenshots). The owner's write layer held the game's default gun calibration (byte-identical to a fresh eeprom.bin) and both players were off in proportion to the distance from the centre: 0.5,0.5 +2,+1 px; 0.3,0.3 -14,-2 px; 0.15,0.2 -28,-4 px; 0.1,0.1 -30,-5 px; 0.9,0.9 +29,+7 px; 0.1,0.9 -30,+7 px; edge midpoints 0.1,0.5 -30,+1 px and 0.9,0.5 +29,+1 px (up to 30 px = 2.2% of the width and 7 px = 0.9% of the height). Our JVS axis is linear over the whole range; the default calibration expects a narrower one. After the game's own PLAYER1 and PLAYER2 CONTROLLER ADJUSTMENT (three marks each at 32,32 / 1328,736 / centre, fired with output-button trigger, TEST to memorize) every one of the 13 points is within 3 px in x and 4 px in y (0.2% of the width, 0.5% of the height) for both players; in the running game the cursor at the four corner points lands within 7 px of the target with the same offset at every corner. The calibration is in eeprom.bin at 0x1000 (copy at 0x1080; against a fresh default only 0x1000-0x10b1 differs, no key or dongle data); the owner's write layer got it that way, and patches/HOTDEX/seed/eeprom.bin carries it into a fresh write layer (native.json 'seed'; an existing eeprom.bin is never overwritten, so recalibrate in the test menu if the cursor ever drifts). To recalibrate put a user-layer patches/HOTDEX/native.json with exe /lb/elf/hodextestR.elf and lindbergh.id 0xd58a0053, then TEST selects CONTROLLER CALIBRATION SETTING > PLAYER1/PLAYER2 CONTROLLER ADJUSTMENT (shoot the three marks, then TEST) and CONTROLLER MARK CHECK shows the result.

