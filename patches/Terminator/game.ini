; Gegenereerd door scripts/migrate-game-settings.py (docs/per-game-patches.md). Sleutels die het script afleidt uit de oude bronnen worden bij
; elke run opnieuw gezet; handwerk in andere sleutels blijft staan.
;
; Uit het oude UserProfiles/Terminator.env:
; door tp-add-game.py / ronde 2: TPUI-gamescope (Automatic fullscreen fit) werkt voor ElfLdr2

[Game]
Name = Terminator Salvation
Profile = Terminator
Type = ElfLdr2
EmulationProfile = RawThrillsGUN
Executable = game
ProfileRevision = 18

[Launch]
; Native route (eigen ELF-lader) in plaats van de directe ElfLdr2-route met BudgieLoader.
Mode = native

[Display]
Gamescope = true
GamescopePath = /usr/bin/gamescope

[Input]
Route = tp-shm
Layout = RawThrillsGUN
Note = start direct (zonder TeknoParrotUi) via tp-shm; via TeknoParrotUi werkt ook evdev (--tpui --route evdev)

; Klasse (statische meting 2026-10-12, zie patches/ELF-LADER-SPEC.md): ONGEPAKT -- volledige
; importtopologie, nul 0xdeadbeef-stubs. Met LD_LIBRARY_PATH=<ElfLdr2/libs> mist hij nog alleen
; libglut.so.3, en dat levert BudgieLoader zelf via zijn exporttabel (173 exports = de complete
; freeglut-API).

; Bediening voor de knoppen-uitleg bij de eerste start (docs/per-game-patches.md, "Bediening per game"); labels uit het
; TeknoParrot-profiel (GameProfiles/<P>.xml), "Not confirmed yet" = de werking is nog niet gemeten.
[Controls]
trigger = Shoot | Fires the gun.
reload = Reload | Reloads your weapon.
grenade = Grenades | Throws a grenade.

[Status]
Status = working
Note = WERKT op onze eigen route (2026-10-14): een dubbelklik in RavenGun start de game zonder scripts en zonder TeknoParrotUi (daemon -> rg-direct -> Wine -> BudgieLoader, schermvullend via gamescope). Gemeten op de tv met de muismodus: START (toets 1 even vasthouden), missie kiezen met de trekker, richten, schieten, herladen (rechterknop), een kill; 6:32 min gedraaid. Nog niet met de echte Move gespeeld op deze route. Sinds 2026-10-18 zonder TeknoParrot: eigen ELF-lader (rg-elfloader, native.json) + eigen HASP-emulatie met de dongle uit dropin/; eerste start vraagt de bekende START na de waarschuwing, daarna attract (T-800/FREEPLAY) op de tv gemeten.
NoteEN = WORKING on our own route (2026-10-14): a double-click in RavenGun starts the game without scripts and without TeknoParrotUi (daemon -> rg-direct -> Wine -> BudgieLoader, full screen through gamescope). Measured on the TV in mouse mode: START (hold key 1 briefly), mission select with the trigger, aim, shoot, reload (right button), a kill; ran 6:32 min. Not yet played with the real Move on this route. Since 2026-10-18 without TeknoParrot: own ELF loader (rg-elfloader, native.json) + own HASP emulation with the dongle from dropin/; the first start needs the known START after the warning, then attract (T-800/FREEPLAY) measured on the TV.
Findings = findings/Terminator.md

