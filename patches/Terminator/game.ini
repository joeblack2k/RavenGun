; Gegenereerd door scripts/migrate-game-settings.py (docs/per-game-patches.md). Sleutels die het script afleidt uit de oude bronnen worden bij
; elke run opnieuw gezet; handwerk in andere sleutels blijft staan.
;
; Uit het oude UserProfiles/Terminator.env:
; door tp-add-game.py / ronde 2: TPUI-gamescope (Automatic fullscreen fit) werkt voor ElfLdr2

[Game]
Name = Terminator Salvation
Profile = Terminator
Type = ElfLdr2
EmulationProfile = RawThrillsGUN

[Launch]
Mode = direct

[Display]
Gamescope = true
GamescopePath = /usr/bin/gamescope

[Input]
Route = tp-shm
Layout = RawThrillsGUN
Note = start direct (zonder TeknoParrotUi) via tp-shm; via TeknoParrotUi werkt ook evdev (--tpui --route evdev)

[Status]
Status = playable
Note = Werkt beeldvullend (via gamescope). Richten en schieten werken goed, ook via de IO-brug (tp-shm, 'play-halo.sh --route tp-shm').
NoteEN = Works full screen (through gamescope). Aiming and shooting work well, also through the I/O bridge (shared memory route).
Findings = findings/Terminator.md
