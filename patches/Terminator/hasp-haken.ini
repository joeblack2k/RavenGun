# ================================================================================================
# NOOT BIJ hasp_free — waarom de weigering van de hook CORRECT is
# ================================================================================================
# `hasp_free` @0x083baab0 is in deze build een alias: zijn hele lichaam is `e9 ab 22 00 00`, een
# `jmp rel32` naar 0x083bcd60. Dat is geen functie met een prologue, en de prologue-check van de
# hook (`hh_proloog_ok`) accepteert `0xe9` niet -- terecht. Twee dingen die daaruit volgen:
#
#  1. Het adres is goed; de weigering is goed. Dit is geen fout in deze lijst. Wie hier een fout
#     vermoedt: het bewijs staat in `find-dongle-adjacency.py` (span 0x220 identiek tussen twee
#     bewezen buren, gat van 0xb naar `hasp_login_scope` identiek in beide builds, en de eerste
#     instructie op het voorspelde adres is inderdaad een `jmp`).
#  2. Het helpt NIET om in plaats daarvan het alias-doel te hooken: 0x083bcd60 is zelf ook weer een
#     `jmp rel32` (`e9 ab be 04`). Het is dus een keten van minimaal twee sprongen naar de
#     vertroebelde HASP-kern. Voor `hasp_free` is er in deze build geen enkel punt met een prologue.
#
# Inhoudelijk hoeft dat geen probleem te zijn: `hasp_free` geeft in de HASP-HL-API geheugen vrij
# dat door `hasp_get_info`/`hasp_get_sessioninfo` is gereserveerd. Het is geen functie die iets van
# de dongle vraagt. De tien die WEL aangehaakt worden zijn de tien die de dongle daadwerkelijk
# aanspreken -- en dat zijn precies de tien met graad A.
