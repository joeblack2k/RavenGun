# RavenGun — adreslijst voor de generieke HASP-inline-hook, game: Terminator Salvation
#
# Dit bestand hoort in de PATCHES-repo (het is van deze ene game-versie), niet in de lader-repo.
# De hook leest het via RAVENGUN_HASP_ELF_ADRESLIJST, of anders als `hasp-haken.ini` naast de
# hookbibliotheek. Zonder dit bestand verandert er niets: dan blijft de naam-route (dynsym) de
# enige weg, en dat is de standaard.
#
# WAAROM DIT BESTAAN
# ------------------
# De HASP-cliënt van Terminator zit STATISCH in `game`. Gemeten: `game` heeft 1.019 dynamische
# symbolen en NUL daarvan met `hasp_`; de naam-route kan hier dus per definitie niets vinden.
#
# WAAR DE ADRESSEN VANDAAN KOMEN (gemeten, niet gegokt)
# ----------------------------------------------------
# Niet uit een lopende TeknoParrot-run, maar uit een tweede binary in DEZELFDE spelmap:
#
#     ServiceDongleApp/ServiceDongleApp   -- 32-bits i386, NIET gestript, met volledige DWARF
#
# Dat is dezelfde PlayMechanix-engine, dus zijn symbooltabel is een landkaart voor het gestripte
# `game`. Elke regel hieronder is terug te rekenen met de twee tools in deze map:
#
#     python3 find-dongle-symbols.py     # codeblok-match + string-verankering   -> 43 van 58
#     python3 find-dongle-adjacency.py   # buurafstand + alias-cross-check       -> 7 meer
#
# GRADERING (staat als commentaarregel BOVEN elke regel, niet erachter: de lezer van dit bestand
# knipt geen commentaar van de waarde af, dus een inline-commentaar zou in `waarde` belanden)
# ------------------------------------------------------------------------------------------------
#   A  = byte-identiek blok met ServiceDongleApp, 0 afwijkende bytes over de niet-adres-bytes.
#        Dit is bewijs, geen waarschijnlijkheid.
#   A-adjacentie = het adres volgt uit de afstand tot twee bewezen buren (span identiek in beide
#        builds) plus de eerste instructie op het voorspelde adres. Zie LADER-README.md §4.
#   B/C = 1-6% afwijkende bytes. NIET in de actieve lijst opgenomen.
#
# BRONVERSIE
# ----------
#   game       : 7.764.284 bytes, e_entry 0x08057240, ELF32 i386 ET_EXEC, 13 DT_NEEDED
#                spel meldt zelf "Version: 01.25.00.US RELEASE" (build 12 september 2011)
#   anker      : ServiceDongleApp/ServiceDongleApp (zelfde map, ongestript, DWARF)
#   `grootte` en `ingang` hieronder zijn de versiecontrole: kloppen ze niet met het beeld, dan
#   keurt de hook de HELE lijst af. Dat is de bedoeling -- een adres uit een andere build is een
#   crash die niemand terugvindt.
#
# WAT ER NIET IN STAAT, EN WAAROM
# -------------------------------
# De hook kent precies 11 doelen (hh_doelen[]): hasp_login, hasp_login_scope, hasp_logout,
# hasp_read, hasp_write, hasp_encrypt, hasp_decrypt, hasp_get_size, hasp_get_info,
# hasp_get_sessioninfo, hasp_free. Alleen die namen komen hieronder actief voor; een `hasp_`-regel
# met een andere naam wordt wel geparseerd maar nooit aangehaakt, dus dat is alleen ruis.
# De overige 47 adressen uit de symbolenkaart staan onderaan als UITGEKOMMENTARIEERD naslagwerk.
#
# EEN VERWACHTE WEIGERING, MET OPZET
# ----------------------------------
# `hasp_free` staat erin met een correct adres, maar de hook HOORT het te weigeren: het is in deze
# build een `jmp rel32`-alias (eerste byte 0xe9), geen functie met een prologue. De prologue-check
# van de hook wijst dat terecht af. Dat is dus GEEN fout in deze lijst. Zie de noot onderaan.

game    = Terminator
arch    = i386
basis   = absoluut
grootte = 7764284
ingang  = 0x8057240

# --- graad A: byte-identiek blok in ServiceDongleApp (0 afwijkende bytes) ---

# A  hasp_login            SDA 0x08300cb0  103 B   0/103 niet-adres-bytes afwijkend
hasp_login           = 0x083bbe60

# A  hasp_login_scope      SDA 0x082ff910  144 B   0/140
hasp_login_scope     = 0x083baac0

# A  hasp_logout           SDA 0x08300c50   90 B   0/86
hasp_logout          = 0x083bbe00

# A  hasp_read             SDA 0x082ffb80  174 B   0/174
hasp_read            = 0x083bad30

# A  hasp_write            SDA 0x082ffad0  176 B   0/176
hasp_write           = 0x083bac80

# A  hasp_encrypt          SDA 0x08300bb0  125 B   0/117
hasp_encrypt         = 0x083bbd60

# A  hasp_decrypt          SDA 0x08300b30  125 B   0/121
hasp_decrypt         = 0x083bbce0

# A  hasp_get_size         SDA 0x082ffa30  154 B   0/154
hasp_get_size        = 0x083babe0

# A  hasp_get_info         SDA 0x082ff6f0  524 B   0/224
hasp_get_info        = 0x083ba8a0

# A  hasp_get_sessioninfo  SDA 0x082ffcd0  649 B   0/248
hasp_get_sessioninfo = 0x083bae80

# --- adres bewezen, maar de hook hoort dit te WEIGEREN (zie de noot onderaan) ---

# A-adjacentie  hasp_free  SDA 0x082ff900  5 B  -- alias: `jmp rel32`, eerste bytes e9 ab 22 00
hasp_free            = 0x083baab0

