; Drop-in van Terminator Salvation (docs/dropins.md).
;
; De dongle van deze game staat in ravengun-hasp/Terminator/. De image daarin is GEEN
; reconstructie: het is de HASP-HL-geheugendump `hhl_mem.dmp` die in de eigen hasp-map van de game
; staat, byte voor byte overgenomen. Zie patches/Terminator/README.md en de `notes` in dongle.json.
;
; GEEN inline-hook. `game` heeft 0 hasp_-symbolen in zijn dynsym (1019 dynamische symbolen, geen
; enkele met 'hasp') en 0 ongedefinieerde hasp-symbolen: er is geen statisch gelinkte HASP-client om
; aan te haken. Dat de game wel een Aladdin/HASP-dongle gebruikt blijkt uit zijn eigen tekstregels
; ('DongleInitialize() FAILED!', 'ReInitAladdinDongles called: %d times') en uit t4-patch ('failed
; to find aladdin dongle'). Zie docs/hasp-elf-hook.md, sectie 5.
;
; Daarom is deze drop-in voorlopig INERT: de bestanden worden in de view gezet, maar er is niets dat
; de emulator aanspreekt. Hij staat er omdat de dongle-beschrijving de enige vastgelegde bron van
; deze dongle is, en omdat een latere hook (of de eigen lader) hem wel kan gebruiken.
;
; LET OP: elk bestand dat de game nodig heeft moet een EIGEN sectie hebben, anders wordt het niet
; gekopieerd (docs/dropins.md).

; De emulatorbibliotheek hoort volgens het drop-in-contract in de drop-in. GEEN Preload: glibc eist
; van een bibliotheek in LD_AUDIT dat hij `la_version` exporteert, en ravengun-hasp.so doet dat niet
; ("undefined symbol: la_version; ignored").
[ravengun-hasp.so]
To = .

[ravengun-hasp/Terminator/dongle.json]
To = .

[ravengun-hasp/Terminator/memory/00000000000000001111111111110100]
To = .
