;
; Drop-in van LGI (docs/dropins.md).
;
; De donglegegevens staan in ravengun-hasp/LGI/. De bibliotheek leest ze daar zelf:
; de loader weet niets van dongles. Elk bestand heeft een EIGEN sectie, want de
; drop-in-motor kopieert alleen wat een sectie heeft.

[ravengun-hasp/LGI/dongle.json]
To = .

; rg-amhw.dll: de kastapparaten van een Sega Ring-kast (DMI, SRAM, SMBus/EEPROM, dipschakelaars, JVS). Bron tools/rg-amhw/, bouwen
; met tools/dev/build-amhw.sh. RG_AMHW_DIPIN=FE,FF: dipschakelaar 0 aan = STD-kast zonder bewegende stoel. Laadbewijs: rg-amhw.log.
[rg-amhw.dll]
To = .
Preload = true
Audit = false
Env = RG_AMHW_OEM=AAM;RG_AMHW_VENDOR=Supermicro;RG_AMHW_DIPIN=FE,FF
