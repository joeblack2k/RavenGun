; Gegenereerd door scripts/migrate-game-settings.py (docs/per-game-patches.md). Sleutels die het script afleidt uit de oude bronnen worden bij
; elke run opnieuw gezet; handwerk in andere sleutels blijft staan.
;
; Uit het oude UserProfiles/LGI.env:
; eigen prefix-kopie (zie findings/LetsGoIsland.md), plain wine via wrappers/wine-prefix

[Game]
Name = Let's Go Island: Lost on the Island of Tropics
Profile = LGI
Type = TeknoParrot
EmulationProfile = SegaJvsLetsGoIsland
DongleRegion = JAPAN
PcbRegion = JAPAN
Executable = LGI_RingW_F_safe.exe
ProfileRevision = 21

[Launch]
Mode = direct

[Wine]
Prefix = ravengun-test-lgi
VirtualDesktop = 1920x1080
Runner = wrapper

[Input]
Route = jvs
Board = LGI
ComPort = COM4
JvsTransport = pipe
Note = speelbaar: de game praat JVS over de pipe TeknoParrot_JVS; start direct (zonder TeknoParrotUi, play-halo.sh) met UserProfiles/LGI.env: TP_REMOTETHREAD=off, RG_WINEPREFIX (eigen prefix-kopie met een Wine-virtueel bureaublad 1920x1080: volledig scherm loopt vast, venstermodus laat de kern crashen) en RG_JVS_TRANSPORT=pipe; launch-direct.py brugt de pipe naar de pty van de daemon, die het JVS-bord LGI is (aim, trekker, start, munt)

[Status]
Status = working
Note = WERKT op onze eigen route (2026-10-14): een dubbelklik in RavenGun start de game zonder scripts en zonder TeknoParrotUi (daemon -> rg-direct -> Wine -> OpenParrot-lader; JVS over de pipe naar het bord van de daemon). Gemeten op de tv met de muismodus: START (toets 1 even vasthouden), richten, schieten, doorgaan na CONTINUE, tot een eindbaas (score 36600); 5:23 min attract en spel na het eerste attractbeeld. De teksten in het spel zijn Japans (regio JAPAN in game.ini). Nog niet met de echte Move gespeeld op deze route.
NoteEN = WORKING on our own route (2026-10-14): a double-click in RavenGun starts the game without scripts and without TeknoParrotUi (daemon -> rg-direct -> Wine -> OpenParrot loader; JVS over the pipe to the daemon's board). Measured on the TV in mouse mode: START (hold key 1 briefly), aim, shoot, continue after CONTINUE, up to a boss (score 36600); 5:23 min of attract and play after the first attract screen. The in-game texts are Japanese (region JAPAN in game.ini). Not yet played with the real Move on this route.
Findings = findings/LetsGoIsland.md

