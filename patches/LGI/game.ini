; Gegenereerd door scripts/migrate-game-settings.py (docs/per-game-patches.md). Sleutels die het script afleidt uit de oude bronnen worden bij
; elke run opnieuw gezet; handwerk in andere sleutels blijft staan.
;
; Uit het oude UserProfiles/LGI.env:
; eigen prefix-kopie (zie findings/LetsGoIsland.md), plain wine via wrappers/wine-prefix

[Game]
Name = Let's Go Island: Lost on the Island of Tropics
Profile = LGI
Type = TeknoParrot
EmulationProfile = SegaJvsLetsGoIsland
DongleRegion = JAPAN
PcbRegion = JAPAN
Executable = LGI_RingW_F_safe.exe
ProfileRevision = 21

[Launch]
Mode = direct

[Wine]
Prefix = ravengun-test-lgi
VirtualDesktop = 1920x1080
Runner = wrapper

[Input]
Route = jvs
Board = LGI
ComPort = COM4
JvsTransport = pipe
Note = speelbaar: de game praat JVS over de pipe TeknoParrot_JVS; start direct (zonder TeknoParrotUi, play-halo.sh) met UserProfiles/LGI.env: TP_REMOTETHREAD=off, RG_WINEPREFIX (eigen prefix-kopie met een Wine-virtueel bureaublad 1920x1080: volledig scherm loopt vast, venstermodus laat de kern crashen) en RG_JVS_TRANSPORT=pipe; launch-direct.py brugt de pipe naar de pty van de daemon, die het JVS-bord LGI is (aim, trekker, start, munt)

[Status]
Status = playable
Note = Speelbaar: start tot de attract, start (toets 1) en spelen. Het vizier volgt de aim (gemeten op een raster), de trekker schiet. Volledig scherm, geen titelbalk. Laden duurt ongeveer 1 minuut. Echte Move-knoppen en geluid niet beoordeeld.
NoteEN = Playable: starts through to the attract, start (key 1) and play. The crosshair follows the aim (measured on a grid) and the trigger fires. Fullscreen, no title bar. Loading takes about a minute. Real Move buttons and sound not checked.
Findings = findings/LetsGoIsland.md

