[Game]
Name = Time Crisis 5
Profile = TC5
Type = TeknoParrot
EmulationProfile = TimeCrisis5
Executable = RSLauncher.exe
Is64Bit = true
ProfileRevision = 19

[Launch]
Mode = direct
WorkingDirectory = .

; Lader uit de TeknoParrot-runtime: Time Crisis 5 (Namco ES3X) gebruikt bngrw.dll en iDmacDrv64.dll naast de lader; die zitten
; (nog) niet in de eigen OpenParrot-build (third_party/openparrot/README.md).
[Loader]
Build = teknoparrot
RemoteThread =
PostStartMs = 3000

[Input]
Route = tp-shm
Layout = TimeCrisis5
CoinKeys = lshift,t
Note = de game leest zijn munt uit het toetsenbord (Shift+T); aim, trekker en pedalen komen via tp-shm

[Status]
Status = playable
Note = Speelbaar via de IO-brug (tp-shm): richten, trekker en linker pedaal (middenknop) werken; munt = Move-knop voor toets 5 (de daemon geeft de game daarvoor Shift+T). Schiet in het menu om '1-player solo' te kiezen. Rechter pedaal nog niet apart gecontroleerd.
NoteEN = Playable through the I/O bridge (shared memory): aiming, trigger and left pedal (middle button) work; coin = the Move button for key 5 (the engine sends Shift+T to the game). Shoot '1-player solo' in the menu. The right pedal has not been checked on its own yet.

