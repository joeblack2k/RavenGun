;
; Drop-ins van Time Crisis 5 (docs/dropins.md).
;
; De game importeert hasp_windows_x64_105293.dll op ordinalen 2, 13, 14 en 15 (gemeten; docs/hasp-layer.md).
; Onze DLL heeft dezelfde namen en ordinalen en is daarmee een vervanging van de runtime van de fabrikant.
; De launcher zet hem in de map van de game (naast de exe) en dwingt hem af met WINEDLLOVERRIDES.
;
; De bestanden worden gebouwd met scripts/build-hasp.sh (dat ze ook hier neerzet).
;
; LET OP: zolang er geen lokale view van TC5 is, ligt de map van de game op de NAS en weigert de
; drop-in-motor te schrijven (nooit naar de NAS). Maak er dan een met:
;   scripts/tp-add-game.py TC5 "<pad naar Time Crisis 5>" --view --view-up 3
;
; Uitzetten: haal de bestanden weg of de secties hieronder weg.

[hasp_windows_x64_105293.dll]
To = .
DllOverride = native
Env = RAVENGUN_HASP_DIR=ravengun-hasp;RAVENGUN_HASP_GAME=TC5;RAVENGUN_HASP_VERBOSE=1

[hasp_windows_x64_106993.dll]
To = .
DllOverride = native
Env = RAVENGUN_HASP_DIR=ravengun-hasp;RAVENGUN_HASP_GAME=TC5;RAVENGUN_HASP_VERBOSE=1

[hasp_windows_x64.dll]
To = .
DllOverride = native
Env = RAVENGUN_HASP_DIR=ravengun-hasp;RAVENGUN_HASP_GAME=TC5;RAVENGUN_HASP_VERBOSE=1

[ravengun-hasp/TC5/dongle.json]
To = .
