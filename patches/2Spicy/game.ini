[Status]
Status = working
Note = WERKT op de Lindbergh-route (2026-10-15): dubbelklik in RavenGun, apacheM.elf met lindbergh.so en librg-stackalign.so (oude i386-code met een op 16 bytes uitgelijnde stapel in de GL-bibliotheken van SteamOS), libsndio-stub voor OpenAL, JVS via de daemon. 5,5 min gespeeld in muismodus. Richten (gemeten 2026-10-22 met de eigen GUN ADJUSTMENT > CHECK van de game): de standaardkalibratie in de EEPROM liep tot 44 px (3,4% van de breedte) uit de pas, groeiend naar de rand; na de eigen GUN ADJUSTMENT van de game zit elk punt binnen 2 px. De kalibratie staat in eeprom.bin (patches/2Spicy/seed/eeprom.bin als zaad voor een schrijflaag zonder eeprom.bin); opnieuw kalibreren staat in docs/lindbergh.md.
NoteEN = WORKING on the Lindbergh route (2026-10-15): double-click in RavenGun, apacheM.elf with lindbergh.so and librg-stackalign.so (old i386 code given a 16-byte aligned stack into SteamOS's GL libraries), a libsndio stub for OpenAL, JVS through the daemon. Played 5.5 min in mouse mode. Aim (test-pattern, 1280x768), measured 2026-10-22 headless through the daemon with GUN ADJUSTMENT > CHECK in the game's separate test program elf/apachetestM.elf (game ID 0x6510b2e6; SERVICE = key F3 steps the cursor, TEST = key 0 or the trigger selects; CHECK draws an orange reticle where the game thinks the gun points; only P1 has one, the game keeps a single calibration set; reticle centres read from full-resolution screenshots). The owner's write layer held the game's default calibration (byte-identical to a fresh eeprom.bin: TOP 10, LEFT 10, CENTER 80/80, RIGHT f0, BOTTOM f0 on the 8-bit axis) and the aim was off in proportion to the distance from the centre: 0.5,0.5 0,0 px; 0.3,0.3 -22,-7 px; 0.15,0.2 -38,-11 px; 0.1,0.1 -44,-14 px; 0.9,0.1 +42,-14 px; 0.1,0.9 -44,+13 px; 0.9,0.9 +42,+13 px; 0.85,0.8 +38,+10 px; edge midpoints 0.1,0.5 -44,0 px and 0.9,0.5 +42,0 px (up to 44 px = 3.4% of the width and 14 px = 1.9% of the height). After the game's own adjustment (select TOP, LEFT, CENTER, RIGHT, BOTTOM in turn and fire at the white mark with output-button trigger: marks at 640,32 / 32,384 / centre / 1248,384 / 640,736; then EXIT with TEST stores it) the values are TOP 0a, LEFT 06, CENTER 80/80, RIGHT f9, BOTTOM f5 and every one of the 13 points is within 2 px in x and 1 px in y (0.2% / 0.1%); in the running game the cursor follows the aim at the corner points and (0.75,0.25). The calibration is in eeprom.bin at 0x1000 (copy at 0x1080; against a fresh default only those bytes differ, no key or dongle data); the owner's write layer got it that way, and patches/2Spicy/seed/eeprom.bin carries it into a fresh write layer (native.json 'seed'; an existing eeprom.bin is never overwritten). To recalibrate put a user-layer patches/2Spicy/native.json with exe /lb/elf/apachetestM.elf and lindbergh.id 0x6510b2e6.

