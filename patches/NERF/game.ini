; Uit het oude UserProfiles/NERF.env:
; door tp-add-game.py; test 2026-10-11: standaardroute van de lader (entry-point-trampoline), zonder TP_REMOTETHREAD

[Game]
Name = NERF Arcade
Profile = NERF
Type = TeknoParrot
EmulationProfile = WartranTroopers
Executable = Nerf.exe
Is64Bit = true
ProfileRevision = 3
Patreon = true

[Launch]
Mode = direct

[Wine]
Prefix = ravengun-test-dxvk
DllOverrides = winhttp=n,b;d3d11,d3d10core,dxgi=n,b
Runner = wrapper

[Input]
Route = tp-shm
Layout = WartranTroopers
Note = speelbaar via tp-shm: UserProfiles/NERF.env heeft TP_REMOTETHREAD=off (standaardroute van de lader; met TP_POSTSTART_REMOTETHREAD_MS komt er geen invoer aan). DXVK-prefix, BepInEx laadt; free play, start = toets 1

[Status]
Status = working
Note = WERKT: draait op onze eigen kern (native Linux, Nerf.x86_64), rechtstreeks gestart vanuit RavenGun (dubbelklik; de engine start hem zelf, zonder scripts). Het lightgun-bord (RIO) antwoordt via de RIO-brug: START (toets 1 / Move-START), richten en trekker (muis 2026-10-14: score 12.050). De Windows-route (TeknoParrot, DXVK, BepInEx) is niet meer nodig. Niet getest: speler 2.
NoteEN = WORKING: runs on our own core (native Linux, Nerf.x86_64), started straight from RavenGun (double-click; the RavenGun engine starts it itself, no scripts). The lightgun board (RIO) answers through the RIO bridge: START (key 1 / Move START), aim and trigger (mouse 2026-10-14: score 12,050). The Windows route (TeknoParrot, DXVK, BepInEx) is no longer needed. Not tested: player 2.
Findings = findings/NERF.md

