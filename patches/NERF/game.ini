[Game]
Name = NERF Arcade
Profile = NERF
Type = TeknoParrot
EmulationProfile = WartranTroopers
Executable = Nerf.exe
Is64Bit = true
ProfileRevision = 3
Patreon = true

[Launch]
Mode = direct

[Wine]
Prefix = ravengun-test-dxvk
DllOverrides = winhttp=n,b;d3d11,d3d10core,dxgi=n,b
Runner = wrapper

[Input]
Route = tp-shm
Layout = WartranTroopers
Note = speelbaar via tp-shm: UserProfiles/NERF.env heeft TP_REMOTETHREAD=off (standaardroute van de lader; met TP_POSTSTART_REMOTETHREAD_MS komt er geen invoer aan). DXVK-prefix, BepInEx laadt; free play, start = toets 1

[Status]
Status = playable
Note = Speelbaar: free play, start (toets 1), richten en trekker (score loopt op). Draait met DXVK in een eigen Wine-prefix; de BepInEx-plugin laadt. Niet getest: de echte Move-knoppen, speler 2 en geluid. Native route (2026-10-14): het originele Linux-programma Nerf.x86_64 op onze eigen kern (zonder Wine, TeknoParrot of BepInEx) is SPEELBAAR via de RIO-brug (tools/rio-bridge in de lader, tabel patches/NERF/rio-invoer.ini): start, richten en trekker komen van de daemon, de lightguns zijn gekalibreerd in het eigen operatormenu van de game, 11 minuten gespeeld met score (bewijs-bridge-20261014/). Profiel packaging/native-games.json (NERF); play-halo.sh neemt die route als het profiel aan staat. Niet getest op die route: de echte Move of muis, vuren voor speler 2, geluid.
NoteEN = Playable: free play, start (key 1), aiming and trigger (the score counts up). Runs with DXVK in its own Wine prefix; the BepInEx plugin loads. Not tested: real Move buttons, player 2 and sound. Native route (2026-10-14): the original Linux program Nerf.x86_64 on our own core (no Wine, TeknoParrot or BepInEx) is PLAYABLE through the RIO bridge (tools/rio-bridge in the loader, table patches/NERF/rio-invoer.ini): start, aim and trigger come from the daemon, the arcade lightguns are calibrated in the game's own operator menu, 11 minutes played with scoring (bewijs-bridge-20261014/). Profile packaging/native-games.json (NERF); play-halo.sh takes that route when the profile is enabled. Not tested on that route: the real Move or mouse, Player 2 firing, sound.
Findings = findings/NERF.md

