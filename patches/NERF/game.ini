; door tp-add-game.py; test 2026-10-11: standaardroute van de lader (entry-point-trampoline), zonder TP_REMOTETHREAD

[Game]
Name = NERF Arcade
Profile = NERF
Type = TeknoParrot
EmulationProfile = WartranTroopers
Executable = Nerf.exe
Is64Bit = true
ProfileRevision = 3
Patreon = true

[Launch]
Mode = direct

[Wine]
Prefix = ravengun-test-dxvk
DllOverrides = winhttp=n,b;d3d11,d3d10core,dxgi=n,b
Runner = wrapper

[Input]
Route = tp-shm
Layout = WartranTroopers
Note = speelbaar via tp-shm: UserProfiles/NERF.env heeft TP_REMOTETHREAD=off (standaardroute van de lader; met TP_POSTSTART_REMOTETHREAD_MS komt er geen invoer aan). DXVK-prefix, BepInEx laadt; free play, start = toets 1

[Status]
Status = playable
Note = Speelbaar: free play, start (toets 1), richten en trekker (score loopt op). Draait met DXVK in een eigen Wine-prefix; de BepInEx-plugin laadt. Niet getest: de echte Move-knoppen, speler 2 en geluid. Tweede route (2026-10-14): het originele Linux-programma Nerf.x86_64 draait native zijn attract-lus (scripts/play-native.sh --game NERF --gamescope, 12 minuten gemeten), zonder Wine of TeknoParrot; daar staat "RIO DISCONNECTED" in beeld en is geen invoer geprobeerd (ATTRACT-RUN.md).
NoteEN = Playable: free play, start (key 1), aiming and trigger (the score counts up). Runs with DXVK in its own Wine prefix; the BepInEx plugin loads. Not tested: real Move buttons, player 2 and sound. Second route (2026-10-14): the original Linux program Nerf.x86_64 runs its attract loop natively (scripts/play-native.sh --game NERF --gamescope, 12 minutes measured), without Wine or TeknoParrot; it shows "RIO DISCONNECTED" and no input was tried (ATTRACT-RUN.md).
Findings = findings/NERF.md

