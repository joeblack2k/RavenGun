# PROBE session only: rio-invoer.ini without "bit 7 -> id 7" (start comes from key 1 = bit 6); the daemon trigger (bit 7) is mapped live via RG_RIO_PROBE.
# Read by tools/rio-bridge/rg_rio_bridge.c (in the loader repo) through RG_RIO_TABLE. Format: see the head of that file.
#
# Board image: the daemon's tp-shm route for NERF writes layout WartranTroopers (game.ini [Input] Layout), so the bit
# and byte numbers below are that layout's (packaging/tp-shm-profiles.json). Change the layout, change this table.
#
# Which RIO id / lightgun channel means what was MEASURED on the bench, 2026-10-14
# (patches/NERF/bewijs-rio-20261014/inputs-map-20261014/MAP.md):
#   switch id 7 = Player-1 start (a discrete press starts a P1 round)      id 8 = Player-2 start
#   switch id 3 = TEST (held -> operator menu)                             id 5, id 6 = volume (+/- order not measured)
#   lightgun channels: 19 = P1 X, 20 = P1 Y, 21 = P2 X, 22 = P2 Y; X 0 = left, Y 0 = BOTTOM (the image has 0 = top: invert)
#
# The function signatures are the first 8 bytes of each function in the dump's librio.so
# (sha256 a32fb2e61b0e2a6b..., Nerf_Data/Plugins/x86_64_ori/librio.so). Another build -> bytes differ -> the bridge does nothing.

bibliotheek naam=librio.so
proces      naam=Nerf.x86_64
beeld       bits=8

functie naam=RIO_Connected  rol=verbonden  sig=488b0579fc210083
functie naam=RIO_SW_Count   rol=schakelaar sig=8d47dc83f8277738
functie naam=RIO_ADC_Val    rol=adc        sig=89ff488d04bf488d
functie naam=RIO_ADC_Val_Ex rol=adc_ex     sig=8d47ed83f8037740

schakelaar bit=6  id=7     # p1.start   -> id 7 as well
schakelaar bit=12 id=8     # p2.trigger -> id 8
schakelaar bit=11 id=8     # p2.start   -> id 8 as well
schakelaar bit=0  id=3     # test       -> id 3 (TEST)
schakelaar bit=4  id=5     # volume_up  -> id 5 (direction of 5/6 not measured)
schakelaar bit=5  id=6     # volume_down-> id 6

# Lightgun channels. The range is the board's 12-bit ADC; the game maps it onto the screen through its own
# CALIBRATION (operator menu), so 0..4095 here only has to be the range the calibration was taken in.
kanaal bron=12 ch=19 min=0 max=4095 inverteer=nee   # p1.x
kanaal bron=13 ch=20 min=0 max=4095 inverteer=ja    # p1.y (image 0 = top, channel 0 = bottom)
kanaal bron=14 ch=21 min=0 max=4095 inverteer=nee   # p2.x
kanaal bron=15 ch=22 min=0 max=4095 inverteer=ja    # p2.y
