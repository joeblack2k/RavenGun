; Gegenereerd door scripts/migrate-game-settings.py. Zet een gedeelde patch aan (definitie in _defaults/<Type>.patches.ini); andere patches in dit bestand zijn handwerk en blijven staan.

[Patch: OpenParrotLoader zonder CONTEXT_FLOATING_POINT]
Enabled = true

[Patch: Gun-schrijfacties uit (0x113E80)]
Enabled = false
Kind = memory
Category = input
AppliedBy = core
Module = game.exe
Offset = 0x113E80
Action = jmp-returns-true
Source = OpenParrot TypeX2Generic.cpp (GPL-3.0), regel 2239
Reason = OpenParrot-commentaar: "Disable Gun Writes". De OpenParrot-kern zet op deze plek een JMP naar een functie die altijd 1 teruggeeft (ReturnsTrue); hij past dit zelf al toe (AppliedBy = core). Alleen documentatie: RavenGun past dit niet toe en schrijft hier niets. Er staan geen originele bytes in de bron, dus Find is leeg.

[Patch: Volumeschrijfactie uit (0x1156C8)]
Enabled = false
Kind = memory
Category = audio
AppliedBy = core
Module = game.exe
Offset = 0x1156C8
Action = nop
Size = 4
Source = OpenParrot TypeX2Generic.cpp (GPL-3.0), regel 2241
Reason = OpenParrot-commentaar: "Volume Write (Uses Analog0 from JVS which we use for inputs)". De OpenParrot-kern maakt hier 4 bytes NOP en past dit zelf al toe (AppliedBy = core). Alleen documentatie: RavenGun past dit niet toe. Er staan geen originele bytes in de bron, dus Find is leeg.
