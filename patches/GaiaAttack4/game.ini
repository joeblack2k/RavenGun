NoteEN = WORKING via double-click (2026-10-16): attract, coin, START, area select, mission; ran 5.5 min. Gun calibration ships with RavenGun (made in the test menu); to recalibrate: TEST > GUN CHECK > START 1, save with TEST.
Findings = findings/GaiaAttack4.md

; Profiel uit TeknoParrot-sjabloon GameProfiles/GaiaAttack4.xml, revisie 12 (scripts/import-tp-profiles.py; opnieuw importeren in plaats van met de hand wijzigen)
; Gemeten 2026-10-16 (proef in de gebruikerslaag: [Launch] Mode = direct, [Input] Route = jvs, Board = SegaGun2P, JvsTransport = pipe,
; Layout = MusicGunGun2Pipe): in gamescope zwart (ook met -w/-h 1280x720 of 1360x768); ZONDER gamescope met Windowed = 1 wel beeld:
; "ERROR / I/O ERROR 2 / Check if any wire disconnection with I/O board". De JVS-ketting stopt na 0x14 (features); ons bord
; SegaGun2P meldt hetzelfde als het standaardbord van TeknoParrot (837-14572, 2 spelers, 14 knoppen, 2 munten, 8x10 bit, 20 GPO),
; waarmee Music GunGun 2 wel werkt.
; Opgelost 2026-10-16: (1) het spel sluit de JVS-pipe na de eerste bordcontrole (zijn 0x67 is onbekend) en opent hem opnieuw;
; rg-direct nam maar een verbinding aan -> I/O ERROR 2. (2) Daarna vraagt het 0x22 voor 10 kanalen aan een bord met 8; ons bord gaf
; een foutrapport -> I/O ERROR. Nu krijgt elke verbinding antwoord en geeft het bord zoveel kanalen als gevraagd (zoals TeknoParrot).
; (3) START zit bij de Taito-geweerspellen op P1 omhoog/omlaag (TeknoParrot-profiel) -> bord TaitoGun. (4) De fabriekskalibratie
; zit 20% naast het beeld (X x1,2, Y -0,16): in het testmenu gekalibreerd met de muismodus en als zaaigoed meegeleverd.
