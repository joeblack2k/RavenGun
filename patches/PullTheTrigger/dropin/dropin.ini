; Pull The Trigger zonder TeknoParrot: de drop-ins van de kandidaat (tools/rg-ptt, docs/research/losse/PullTheTrigger.md).
;
; WkWin32.dll is de WibuKey-doos voor PTW.exe: de WibuKey-stub laadt WKWIN32.DLL bij naam uit de map van de exe (de view) en
; haalt negen functies op ordinaal op. Er is geen DllOverride nodig (er is geen ingebouwde Wine-versie) en geen Preload (het
; spel laadt de DLL zelf). Logboek: rg-wkwin32.log in de map van de exe (laadbewijs).
[WkWin32.dll]
To = .

; Seriele poorten zonder poorten (tools/rg-ptt/rg_ptt_wsc32.c): onze wsc32.dll vervangt de echte WSC32 (die CreateFileA("COMx") doet en
; onder Wine "Memory Card Port Open Error!" geeft). Poort 0 = geheugenkaartlezer (leeg, "geen kaart"), poort 1 = geweerbord uit het
; gedeelde geheugen TeknoParrot_JvsState. Geen DllOverride, geen Preload (het spel laadt hem zelf). Logboek: rg-wsc32.log naast de exe.
[wsc32.dll]
To = .

; Kalibratie voor het geweerbord: een rechthoek (26,26)-(230,230), zodat byte -> scherm lineair is (byte * 640/255). De echte
; correctionV2.txt op de NAS is de kalibratie van een fysiek wapen en blijft ongemoeid; deze staat alleen in de view.
[correctionV2.txt]
To = .
