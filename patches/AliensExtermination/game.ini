[Game]
Name = Aliens Extermination
Profile = AliensExtermination
Executable = aliens.exe;aliens dehasped.exe
Type = TeknoParrot
EmulationProfile = AliensExtermination
ProfileRevision = 14

[Launch]
Mode = direct
; "aliens dehasped.exe" heeft zijn HASP-emulatie achter het einde van .text (SizeOfRawData 0x55DB6, 573 bytes code tot de bladzijde).
; Windows mapt die bladzijde mee, Wine zet hem op nul: page fault op 0x456DF1 (lezen van 0xFFFFFFF1). PeFillPages maakt in de view een
; lokale kopie met secties tot hun bladzijde (CRC32 van de kop gelijk); met een kop zonder die CRC stopte de kern met exitcode 1337.
PeFillPages = true

[Display]
Gamescope = true

; Pass 1 (docs/goal-90-native.md): Global VR, EmulationProfile AliensExtermination. Er is geen tp-shm-indeling of JVS/HID-bord voor dit
; profiel (de bescherming is een HASP4-dongle plus een USB-HID-controle, zie BESCHERMING-STATUS.md): de route is de dichtstbijzijnde,
; geen gemeten keuze. Engine-werk nodig voor een eigen indeling.
[Input]
Route = tp-shm
Layout = AliensExtermination
Note = tp-shm, indeling AliensExtermination (TeknoParrotUi AliensExterminationPipe; special = granaat, vlam = extra knop 1)

[Status]
Status = untested
Note = Start via dubbelklik (2026-10-17): PeFillPages (de HASP-emulatie achter .text, die Wine wiste), gamescope met Windowed = 1 en 1920x1080: opstartscherm (VERSION 1.0.3 US), logo's van Global VR en PlayMechanix, attract met FREE PLAY / PRESS START. Open: "I/O ERROR: no GVRIO card found" en "no Aliens guns found" op het opstartscherm; invoer nog niet gemeten.
NoteEN = Starts by double-click (2026-10-17): PeFillPages (the HASP emulation behind .text that Wine cleared), gamescope with Windowed = 1 at 1920x1080: boot screen, Global VR and PlayMechanix logos, attract with free play / press start. Open: the boot screen reports no GVRIO card and no Aliens guns; input not measured yet.

; Profiel uit TeknoParrot-sjabloon GameProfiles/AliensExtermination.xml, revisie 14 (scripts/import-tp-profiles.py; opnieuw importeren in plaats van met de hand wijzigen)
