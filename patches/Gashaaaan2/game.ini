[Status]
Status = playable
Note = Speelbaar na eenmalige instelling in het testmenu (klok, scherm, free play; staat nu in de game-opslag). Daarna start, vizier en trekker (de bal) werken. Testmenu: toets 0, selecteren met start, uitvoeren met P1 aux1.
NoteEN = Playable after a one-time setup in the test menu (clock, screen, free play; now stored in the game's save data). Then start, aiming and trigger (the ball) work. Test menu: key 0, select with start, execute with P1 aux1.
Findings = findings/GashaaaanRefill.md
