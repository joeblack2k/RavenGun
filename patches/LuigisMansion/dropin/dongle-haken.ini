# RavenGun — adreslijst met antwoorden voor de generieke PE-inline-hook, game: Luigi's Mansion Arcade
#
# Dit bestand hoort in de PATCHES-repo (het is van deze ene game-versie), niet in de lader-repo.
# Het gereedschap is generiek: `tools/rt-hasphook/rg_pe_hook.c` leest dit formaat en bevat geen
# enkele Luigi-naam of Luigi-adres.
#
# WANNEER DEZE LIJST WORDT TOEGEPAST, EN WAAROM DAT LASTIG IS
# ----------------------------------------------------------
# De prologues BESTAAN PAS nadat de pakker de code heeft weggeschreven. Gemeten (dichte bemonstering
# van ONZE kern, /tmp/lm-dicht-onze/meting-onze.txt):
#   * `.text` gaat van 100 procent nul op t=4,5 s naar 11,20 procent nul op t=4,7 s -- het spel
#     ontpakt zichzelf dus volledig onder onze kern;
#   * de prologue is op dat moment `40 53 48 83 ec`, de ORIGINELE prologue: uitgepakt maar NIET
#     omgezet;
#   * het proces sterft op t=5,96 s, ongeveer 1,3 s NA een geslaagd uitpakken.
# De gesloten kern ontpakt veel later (t=9 tot 10 s) en zet de prologues op hetzelfde moment om als
# waarop het uitpakken klaar is.
#
# Gevolg: als de hook bij het LADEN van de DLL omzet, staat de pagina nog op nul en zet hij niets om.
# Daarom heeft de hook een wachtroute: `wacht_s` laat hem kijken tot de prologue er staat, en dan
# omzetten. Gemeten in de proef (patches/Halo/probe/wacht-toets.sh): 17 van 17 aangehaakt 2 ms nadat
# de pagina's gevuld werden, ruim binnen het venster van 1,3 s.
#
# En de am-laag is de LEIDENDE hypothese, niet een uitgesloten route: het enige gemeten verschil in
# het spelbeeld op het moment dat het uitgepakt is, is dat deze 17 prologues origineel zijn in plaats
# van omgezet. De specificatie van wat ze moeten doen staat in AM-LAAG.md.
#
# (Een tweede, robuustere plek is het aftappen van `ntdll!NtProtectVirtualMemory`: de pakker maakt
#  zijn pagina's daar schrijfbaar/uitvoerbaar, dus dat is het eerstvolgende moment waarop omzetten
#  kan. Dat is nog niet gebouwd; zie MECHANISME-PE-HOOK.md paragraaf 5.)
# WAT DE ANTWOORDEN ZIJN (allemaal GEMETEN uit de kern-implementaties, AM-LAAG.md 5.1)
# -----------------------------------------------------------------------------------
# Alle 17 geven NUL terug. Er is GEEN game-id, GEEN modeltype en GEEN keychip-id: de kern schrijft
# die niet, en het dongle-object blijft leeg. De enige echte waarde is het netwerkadres:
#
#     amDongleGetNetworkAddress schrijft 0x1a8c0 = c0 a8 01 00 = 192.168.1.0 in *(uint32*)rcx
#
# Er valt dus niets te verzinnen, en er is ook niets verzonnen.
#
# `bewaar_args = 1` laat elke stub eerst de argumentregisters in de home space van de aanroeper
# zetten ([rsp+8] .. [rsp+0x20]), precies zoals ELKE kern-implementatie doet. Daarna pas het
# antwoord. Zonder dat zouden de stubs semantisch van de kern afwijken.
#
# DE PROLOGUEKEURING, EN WAAROM `bytes` HIER NIET STAAT
# ----------------------------------------------------
# `proloog = standaard` eist een herkenbare functieprologue. Dat is met opzet:
#   * onder ONZE kern staan de originele prologues er -> de hook keurt ze goed en zet ze om;
#   * onder de GESLOTEN kern staat er al `e9 ...` -> de hook WEIGERT ze luid ("al door een andere
#     kern omgezet?"), in plaats van een ketting van twee vervangingen te bouwen.
# De `e9`-bytes uit AM-LAAG.md §1 zijn de toestand die de GESLOTEN kern achterlaat; ze hier als
# `bytes = ...` zetten zou de keuring omkeren (dan verwacht de hook juist de patch van een andere
# kern). De ORIGINELE 5 bytes zijn nog niet meetbaar: onder onze kern is `.text` op elk bemonsterd
# moment nul. Zodra de pakker-fase loopt zijn ze te meten, en dan kan elke regel een `bytes = ...`
# krijgen en weigert de hook een verkeerde spelversie.

game        = LuigisMansion
arch        = x86_64
beeld       = pe
basis       = beeld
proloog     = standaard
bewaar_args = 1
# DE TRIGGER (deterministisch): de prologues bestaan pas NADAT de pakker de code heeft weggeschreven.
# Gemeten (exit-trace van onze kern, 16 NtProtectVirtualMemory-aanroepen): de pakker zet .text eerst op
# RWX (0x40) en verzegelt hem aan het eind met NtProtectVirtualMemory(0x140001000, 0x355a34, 0x20);
# 0-1 ms later volgt het einde van de pakker en de eerste spelcode. De DLL leidt NtProtectVirtualMemory
# om en past op PRECIES die aanroep alle regels toe, voor hij wordt doorgegeven (de sectie is dan nog
# schrijfbaar en compleet). Er is geen race en niet gepold.
trigger        = protect
trigger_sectie = .text
trigger_prot   = 0x20
# De terugval: komt de trigger niet (andere pakker, andere Wine), dan past de eigen thread na wacht_s
# seconden zelf toe via de oude wachtroute (poll elke wacht_ms); het logboek zegt dan FALLBACK.
wacht_s     = 10
wacht_ms    = 50
grootte     = 0x125e000
ingang      = 0xf23125

# ================================================================================================
# De 8 amDongle-functies. `kern-doel` is het adres dat de GESLOTEN kern gebruikt; het staat er als
# naslagwerk, niet als iets wat wij aanroepen.
# ================================================================================================

[amDongleBillingGetKeychipId]
rva      = 0x2b3b70
antwoord = ret0
notitie  = kern-doel 0x6ffff6cfdd80: stack-cookie, log, dan 0. Schrijft NIETS in rcx -- er is geen keychip-id gemeten

[amDongleGetGameId]
rva      = 0x2b3d30
antwoord = ret0
notitie  = kern-doel 0x6ffff6cfe040: log, dan 0. Schrijft NIETS in rcx -- er is geen game-id gemeten

[amDongleGetModelType]
rva      = 0x2b3ff0
antwoord = ret0
notitie  = kern-doel 0x6ffff6cfe0a0: log, dan 0. Schrijft NIETS -- er is geen modeltype gemeten

[amDongleGetNetworkAddress]
rva      = 0x2b40b0
antwoord = buf=rcx:c0 a8 01 00
notitie  = kern-doel 0x6ffff6cfe0e0: schrijft dword 0x1a8c0 = c0 a8 01 00 = 192.168.1.0 in *(uint32*)rcx en geeft 0 terug. DIT IS DE ENIGE ECHTE KASTWAARDE, letterlijk gemeten

[amDongleInit]
rva      = 0x2b4170
antwoord = ret0
notitie  = kern-doel 0x6ffff6cfe1f0: log, dan 0

# ------------------------------------------------------------------------------------------------
# DE POORT: `amDongleIsAvailableInternal`, RVA 0x2b4270 (VA 0x1402b4270). Beide aanroepers (RVA 0xab8b9
# en 0x1349d8) roepen precies dit adres aan.
#
# Het adres KLOPT. Eerder stond hier dat het "in deze build niet klopt" omdat de hook er `cc cc cc cc`
# las; dat was een misverstand. In het spel zelf is 0x2b4270..0x2b428f een slot van 32 bytes
# int3-opvulling (cc) en staat het echte lichaam pas op 0x2b4290 (AM-LAAG.md 3.2). De GESLOTEN kern
# schrijft zijn `e9 rel32` OVER die opvulling (gemeten: /tmp/b0d-met/rg-pe-hook-bytes.txt, +2603 ms
# `cc cc cc cc`, +2711 ms `e9 5e c9 d3`; en protect-aanroep #99 in r2e-closed). Zonder haak voert een
# aanroep dus int3 uit. De `cc`-opvulling is hier dus de VERWACHTE toestand, geen "nog niet klaar":
# `bytes = cc cc cc cc cc` zegt dat uitdrukkelijk (een expliciete `bytes` gaat boven de prologue-
# keuring).
#
# Het antwoord: de functie heeft geen argumenten (hij leest het dongle-object uit de globaal
# [0x14049cc68]); de kern-implementatie geeft 0 terug (AM-LAAG.md 5.1, waarde AFGELEID). Het vorige
# antwoord `velden=rcx:0x110=0x40,0x114=1` schreef in het geheugen waar de aanroeper TOEVALLIG in
# rcx had en is daarom vervangen door `ret0`. Beide aanroepers lezen alleen eax (0 = dongle ok).

[amDongleIsAvailableInternal]
rva      = 0x2b4270
bytes    = cc cc cc cc cc
antwoord = ret1
notitie  = MOET 1 TERUGGEVEN, niet 0. Gemeten 2026-10-13: de gesloten kern-impl (0x6ffff6c97d50) eindigt op `b8 01 00 00 00 ... c3` (mov eax,1; ret). Aanroeper 0x1349d8 doet na de call `test eax,eax; cmove edi,r14d(=0)`: bij eax==0 wordt de keychip-aanwezig-vlag op 0 gezet en toont het spel ERROR 0949 "Keychip Not Found" (gemeten op de tv met ret0). ret1 = aanwezig. Het adres is een int3-slot waar de gesloten kern zijn sprong overheen schrijft.

[amDongleSetupKeychip]
rva      = 0x2b4320
antwoord = ret0
notitie  = kern-doel 0x6ffff6cfe2a0: log; 0 is afgeleid (AM-LAAG.md 5.1)

[amDongleUpdate]
rva      = 0x2b4740
antwoord = ret0
notitie  = kern-doel 0x6ffff6cfe3e0: log, dan 0

