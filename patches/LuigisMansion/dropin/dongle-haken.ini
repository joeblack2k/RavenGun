# ================================================================================================
# BYTE-PATCHES (geen functiestubs): wat de gesloten kern verder in .text/.rdata schrijft, 6 ms na de
# laatste stap van de pakker (docs/research/luigismansion-exit-trace.md §5). Toegepast op hetzelfde
# moment en door dezelfde schrijfhulp als de haken. `verwacht` = wat er NU moet staan; wijkt het af,
# dan wordt er NIET geschreven en logt de DLL beide. `actief = 0`: ingelezen en gemeld, niet toegepast.
# Alle "verwacht"-waarden zijn gecontroleerd tegen het beeld van ONZE kern bij de beeindiging
# (~/bw/luigi-exittrace/beeld-onze-kern-bij-beeindiging.bin) en de nieuwe waarden tegen dat van de
# gesloten kern (beeld-gesloten-kern-draad5.bin).
# ================================================================================================

[patch datapad]
rva      = 0x3d0c20
verwacht = 00*26
tekst    = "../../DataGlobal/EN/Data/"
actief   = 1
notitie  = datapad dat het spel bij het laden van zijn eerste shader leest; onder onze kern leeg (26 nullen), onder de gesloten kern gevuld (25 tekens + NUL = de 0x1a bytes van de protect-aanroep)

[patch uren-vlag]
rva      = 0x17a9a
verwacht = 41 0f 45 c9
bytes    = 33 c9 ff c1
actief   = 0
notitie  = cmovne ecx,r9d -> ecx = 1 (uitkomst vastgezet; de code ernaast drukt HOURS/MINUTES af)

[patch ram-vlag]
rva      = 0x4e05f
verwacht = 0f b6 58 04
bytes    = 88 58 04 90
actief   = 0
notitie  = leest een byte -> schrijft een byte (vlag gezet in plaats van gelezen; naast "../../Ram/")

[patch fout-3001]
rva      = 0xabcf4
verwacht = 74
bytes    = eb
actief   = 0
notitie  = je -> jmp (tak altijd genomen)

[patch const-8]
rva      = 0x173e30
verwacht = 08
bytes    = 00
actief   = 0
notitie  = de imm32 in `41 bc 08 00 00 00` (mov r12d,8) wordt 0

# String assign at +0x485a (measured 2026-10-22, diagnostic detour): this thunk is `jmp` into a
# virtualised body at +0xe74327 that, on our route, leaves the std::string EMPTY and returns 0x10
# (both calls seen in 30 s of boot and attract; 12 call sites in all): +0x37faa "System/Texture/dummy1111.dds" len 28 -> size 0,
# +0x5c1a "Effects/bishamon/param/" len 23 -> size 0. The texture lookup at +0x37fe3 then gets the
# bare directory "../../DataGlobal/EN/Data/", finds nothing, and renderer+0x20e88 stays 0: the read
# fault at +0x38FC6 after START. The sibling thunk +0x4860 has the same call shape (rcx = string,
# rdx = chars, r8 = length; 342 call sites) and its body +0xf1341e works. Pointing +0x485a at that
# body gives size 28 cap 31 "System/Texture/dummy1111.dds", the lookup succeeds, and START leads
# into play. The game's own code is unchanged otherwise; this is not a dongle or protector answer.
[patch assign485a]
rva      = 0x485a
verwacht = e9 c8 fa e6 00
bytes    = e9 bf eb f0 00
actief   = 1
notitie  = jmp +0xe74327 (broken virtualised string assign) -> jmp +0xf1341e (the working body of +0x4860)

# ================================================================================================
# [uitgang]: kernel32!ExitProcess beantwoorden door naar de aanroeper TERUG te keren.
#
# Gemeten op de bench (2026-10-13): op onze kern roept de gevirtualiseerde start van het spel
# ExitProcess precies EEN keer aan (rcx = 0x140415820, terugkeeradres VACUUM.exe+0xf1374d in
# .capcom0). Een proef die die ene aanroep met een `ret` beantwoordde liet het spel doorlopen
# ("*INF* Game Start" 7 ms later, van 1 naar 17 threads). `terug_bij` zijn de RVA's (in de hoofdmodule)
# waarvan een aanroep zo beantwoord wordt; een aanroep van elders gaat ongewijzigd naar
# ntdll!RtlExitUserProcess. `max`: hoogstens zo vaak; daarna doorlaten. Geinstalleerd in DllMain,
# dus voor de pakker en het spel; hangt niet af van het ontpakken of van deze lijst-toepassing.
# ================================================================================================

[uitgang]
export    = kernel32.dll!ExitProcess
terug_bij = 0xf1374d
max       = 4
actief    = 1
