; Gegenereerd door scripts/migrate-game-settings.py (docs/per-game-patches.md). Sleutels die het script afleidt uit de oude bronnen worden bij
; elke run opnieuw gezet; handwerk in andere sleutels blijft staan.
;
; Uit het oude UserProfiles/LuigisMansion.env:
; 2026-10-10 nacht (WERKT: attract/titel met beeld): entry-point-route (TP_REMOTETHREAD=off), symlink-view
; met werkmap exe\x64 (Data -> DataGlobal/EN/Data; Movie/ is een symlink naar de NAS-map),
; en GStreamer-plug-ins asf + libav (lokaal uitgepakt uit de SteamOS-pakketten gst-plugins-ugly/gst-libav 1.28.5-2
; in ~/.local/share/ravengun/tools/gst-extra/plugins) zodat winegstreamer de .wmv-films (title_movie e.d.) kan decoderen.
; Zonder die plug-ins: game sluit af bij title_movie.wmv, of (lege Movie-map) zwart scherm.
; Standaard wined3d in de gedeelde prefix; DXVK is niet nodig.

[Game]
Name = Luigi's Mansion Arcade
Profile = LuigisMansion
Type = TeknoParrot
EmulationProfile = LuigisMansion
Executable = VACUUM.exe
Is64Bit = true
ProfileRevision = 19

[Launch]
Mode = direct
WorkingDirectory = .
; The game writes its backup data (coins/credits, settings, bookkeeping) to ../../Ram and its logs to ../../Log.
; In the view those were links to the NAS; local copies keep the NAS untouched (measured 2026-10-22).
ViewWritable = Ram, Log

[Loader]
; Onze eigen OpenParrot-kern (~/.local/share/ravengun/openparrot/current): daarmee haalde Luigi de 5-minutenlat (BEWIJS-5MIN.md,
; kern sha256 fe2ecf8c...); met de gesloten TeknoParrot-kern stopt de lader na ~13 s met exitcode 9 (gemeten 2026-10-14).
Core = ravengun

[Display]
; Beeldvullend via gamescope, zoals in het bewijs (TP_GAMESCOPE=1).
Gamescope = true
GamescopePath = /usr/bin/gamescope

[Wine]
GStreamerPlugins = ~/.local/share/ravengun/tools/gst-extra/plugins

[Input]
Route = tp-shm
Layout = LuigisMansion
Note = Speelbaar (2026-10-10): standaardroute van de lader (TP_REMOTETHREAD=off), symlink-view (Data -> DataGlobal/EN/Data), werkmap exe/x64, GStreamer asf+libav voor de wmv-films (scripts/fetch-gst-wmv.sh). Select switch = aux1. Invoer (2026-10-22): de game leest een Capcom-tekstbord op COM1; rg-pe-hook.dll emuleert dat bord en leest offset 8 (knoppen, munt1/2 op bit 24/25) en de 16-bit assen op 16..23.

; Bediening voor de knoppen-uitleg bij de eerste start (docs/per-game-patches.md, "Bediening per game").
; Measured 2026-10-22 in the game's INPUT TEST (both players): trigger -> CONTROLLER LEVER, grenade -> CONTROLLER
; BUTTON, reload -> SCREEN OUT, start -> START BUTTON, aux1 -> SELECT SW. What each does in play is not measured yet
; (the game exits ~10 s after START on our route).
[Controls]
trigger = Vacuum lever | Hold to suck up ghosts with the Poltergust.
grenade = Vacuum button | Flashes the Strobulb. Not confirmed in play yet.
reload = Screen out | Tells the game the gun points off screen.

[Status]
Status = playable
Note = Start per dubbelklik in RavenGun (2026-10-14): op onze eigen OpenParrot-kern en via gamescope draait de game beeldvullend in attract (met de gesloten kern stopte hij na ~13 s). Eerder gemeten: ~6 min attract/demo aaneen op onze kern (BEWIJS-5MIN.md), met de drop-in rg-pe-hook.dll (zie MECHANISME-PE-HOOK.md). Invoer werkt sinds 2026-10-22 (headless gemeten): munt boekt credits, TEST opent het testmenu, START, stofzuigerhendel, -knop, screen-out en richten (binnen 1 px, beide spelers) komen aan via een nagebootst I/O-bord op COM1. Nog NIET speelbaar: ~10 s na START stopt de game (leesfout op VACUUM.exe+0x38FC6, een textuur die niet geladen is).
NoteEN = Starts by double-click in RavenGun (2026-10-14): on our own OpenParrot core and through gamescope the game runs full screen in attract (with the closed core it stopped after ~13 s). Measured earlier: ~6 min of continuous attract/demo on our core (BEWIJS-5MIN.md), with the drop-in rg-pe-hook.dll (see MECHANISME-PE-HOOK.md). Input works since 2026-10-22 (measured headless): the game polls a Capcom text I/O board on COM1, which rg-pe-hook.dll now emulates from the board image; coins book credits, TEST opens the test menu, and START, vacuum lever, vacuum button, screen out and aim (within 1 px for both players) all reach the game. NOT playable yet: about 10 s after START the game exits (read fault at VACUUM.exe+0x38FC6, a texture that was never loaded).
Findings = findings/LuigisMansion.md

; Profiel uit TeknoParrot-sjabloon GameProfiles/LuigisMansion.xml, revisie 19 (scripts/import-tp-profiles.py; opnieuw importeren in plaats van met de hand wijzigen)
