; Gegenereerd door scripts/migrate-game-settings.py (docs/per-game-patches.md). Sleutels die het script afleidt uit de oude bronnen worden bij
; elke run opnieuw gezet; handwerk in andere sleutels blijft staan.
;
; Uit het oude UserProfiles/LuigisMansion.env:
; 2026-10-10 nacht (WERKT: attract/titel met beeld): entry-point-route (TP_REMOTETHREAD=off), symlink-view
; met werkmap exe\x64 (Data -> DataGlobal/EN/Data; Movie/ is een symlink naar de NAS-map),
; en GStreamer-plug-ins asf + libav (lokaal uitgepakt uit de SteamOS-pakketten gst-plugins-ugly/gst-libav 1.28.5-2
; in ~/.local/share/ravengun/tools/gst-extra/plugins) zodat winegstreamer de .wmv-films (title_movie e.d.) kan decoderen.
; Zonder die plug-ins: game sluit af bij title_movie.wmv, of (lege Movie-map) zwart scherm.
; Standaard wined3d in de gedeelde prefix; DXVK is niet nodig.

[Game]
Name = Luigi's Mansion Arcade
Profile = LuigisMansion
Type = TeknoParrot
EmulationProfile = LuigisMansion
Executable = VACUUM.exe
Is64Bit = true
ProfileRevision = 19

[Launch]
Mode = direct
WorkingDirectory = .

[Wine]
GStreamerPlugins = ~/.local/share/ravengun/tools/gst-extra/plugins

[Input]
Route = tp-shm
Layout = LuigisMansion
Note = Speelbaar (2026-10-10): standaardroute van de lader (TP_REMOTETHREAD=off), symlink-view (Data -> DataGlobal/EN/Data), werkmap exe/x64, GStreamer asf+libav voor de wmv-films (scripts/fetch-gst-wmv.sh). Select switch = aux1.

[Status]
Status = playable
Note = Valt op onze kern om met lader-exitcode 32, en dat is geen crash: in de trace met WINEDEBUG=+file opent het spelproces geen enkel bestand van zichzelf, en er komt geen enkele fout of unhandled exception uit Wine. Het vertrekt dus voordat het iets van zichzelf doet. Op de GESLOTEN kern blijft hij wel leven (na 20 s nog, met dezelfde maat gemeten), dus het is een verschil in de kern en niet in de collectie: exitcode 32 is volgens de werkvolgorde Capcoms anti-tamper-controle, en OpenParrot-patch 0005 (de COM-blokkade) lost dat niet op. Geparkeerd met die reden; een eigen per-game hook is hier nodig, geen generieke infrastructuur.
NoteEN = Falls over on our core with loader exit code 32, and that is not a crash: in the WINEDEBUG=+file trace the game process opens no file of its own, and Wine produces no error and no unhandled exception. It therefore leaves before doing anything of its own. On the CLOSED core it does stay alive (still there after 20 s, measured with the same method), so this is a difference in the core and not in the collection: exit code 32 is Capcom's anti-tamper check according to the work order, and OpenParrot patch 0005 (the COM block) does not solve it. Parked for that reason; this one needs its own per-game hook, not generic infrastructure.
Findings = findings/LuigisMansion.md

