; Gegenereerd door scripts/migrate-game-settings.py (docs/per-game-patches.md). Sleutels die het script afleidt uit de oude bronnen worden bij
; elke run opnieuw gezet; handwerk in andere sleutels blijft staan.
;
; Uit het oude UserProfiles/LuigisMansion.env:
; 2026-10-10 nacht (WERKT: attract/titel met beeld): entry-point-route (TP_REMOTETHREAD=off), symlink-view
; met werkmap exe\x64 (Data -> DataGlobal/EN/Data; Movie/ is een symlink naar de NAS-map),
; en GStreamer-plug-ins asf + libav (lokaal uitgepakt uit de SteamOS-pakketten gst-plugins-ugly/gst-libav 1.28.5-2
; in ~/.local/share/ravengun/tools/gst-extra/plugins) zodat winegstreamer de .wmv-films (title_movie e.d.) kan decoderen.
; Zonder die plug-ins: game sluit af bij title_movie.wmv, of (lege Movie-map) zwart scherm.
; Standaard wined3d in de gedeelde prefix; DXVK is niet nodig.

[Game]
Name = Luigi's Mansion Arcade
Profile = LuigisMansion
Type = TeknoParrot
EmulationProfile = LuigisMansion
Executable = VACUUM.exe
Is64Bit = true
ProfileRevision = 19

[Launch]
Mode = direct
WorkingDirectory = .

[Wine]
GStreamerPlugins = ~/.local/share/ravengun/tools/gst-extra/plugins

[Input]
Route = tp-shm
Layout = LuigisMansion
Note = Speelbaar (2026-10-10): standaardroute van de lader (TP_REMOTETHREAD=off), symlink-view (Data -> DataGlobal/EN/Data), werkmap exe/x64, GStreamer asf+libav voor de wmv-films (scripts/fetch-gst-wmv.sh). Select switch = aux1.

[Status]
Status = playable
Note = SPEELBAAR OP ONZE EIGEN KERN (2026-10-13, op de tv gezien): ~6 min attract/demo aaneen, beeldvullend via gamescope, geen foutmelding; de eigenaar heeft meegekeken. Opgelost met de per-game drop-in dropin/rg-pe-hook.dll (generieke PE-inline-hook), die zichzelf plaatst op het moment dat de pakker .text verzegelt (NtProtectVirtualMemory -> 0x20) en dan: (1) de EIGEN ExitProcess van het spel in zijn gevirtualiseerde WinMain (terugkeeradres VACUUM.exe+0xf1374d) opvangt en TERUGKEERT i.p.v. te beeindigen; (2) het datapad op RVA 0x3d0c20 schrijft (stond leeg -> crash bij de eerste shader); (3) de 17 am-keychip-functies afvangt, waarbij amDongleIsAvailableInternal 1 TERUGGEEFT (niet 0), anders toont het spel ERROR 0949 "Keychip Not Found" (gemeten). CORRECTIE op de oude lezing: "exitcode 32" is de lage byte van een pointer, geen Capcom anti-tamper/COM-blokkade; patch 0005 is alleen detectie. Invoer (tp-shm, Layout LuigisMansion) nog niet met de echte Move gespeeld.
NoteEN = PLAYABLE ON OUR OWN CORE (2026-10-13, seen on the TV): ~6 min of continuous attract/demo, fullscreen via gamescope, no error banner; the owner watched. Solved with the per-game drop-in dropin/rg-pe-hook.dll (generic PE inline hook) which arms itself when the packer seals .text (NtProtectVirtualMemory -> 0x20) and then: (1) catches the game's OWN ExitProcess in its virtualized WinMain (return address VACUUM.exe+0xf1374d) and RETURNS instead of terminating; (2) writes the data-path string at RVA 0x3d0c20 (was empty -> crash on the first shader); (3) stubs the 17 am keychip functions, with amDongleIsAvailableInternal RETURNING 1 (not 0), else the game shows ERROR 0949 "Keychip Not Found" (measured). CORRECTION to the old reading: "exit code 32" is the low byte of a pointer, not a Capcom anti-tamper/COM block; patch 0005 is detection only. Input (tp-shm, Layout LuigisMansion) not yet played with the real Move.
Findings = findings/LuigisMansion.md

