; Gegenereerd door scripts/migrate-game-settings.py (docs/per-game-patches.md). Sleutels die het script afleidt uit de oude bronnen worden bij
; elke run opnieuw gezet; handwerk in andere sleutels blijft staan.
;
; Uit het oude UserProfiles/LuigisMansion.env:
; 2026-10-10 nacht (WERKT: attract/titel met beeld): entry-point-route (TP_REMOTETHREAD=off), symlink-view
; met werkmap exe\x64 (Data -> DataGlobal/EN/Data; Movie/ is een symlink naar de NAS-map),
; en GStreamer-plug-ins asf + libav (lokaal uitgepakt uit de SteamOS-pakketten gst-plugins-ugly/gst-libav 1.28.5-2
; in ~/.local/share/ravengun/tools/gst-extra/plugins) zodat winegstreamer de .wmv-films (title_movie e.d.) kan decoderen.
; Zonder die plug-ins: game sluit af bij title_movie.wmv, of (lege Movie-map) zwart scherm.
; Standaard wined3d in de gedeelde prefix; DXVK is niet nodig.

[Game]
Name = Luigi's Mansion Arcade
Profile = LuigisMansion
Type = TeknoParrot
EmulationProfile = LuigisMansion
Executable = VACUUM.exe
Is64Bit = true
ProfileRevision = 19

[Launch]
Mode = direct
WorkingDirectory = .
; The game writes its backup data (coins/credits, settings, bookkeeping) to ../../Ram and its logs to ../../Log.
; In the view those were links to the NAS; local copies keep the NAS untouched (measured 2026-10-22).
ViewWritable = Ram, Log

[Loader]
; Onze eigen OpenParrot-kern (~/.local/share/ravengun/openparrot/current): daarmee haalde Luigi de 5-minutenlat (BEWIJS-5MIN.md,
; kern sha256 fe2ecf8c...); met de gesloten TeknoParrot-kern stopt de lader na ~13 s met exitcode 9 (gemeten 2026-10-14).
Core = ravengun

[Display]
; Beeldvullend via gamescope, zoals in het bewijs (TP_GAMESCOPE=1).
Gamescope = true
GamescopePath = /usr/bin/gamescope

[Wine]
GStreamerPlugins = ~/.local/share/ravengun/tools/gst-extra/plugins

[Input]
Route = tp-shm
Layout = LuigisMansion
Note = Speelbaar (2026-10-10): standaardroute van de lader (TP_REMOTETHREAD=off), symlink-view (Data -> DataGlobal/EN/Data), werkmap exe/x64, GStreamer asf+libav voor de wmv-films (scripts/fetch-gst-wmv.sh). Select switch = aux1. Invoer (2026-10-22): de game leest een Capcom-tekstbord op COM1; rg-pe-hook.dll emuleert dat bord en leest offset 8 (knoppen, munt1/2 op bit 24/25) en de 16-bit assen op 16..23.

; Bediening voor de knoppen-uitleg bij de eerste start (docs/per-game-patches.md, "Bediening per game").
; Measured 2026-10-22 in the game's INPUT TEST (both players): trigger -> CONTROLLER LEVER, grenade -> CONTROLLER
; BUTTON, reload -> SCREEN OUT, start -> START BUTTON, aux1 -> SELECT SW. What each does in play is not measured yet
; (the game exits ~10 s after START on our route).
[Controls]
trigger = Vacuum lever | Hold to suck up ghosts with the Poltergust.
grenade = Vacuum button | Flashes the Strobulb. Not confirmed in play yet.
reload = Screen out | Tells the game the gun points off screen.

[Status]
Status = playable
Note = Start per dubbelklik in RavenGun (2026-10-14): op onze eigen OpenParrot-kern en via gamescope draait de game beeldvullend in attract (met de gesloten kern stopte hij na ~13 s). Eerder gemeten: ~6 min attract/demo aaneen op onze kern (BEWIJS-5MIN.md), met de drop-in rg-pe-hook.dll (zie MECHANISME-PE-HOOK.md). Invoer werkt sinds 2026-10-22 (headless gemeten): munt boekt credits, TEST opent het testmenu, START, stofzuigerhendel, -knop, screen-out en richten (binnen 1 px, beide spelers) komen aan via een nagebootst I/O-bord op COM1. Nog NIET speelbaar: ~10 s na START stopt de game (leesfout op VACUUM.exe+0x38FC6, een textuur die niet geladen is).
NoteEN = Starts by double-click in RavenGun (2026-10-14): on our own OpenParrot core and through gamescope the game runs full screen in attract (with the closed core it stopped after ~13 s). Measured earlier: ~6 min of continuous attract/demo on our core (BEWIJS-5MIN.md), with the drop-in rg-pe-hook.dll (see MECHANISME-PE-HOOK.md). Input works since 2026-10-22 (measured headless): the game polls a Capcom text I/O board on COM1, which rg-pe-hook.dll now emulates from the board image; coins book credits, TEST opens the test menu, and START, vacuum lever, vacuum button, screen out and aim (within 1 px for both players) all reach the game. NOT playable yet: about 10 s after START the game exits (read fault at VACUUM.exe+0x38FC6, a texture that was never loaded). Step 1 (protection, 2026-10-22, measured): the exit is the game's own `main` deciding to stop, not a broken VM. The CRT calls `main` through the packed thunk VACUUM.exe+0x11c5f0 (VM tag 0x919e48fe); inside that call VACUUM.exe+0xf13743 pushes tag 0xb63f49fe and enters the VM again, which calls ExitProcess. Exactly one boot-time ExitProcess, 8 ms after the 17 prologues were converted; our hook answers it with a return and the game then runs attract in a half-initialised state (resource path empty -> null texture 10 s after START). rcx at the exit is a leftover (0x140415820: a vtable whose first entry is itself, next to "can't mutex ctor!"), not an error object. The deciding comparison is in the encrypted bytecode of those two tags; the next measurement is the order of the am* calls and the data the VM reads just before +0xf1374d. Instrument in rg-pe-hook.dll (documented in rg_pe_hook_dll.c, all off by default): RG_HOOK_WATCH=<rva>[:len[:x|w|rw]],... hardware watchpoints armed right after the rules are applied, RG_HOOK_WATCH_ALL also on other threads (off: that hangs the game), RG_HOOK_STACKWALK dumps candidate return addresses from the stack when the exit is answered. Null test (2026-10-22, measured): with an ini that applies NOTHING (0 of 17 hooks, 0 of 5 byte patches, .text untouched) the same one boot ExitProcess at VACUUM.exe+0xf1374d still fires, with the same rcx; and with the full list the am layer is only called 1.3 s AFTER that exit (amMasterInit, amHmInit, amDongleInit, amDongleSetupKeychip, amDongleBillingGetKeychipId, amDongleGetNetworkAddress, amDongleGetGameId, amDongleGetModelType, then amDongleIsAvailableInternal every ~33 ms from +0xab8be). So the exit is neither an integrity check over our patched .text nor a verdict on a dongle answer: it is the packed start itself, before the platform layer, and the game continues after our hook returns. The string path at +0x485a is therefore the next thing to measure, not the exit. Step 2 (2026-10-22, measured): the link between the exit and an empty string is disproved. In the same diagnostic run in which +0x37f50 was seen with a size-0 object (0x10d4b0), the VM-built prefix "../../DataGlobal/EN/Data/" landed in a std::string (size 25, cap 31) and ../../DataGlobal/EN/Data/System/Texture/dummy0000.dds and dummy1111.dds were converted and opened, so the VM's string assign works with the exit answered. New instrument, off by default: RG_HOOK_WATCH_TEXT=1 (RG_HOOK_TEXT_FILTER, default "Texture") installs a pass-through logger on kernel32!MultiByteToWideChar in the main module's import table, at load time and again right after the rules are applied (the packer rewrites the import table). Remaining unknown, not a protection or dongle matter: the resource object at renderer+0x20e88 is never created (read at VACUUM.exe+0x38FC6 about 10 s after START, rdx=0) even though the texture files open.
Findings = findings/LuigisMansion.md

