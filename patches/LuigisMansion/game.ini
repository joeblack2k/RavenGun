; Gegenereerd door scripts/migrate-game-settings.py (docs/per-game-patches.md). Sleutels die het script afleidt uit de oude bronnen worden bij
; elke run opnieuw gezet; handwerk in andere sleutels blijft staan.
;
; Uit het oude UserProfiles/LuigisMansion.env:
; 2026-10-10 nacht (WERKT: attract/titel met beeld): entry-point-route (TP_REMOTETHREAD=off), symlink-view
; met werkmap exe\x64 (Data -> DataGlobal/EN/Data; Movie/ is een symlink naar de NAS-map),
; en GStreamer-plug-ins asf + libav (lokaal uitgepakt uit de SteamOS-pakketten gst-plugins-ugly/gst-libav 1.28.5-2
; in ~/.local/share/ravengun/tools/gst-extra/plugins) zodat winegstreamer de .wmv-films (title_movie e.d.) kan decoderen.
; Zonder die plug-ins: game sluit af bij title_movie.wmv, of (lege Movie-map) zwart scherm.
; Standaard wined3d in de gedeelde prefix; DXVK is niet nodig.

[Game]
Name = Luigi's Mansion Arcade
Profile = LuigisMansion
Type = TeknoParrot
EmulationProfile = LuigisMansion
Executable = VACUUM.exe
Is64Bit = true
ProfileRevision = 19

[Launch]
Mode = direct
WorkingDirectory = .
; The game writes its backup data (coins/credits, settings, bookkeeping) to ../../Ram and its logs to ../../Log.
; In the view those were links to the NAS; local copies keep the NAS untouched (measured 2026-10-22).
ViewWritable = Ram, Log

[Loader]
; Onze eigen OpenParrot-kern (~/.local/share/ravengun/openparrot/current): daarmee haalde Luigi de 5-minutenlat (BEWIJS-5MIN.md,
; kern sha256 fe2ecf8c...); met de gesloten TeknoParrot-kern stopt de lader na ~13 s met exitcode 9 (gemeten 2026-10-14).
Core = ravengun

[Display]
; Beeldvullend via gamescope, zoals in het bewijs (TP_GAMESCOPE=1).
Gamescope = true
GamescopePath = /usr/bin/gamescope

[Wine]
GStreamerPlugins = ~/.local/share/ravengun/tools/gst-extra/plugins

[Input]
Route = tp-shm
Layout = LuigisMansion
Note = Invoer via een nagebootst Capcom-tekst-I/O-bord op COM1 (rg-pe-hook.dll, tools/rt-hasphook/rg_capcom_board.c), gevoed uit het bordbeeld: knoppen op offset 8 (munt 1/2 op bit 24/25), 16-bit assen op 16..23. Select switch = aux1.

; Bediening voor de knoppen-uitleg bij de eerste start (docs/per-game-patches.md, "Bediening per game").
; Measured 2026-10-22 in the game's INPUT TEST (both players): trigger -> CONTROLLER LEVER, grenade -> CONTROLLER
; BUTTON, reload -> SCREEN OUT, start -> START BUTTON, aux1 -> SELECT SW. In play (2026-10-22, headless, both players):
; START joins, the trigger picks the control mode and sucks up ghosts; the Strobulb flash itself is not confirmed by eye.
[Controls]
trigger = Vacuum lever | Hold to suck up ghosts with the Poltergust.
grenade = Vacuum button | Flashes the Strobulb. Not confirmed in play yet.
reload = Screen out | Tells the game the gun points off screen.

[Status]
Status = playable
Note = Start per dubbelklik in RavenGun, op onze eigen OpenParrot-kern via gamescope, met de drop-in rg-pe-hook.dll (zie MECHANISME-PE-HOOK.md). Invoer via een nagebootst Capcom-I/O-bord op COM1: munt, TEST, START, stofzuigerhendel, -knop, screen-out en richten (beide spelers). Speelbaar headless gemeten (2026-10-22): munt, START, beide spelers, een missie (Old Clockworks) met geesten opzuigen, game over en terug naar attract, ~6 min zonder crash. De oude crash ~10 s na START (VACUUM.exe+0x38FC6) kwam door een kapotte gevirtualiseerde string-functie (+0x485a); dongle-haken.ini laat die thunk nu naar de werkende zuster (+0x4860) springen.
NoteEN = Starts by double-click in RavenGun on our own OpenParrot core through gamescope, with the drop-in rg-pe-hook.dll (see MECHANISME-PE-HOOK.md and dropin/dongle-haken.ini). Input: the game polls a Capcom text I/O board on COM1, which rg-pe-hook.dll emulates; coin, TEST, START, vacuum lever, vacuum button, screen out and aim reach the game for both players. Playable, measured headless 2026-10-22: coins, START, a second player joining, control-mode select, a mission (Old Clockworks) with ghosts sucked up and scores counting, game over, results and high-score screens and back to attract, about 6 minutes without a crash. Why it used to exit about 10 s after START: the thunk VACUUM.exe+0x485a (a std::string assign with rcx = string, rdx = chars, r8 = length) jumps into a virtualised body (+0xe74327) that on our route leaves the string empty and returns 0x10 (measured with a diagnostic detour: "System/Texture/dummy1111.dds", 28 chars -> size 0). The texture lookup at +0x37fe3 then searched for the bare directory "../../DataGlobal/EN/Data/", renderer+0x20e88 stayed 0, and the entry scene after START read through it at +0x38FC6. The sibling thunk +0x4860 has the same call shape (342 call sites) and a working body (+0xf1341e); the byte patch `assign485a` in dongle-haken.ini points +0x485a there, after which the lookup returns the texture. Still present and harmless: the packed start calls ExitProcess once about 8 ms after unpacking (return address +0xf1374d, rcx 0x140415820), also with no loader, core or hook at all (Wine exit code 0x40415820); the hook answers it with a return. It is not a check on the environment: a +relay trace shows no Win32 call between the CRT start-up (two CreateMutexW) and the exit, and an X: game root, Y:\SDCF and a non-empty command line do not change it.
Findings = findings/LuigisMansion.md

