; Gegenereerd door scripts/migrate-game-settings.py (docs/per-game-patches.md). Sleutels die het script afleidt uit de oude bronnen worden bij
; elke run opnieuw gezet; handwerk in andere sleutels blijft staan.
;
; Uit het oude UserProfiles/LuigisMansion.env:
; 2026-10-10 nacht (WERKT: attract/titel met beeld): entry-point-route (TP_REMOTETHREAD=off), symlink-view
; met werkmap exe\x64 (Data -> DataGlobal/EN/Data; Movie/ is een symlink naar de NAS-map),
; en GStreamer-plug-ins asf + libav (lokaal uitgepakt uit de SteamOS-pakketten gst-plugins-ugly/gst-libav 1.28.5-2
; in ~/.local/share/ravengun/tools/gst-extra/plugins) zodat winegstreamer de .wmv-films (title_movie e.d.) kan decoderen.
; Zonder die plug-ins: game sluit af bij title_movie.wmv, of (lege Movie-map) zwart scherm.
; Standaard wined3d in de gedeelde prefix; DXVK is niet nodig.

[Game]
Name = Luigi's Mansion Arcade
Profile = LuigisMansion
Type = TeknoParrot
EmulationProfile = LuigisMansion
Executable = VACUUM.exe
Is64Bit = true
ProfileRevision = 19

[Launch]
Mode = direct
WorkingDirectory = .

[Loader]
; Onze eigen OpenParrot-kern (~/.local/share/ravengun/openparrot/current): daarmee haalde Luigi de 5-minutenlat (BEWIJS-5MIN.md,
; kern sha256 fe2ecf8c...); met de gesloten TeknoParrot-kern stopt de lader na ~13 s met exitcode 9 (gemeten 2026-10-14).
Core = ravengun

[Display]
; Beeldvullend via gamescope, zoals in het bewijs (TP_GAMESCOPE=1).
Gamescope = true
GamescopePath = /usr/bin/gamescope

[Wine]
GStreamerPlugins = ~/.local/share/ravengun/tools/gst-extra/plugins

[Input]
Route = tp-shm
Layout = LuigisMansion
Note = Speelbaar (2026-10-10): standaardroute van de lader (TP_REMOTETHREAD=off), symlink-view (Data -> DataGlobal/EN/Data), werkmap exe/x64, GStreamer asf+libav voor de wmv-films (scripts/fetch-gst-wmv.sh). Select switch = aux1.

; Bediening voor de knoppen-uitleg bij de eerste start (docs/per-game-patches.md, "Bediening per game"); labels uit het
; TeknoParrot-profiel (GameProfiles/<P>.xml), "Not confirmed yet" = de werking is nog niet gemeten.
[Controls]
trigger = Vacuum lever | Hold to suck up ghosts with the Poltergust.
grenade = Vacuum button | Flashes the Strobulb. Not confirmed yet.
reload = Screen out | Pulls the screen out of the Poltergust. Not confirmed yet.

[Status]
Status = playable
Note = Start per dubbelklik in RavenGun (2026-10-14): op onze eigen OpenParrot-kern en via gamescope draait de game beeldvullend in attract (met de gesloten kern stopte hij na ~13 s). Eerder gemeten: ~6 min attract/demo aaneen op onze kern (BEWIJS-5MIN.md), met de drop-in rg-pe-hook.dll (zie MECHANISME-PE-HOOK.md). Nog NIET speelbaar: munt en TEST komen niet bij het spel aan (DIRECT-ROUTE-INVOER.md).
NoteEN = Starts by double-click in RavenGun (2026-10-14): on our own OpenParrot core and through gamescope the game runs full screen in attract (with the closed core it stopped after ~13 s). Measured earlier: ~6 min of continuous attract/demo on our core (BEWIJS-5MIN.md), with the drop-in rg-pe-hook.dll (see MECHANISME-PE-HOOK.md). NOT playable yet: coin and TEST do not reach the game (DIRECT-ROUTE-INVOER.md).
Findings = findings/LuigisMansion.md

; Profiel uit TeknoParrot-sjabloon GameProfiles/LuigisMansion.xml, revisie 19 (scripts/import-tp-profiles.py; opnieuw importeren in plaats van met de hand wijzigen)
[Identify]
Path = exe/x64/VACUUM.exe
Size = 3436544

[Config]
General/Input API = RawInput
General/Windowed = 1
General/Use Relative Input = 0
General/Player 1 Relative Sensitivity = 8
General/Player 2 Relative Sensitivity = 8

[ConfigType]
General/Input API = Dropdown
General/Windowed = Bool
General/Use Relative Input = Bool
General/Player 1 Relative Sensitivity = Slider
General/Player 2 Relative Sensitivity = Slider

[ConfigOptions]
General/Input API = DirectInput|XInput|RawInput
