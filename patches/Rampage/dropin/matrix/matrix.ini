;
; matrix.ini - de gegevens van de Matrix/SBK-donglelaag van Rampage.
;
; De bibliotheek (matrix64.dll, in dezelfde drop-in) leest dit bestand zelf; de launcher weet er niets
; van (docs/geen-dongle-in-de-loader.md). De drop-in geeft de weg mee met RAVENGUN_MATRIX_DIR=matrix,
; en de bibliotheek zoekt het bestand daar en anders naast zichzelf.
;
; Deze game leest GEEN dongle-geheugen op het opstartpad: MatrixManager::GetSerial vraagt alleen het
; aantal dongles en een reeks. Daarom staat er geen memory-regel.
;
; poort   de poort waarop deze game controleert: 85. Gemeten in de IL van
;         MatrixManager::GetSerial (Game_Data/Managed/Assembly-CSharp.dll):
;             IL_001D: ldc.i4.s 85   ; stloc.0 = de poort
;             IL_0021: call MatrixDLLCSharp.MatrixWrapper::Dongle_Count
;             IL_0038: ldloc.0       ; dezelfde poort gaat mee naar Dongle_ReadSerNr
;             IL_0039: call MatrixDLLCSharp.MatrixWrapper::Dongle_ReadSerNr
; aantal  het aantal dongles dat wij opgeven: 2, dezelfde waarde als TeknoParrot's eigen
;         matrix32.dll teruggeeft (docs/matrix-layer.md). De controle eist > 0.
;
; Het serienummer staat hier bewust NIET in: dat is een vaste, zelfgekozen waarde in de bibliotheek
; (0x10F2C = 69420, dezelfde als TeknoParrot's emulator). Er hoort geen echt serienummer in een
; bestand te staan, en er wordt er ook geen gelezen of gelogd.

poort = 85
aantal = 2
