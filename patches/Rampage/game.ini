; elke run opnieuw gezet; handwerk in andere sleutels blijft staan.
;
; Uit het oude UserProfiles/Rampage.env:
; door tp-add-game.py; zie packaging/games-status.md

[Game]
Name = Rampage
Profile = Rampage
Type = TeknoParrot
EmulationProfile = WartranTroopers
Executable = game.exe
Is64Bit = true
ProfileRevision = 5

[Launch]
Mode = direct

[Wine]
Prefix = ravengun-test-dxvk
DllOverrides = d3d11,d3d10core,dxgi=n,b
GStreamerPlugins = ~/.local/share/ravengun/tools/gst-extra/plugins
Runner = wrapper

[Input]
Route = tp-shm
Layout = WartranTroopers
Note = speelbaar via tp-shm, maar geen lightgungame: een joystick- en aanvalsspel voor drie spelers (indeling WartranTroopers; speler 1: omhoog = trekker, omlaag = herladen, links = granaat, rechts = aux1, aanval = toets F4 (volume omhoog), munt = toets F5 (volume omlaag), start = toets 1; speler 2: munt = toets 5, start = toets 2). UserProfiles/Rampage.env: TP_REMOTETHREAD=off, RG_WINEPREFIX (DXVK-prefix) en GST_PLUGIN_PATH (gst-libav voor de AAC-geluidsspoor van de filmpjes: zonder AAC-decoder stopt de game met exitcode 1 zodra de intro-film begint, ook met alleen coin en start); de teknoparrot.ini ontbreekt op de NAS en wordt niet geschreven (kern-standaard), zie findings/Rampage.md

; Ronde 23 (vraag 71): WartranTroopers is juist; drie spelers met elk COINS, START, UP, DOWN, LEFT, RIGHT en ATTACK, plus
; Test Menu en Test Select. Eigen indeling voor de Move volgt zodra de bitvolgorde bekend is (vraag 77).
[Status]
Status = playable
Note = Speelbaar, maar geen lightgungame: een joystick- en aanvalsspel voor drie spelers. Speler 1: omhoog = trekker, omlaag = herladen, links = granaat, rechts = aux1, aanval = toets F4, munt = toets F5, start = toets 1 (speler 2: munt toets 5, start toets 2). Gemeten: intro-film, tutorial, klimmen, lopen links en rechts, gebouwen slopen ($ 7.500). Draait met DXVK en gst-libav (AAC-decoder voor de filmpjes); geen vizier. Echte Move-knoppen, speler 2 en 3, testmenu niet getest.
NoteEN = Playable, but not a lightgun game: a joystick-and-attack game for three players. Player 1: up = trigger, down = reload, left = grenade, right = aux1, attack = key F4, coin = key F5, start = key 1 (player 2: coin key 5, start key 2). Measured: intro movie, tutorial, climbing, walking left and right, demolishing buildings ($ 7,500). Runs with DXVK and gst-libav (AAC decoder for the movies); no crosshair. Real Move buttons, players 2 and 3 and the test menu not tested.

