[Game]
Name = Transformers: Human Alliance
Profile = Transformers
Executable = TF_Gun_R_Ring_dumped.exe
Type = TeknoParrot
EmulationProfile = SegaJvsLetsGoIsland
ProfileRevision = 24

[Launch]
Mode = direct
; Sega Ring-kast: de game praat via de AM-bibliotheek (amJvs, amDipsw, SMBus) met de kast. rg-amhw.dll
; (dropin/) emuleert die kast; de daemon is het JVS-bord (route jvs).
AmDaemon = true

[Loader]
; Zonder TeknoParrot (2026-10-18): onze eigen OpenParrot-lader en -kern. De dump heeft lege
; CRT-init-tabellen, waardoor de AM-bibliotheek in de R6002-floatval liep; met rg-amhw.dll op de
; kastapparaten komt de game door de systeeminit heen naar de attract.
Core = ravengun

[AmDaemon]
; Platform-id AAM = RingWide (bordtype in rg-amhw); gameid uit gameid.txt van de dump.
keychip.appboot.platformid = AAM
keychip.appboot.gameid = SBYR

[Env]
; +seh: het afsluitspoor van rg-amhw in het logboek (zoals LGI).
WINEDEBUG = -all,+seh

; Schermvullend in gamescope met Windowed = 1 (met 0 bleef het zwart en opende de game de JVS-pipe niet), recept SEGA Golden Gun.
[Display]
Gamescope = true
GamescopePath = /usr/bin/gamescope

[Input]
Route = jvs
Board = SegaGun2P
ComPort = COM4
JvsTransport = pipe
Note = recept SEGA Golden Gun: JVS over de pipe, generiek Sega-gunbord SegaGun2P. Sinds 2026-10-18 zonder TeknoParrot: eigen OpenParrot-kern + rg-amhw.dll (dropin/) als RingWide-kast; de game komt door de systeeminit (die met de lege CRT-init-tabellen van de dump in R6002 liep) naar de attract.

; Bediening voor de knoppen-uitleg bij de eerste start (docs/per-game-patches.md, "Bediening per game"); labels uit het
; TeknoParrot-profiel (GameProfiles/<P>.xml), "Not confirmed yet" = de werking is nog niet gemeten.
[Controls]
trigger = Trigger 1 | Fires the gun.
reload = Trigger 2 | The second trigger. Used by the game; exact function not confirmed yet.

[Status]
Status = working
Note = WERKT (2026-10-17, gespeeld in muismodus, 5,5 min: START, intro-scène, in het spel 'PULL THE TRIGGER' met score). Start via dubbelklik (2026-10-17): SYSTEM INITIALIZING, dan de attract (PRESS START BUTTON, FREE PLAY); JVS over de pipe (SegaGun2P). Nodig: Windowed = 1 in gamescope (met 0 zwart, geen JVS). Spelen, richten en de hendel nog niet gemeten. Sinds 2026-10-18 zonder TeknoParrot: eigen lader en kern + rg-amhw.dll (dropin/, RingWide-kast AAM, gameid SBYR) op dezelfde JVS-poort; systeeminit en attract op de tv gemeten.
NoteEN = WORKING (2026-10-17, played in mouse mode for 5.5 min: start, intro cutscene, in the game with score). Starts by double-click (2026-10-17): system init, then the attract (press start, free play). Needs Windowed = 1 under gamescope. Play, aim and the lever not yet measured. Since 2026-10-18 without TeknoParrot: own loader and core + rg-amhw.dll (dropin/, RingWide cabinet AAM, gameid SBYR) on the same JVS port; system init and attract measured on the TV.

; Profiel uit TeknoParrot-sjabloon GameProfiles/Transformers.xml, revisie 24 (scripts/import-tp-profiles.py; opnieuw importeren in plaats van met de hand wijzigen)
[Identify]
Path = exe/TF_Gun_R_Ring_dumped.exe

