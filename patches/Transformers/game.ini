[Game]
Name = Transformers: Human Alliance
Profile = Transformers
Executable = TF_Gun_R_Ring_dumped.exe
Type = TeknoParrot
EmulationProfile = SegaJvsLetsGoIsland
ProfileRevision = 24

[Launch]
Mode = direct

; Schermvullend in gamescope met Windowed = 1 (met 0 bleef het zwart en opende de game de JVS-pipe niet), recept SEGA Golden Gun.
[Display]
Gamescope = true
GamescopePath = /usr/bin/gamescope

[Input]
Route = jvs
Board = SegaGun2P
ComPort = COM4
JvsTransport = pipe
Note = recept SEGA Golden Gun: JVS over de pipe, generiek Sega-gunbord SegaGun2P. Let op (2026-10-18): met onze eigen OpenParrot-build ([Loader] Build = ravengun, Core = ravengun) stopt de game met de MSVC-fout R6002 (floating point support not loaded); dit profiel gebruikt daarom nog de lader en kern uit de TeknoParrot-map van de gebruiker. Dat moet nog weg.

; Bediening voor de knoppen-uitleg bij de eerste start (docs/per-game-patches.md, "Bediening per game"); labels uit het
; TeknoParrot-profiel (GameProfiles/<P>.xml), "Not confirmed yet" = de werking is nog niet gemeten.
[Controls]
trigger = Trigger 1 | Fires the gun.
reload = Trigger 2 | The second trigger. Used by the game; exact function not confirmed yet.

[Status]
Status = working
Note = WERKT (2026-10-17, gespeeld in muismodus, 5,5 min: START, intro-scène, in het spel 'PULL THE TRIGGER' met score). Start via dubbelklik (2026-10-17): SYSTEM INITIALIZING, dan de attract (PRESS START BUTTON, FREE PLAY); JVS over de pipe (SegaGun2P). Nodig: Windowed = 1 in gamescope (met 0 zwart, geen JVS). Spelen, richten en de hendel nog niet gemeten.
NoteEN = WORKING (2026-10-17, played in mouse mode for 5.5 min: start, intro cutscene, in the game with score). Starts by double-click (2026-10-17): system init, then the attract (press start, free play). Needs Windowed = 1 under gamescope. Play, aim and the lever not yet measured. Note (2026-10-18): with our own OpenParrot build ([Loader] Build = ravengun, Core = ravengun) the game stops with the MSVC error R6002 (floating point support not loaded); this profile therefore still uses the loader and core from the user's TeknoParrot folder. Removing that dependency is still open.

