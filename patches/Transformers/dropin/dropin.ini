; SPDX-License-Identifier: GPL-3.0-or-later
;
; Drop-in van Transformers: Human Alliance (docs/dropins.md).
;
; rg-amhw.dll: de kastapparaten van een Sega RingWide-kast (DMI, SRAM, SMBus/EEPROM,
; dipschakelaars, JVS). Bron tools/rg-amhw/, bouwen met tools/dev/build-amhw.sh.
; RG_AMHW_OEM=AAM = RingWide; RG_AMHW_DIPIN=FE,FF = dip 0 aan (standaardkast).
[rg-amhw.dll]
To = .
Preload = true
Audit = false
Env = RG_AMHW_OEM=AAM;RG_AMHW_VENDOR=Supermicro;RG_AMHW_DIPIN=FE,FF
