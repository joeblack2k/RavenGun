; Men in Black (SEGA Amusements, ticket game, build 240913RED; Unity 2020.3, 64 bits). Sinds 2026-10-17 start RavenGun MIB.exe
; rechtstreeks, zonder de shell van de kast (Shell.exe, Game Shell 230307RED), zoals TeknoParrot's eigen profiel GameProfiles/MIB.xml
; dat ook doet, maar op onze eigen kern. De keten van de kast (Shell.exe start MIB.exe) staat beschreven in ATTRACT-RUN.md en README.md.
;
; Zonder shell stopt de game zichzelf (MIBClient.ProcessMessage: niet verbonden -> Application.Quit; MIBCore.Update: security-challenge
; onbeantwoord -> ExitGameSequance). Onze BepInEx-plugin RavenGun.MenInBlack (plugins/bepinex/MenInBlack/, drop-in) onderdrukt dat.

[Game]
Name = Men in Black
Profile = MenInBlack
Type = TeknoParrot
EmulationProfile = WartranTroopers
Executable = MIB.exe
Is64Bit = true

[Launch]
Mode = direct
; Unity met Direct3D 11: DXVK (zonder bleef het zwart).
Dxvk = true
; BepInEx 5.4.21.0 (scripts/fetch-bepinex.sh) naast MIB.exe, voor de plugin uit dropin/.
BepInEx = 5.4.21.0

[Loader]
; Onze eigen 64-bit kern: met de gesloten kern van TeknoParrot (TeknoParrot64.dll) laadde BepInEx niet en verdween de game na het logo
; (gemeten 2026-10-17).
Core = ravengun

[Wine]
; De attract is een reeks MP4-films (H.264/AAC); zonder de libav-plugins van GStreamer viel de game bij de eerste film weg.
GStreamerPlugins = ~/.local/share/ravengun/tools/gst-extra/plugins

[Display]
Gamescope = true

[Input]
Route = tp-shm
Layout = WartranTroopers
Note = bordbeeld: de plugin RavenGun.MenInBlack leest TeknoParrot_JvsState (indeling WartranTroopers) en beantwoordt PlayerStart1/2, Player1/2Trigger1, het richtpunt en de munt (docs/research/invoer/README.md); de shell van de kast is niet nodig

[Status]
Status = working
Note = SPEELPROEF 2026-10-19 (punt G, op onze eigen kern): GESPEELD, niet alleen attract. Start via de daemon, daarna munt (virtueel toetsenbord, toets 5) en START (toets 1): het scherm ging van de attract naar "PLAYER 1 READY" (docs/screenshots/meninblack-speler1-gereed-2026-10-19.png), na een tweede START begon de eerste missie ("SCORE 0000 / TICKETS 000 / PLASMA RIFLE", docs/screenshots/meninblack-spel-missie-2026-10-19.png) en met de trekker (output-button trigger) liep de score op naar "SCORE 0062 / TICKETS 004" (docs/screenshots/meninblack-spel-score-2026-10-19.png). Munt, START en het geweer komen dus aan en het spel speelt. MUISMODUS, 2026-10-19 15:05-15:08 (review 16; logboek direct-MenInBlack-20261019-150532.log, daemon in muismodus via ravengunctl mouse-gun): munt en START komen AAN, maar via het VIRTUELE TOETSENBORD (ravengunctl key 5 en key 1) en niet via de muisknoppen. Welke invoerweg het is blijkt uit de fotos (het logboek bevat geen invoerspoor). Verloop: de attract, dan "PLAYER 1 READY" (docs/screenshots/meninblack-muismodus-gereed-2026-10-19.png), na een tweede START begint de missie en met de trekker (ravengunctl output-button trigger) loopt de score naar 0024 en de tickets naar 001 (docs/screenshots/meninblack-muismodus-score-2026-10-19.png). De meting van 17 oktober ("munt en START komen niet aan" in muismodus) blijft dus staan voor de MUISKNOPPEN -- die hebben geen munt- of START-functie -- en is niet hermeten; wat er vandaag bij kwam is dat dezelfde game in muismodus wel speelt als munt en START via het virtuele toetsenbord gaan. WAT NIET GEMETEN IS: of een missie helemaal uitgespeeld kan worden (de score liep op, maar het einde van de missie is niet afgewacht).
NoteEN = PLAY TEST 2026-10-19 (item G, on our own core): PLAYED, not just attract. Started through the daemon, then coin (virtual keyboard, key 5) and START (key 1): the screen went from the attract to "PLAYER 1 READY" (docs/screenshots/meninblack-speler1-gereed-2026-10-19.png), a second START began the first mission ("SCORE 0000 / TICKETS 000 / PLASMA RIFLE", docs/screenshots/meninblack-spel-missie-2026-10-19.png) and with the trigger (output-button trigger) the score rose to "SCORE 0062 / TICKETS 004" (docs/screenshots/meninblack-spel-score-2026-10-19.png). So coin, START and the gun all arrive and the game plays. MOUSE MODE, 2026-10-19 15:05-15:08 (review 16; log direct-MenInBlack-20261019-150532.log, daemon in mouse mode via ravengunctl mouse-gun): coin and START DO arrive, but through the VIRTUAL KEYBOARD (ravengunctl key 5 and key 1), not through the mouse buttons. Which input path it is can be seen from the photos (the log has no input trace). Sequence: the attract, then "PLAYER 1 READY" (docs/screenshots/meninblack-muismodus-gereed-2026-10-19.png), after a second START the mission begins and with the trigger (ravengunctl output-button trigger) the score rises to 0024 and the tickets to 001 (docs/screenshots/meninblack-muismodus-score-2026-10-19.png). The 17 October measurement ("coin and START do not arrive" in mouse mode) therefore stands for the MOUSE BUTTONS -- they have no coin or START function -- and was not re-run; what is new today is that the same game does play in mouse mode when coin and START go through the virtual keyboard. NOT MEASURED: whether a mission can be played to the end (the score rose, but the end of the mission was not waited for).

