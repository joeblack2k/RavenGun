; Men in Black (SEGA Amusements, ticket game, build 240913RED; Game Shell 230307RED). Written by hand on 2026-10-14 -- there
; is no TeknoParrot template for THIS route: TeknoParrot's own profile (GameProfiles/MIB.xml) starts MIB.exe directly on its
; closed 64-bit core. Here the cabinet's own chain is started: Shell.exe, which starts MIB.exe itself.
; What this game needs and why: ATTRACT-RUN.md and README.md.

[Game]
Name = Men in Black
Profile = MenInBlack
Type = TeknoParrot
EmulationProfile = MenInBlack
Executable = shell.exe;MIB.exe
Is64Bit = false

[Launch]
Mode = direct
; The shell refuses to work without the checksum of its own file on its command line; on the cabinet SystemLauncher.exe
; computes it and passes it. /k=0d051181 is the value for the share's unmodified Shell.exe (Game Shell 230307RED);
; /k=e6222935 is the value for the view's local copy with the nine-byte I/O-board change (ATTRACT-RUN.md; the script
; bewijs-attract-20261014/harness/mib-shell-copy.sh makes that copy and prints the value).
Arguments = /k=e6222935

[Loader]
Core = ravengun

[Wine]
Prefix = ravengun-test-mib
DllOverrides = d3d11,d3d10core,dxgi=n,b
Runner = wrapper

[Status]
Status = parked
Note = In onderzoek sinds 2026-10-14; zie ATTRACT-RUN.md.
NoteEN = Under investigation since 2026-10-14; see ATTRACT-RUN.md.

[Identify]
Path = shell/Shell.exe
Size = 1434624
