; Men in Black (SEGA Amusements, ticket game, build 240913RED; Unity 2020.3, 64 bits). Sinds 2026-10-17 start RavenGun MIB.exe
; rechtstreeks, zonder de shell van de kast (Shell.exe, Game Shell 230307RED), zoals TeknoParrot's eigen profiel GameProfiles/MIB.xml
; dat ook doet, maar op onze eigen kern. De keten van de kast (Shell.exe start MIB.exe) staat beschreven in ATTRACT-RUN.md en README.md.
;
; Zonder shell stopt de game zichzelf (MIBClient.ProcessMessage: niet verbonden -> Application.Quit; MIBCore.Update: security-challenge
; onbeantwoord -> ExitGameSequance). Onze BepInEx-plugin RavenGun.MenInBlack (plugins/bepinex/MenInBlack/, drop-in) onderdrukt dat.

[Game]
Name = Men in Black
Profile = MenInBlack
Type = TeknoParrot
EmulationProfile = WartranTroopers
Executable = MIB.exe
Is64Bit = true

[Launch]
Mode = direct
; Unity met Direct3D 11: DXVK (zonder bleef het zwart).
Dxvk = true
; BepInEx 5.4.21.0 (scripts/fetch-bepinex.sh) naast MIB.exe, voor de plugin uit dropin/.
BepInEx = 5.4.21.0

[Loader]
; Onze eigen 64-bit kern: met de gesloten kern van TeknoParrot (TeknoParrot64.dll) laadde BepInEx niet en verdween de game na het logo
; (gemeten 2026-10-17).
Core = ravengun

[Wine]
; De attract is een reeks MP4-films (H.264/AAC); zonder de libav-plugins van GStreamer viel de game bij de eerste film weg.
GStreamerPlugins = ~/.local/share/ravengun/tools/gst-extra/plugins

[Display]
Gamescope = true

[Input]
Route = tp-shm
Layout = WartranTroopers
Note = bordbeeld: de plugin RavenGun.MenInBlack leest TeknoParrot_JvsState (indeling WartranTroopers) en beantwoordt PlayerStart1/2, Player1/2Trigger1, het richtpunt en de munt (docs/research/invoer/README.md); de shell van de kast is niet nodig

[Status]
Status = working
Note = SPEELPROEF 2026-10-19 (punt G, op onze eigen kern): GESPEELD, niet alleen attract. Start via de daemon, daarna munt (virtueel toetsenbord, toets 5) en START (toets 1): het scherm ging van de attract naar "PLAYER 1 READY" (docs/screenshots/meninblack-speler1-gereed-2026-10-19.png), na een tweede START begon de eerste missie ("SCORE 0000 / TICKETS 000 / PLASMA RIFLE", docs/screenshots/meninblack-spel-missie-2026-10-19.png) en met de trekker (output-button trigger) liep de score op naar "SCORE 0062 / TICKETS 004" (docs/screenshots/meninblack-spel-score-2026-10-19.png). Munt, START en het geweer komen dus aan en het spel speelt. EERDERE METING, blijft staan: 2026-10-17 (muismodus): munt en START komen niet aan; op de kast loopt de invoer via de shell. Die meting is vandaag HERMETEN en het beeld is anders: via het virtuele toetsenbord (ravengunctl key 5 / key 1) komen munt en START wel aan. Het verschil zit dus in de bron van de invoer (muismodus tegen het virtuele toetsenbord), niet in de game. Ik had deze negatieve meting eerder vandaag weggehaald toen ik op grond van twee attract-fotos "working" zette; dat was fout -- een gemeten negatief mag niet verdwijnen zonder opnieuw te meten, en deze regel staat er nu weer. WAT NIET GEMETEN IS: of een missie helemaal uitgespeeld kan worden (de score liep op, maar het einde van de missie is niet afgewacht).
NoteEN = PLAY TEST 2026-10-19 (item G, on our own core): PLAYED, not just attract. Started through the daemon, then coin (virtual keyboard, key 5) and START (key 1): the screen went from the attract to "PLAYER 1 READY" (docs/screenshots/meninblack-speler1-gereed-2026-10-19.png), a second START began the first mission ("SCORE 0000 / TICKETS 000 / PLASMA RIFLE", docs/screenshots/meninblack-spel-missie-2026-10-19.png) and with the trigger (output-button trigger) the score rose to "SCORE 0062 / TICKETS 004" (docs/screenshots/meninblack-spel-score-2026-10-19.png). So coin, START and the gun all arrive and the game plays. EARLIER MEASUREMENT, kept: 2026-10-17 (mouse mode): coin and START do not arrive; on the cabinet the input goes through the shell. That measurement was RE-MEASURED today and the picture differs: through the virtual keyboard (ravengunctl key 5 / key 1) coin and START do arrive. The difference is the input source (mouse mode versus the virtual keyboard), not the game. I had removed this negative measurement earlier today when I set "working" on two attract screenshots; that was wrong -- a measured negative must not disappear without re-measuring, and that line is back now. NOT MEASURED: whether a mission can be played to the end (the score rose, but the end of the mission was not waited for).

