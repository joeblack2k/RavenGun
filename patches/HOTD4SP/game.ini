Note = Gemeten 2026-10-15 (Lindbergh-route, stackalign, /var/tmp): dubbelklik, ride-reset met START, daarna meer dan 5 min attract zonder crash. Munt en START starten geen spel: de ride-versie wacht vermoedelijk op signalen van de stoel (gordels, startknop op de ride; rideBoard.c van lindbergh-loader). Nog niet speelbaar. Correctie 2026-10-19: een eerdere notitie van vandaag zei dat de enige route de jvs-route met de TeknoParrot-lader was. Er is wel degelijk een NATIVE route: patches/HOTD4SP/native.json (enabled, blok lindbergh met stackalign en jvs = passthrough), docs/lindbergh.md en de eerdere startlogboeken native-HOTD4SP-20261015/17/18-*.log. lindbergh-loader is de vrije, eigen Lindbergh-route -- geen TeknoParrot, geen Wine: de ELF (hod4M.elf, i386) draait rechtstreeks op de machine met lindbergh.so. Vandaag opnieuw gestart via die route: het logboek zegt "lindbergh: spel-ID 0x7d6ab3e3 (/lb/elf/hod4M.elf)", "geschreven: /rg/lindbergh.ini" en "JVS: /dev/ttyRG0 in de sandbox = /dev/pts/0 (de pty van de IO-brug)". De attract liep meer dan een minuut en bewoog: twee fotos 20 seconden uit elkaar verschillen (docs/screenshots/hotd4sp-native-attract-2026-10-19.png en -b.png; de intro met de vrouw in de rode blazer). Wat NIET lukt is een spel starten. Dat is op 19-10 NIET opnieuw gemeten: de meting van vandaag gaat over de attract (beeld, spel-ID, JVS-pijp). Wat erover bekend is komt uit de meting van 15 oktober: munt en START starten geen spel, en de veronderstelling is dat de ride-versie op stoelsignalen wacht. Dus: attract ja, spelen nee, en dat is de stand van deze titel.
NoteEN = Measured 2026-10-15 (Lindbergh route, stackalign, /var/tmp): double-click, ride reset with START, then more than 5 min of attract without a crash. Coin and START do not start a game: the ride version most likely waits for seat signals (seat belts, the ride's start button; lindbergh-loader's rideBoard.c). Not playable yet. Correction 2026-10-19: an earlier note of today said the only route was the jvs route with the TeknoParrot loader. There IS a NATIVE route: patches/HOTD4SP/native.json (enabled, a lindbergh block with stackalign and jvs = passthrough), docs/lindbergh.md and the earlier start logs native-HOTD4SP-20261015/17/18-*.log. lindbergh-loader is the free, own Lindbergh route -- no TeknoParrot, no Wine: the ELF (hod4M.elf, i386) runs directly on the machine with lindbergh.so. Started again today through that route: the log says "lindbergh: spel-ID 0x7d6ab3e3 (/lb/elf/hod4M.elf)", "geschreven: /rg/lindbergh.ini" and "JVS: /dev/ttyRG0 in de sandbox = /dev/pts/0 (de pty van de IO-brug)". The attract ran for more than a minute and moved: two screenshots 20 seconds apart differ (docs/screenshots/hotd4sp-native-attract-2026-10-19.png and -b.png; the intro with the woman in the red blazer). What does NOT work is starting a game. That was NOT re-measured on 19-10: today's measurement covers the attract (image, game ID, JVS pipe). What is known about it comes from the 15 October measurement: coin and START do not start a game, and the hypothesis is that the ride version waits for seat signals. So: attract yes, playing no, and that is this title's state.

