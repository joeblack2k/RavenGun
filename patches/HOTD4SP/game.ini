[Status]
Status = untested
Note = Lindbergh route, no TeknoParrot. Measured headless through the daemon, 2026-10-21 (start logs native-HOTD4SP-20261021-141726.log, -144007.log, -144448.log). How a game starts: this ride version runs the ride's free-play flow by itself. lindbergh-loader emulates the ride board (rideBoard.c); after the boot the game sends ride command 06 (free play, its own credit setting: the free-play branch of the ride code at 0x0804f964), the emulation answers 08 (riders boarded), the game shows the safety and story screens (mode 12) and waits there. Pressing START (key 1, PS Move Square/Start) starts the game (mode 9, stage sp01) within 2 s; without START it stayed in mode 12 for more than 2.5 min. No coin, seat, seat-belt or test-menu setting is needed: the earlier 'grey screen-adjust pattern' was the safety screen drawn without its textures (fixed below), not a ride error. After GAME OVER (ride command 11, then 'Mission Complete') the game returns to the safety screens by itself and START starts the next game; measured for six games in a row. In play: the trigger fires (shell casings, impact sparks, the ride's P1 gun-reaction output bit, the ammo column drains while the trigger is held and shows RELOAD when empty); the grenade is thrown and the count drops 3 -> 2. The P1 HUD appears after the first shot. Reload is automatic in this version (measured 2026-10-21 on the installed loader, start log native-HOTD4SP-20261021-150751.log): after a 0.8 s burst the ammo column was full again 0.6 s after the trigger was released, with no reload press and no off-screen shot; RELOAD only shows while the trigger is held until the magazine is empty. The reload button and off-screen + trigger do no harm (column full afterwards) but are not needed. Aim (test-pattern, 1024x768), measured 2026-10-22 with the game's own GUN MARK CHECK in its test menu (the test program hod4testM.elf from the same folder; SERVICE = key F3 steps the cursor, TEST = key 0 enters; the game draws a red cross for P1 and a blue cross for P2 where it thinks the gun points; cross centres read from full-resolution screenshots, the cross glyph sits about +2,+1 px from the pixel it marks). With the game's default gun calibration (a fresh eeprom.bin) both players were off in proportion to the distance from the centre: 0.5,0.5 +2,+1 px; 0.3,0.3 -14,-2 px; 0.15,0.2 -26,-4 px; 0.1,0.1 -30,-5 px; 0.9,0.9 +29,+7 px; 0.85,0.8 +25,+6 px; 0.1,0.9 -30,+7 px (up to 30 px = 2.9% of the width and 7 px = 0.9% of the height; the earlier spark estimate of 27 px left at 0.15,0.2 agrees). The cause is the game's stored calibration, not the loader or the daemon: our JVS axis spans the whole 0..1023 and is linear, but the default calibration expects a narrower range. After the game's own PLAYER1 GUN ADJUSTMENT and PLAYER2 GUN ADJUSTMENT (three marks each, at 16,32, 1008,736 and the centre, fired with output-button trigger, then TEST to memorize) every point of the grid (0.1/0.9 corners, 0.15,0.2, 0.85,0.8, centre, edge midpoints, 0.3,0.3, 0.7,0.7) is within 2 px in x and 4 px in y (0.2% of the width, 0.5% of the height) for P1 and for P2. The calibration lives in the game section of eeprom.bin (0x1000 and its copy at 0x1080); patches/HOTD4SP/seed/eeprom.bin carries it into a fresh write layer (native.json 'seed'; an existing eeprom.bin is never overwritten, so recalibrate in the test menu if the cursor ever drifts). Player 2 (mouse-gun --player 2, output-button --player 2 trigger) joins during play: the P2 HUD, ammo column and 'GOOD' appear. Picture: without loader patch 0007 (third_party/lindbergh-loader/patches/0007-hod4sp-texture-units-and-shaders.patch, the 0005 and 0006 fixes of HOTD4 Rev C for this build) the safety and story screens are grey and white boxes and the stage has purple-blue/green surfaces and a whitish picture (docs/screenshots/hotd4sp-safety-boxes-before-0007-2026-10-21.jpg, hotd4sp-colours-before-0007-2026-10-21.jpg); with it they are right (hotd4sp-safety-screen-0007-2026-10-21.jpg, hotd4sp-ingame-0007-2026-10-21.jpg). Patch 0007 is only active once the loader is rebuilt and installed (scripts/build-lindbergh-loader.sh). Status untested until the owner plays it with the PS Move.
