[Status]
Status = untested
Note = Gemeten 2026-10-15 (Lindbergh-route, stackalign, /var/tmp): dubbelklik, ride-reset met START, daarna meer dan 5 min attract zonder crash. Munt en START starten geen spel: de ride-versie wacht vermoedelijk op signalen van de stoel (gordels, startknop op de ride; rideBoard.c van lindbergh-loader). Nog niet speelbaar.
NoteEN = Measured 2026-10-15 (Lindbergh route, stackalign, /var/tmp): double-click, ride reset with START, then more than 5 min of attract without a crash. Coin and START do not start a game: the ride version most likely waits for seat signals (seat belts, the ride's start button; lindbergh-loader's rideBoard.c). Not playable yet.

