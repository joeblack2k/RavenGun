Note = GEPARKEERD 2026-10-19 13:44 (punt G). Op onze eigen lader en kern lukt deze game nog niet: de enige route in het profiel is Route = jvs met Board = Lindbergh, en die vraagt de Lindbergh-laag (lindbergh.so) die de JVS-pakketten van het baseboard doorgeeft. Drie wegen geprobeerd en alle drie dicht: (1) de directe route met onze eigen lader weigert, want hij vraagt TeknoParrot/BudgieLoader.exe (dat mag niet meer: nooit TeknoParrot); (2) er is geen native/Unity-route voor een Lindbergh-ELF -- packaging/native-games.json bestaat niet en het profiel is Type = Lindbergh, dus er valt niets om te schakelen; (3) de jvs-route zelf bouwen (wineboot, dosdevices, de LD_PRELOAD-hulp, JVS over een COM-poort) is een hele route en past niet in dit tijdvak. Wat de oude notitie hieronder beschrijft is de meting van 2026-10-15 op de TeknoParrot-route (dubbelklik): die werkte, maar dat is precies de weg die we niet meer willen. Volgende stap: de Lindbergh-laag zelf (ELF native starten plus een JVS-shim), dat is een eigen ronde.
NoteEN = PARKED 2026-10-19 13:44 (item G). This game does not run on our own loader/core yet: the profile only has Route = jvs with Board = Lindbergh, which needs the Lindbergh layer (lindbergh.so) that forwards the baseboard JVS packets. Three approaches were tried and all three are closed: (1) the direct route with our own loader refuses because it wants TeknoParrot/BudgieLoader.exe (not allowed any more: never TeknoParrot); (2) there is no native/Unity route for a Lindbergh ELF -- packaging/native-games.json does not exist and the profile is Type = Lindbergh, so there is nothing to switch to; (3) building the jvs route itself (wineboot, dosdevices, the LD_PRELOAD helper, JVS over a COM port) is a whole route and does not fit in this timebox. The older note below is the 2026-10-15 measurement on the TeknoParrot route (double-click): that worked, but it is exactly the path we no longer want. Next step: the Lindbergh layer itself (start the ELF natively plus a JVS shim), which is a round of its own.

[Input]
Route = jvs
