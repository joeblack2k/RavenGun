[Game]
Name = The House of the Dead 4 Special
Profile = HOTD4SP
Executable = hod4M.elf
Type = Lindbergh
EmulationProfile = Hotd4sp
ProfileRevision = 8

[Status]
Status = untested
Note = Nog nooit gestart. Lindbergh-route klaar (2026-10-14, docs/lindbergh.md): native i386 met lindbergh.so van lindbergh-loader (dongle, baseboard, EEPROM), JVS doorgegeven aan het bord Lindbergh van de daemon, zink. De dump is Rev B (spel-ID 0x7d6ab3e3, schone ELF volgens lindbergh-loader); geen libCg nodig. Statisch onderzoek van de bescherming: BESCHERMING-STATUS.md.
NoteEN = Never started. Lindbergh route ready (2026-10-14, docs/lindbergh.md): native i386 with lindbergh.so from lindbergh-loader (dongle, baseboard, EEPROM), JVS passed to the daemon's Lindbergh board, zink. The dump is Rev B (game ID 0x7d6ab3e3, a clean ELF according to lindbergh-loader); no libCg needed. Static study of the protection: BESCHERMING-STATUS.md.

[Input]
Route = jvs
Board = Lindbergh
Note = Lindbergh-route: lindbergh.so geeft de JVS-pakketten van het baseboard door aan de pty van de daemon (/dev/ttyRG0 in de sandbox); de daemon is het bord Lindbergh uit packaging/jvs-boards.json.

; Profiel uit TeknoParrot-sjabloon GameProfiles/HOTD4SP.xml, revisie 8 (scripts/import-tp-profiles.py; opnieuw importeren in plaats van met de hand wijzigen)
