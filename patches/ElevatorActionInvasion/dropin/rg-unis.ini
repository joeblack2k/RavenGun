;
; rg-unis.ini voor Elevator Action Invasion (zie tools/rg-unis/rg-unis.voorbeeld.ini voor de uitleg). Dit is de ingebouwde standaard voor
; deze game, expliciet gemaakt.
;
; Profiel ElevatorActionInvasion.xml (TeknoParrot): Coin 1/2, Test, Menu Up = P1Button5, Menu Down = P1Button6, Start P1/P2, trekker P1/P2.
; In het spel (ParseIOData, RVA 0x792410): IoData2 bit 0 = Enter, bit 1 = omlaag, bit 2 = omhoog, bit 5 = start 1, bit 4 = start 2.
; Bits van het bordbeeld: 0 test, 2 munt 1, 3 munt 2, 4 menu omhoog (F4), 5 menu omlaag (F5), 6 / 11 start 1 / 2, 7 / 12 trekker 1 / 2.

game = eai
enter = 0
up = 4
down = 5
start1 = 6
start2 = 11
trig1 = 7
trig2 = 12
coin1 = 2
coin2 = 3

; Het spelbeeld (1080x1920, staande kast) staat als smalle kolom midden in het scherm van 1920x1080 (GEGOKT: gamescope zet het zo; niet
; gemeten). De assen van het bordbeeld lopen over het hele scherm; de DLL rekent ze om naar beeldpunten van het spel.
aim.mode = column
aim.out = 1920x1080
