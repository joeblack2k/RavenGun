; Standaard voor Taito Type X2-games (Type = OpenParrot): standaardroute van de lader, Wine's eigen d3d9 en een standaard
; JVS-bord achter de pipe (scripts/launch-direct.py). Zie packaging/games-status.md, elfde ronde.
; Eigen lader en kern uit de openbare OpenParrot-bron (scripts/build-openparrot.sh, de Wine-fix zit er als broncodewijziging in): zet in
; patches/<Game>/game.ini of in de gebruikerslaag  [Loader] Build = ravengun  (alleen lader: Core = teknoparrot). Standaard sinds 2026-10-11: eigen lader en kern; terug met Build = teknoparrot.
; Zie docs/per-game-patches.md en third_party/openparrot/README.md.
[Loader]
RemoteThread = off
Build = ravengun

[Wine]
DllOverrides = d3d9=b

[Input]
JvsPipeBoard = true

; Wat scripts/tp-add-game.py voor een nieuwe game van dit soort in de gebruikerslaag aanzet (namen uit _defaults/OpenParrot.patches.ini,
; gescheiden door een komma). De launcher leest deze sectie niet.
[NewGame]
EnablePatches = OpenParrotLoader zonder CONTEXT_FLOATING_POINT
