; Gedeelde patches voor games met Type = OpenParrot. Een game zet er een aan met alleen
;   [Patch: <naam>]
;   Enabled = true
; in zijn eigen patches.ini (of de gebruiker in ~/.local/share/ravengun/patches/<Game>/patches.ini).
[Patch: OpenParrotLoader zonder CONTEXT_FLOATING_POINT]
Enabled = false
Kind = file
Category = loader
Target = loader
TargetName = OpenParrotLoader.exe
Find = C7 05 C0 9B 42 00 1F 00 01 00
Replace = C7 05 C0 9B 42 00 17 00 01 00
Count = 1
Reason = Wine zet MXCSR op 0 bij SetThreadContext met CONTEXT_FLOATING_POINT zonder CONTEXT_EXTENDED_REGISTERS (alle SSE-uitzonderingen ongemaskeerd). De OpenParrot-lader doet dat met ContextFlags 0x1001F op de hoofdthread van de game, waarna Mesa in de D3D9-init op de eerste inexacte conversie met c00002b5 vastloopt (Type X2). De patch maakt van 0x1001F 0x10017 (zonder FLOATING_POINT) op een lokale kopie van de lader. Zie findings/GaiaAttack4.md.
