[Game]
Name = Let's Go Island 3D: Lost on the Island of Tropics
Profile = LGI3D
Type = TeknoParrot
EmulationProfile = SegaJvsLetsGoIsland
DongleRegion = USA
PcbRegion = USA
Executable = LGI.exe
ProfileRevision = 22

[Launch]
Mode = direct

[Wine]
Prefix = ravengun-test-lgi3d
VirtualDesktop = 1920x1080
Runner = wrapper

[Input]
Route = jvs
Board = LGI3D
ComPort = COM4
JvsTransport = pipe
Note = speelbaar: de game praat JVS over de pipe TeknoParrot_JVS; start direct (zonder TeknoParrotUi, play-halo.sh) met UserProfiles/LGI3D.env: TP_REMOTETHREAD=off, RG_WINEPREFIX (eigen prefix-kopie met een Wine-virtueel bureaublad 1920x1080: volledig scherm loopt vast, venstermodus laat de kern crashen) en RG_JVS_TRANSPORT=pipe; launch-direct.py brugt de pipe naar de pty van de daemon, die het JVS-bord LGI is (aim, trekker, start, munt)

; Bediening voor de knoppen-uitleg bij de eerste start (docs/per-game-patches.md, "Bediening per game"); labels uit het
; TeknoParrot-profiel (GameProfiles/<P>.xml), "Not confirmed yet" = de werking is nog niet gemeten.
[Controls]
trigger = Shoot | Fires the gun.
reload = Reload | Used by the game; exact function not confirmed yet.
grenade = Extra | Used by the game; exact function not confirmed yet.

[Status]
Status = working
Note = WERKT op onze eigen route (2026-10-14): een dubbelklik in RavenGun start de game zonder scripts en zonder TeknoParrotUi (daemon -> rg-direct -> Wine -> OpenParrot-lader; JVS over de pipe naar het bord van de daemon). Gemeten op de tv met de muismodus: START (toets 1 even vasthouden), richten, schieten, combo's (score 37500); 5:15 min attract en spel na het eerste attractbeeld. Beeld in rood-cyaan 3D (de 2D-knop is niet gecontroleerd). Nog niet met de echte Move gespeeld op deze route.
NoteEN = WORKING on our own route (2026-10-14): a double-click in RavenGun starts the game without scripts and without TeknoParrotUi (daemon -> rg-direct -> Wine -> OpenParrot loader; JVS over the pipe to the daemon's board). Measured on the TV in mouse mode: START (hold key 1 briefly), aim, shoot, combos (score 37500); 5:15 min of attract and play after the first attract screen. Red-cyan 3D picture (the 2D button was not checked). Not yet played with the real Move on this route.
Findings = findings/LetsGoIsland3D.md

