; Gegenereerd door scripts/migrate-game-settings.py (docs/per-game-patches.md). Sleutels die het script afleidt uit de oude bronnen worden bij
; elke run opnieuw gezet; handwerk in andere sleutels blijft staan.
;
; Uit het oude UserProfiles/LGI3D.env:
; door tp-add-game.py; zie packaging/games-status.md

[Game]
Name = Let's Go Island 3D: Lost on the Island of Tropics
Profile = LGI3D
Type = TeknoParrot
EmulationProfile = SegaJvsLetsGoIsland
DongleRegion = USA
PcbRegion = USA
Executable = LGI.exe
ProfileRevision = 22

[Launch]
Mode = direct
; De AM-daemon van de Ring-kast beantwoordt rg-direct zelf (keychip-waarden hieronder, docs/research/segajvs/README.md).
AmDaemon = true

[Loader]
; Zonder de gesloten TeknoParrot-kern (2026-10-18): onze OpenParrot-kern + rg-amhw.dll (dropin/) als de kastapparaten (DMI, SRAM,
; EEPROM met de regio, dipschakelaars, JVS). Gemeten op de tv zonder TP-map: attract, munt, start, 3D CALIBRATION, geluid.
Core = ravengun

[AmDaemon]
; keychip.appboot.platformid wordt door de game nergens teruggelezen; het DMI-platform (OEM-tekenreeks) staat in dropin/dropin.ini.
keychip.appboot.platformid = AAL
; het vierletterige spel-id: de naam van <id>_Table.dat in de exe (strings); rg-amhw maakt die tabel als hij op de NAS ontbreekt
keychip.appboot.gameid = SBWB

[Env]
; +seh: de afsluitspoor van rg-amhw (requestExit met de knoopnaam) in het logboek
WINEDEBUG = -all,+seh

[Display]
; In gamescope, met Windowed = 1 hieronder (zoals GG, OG en LGS); Windowed = 0 was voor de TP-route.
Gamescope = true
GamescopePath = /usr/bin/gamescope

[Wine]
Prefix = ravengun-test-lgi3d
VirtualDesktop = 1920x1080
Runner = wrapper

[Input]
Route = jvs
Board = LGI3D
ComPort = COM4
JvsTransport = pipe
Note = speelbaar: de game praat JVS over de pipe TeknoParrot_JVS; start direct (zonder TeknoParrotUi, play-halo.sh) met UserProfiles/LGI3D.env: TP_REMOTETHREAD=off, RG_WINEPREFIX (eigen prefix-kopie met een Wine-virtueel bureaublad 1920x1080: volledig scherm loopt vast, venstermodus laat de kern crashen) en RG_JVS_TRANSPORT=pipe; launch-direct.py brugt de pipe naar de pty van de daemon, die het JVS-bord LGI is (aim, trekker, start, munt)

; Bediening voor de knoppen-uitleg bij de eerste start (docs/per-game-patches.md, "Bediening per game"); labels uit het
; TeknoParrot-profiel (GameProfiles/<P>.xml), "Not confirmed yet" = de werking is nog niet gemeten.
[Controls]
trigger = Shoot | Fires the gun.
reload = Reload | Used by the game; exact function not confirmed yet.
grenade = Extra | Used by the game; exact function not confirmed yet.

[Status]
Status = working
Note = WERKT op onze eigen route (2026-10-14): een dubbelklik in RavenGun start de game zonder scripts en zonder TeknoParrotUi (daemon -> rg-direct -> Wine -> OpenParrot-lader; JVS over de pipe naar het bord van de daemon). Gemeten op de tv met de muismodus: START (toets 1 even vasthouden), richten, schieten, combo's (score 37500); 5:15 min attract en spel na het eerste attractbeeld. Beeld in rood-cyaan 3D (de 2D-knop is niet gecontroleerd). Nog niet met de echte Move gespeeld op deze route. Sinds 2026-10-18 zonder de TeknoParrot-kern (onze kern + rg-amhw.dll), op de tv gemeten zonder TP-map: attract, munt (CREDIT(S) 2), start naar 3D CALIBRATION, geluid.
NoteEN = WORKING on our own route (2026-10-14): a double-click in RavenGun starts the game without scripts and without TeknoParrotUi (daemon -> rg-direct -> Wine -> OpenParrot loader; JVS over the pipe to the daemon's board). Measured on the TV in mouse mode: START (hold key 1 briefly), aim, shoot, combos (score 37500); 5:15 min of attract and play after the first attract screen. Red-cyan 3D picture (the 2D button was not checked). Not yet played with the real Move on this route. Since 2026-10-18 without the TeknoParrot core (our core + rg-amhw.dll), measured on the TV without the TP folder: attract, coin (CREDIT(S) 2), start to 3D CALIBRATION, sound.
Findings = findings/LetsGoIsland3D.md

