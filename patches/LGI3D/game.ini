; Gegenereerd door scripts/migrate-game-settings.py (docs/per-game-patches.md). Sleutels die het script afleidt uit de oude bronnen worden bij
; elke run opnieuw gezet; handwerk in andere sleutels blijft staan.
;
; Uit het oude UserProfiles/LGI3D.env:
; door tp-add-game.py; zie packaging/games-status.md

[Game]
Name = Let's Go Island 3D: Lost on the Island of Tropics
Profile = LGI3D
Type = TeknoParrot
EmulationProfile = SegaJvsLetsGoIsland
DongleRegion = USA
PcbRegion = USA

[Launch]
Mode = direct

[Wine]
Prefix = ravengun-test-lgi3d
VirtualDesktop = 1920x1080

[Input]
Route = jvs
Board = LGI3D
ComPort = COM4
JvsTransport = pipe
Note = speelbaar: de game praat JVS over de pipe TeknoParrot_JVS; start direct (zonder TeknoParrotUi, play-halo.sh) met UserProfiles/LGI3D.env: TP_REMOTETHREAD=off, RG_WINEPREFIX (eigen prefix-kopie met een Wine-virtueel bureaublad 1920x1080: volledig scherm loopt vast, venstermodus laat de kern crashen) en RG_JVS_TRANSPORT=pipe; launch-direct.py brugt de pipe naar de pty van de daemon, die het JVS-bord LGI is (aim, trekker, start, munt)

[Status]
Status = playable
Note = Speelbaar: start tot de attract, 3D-kalibratie (rood-cyaan beeld), start (toets 1) en spelen. Het vizier volgt de aim (gemeten op een raster in de tussenfilm), de trekker schiet. Laden ongeveer 1 minuut. Echte Move-knoppen en geluid niet beoordeeld.
NoteEN = Playable: starts through to the attract, 3D calibration (red-cyan picture), start (key 1) and play. The crosshair follows the aim (measured on a grid in the cutscene) and the trigger fires. Loading takes about a minute. Real Move buttons and sound not checked.
Findings = findings/LetsGoIsland3D.md
