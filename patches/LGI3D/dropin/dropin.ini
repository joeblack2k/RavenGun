;
; Drop-in van LGI3D (docs/dropins.md).
;
; De donglegegevens staan in ravengun-hasp/LGI3D/. De bibliotheek leest ze daar zelf:
; de loader weet niets van dongles. Elk bestand heeft een EIGEN sectie, want de
; drop-in-motor kopieert alleen wat een sectie heeft.

[ravengun-hasp/LGI3D/dongle.json]
To = .

; rg-amhw.dll: de kastapparaten van een Sega Ring-kast (\\.\columba = DMI, \\.\mxsram = backup-SRAM, SMBus/EEPROM, \\.\mxjvs).
; Bron tools/rg-amhw/rg_amhw.cpp, bouwen met tools/dev/build-amhw.sh. Laadbewijs: rg-amhw.log naast de exe ("rg-amhw geladen in ...").
[rg-amhw.dll]
To = .
Preload = true
; Een Windows-PE-DLL, geen ELF: niet in LD_AUDIT (docs/dropins.md, "Audit = false").
Audit = false
; OEM-tekenreeks 3 uit de DMI-tabel = platform-id (AAM RingWide, AAL RingEdge, AAL2 RingEdge 2) en de systeemfabrikant.
Env = RG_AMHW_OEM=AAL;RG_AMHW_VENDOR=NEC
