[Game]
Name = Mars Sortie
Profile = MarsSortie
Executable = Shooter.exe
Type = TeknoParrot
EmulationProfile = WartranTroopers
Is64Bit = true
ProfileRevision = 5
Patreon = true

[Launch]
Mode = direct
; Direct3D via DXVK (docs/dxvk.md): zonder bleef het beeld zwart (ook in gamescope), met DXVK v2.7.1 staan attract en spel in beeld
; (bench 2026-10-15).
Dxvk = true
; De game schrijft zijn records en instellingen bij elke start in GameRecords1/2.dat naast de exe; in de view zijn dat links naar
; de NAS. Daarom lokale kopieën in de view: er wordt nooit naar de NAS geschreven (gemeten 2026-10-15: zonder dit kregen de
; bestanden op de NAS bij elke start een nieuwe mtime).
ViewCopies = GameRecords1.dat, GameRecords2.dat

[Wine]
; BepInEx (doorstop winhttp.dll) laadt de plug-in MSTPPlugin; DXVK voor D3D11 (diagnose 2026-10-14)
Prefix = ravengun-test-dxvk
DllOverrides = winhttp=n,b;d3d11,d3d10core,dxgi=n,b
Runner = wrapper

[Display]
Gamescope = true
GamescopePath = /usr/bin/gamescope

[Input]
Route = tp-shm
Layout = WartranTroopers
Note = tp-shm, indeling WartranTroopers; gemeten 2026-10-15: munt, START, schieten werken

[Status]
Status = working
Note = WORKING via dubbelklik in de app (2026-10-15): DXVK, attract, munt, START, spel; 5,5 min gespeeld. Na een spel met score >= 10 volgt een beloningsscherm (instelling ScoreOfReward = 10 in GameRecords): trekker 5 s vasthouden gaat verder (geen hang). GameRecords1/2.dat zijn lokale kopieën in de view (ViewCopies), de NAS blijft gelijk.
NoteEN = WORKING via double-click in the app (2026-10-15): DXVK, attract, coin, START, game; played 5.5 min. After a game with score >= 10 a reward screen follows (setting ScoreOfReward = 10 in GameRecords): hold the trigger for 5 s to continue (not a hang). GameRecords1/2.dat are local copies in the view (ViewCopies); the NAS stays unchanged.


