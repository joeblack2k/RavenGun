; Voorbereid in pass 1 (docs/goal-90-native.md): profiel uit het TeknoParrot-sjabloon, herkenning gemeten aan de NAS-map "Mars Sortie"
; (alleen gelezen), invoerroute gekozen naar het EmulationProfile. Niet gestart.

[Game]
Name = Mars Sortie
Profile = MarsSortie
Executable = Shooter.exe
Type = TeknoParrot
EmulationProfile = WartranTroopers
Is64Bit = true
ProfileRevision = 5
Patreon = true

[Launch]
Mode = direct
; Direct3D via DXVK (docs/dxvk.md): zonder bleef het beeld zwart (ook in gamescope), met DXVK v2.7.1 staan attract en spel in beeld
; (bench 2026-10-15).
Dxvk = true
; De game schrijft zijn records en instellingen bij elke start in GameRecords1/2.dat naast de exe; in de view zijn dat links naar
; de NAS. Daarom lokale kopieën in de view: er wordt nooit naar de NAS geschreven (gemeten 2026-10-15: zonder dit kregen de
; bestanden op de NAS bij elke start een nieuwe mtime).
ViewCopies = GameRecords1.dat, GameRecords2.dat
; Zonder TeknoParrot (2026-10-17): BepInEx 5.4.21.0 (scripts/fetch-bepinex.sh) naast Shooter.exe, voor onze eigen plugin
; RavenGun.MarsSortie (plugins/bepinex/MarsSortie/, dropin/). Die vult de signaallaag van de game (MRCQ.Hardware) uit het bordbeeld,
; zet het I/O-bord GMB, de SuperDog-dongle en de bord- en camerafouten uit, en zet de TeknoParrot-plugin MSTPPlugin uit die nog in
; BepInEx/plugins van de spelmap staat (die vroeg zijn invoer aan de gesloten kern via ReadFile/WriteFile op een nep-handvat).
BepInEx = 5.4.21.0

[Loader]
; Geen lader en geen kern: Wine start Shooter.exe zelf. Wat de gesloten kern deed (de antwoorden voor MSTPPlugin: knoppen,
; richtpunten, venster en resolutie) doet onze plugin; venster, cursor en resolutie komen uit teknoparrot.ini ([Config] hieronder).
; NOG NIET OP DE TV GEMETEN op deze route; [Status] hieronder is die van de route met de kern van TeknoParrot.
Core = none

[Wine]
; DXVK voor D3D11 (diagnose 2026-10-14); winhttp=n,b voor de doorstop van BepInEx (de drop-in van [Launch] BepInEx zet hem ook)
Prefix = ravengun-test-dxvk
DllOverrides = winhttp=n,b;d3d11,d3d10core,dxgi=n,b
Runner = wrapper

[Display]
Gamescope = true
GamescopePath = /usr/bin/gamescope

[Input]
Route = tp-shm
Layout = WartranTroopers
Note = tp-shm, indeling WartranTroopers; zonder TeknoParrot leest onze plugin RavenGun.MarsSortie het bordbeeld in de game (munt 1/2, start/trekker/wapen per speler, test = OK, menu = granaat/aux1 van speler 1 en 2). Met de kern gemeten 2026-10-15: munt, START, schieten

; Bediening voor de knoppen-uitleg bij de eerste start (docs/per-game-patches.md, "Bediening per game"); labels uit het
; TeknoParrot-profiel (GameProfiles/<P>.xml), "Not confirmed yet" = de werking is nog niet gemeten.
[Controls]
trigger = Shoot | Fires the gun.
reload = Weapon change | Switches weapon. Not confirmed yet.

[Status]
Status = working
Note = WORKING via dubbelklik in de app (2026-10-15): DXVK, attract, munt, START, spel; 5,5 min gespeeld. Na een spel met score >= 10 volgt een beloningsscherm (instelling ScoreOfReward = 10 in GameRecords): trekker 5 s vasthouden gaat verder (geen hang). GameRecords1/2.dat zijn lokale kopieën in de view (ViewCopies), de NAS blijft gelijk.
NoteEN = WORKING via double-click in the app (2026-10-15): DXVK, attract, coin, START, game; played 5.5 min. After a game with score >= 10 a reward screen follows (setting ScoreOfReward = 10 in GameRecords): hold the trigger for 5 s to continue (not a hang). GameRecords1/2.dat are local copies in the view (ViewCopies); the NAS stays unchanged.


