; Voorbereid in pass 1 (docs/goal-90-native.md): profiel uit het TeknoParrot-sjabloon, herkenning gemeten aan de NAS-map "Dream Raiders"
; (alleen gelezen), invoerroute gekozen naar het EmulationProfile. Niet gestart.

[Game]
Name = Dream Raiders
Profile = SDR
Executable = Game.exe
Type = TeknoParrot
EmulationProfile = SegaJvsDreamRaiders
ProfileRevision = 18

[Launch]
Mode = direct
; Sega Ring: de game praat via de AM-bibliotheek met de kast; rg-amhw.dll (dropin/) emuleert de
; kastapparaten, de daemon is het JVS-bord. View = auto (niet off): de oude "ERROR 0906 SOUND
; FUNCTION NOT FOUND" kwam doordat de kastapparaten ontbraken, niet door de view.
View = auto
AmDaemon = true

[Loader]
; Zonder TeknoParrot (2026-10-18): onze eigen OpenParrot-lader en -kern.
Core = ravengun

[AmDaemon]
; Platform-id AAM = RingWide; gameid uit de dongletabel SBXM_Table.dat in de exe.
keychip.appboot.platformid = AAM
keychip.appboot.gameid = SBXM

[Env]
; +seh: het afsluitspoor van rg-amhw in het logboek (zoals LGI).
WINEDEBUG = -all,+seh

[Display]
; Schermvullend via gamescope (zonder gamescope een klein venster met de taakbalk zichtbaar).
Gamescope = true

[Input]
Route = jvs
Board = SegaGun2P
ComPort = COM4
JvsTransport = pipe
Note = JVS over de pipe, bord SegaGun2P. Eerste start vraagt om kalibratie (CONTROLLER ADJUSTMENT: SERVICE (toets 0), dan op de vier hoeken schieten); daarna de attract. Sinds 2026-10-18 zonder TeknoParrot: eigen kern + rg-amhw.dll (dropin/, RingWide AAM, gameid SBXM).

; Bediening voor de knoppen-uitleg bij de eerste start (docs/per-game-patches.md, "Bediening per game"); labels uit het
; TeknoParrot-profiel (GameProfiles/<P>.xml), "Not confirmed yet" = de werking is nog niet gemeten.
[Controls]
trigger = Shoot | Fires the gun.
reload = Reload | Reloads your gun.

[Status]
Status = working
Note = WERKT op onze eigen route (2026-10-14): dubbelklik in RavenGun, zonder TeknoParrotUi (rg-direct, JVS over de pipe naar het bord SegaGun2P). Eerste start: het spel vraagt om kalibratie (CONTROLLER ADJUSTMENT): SERVICE (F3) naar CALIBRATION, START-1, dan op de vier hoeken schieten (linksboven, rechtsboven, linksonder, rechtsonder); de kalibratie blijft bewaard. Gemeten met het testpatroon: START, in het spel schieten, uitslag, nieuw spel; 6:39 min. Nog niet met de echte Move gespeeld. Sinds 2026-10-18 zonder TeknoParrot: eigen lader en kern + rg-amhw.dll (dropin/, RingWide AAM, gameid SBXM); attract met gamebeeld op de tv gemeten.
NoteEN = WORKING on our own route (2026-10-14): double-click in RavenGun, no TeknoParrotUi (rg-direct, JVS over the pipe to the SegaGun2P board). First start: the game asks for calibration (CONTROLLER ADJUSTMENT): SERVICE (F3) to CALIBRATION, START-1, then shoot the four corners (top-left, top-right, bottom-left, bottom-right); the calibration is kept. Measured with the test pattern: START, shooting in the game, result screen, new game; 6:39 min. Not yet played with the real Move. Since 2026-10-18 without TeknoParrot: own loader and core + rg-amhw.dll (dropin/, RingWide AAM, gameid SBXM); attract with game graphics measured on the TV.


