;
; Drop-in van SDR (Dream Raiders), docs/dropins.md.
;
; rg-amhw.dll: de kastapparaten van een Sega RingWide-kast (DMI, SRAM, SMBus/EEPROM,
; dipschakelaars, JVS). Bron tools/rg-amhw/, bouwen met tools/dev/build-amhw.sh.
; RG_AMHW_OEM=AAM = RingWide; RG_AMHW_DIPIN=FE,FF = dip 0 aan (standaardkast).
; RG_AMHW_REGION=4 = Export (de kast en de NAS-Game.ini staan op E; alleen 2/4/8 is geldig,
; anders ERROR 0903 WRONG REGION). RG_AMHW_SRAMSEED=0+1000:200 maakt SDR's backup-record 7
; leeg aan (de invoerstart leest dat zonder terugval). RG_AMHW_NOREPARSE=1 laat een gelinkte
; map als gewone map gelden; zonder dat stapt de game uit de view (ERROR 0906).
[rg-amhw.dll]
To = .
Preload = true
Audit = false
Env = RG_AMHW_OEM=AAM;RG_AMHW_VENDOR=Supermicro;RG_AMHW_DIPIN=FE,FF;RG_AMHW_REGION=4;RG_AMHW_SRAMSEED=0+1000:200;RG_AMHW_NOREPARSE=1

; De NAS-Game.ini staat op REGION E en FULLSCREEN 1; deze kopie zet het beeld op
; windowed 1280x720 (gamescope schaalt het) en de regio op E.

[Game.ini]
To = .
