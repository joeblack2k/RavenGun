;
; Point Blank X zonder TeknoParrot (kandidaat; docs/research/namco/PointBlankX.md).
;
; bnusio.dll is de USIO-bibliotheek die het spel via P/Invoke laadt (Unity zoekt hem in <spel>_Data/Plugins). Dit is ONS bestand
; (tools/rg-usio, gebouwd met tools/dev/build-usio.sh): zelfde 48 exports, cdecl, beantwoord uit het gedeelde geheugen dat de daemon
; schrijft (tp-shm-indeling PointBlankX). Het staat op de plaats van het echte bestand; in de view wordt Plugins/ een lokale map en
; bnusio.dll een lokaal bestand, op de NAS verandert niets (docs/dropins.md, "De view en de map van de exe").
;
; Controleren dat hij geladen is: rg-usio.log in Plugins/ van de view (eerste regel: "rg-usio (bnusio.dll) geladen"), daarna
; "eerste aanroep: usio_Initialize" enz. Zonder dat logboek heeft het spel het echte bestand of niets gelezen.
[bnusio.dll]
To = PBX100-2-NA-MPR0-A63_Data/Plugins
