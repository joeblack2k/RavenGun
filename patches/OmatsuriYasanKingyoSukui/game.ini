Executable = cvgame.exe
ProfileRevision = 1
Patreon = true

[Input]
Route = tp-shm
Layout = WartranTroopers
Note = geparkeerd: valt op onze kern om met exitcode 8; de oorzaak zit niet op de bestandslaag -- zie de [Status] hieronder voor wat wel en niet gemeten is

[Status]
Status = parked
Note = Valt op onze kern om met exitcode 8, maar niet op de bestandslaag: in de trace met WINEDEBUG=+file opent het spelproces geen enkel bestand van zichzelf, en de gesloten kern ziet hem wel leven (na 20 s nog, met dezelfde maat gemeten). Het eerder genoemde ontbrekende campaign*.bmp is dus niet de oorzaak van wat wij meten -- daar komt de game niet eens aan toe. Wat de twee zusjes onderscheidt: Takoyaki, dat leeft, heeft een GMDATA-map die deze game niet heeft, en hun exe-bestanden verschillen in grootte (643.072 tegen 1.642.496 bytes). De herleidingsmap die onze kern aanmaakt (TeknoParrot/D tot en met W) is leeg, terwijl rqrdlist.rqr wel bestaat, in de eigen Media-map (1.200.082 bytes). Een drop-in kan hier niet landen: deze game draait rechtstreeks vanaf de NAS en heeft geen view.
NoteEN = Falls over on our core with exit code 8, but not at the file layer: in the WINEDEBUG=+file trace the game process opens no file of its own, while the closed core does see it stay alive (still there after 20 s, measured with the same method). The previously mentioned missing campaign*.bmp is therefore not the cause of what we measure; the game never gets that far. What separates the two siblings: Takoyaki, which lives, has a GMDATA folder this game lacks, and their executables differ in size (643,072 against 1,642,496 bytes). The redirection folder our core creates (TeknoParrot/D through W) is empty, while rqrdlist.rqr does exist, in the game's own Media folder (1,200,082 bytes). A drop-in cannot land here: this game runs straight from the NAS and has no view.
Findings = findings/OmatsuriYasan.md

