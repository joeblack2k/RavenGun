;
; Drop-in van LGS (docs/dropins.md).
;
; De donglegegevens staan in ravengun-hasp/LGS/. De bibliotheek leest ze daar zelf:
; de loader weet niets van dongles. Elk bestand heeft een EIGEN sectie, want de
; drop-in-motor kopieert alleen wat een sectie heeft.

[ravengun-hasp/LGS/dongle.json]
To = .

; SPDX-License-Identifier: GPL-3.0-or-later
;
; Drop-in voor Let's Go Safari (RingWide): de kastapparaten van een Sega Ring-kast (\\.\columba = DMI, \\.\mxsram = backup-SRAM).
; rg-amhw.dll: tools/rg-amhw/rg_amhw.cpp, bouwen met tools/dev/build-amhw.sh. De gebruikerslaag mag naast de meegeleverde dropin.ini staan:
; de secties worden samengevoegd (docs/dropins.md).
;
; Controle dat hij geladen is: rg-direct --plan LGS toont rg-amhw.dll bij dropin_lines met TP_PRELOAD_DLL; na de start staat
; rg-amhw.log naast de exe met als eerste regel "rg-amhw geladen in ...", daarna "importtabel: KERNEL32.dll!CreateFileW omgezet".

[rg-amhw.dll]
To = .
Preload = true
; Een Windows-PE-DLL, geen ELF: niet in LD_AUDIT (docs/dropins.md, "Audit = false").
Audit = false
; OEM-tekenreeks 3 uit de DMI-tabel = platform-id (AAM RingWide, AAL RingEdge, AAL2 RingEdge 2) en de systeemfabrikant.
Env = RG_AMHW_OEM=AAM;RG_AMHW_VENDOR=Supermicro
