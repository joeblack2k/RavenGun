; Gegenereerd door scripts/migrate-game-settings.py (docs/per-game-patches.md). Sleutels die het script afleidt uit de oude bronnen worden bij
; elke run opnieuw gezet; handwerk in andere sleutels blijft staan.
;
; Uit het oude UserProfiles/LGS.env:
; jvs-route (docs/procedures.md, Let's Go Safari): eigen prefix-kopie, plain wine via wrappers/wine-prefix
; 2026-10-11 nacht: standaardroute van de lader (zonder TP_POSTSTART_REMOTETHREAD_MS)

[Game]
Name = Let's Go Safari
Profile = LGS
Type = TeknoParrot
EmulationProfile = LGS
DongleRegion = USA
PcbRegion = USA

[Wine]
Prefix = ravengun-test-lgs

[Input]
Route = jvs
Layout = LGS
Board = LGS
ComPort = COM4
Note = speelbaar via TeknoParrotUi: UserProfiles/LGS.env heeft TP_REMOTETHREAD=off (standaardroute van de lader; met die route blijft het wachten op poort 40100 weg: er is geen verbinding naar 40100 te zien) en RG_WINEPREFIX; de knoppen zitten in UserProfiles/LGS.xml aan het virtuele toetsenbord: A/S/D/F = rood/blauw/geel/groen (starten en kiezen), Q/W/E/R = camera/wissers/claxon/vuurwerk, pijltje links/rechts = stuur (Use Keyboard/Button For Axis), toets 5 = munt. De game opent COM4 niet (de kern praat via de JVS-pipe met TeknoParrotUi): het JVS-bord van de daemon aan COM4 krijgt 0 pakketten en doet niets; de route staat nog op jvs omdat die ook werkt (gemeten) en de tests erop rekenen, route evdev werkt evenzo (gemeten)

[Status]
Status = playable
Note = Speelbaar: de game start tot de attract en het rijden (cursuskeuze en start met de knoppen). Rood, blauw, geel en groen zijn de toetsen A, S, D en F, het stuur de pijltjes links en rechts, munt toets 5. De stuurtoetsen veranderen het beeld (hoeveel stuurhoek is niet gemeten); het stuur uit de horizontale aim van de Move is er nog niet; het venster is niet schermvullend.
NoteEN = Playable: the game starts through to the attract and driving (course choice and start with the buttons). Red, blue, yellow and green are the keys A, S, D and F, the wheel is the left and right arrow keys, coin is key 5. The steering keys change the picture (how much steering is not measured); the wheel from the Move's horizontal aim is not there yet; the window is not fullscreen.
Findings = findings/LetsGoSafari.md

; Knoppen van deze game voor scripts/tp-add-game.py (vroeger vast in de code): de kern beantwoordt de JVS-pakketten via de pipe van
; TeknoParrotUi, die deze bindingen leest. Stuur: zet ook "Use Keyboard/Button For Axis" op 1 in het profiel.
[Bindings]
Button 1 (red) = kbd:A
Button 2 (blue) = kbd:S
Button 3 (yellow) = kbd:D
Button 4 (green) = kbd:F
Change View = kbd:Q
Window Wipers = kbd:W
Horn = kbd:E
Fireworks = kbd:R
Wheel Axis Left = kbd:Left
Wheel Axis Right = kbd:Right
