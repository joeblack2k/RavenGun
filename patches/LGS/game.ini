; Gegenereerd door scripts/migrate-game-settings.py (docs/per-game-patches.md). Sleutels die het script afleidt uit de oude bronnen worden bij
; elke run opnieuw gezet; handwerk in andere sleutels blijft staan.
;
; Uit het oude UserProfiles/LGS.env:
; jvs-route (docs/procedures.md, Let's Go Safari): eigen prefix-kopie, plain wine via wrappers/wine-prefix
; 2026-10-11 nacht: standaardroute van de lader (zonder TP_POSTSTART_REMOTETHREAD_MS)

[Game]
Name = Let's Go Safari
Profile = LGS
Type = TeknoParrot
EmulationProfile = LGS
DongleRegion = USA
PcbRegion = USA
Executable = GameSampR_RingWide.exe
ProfileRevision = 16

[Wine]
Prefix = ravengun-test-lgs
Runner = wrapper

[Launch]
; Zonder TeknoParrotUi: de daemon start de game zelf (rg-direct) en is het JVS-bord achter de pipe TeknoParrot_JVS.
Mode = direct

[Display]
; Beeldvullend via gamescope (zonder TeknoParrotUi opent de game een venster met titelbalk; Windowed = 0 alleen helpt niet).
Gamescope = true
GamescopePath = /usr/bin/gamescope

[Gamepad]
; Een gamepad (Xbox-controller, Steam Controller, ...) naast de lightgun. Toewijzen: de app, Controllers > Gamepads (een enkele pad
; wordt vanzelf speler 1). Elke regel: <knop of as van de pad> = <signaal>; de rest volgt de standaardindeling (docs/gamepad.md).
; Gemeten 2026-10-14: het stuur van Let's Go Safari komt alleen uit byte 12 van het gedeelde geheugen (indeling LGS, signaal wheel);
; zonder pad stuurt de horizontale aim van de lightgun.
LeftX = wheel
; De vier gekleurde knoppen van de kast (JVS-bord LGS): rood, blauw, geel, groen.
A = trigger
B = reload
X = grenade
Y = aux1
Start = start
Back = coin

[Input]
Route = jvs
Layout = LGS
Board = LGS
ComPort = COM4
; De game praat JVS over de pipe TeknoParrot_JVS, niet over COM4 (gemeten: COM4 kreeg 0 pakketten).
JvsTransport = pipe
Note = JVS over de pipe TeknoParrot_JVS (JvsTransport = pipe): de daemon is het LGS-bord, rg-direct koppelt de pipe aan de pty van de daemon. De game opent COM4 niet (gemeten: COM4 kreeg 0 pakketten). Knoppen: START = toets 1, rood/blauw/geel/groen = trekker/herladen/granaat/aux1 van de lightgun; munt = toets 5 (vrij spel staat aan). De plaats van stuur, camera, wissers, claxon en vuurwerk is nog niet gemeten.

[Status]
Status = working
Note = WERKT zonder TeknoParrotUi (2026-10-14): een dubbelklik in RavenGun start de game via rg-direct, JVS over de pipe naar het LGS-bord van de daemon, beeldvullend via gamescope (17:33, 5:49 min). Met een gamepad gemeten (18:35, 5:38 min): sturen met de linkerstick (contactvel bench-captures/LGS/seq_sheet.png), START met Start, de gekleurde knoppen A/B/X/Y = rood/blauw/geel/groen. Zonder pad stuurt de horizontale aim van de lightgun. Nog niet gemeten: camera, wissers, claxon, vuurwerk, en spelen met de echte Move.
NoteEN = WORKING without TeknoParrotUi (2026-10-14): a double-click in RavenGun starts the game through rg-direct, JVS over the pipe to the daemon's LGS board, full screen through gamescope (17:33, 5:49 min). Measured with a gamepad (18:35, 5:38 min): steering with the left stick (contact sheet bench-captures/LGS/seq_sheet.png), START with Start, the colored buttons A/B/X/Y = red/blue/yellow/green. Without a pad the lightgun's horizontal aim steers. Not measured yet: camera, wipers, horn, fireworks, and playing with the real Move.
Findings = findings/LetsGoSafari.md

; Knoppen van deze game voor scripts/tp-add-game.py (vroeger vast in de code): de kern beantwoordt de JVS-pakketten via de pipe van
; TeknoParrotUi, die deze bindingen leest. Stuur: zet ook "Use Keyboard/Button For Axis" op 1 in het profiel.
[Bindings]
Button 1 (red) = kbd:A
Button 2 (blue) = kbd:S
Button 3 (yellow) = kbd:D
Button 4 (green) = kbd:F
Change View = kbd:Q
Window Wipers = kbd:W
Horn = kbd:E
Fireworks = kbd:R
Wheel Axis Left = kbd:Left
Wheel Axis Right = kbd:Right

