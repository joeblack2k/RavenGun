[Status]
Status = untested
Note = PARKED, met grote voortgang sinds 2026-10-19 02:45: de beveiligingscontrole is om -- het spel gaat voorbij ERROR / SECURITY CHECK BAD en staat in zijn eigen scherm BOOTING . / I/O ... CHECKING. Dat deed onze eigen geheugen-motor (patches/RobinHood/dropin) met negen patches, waarvan twee nieuw: de motor patcht nu ook SYNCHROON in DllMain (anders was de controle al geweest) en de uitslag gaat naar 0 in plaats van 2. De NAS is ongemoeid (md5 gelijk). Nieuwe blokkade (bijgesteld 2026-10-19 05:35): het spel probeert COM1..COM4, opent het bord op COM4 en stuurt 7-byte kaders; de antwoorden daarvan voeden ook de beveiligingscontrole. De I/O-controle blijft staan omdat het antwoordkader nog niet klopt (geen SetupDi-pad: dat bleek een dood spoor); zie docs/research/wartran/README.md. Oude aantekening: op onze eigen kern stopt hij op zijn eigen beveiligingscontrole (ERROR / SECURITY CHECK BAD, in de exe op 0x4012a4). Onze eigen geheugen-motor is er nu bij (patches/RobinHood/dropin, ravengun-patchmem32.dll + patchmem.txt) en werkt -- de bytes staan in het proces, de NAS is ongemoeid (docs/research/wartran/README.md) -- maar de controle is nog niet om: de volgende stappen staan daar. Oude meting, met de gesloten kern -- WERKT (2026-10-17, gespeeld in muismodus, 5,5 min: START, Round 1, mikken en schieten, tickets lopen op (5 naar 9)). Start via dubbelklik (2026-10-17): met Windowed = 1 in gamescope de attract (PRESS START BUTTON, FREE PLAY); met 0 tekende hij niets (geen Present). Spelen nog niet gemeten.
NoteEN = MEASURED 2026-10-20 (headless gamescope, plain Wine + [Launch] Dxvk, no wrapper script): REACHES ATTRACT. The 3-minute-plus run shows the Robin Hood title with PRESS START BUTTON, FREE PLAY and SUPER BONUS 50 Tickets; the game stayed up 5 min 15 s without a crash and was then stopped by us. Two fixes were needed. (1) rg-rhio.dll answers the board poll 0x25 with a frame whose byte 0 is 0x25 (the game repeats a command until byte 0 of the reply equals the command byte; the old reply 0x94 never ended the loop). After that the game sends 0x29 and 0x94 once and polls 0x25 continuously. (2) With the board accepted the game runs a second dongle login (function at game.exe+0x91620, callers 0x480f80/0x481587) and showed ERROR / SECURITY CHECK BAD (flag 0x1a6be80 = 2 read from /proc/<pid>/mem while the first nine patches were in memory); patchmem.txt got a tenth line 'game.exe|0x91620|518d04|33c0c3' (return 0 at once), after which the flag reads 0 and the title appears. NOT measured: coin/Start, trigger, aim, reload (input route tp-shm, no board-reply mapping of buttons yet; the board reply codes 0x40-0x44, 0x50/0x51, 0x80-0x84 are the candidates). Earlier notes follow. MEASURED 2026-10-20 (headless gamescope, plain Wine + [Launch] Dxvk, no wrapper script): rg-rhio.dll now answers the poll command 0x25 with a frame whose byte 0 is 0x25 (BouwAntwoord). Reading of the game's reply loop (helper 0x4902c0, caller 0x49075e..0x49094c): the game sends a command again until byte 0 of the reply EQUALS the command byte; the earlier reply 0x94 is only a 'status code' and could never end the loop, which is why it polled 0x25 forever. Result of the change: after the polls the game now sends two commands it never sent before (0x29 and 0x94, once each) and then polls 0x25 continuously (537 frame pairs in 45 s, game stays up, DXVK Direct3D 9 device created, windowed 1280x720). NOT measured: any picture. Headless gamescope gives no screenshot for a Wine/DXVK game (DXVK logs ResetSwapChain and never creates its presenter), so BOOTING / attract is unconfirmed; the Status stays parked. Earlier notes: PARKED, with major progress since 2026-10-19 02:45: the security check is beaten -- the game passes ERROR / SECURITY CHECK BAD and reaches its own BOOTING . / I/O ... CHECKING screen. Our own memory engine (patches/RobinHood/dropin) did that with nine patches, two of them new: the engine now patches SYNCHRONOUSLY in DllMain (otherwise the check had already run) and the result goes to 0 instead of 2. The NAS is untouched (same md5). New blocker (revised 2026-10-19 05:35): the game tries COM1..COM4, opens the board on COM4 and sends 7-byte frames; those replies also feed the security check. The I/O check still stalls because the reply frame is not right yet (not a SetupDi path: that was a dead end); see docs/research/wartran/README.md. Older note: on our own core it stops at its own security check (ERROR / SECURITY CHECK BAD, in the exe at 0x4012a4). Our own memory engine is now in place (patches/RobinHood/dropin, ravengun-patchmem32.dll + patchmem.txt) and it works -- the bytes are in the process, the NAS is untouched (docs/research/wartran/README.md) -- but the check is not beaten yet; the next steps are listed there. Older measurement, with the closed core -- WORKING (2026-10-17, played in mouse mode for 5.5 min: start, round 1, aiming and shooting, tickets go up). Starts by double-click (2026-10-17): with Windowed = 1 under gamescope the attract shows (press start, free play). Play not measured.


