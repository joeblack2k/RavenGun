[Game]
Name = Robin Hood
Profile = RobinHood
Executable = game.exe
Type = TeknoParrot
EmulationProfile = WartranTroopers
ProfileRevision = 10
Patreon = true

[Launch]
Mode = direct

[Loader]
; Zonder TeknoParrot (2026-10-18): onze eigen OpenParrot-lader en -kern.
Core = ravengun

[Wine]
; Direct3D 9 via DXVK; het spel vraagt exclusief schermvullend (diagnose 2026-10-14)
Prefix = ravengun-test-dxvk
DllOverrides = d3d9=n,b
Runner = wrapper

[Display]
Gamescope = true
GamescopePath = /usr/bin/gamescope

[Input]
Route = tp-shm
Layout = WartranTroopers
Note = voorbereid, niet gestart: tp-shm, indeling WartranTroopers

; Bediening voor de knoppen-uitleg bij de eerste start (docs/per-game-patches.md, "Bediening per game"); labels uit het
; TeknoParrot-profiel (GameProfiles/<P>.xml), "Not confirmed yet" = de werking is nog niet gemeten.
[Controls]
trigger = Shoot | Fires the bow.
reload = Advance | Advance switch. Used by the game; exact function not confirmed yet.
grenade = Spare | Spare switch. Used by the game; exact function not confirmed yet.
aux1 = Select | Select switch. Used by the game; exact function not confirmed yet.
aux2 = Other | Other switch. Used by the game; exact function not confirmed yet.

[Status]
Status = working
Note = WERKT (2026-10-17, gespeeld in muismodus, 5,5 min: START, Round 1, mikken en schieten, tickets lopen op (5 naar 9)). Start via dubbelklik (2026-10-17): met Windowed = 1 in gamescope de attract (PRESS START BUTTON, FREE PLAY); met 0 tekende hij niets (geen Present). Spelen nog niet gemeten.
NoteEN = WORKING (2026-10-17, played in mouse mode for 5.5 min: start, round 1, aiming and shooting, tickets go up). Starts by double-click (2026-10-17): with Windowed = 1 under gamescope the attract shows (press start, free play). Play not measured.


