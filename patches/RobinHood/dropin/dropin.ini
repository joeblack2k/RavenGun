; Drop-in van RavenGun voor Robin Hood (Wartran, 32-bits Windows onder Wine).
;
; ravengun-patchmem32.dll  onze eigen geheugen-motor (memory/src; docs/memory-engine.md): hij leest
;                          patchmem.txt en schrijft die bytes in het LOPENDE proces. Het bestand op
;                          de NAS blijft dus ongemoeid -- dit is procesgeheugen en verder niets.
; patchmem.txt             de lijst met patches (module|offset|verwacht|nieuw).
;
; WAAROM
; ------
; game.exe heeft de Aladdin-HASP-bibliotheek statisch in de exe. De controle (0x4913c0) opent de
; dongle (0x55cffd), leest 0x20 bytes (0x55db52), controleert die met een CRC (0x491402-0x491496) en
; leest daarna nog 0x20 bytes naar 0xde7098, die met "GWRH" vergeleken worden. Zonder dongle lukt
; geen van beide leesacties en zet de foutafhandeling de vlag 0x1a6be80 (staart op 0x491522), waarop
; het spel ERROR / SECURITY CHECK BAD toont. De dongle-antwoorden hebben we niet; patchmem.txt laat
; de controle daarom met lege buffers slagen (negen regels, met de RVA's erbij).
;
; HOE JE CONTROLEERT DAT HIJ GELADEN IS
; -------------------------------------
;   1. rg-direct --plan RobinHood: bij dropin_lines staat ravengun-patchmem32.dll met TP_PRELOAD_DLL
;      en patchmem.txt als bestand in de view;
;   2. in het logboek van de run staat met RAVENGUN_PATCHMEM_VERBOSE=1 per patch een regel met
;      module, offset en voor/na, plus de lijst van geladen modules.

[ravengun-patchmem32.dll]
To = .
Preload = true
Env = RAVENGUN_PATCHMEM_FILE=patchmem.txt;RAVENGUN_PATCHMEM_VERBOSE=1

[patchmem.txt]
To = .

; setupapi.dll  de nagebootste I/O-bordkant (tools/rg-rhio): de exe laadt de SetupDi-functies met
;               LoadLibraryA + GetProcAddress, dus een eigen setupapi.dll naast de exe met
;               WINEDLLOVERRIDES=setupapi=n is genoeg. Hij logt elke opzoeking, het apparaatpad en
;               elke DeviceIoControl in rg-rhio.log (naast de exe).
