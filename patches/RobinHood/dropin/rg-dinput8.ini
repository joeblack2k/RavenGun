;
; rg-dinput8.ini for Robin Hood (data/game.exe, sha256 269ada3e...). Format: tools/rg-dinput8/rg_dinput8_kern.h.
; The game imports DINPUT.dll!DirectInputCreateA (0x55CAA0, version 0x0500), enumerates DIDEVTYPE_JOYSTICK, sets c_dfDIJoystick
; (DIJOYSTATE, 0x50 bytes), DIPROP_RANGE -1000..1000 (0x48F66F) and reads Poll + GetDeviceState every frame (0x48F6DE); lX is
; copied to 0xDE6D20, button 0 is tested at 0xDE6D50 (config keys 'jtrigb' / 'jstart', default button 0). Board bit layout:
; packaging/tp-shm-profiles.json (WartranTroopers): bit 7 = player 1 trigger, 8 = reload, 9 = grenade; aim bytes 12 / 13.
; Coin, start, test and service are board events (tools/rg-rhio), not joystick input.
spelers = 1
p1.x = 12
p1.y = 13
p1.knop0 = 7
p1.knop1 = 8
p1.knop2 = 9
