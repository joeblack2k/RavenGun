; Zonder TeknoParrot leest niemand de sleutels hieronder (de kern schreef ze in teknoparrot.ini). Venstermodus staat nu vast in
; dropin/rg-dinput8.ini (patch 0x40A03F); Use Relative Input, de gevoeligheid, UseLocaleEmulator en InstantReload hebben op deze route
; geen werking (zie docs/research/wartran/README.md, "Bug Busters", wat niet bewezen is).
[Config]
General/Input API = RawInput
; Windowed = 1 met gamescope (sectie Display): schermvullend zonder taakbalk. Gamescope met Windowed = 0 gaf zwart beeld;
; zonder gamescope een venster met de taakbalk zichtbaar (gemeten 2026-10-16).
General/Windowed = 1
General/Use Relative Input = 0
General/Player 1 Relative Sensitivity = 8
General/Player 2 Relative Sensitivity = 8
General/UseLocaleEmulator = 1
General/InstantReload = 1

[ConfigType]
General/Input API = Dropdown
General/Windowed = Bool
General/Use Relative Input = Bool
General/Player 1 Relative Sensitivity = Slider
General/Player 2 Relative Sensitivity = Slider
General/UseLocaleEmulator = Bool
General/InstantReload = Bool

[ConfigOptions]
General/Input API = DirectInput|XInput|RawInput
