; Voorbereid in pass 1 (docs/goal-90-native.md): profiel uit het TeknoParrot-sjabloon, herkenning gemeten aan de NAS-map "Bug Busters"
; (alleen gelezen), invoerroute gekozen naar het EmulationProfile. Niet gestart.

[Game]
Name = Bug Busters
Profile = BugBusters
Executable = BBPC.exe
Type = TeknoParrot
EmulationProfile = WartranTroopers
ProfileRevision = 3

[Launch]
; De game schrijft hier zelf in (review 10, A6): in de view een echte map met een kopie
; van de NAS-inhoud, nooit een koppeling naar de NAS.
ViewWritable = config
; Films (video/*.m, MPEG-1 via DirectShow) via de 32-bits GStreamer uit Proton (docs/gst32.md); zonder viel het spel na MODE SELECT.
Gst32 = true
Mode = direct
; De game schrijft zijn instellingen en records zelf (fopen "wb": config\buster.cfg, config\score.cfg, config\color.cfg; gelezen in
; BBPC.exe 0x411b2e, 0x411c7f, 0x411d4f). config/ wordt een echte map in de view en de drie bestanden lokale kopieën: nooit naar de NAS.
ViewRealDirs = config
ViewCopies = config/BUSTER.CFG, config/score.cfg, config/COLOR.CFG

[Loader]
; Zonder TeknoParrot (klaargezet 2026-10-17, docs/research/wartran/README.md "Bug Busters"): geen lader en geen kern, Wine start
; BBPC.exe zelf in de map van de view. Wat de gesloten kern deed, doet nu onze eigen dinput8.dll (rg-dinput8, tools/rg-dinput8/,
; dropin/): de geweren als DirectInput-joysticks (X/Y absoluut, knop 0 = sproeien, knop 1 = herladen), munt/start/test op de plaatsen
; waar het I/O-bord van de kast ze zette, en twee bytes in het geheugen van de exe (venstermodus zoals Windowed = 1, en de controle op
; een cd-rom met label BBPC overslaan, zoals BBPC_standalone.exe). dropin/control.cfg kiest de twee geweren voor speler 1 en 2.
; [Status] hieronder is die van de route met de kern van TeknoParrot.
Core = none

[Display]
Gamescope = true

[Input]
Route = tp-shm
Layout = WartranTroopers
Note = zonder TeknoParrot leest onze dinput8.dll (rg-dinput8, dropin/rg-dinput8.ini) het bordbeeld: richten en sproeien/herladen per speler, munt 1/2, start 1/2, test en service (in het testmenu: kiezen)

; Bediening voor de knoppen-uitleg bij de eerste start (docs/per-game-patches.md, "Bediening per game"); labels uit het
; TeknoParrot-profiel (GameProfiles/<P>.xml), "Not confirmed yet" = de werking is nog niet gemeten.
[Controls]
trigger = Spray | Fires the insect spray. Not confirmed yet.
reload = Reload | Reloads the spray.

[Status]
Status = working
Note = WERKT (2026-10-15): dubbelklik in RavenGun, rg-direct met de 32-bits GStreamer uit Proton ([Launch] Gst32, docs/gst32.md) voor de MPEG-1-films; zonder viel het spel na MODE SELECT. 5,5 min gespeeld in muismodus. Draait in een venster (taakbalk zichtbaar).
NoteEN = WORKING (2026-10-15): double-click in RavenGun, rg-direct with the 32-bit GStreamer from Proton ([Launch] Gst32, docs/gst32.md) for the MPEG-1 videos; without it the game died after MODE SELECT. Played 5.5 min in mouse mode. Runs in a window (taskbar visible).


