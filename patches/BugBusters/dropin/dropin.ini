;
; dropin.ini - wat er in de view van Bug Busters komt (docs/dropins.md). Zonder TeknoParrot: [Loader] Core = none in game.ini.
;
; dinput8.dll is rg-dinput8 (tools/rg-dinput8/, gebouwd met tools/rg-dinput8/build.sh --out <deze map>): BBPC.exe importeert
; DINPUT8.dll!DirectInput8Create en laadt met DllOverride = native deze DLL uit zijn eigen map. Zij levert de geweren als
; DirectInput-joysticks, zet munt/start/test in het geheugen van de game en past twee bytes van de exe aan (rg-dinput8.ini).
; RG_DINPUT8_LOG schrijft het logboek naast de DLL (rg-dinput8.log in de view, een lokale map, nooit de NAS): het bewijs dat ONZE
; DLL laadt, met de tabel, de patches en elke munt/start.
[dinput8.dll]
To = .
DllOverride = native
Env = RG_DINPUT8_LOG=rg-dinput8.log

; De tabel: welke byte/bit van het bordbeeld welke as/knop is, welke vlaggen en tellers, welke patches.
[rg-dinput8.ini]
To = .

; control.cfg: de game zoekt hem in zijn werkmap (BBPC.exe 0x411696, fopen "rb"); staat niet op de NAS, dan kiest de game muis voor
; speler 1 en toetsenbord voor speler 2. Deze 40 bytes kiezen per speler "joystick" (modus 2) met de GUID van geweer 1 en 2 van
; rg-dinput8 (rgd_guid; tests/dinput8_test.sh controleert de bytes).
[control.cfg]
To = .
