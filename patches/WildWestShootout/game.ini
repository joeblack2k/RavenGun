; Voorbereid in pass 1 (docs/goal-90-native.md): profiel uit het TeknoParrot-sjabloon, herkenning gemeten aan de NAS-map "Wild West Shootout"
; (alleen gelezen), invoerroute gekozen naar het EmulationProfile. Niet gestart.

[Game]
Name = Wild West Shootout
Profile = WildWestShootout
Executable = CowBoy.exe
Type = TeknoParrot
EmulationProfile = WartranTroopers
ProfileRevision = 2

[Launch]
Mode = direct
; Unity 5.6 (D3D11) via DXVK, Vulkan (docs/dxvk.md); zonder DXVK en zonder BepInEx bleef het venster weg (bench 2026-10-15).
Dxvk = true
; Zonder TeknoParrot (2026-10-17): BepInEx 5.4.21.0 (x86, scripts/fetch-bepinex.sh) naast CowBoy.exe, voor onze eigen plugin
; RavenGun.WildWestShootout (plugins/bepinex/WildWestShootout/, dropin/). Op de kast komt het richtpunt van een camera (MVSDK) en
; komen trekker, munt en testmenu over een serieel bord (BaseCom); de gesloten kern bootste dat bord na en beantwoordde de
; TeknoParrot-plugin WWSTPPlugin (richtpunt via ReadFile/WriteFile op een nep-handvat). Onze plugin levert richtpunt, trekker
; (BaseGun.OnShoot), munt, herladen, start en testmenu zelf uit het bordbeeld, zet camera, bord, bordcontrole, dongle (SuperDog)
; en de witte flits bij elk schot uit, gaat bij het opstarten meteen naar de attract, en zet WWSTPPlugin uit.
BepInEx = 5.4.21.0

[Loader]
; Geen lader en geen kern: Wine start CowBoy.exe zelf. NOG NIET OP DE TV GEMETEN op deze route; [Status] hieronder is die van de
; route met de kern van TeknoParrot.
Core = none

[Wine]
; winhttp=n,b: de doorstop van BepInEx (de drop-in van [Launch] BepInEx zet hem ook).
DllOverrides = winhttp=n,b

[Input]
Route = tp-shm
Layout = WartranTroopers
Note = tp-shm, indeling WartranTroopers; zonder TeknoParrot leest onze plugin RavenGun.WildWestShootout het bordbeeld in de game (richtpunt en trekker speler 1/2, herladen, munt 1/2, start = bevestigen, test = testmenu; daarin service = kiezen, menu omhoog/omlaag = bladeren). Met de kern gemeten 2026-10-15 in muismodus: munt, START en schieten

; Bediening voor de knoppen-uitleg bij de eerste start (docs/per-game-patches.md, "Bediening per game"); labels uit het
; TeknoParrot-profiel (GameProfiles/<P>.xml), "Not confirmed yet" = de werking is nog niet gemeten.
[Controls]
trigger = Shoot | Fires the gun.
reload = Reload | Reloads your gun.

[Status]
Status = working
Note = WERKT (2026-10-15): rg-direct met DXVK (Vulkan) en winhttp=n,b voor BepInEx (plug-in WWS 1.4, de invoer). 5,5 min gespeeld in muismodus: munt (5), START (1), schieten, eindbaas.
NoteEN = WORKING (2026-10-15): rg-direct with DXVK (Vulkan) and winhttp=n,b for BepInEx (plugin WWS 1.4, the input). Played 5.5 min in mouse mode: coin (5), START (1), shooting, boss.


