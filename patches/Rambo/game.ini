; Bediening voor de knoppen-uitleg bij de eerste start (docs/per-game-patches.md, "Bediening per game"); labels uit het
; TeknoParrot-profiel (GameProfiles/<P>.xml), "Not confirmed yet" = de werking is nog niet gemeten.
[Controls]
trigger = Shoot | Fires the gun.
reload = Reload | Reloads your gun. Aiming off the screen reloads too.
offscreen = Reload off-screen | Point the gun away from the screen and pull the trigger to reload.
grenade = Rage | Rage button. Used by the game; exact function not confirmed yet.

[Status]
Status = working
Note = WERKT op de Lindbergh-route (2026-10-15): dubbelklik in RavenGun, ramboM.elf met lindbergh.so van lindbergh-loader (geen TeknoParrot), JVS via het bord van de daemon, OpenGL via zink. Gespeeld 5,5 min in muismodus: munt (5), START (1), schieten, herladen door naast het scherm te richten. Richten (gemeten 2026-10-22 met de eigen CONTROLLER ADJUSTMENT > CHECK van de game): de standaardkalibratie in de EEPROM (per speler anders) liep tot 118 px (9,2% van de breedte) uit de pas; na de eigen CONTROLLER ADJUSTMENT van de game zit elk punt van beide spelers binnen 5 px in x en 3 px in y. De kalibratie staat in eeprom.bin (patches/Rambo/seed/eeprom.bin als zaad voor een schrijflaag zonder eeprom.bin); opnieuw kalibreren staat in docs/lindbergh.md.
NoteEN = WORKING on the Lindbergh route (2026-10-15): double-click in RavenGun, ramboM.elf with lindbergh-loader's lindbergh.so (no TeknoParrot), JVS through the daemon's board, OpenGL via zink. Played 5.5 min in mouse mode: coin (5), START (1), shooting, reloading by aiming off-screen. Aim (test-pattern, 1280x768), measured 2026-10-22 headless through the daemon with CONTROLLER ADJUSTMENT > CHECK in the game's own test menu. The test menu is ramboM.elf itself started with the argument -t (there is no separate test program and TEST in the running game just exits it): a temporary user-layer patches/Rambo/native.json with "args": ["-t"]; SERVICE = key F3 steps the main menu, TEST = key 0 selects; in CONTROLLER ADJUSTMENT the START keys (key 1 for P1, key 2 for P2) step each player's cursor and the trigger selects; CHECK draws a thin white cross per player where the game thinks the gun points (it clips at the screen edge, so the outermost corner points read short; the cross glyph sits about -3,-2 px from the pixel it marks). The owner's write layer held the game's default calibration (byte-identical to a fresh eeprom.bin: P1 TOP 24, LEFT 14, CENTER 7c/88, RIGHT e6, BOTTOM ed; P2 TOP 1f, LEFT 1e, CENTER 86/82, RIGHT ee, BOTTOM e6): the aim was off by -118..+97 px in x (up to 9.2% of the width) and -71..+33 px in y (9.2% of the height), differently per player: P1 0.55,0.55 +30,-24 px; 0.3,0.3 -25,-57 px; 0.85,0.8 +86,+9 px; 0.1,0.9 -69,+22 px; P2 0.3,0.7 -80,+19 px; 0.15,0.2 -118,-53 px; 0.3,0.3 -80,-36 px; 0.9,0.5 +52,-7 px. After the game's own adjustment for both players (marks at 640,32 / 30,384 / centre / 1250,384 / 640,736, fired with output-button trigger; both players now hold TOP 0a, LEFT 06, CENTER 80/80, RIGHT f9, BOTTOM f5) all 13 points of both players are within 5 px in x and 3 px in y (0.4% of the width, 0.4% of the height), no point clipped. TEST leaves the menu and stores it. The calibration is in eeprom.bin at 0x1000 (second copy at 0x1080); the owner's write layer got only that area changed (0x1000-0x10b3; the game's own settings block at 0x300 and 0x320 stayed the owner's), and patches/Rambo/seed/eeprom.bin (the loader's fresh default with only that area replaced, no key or dongle data) carries it into a fresh write layer (native.json 'seed'; an existing eeprom.bin is never overwritten). In the running game the picture is normal (intro movie, stage); the stage showed no visible gun cursor, so shot placement was verified through the test menu only.

