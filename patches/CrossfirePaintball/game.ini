[Game]
Name = Crossfire: Maximum Paintball
Profile = CrossfirePaintball
Executable = med_pball
Type = ElfLdr2
EmulationProfile = RawThrillsGUN
ProfileRevision = 3
Patreon = true

[Input]
Route = evdev
Note = nog geen eigen route: de game leest zijn IO met poortinstructies (iopl/inb, /dev/p37c) en de geweren via /dev/mjg (een kerneldriver voor lichtpulsen).

[Status]
Status = untested
Note = Nooit gestart. Statisch onderzocht (2026-10-14): i386, ongepakt, klein (med_pball 161 kB). IO via I/O-poorten (iopl, inb/outb; "/dev/p37c must exist or user must be root") en de geweren via de kerneldriver /dev/mjg; geen van beide bestaat natively. Nodig: een shim die iopl laat slagen en de poortinstructies (SIGSEGV) nadoet, en een nep-/dev/mjg. Zelfde motor als Police Trainer 2.
NoteEN = Never started. Statically examined (2026-10-14): i386, unpacked, small (med_pball 161 kB). I/O through I/O ports (iopl, inb/outb; "/dev/p37c must exist or user must be root") and the guns through the kernel driver /dev/mjg; neither exists natively. Needed: a shim that lets iopl succeed and emulates the port instructions (SIGSEGV), and a fake /dev/mjg. Same engine as Police Trainer 2.

; Profiel uit TeknoParrot-sjabloon GameProfiles/CrossfirePaintball.xml, revisie 3 (scripts/import-tp-profiles.py; opnieuw importeren in plaats van met de hand wijzigen)
