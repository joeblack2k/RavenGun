[Game]
Name = Rainbow Bombergirl
Profile = RainbowBombergirl
Type = TeknoParrot
EmulationProfile = WartranTroopers

[Launch]
Mode = direct

[Wine]
Prefix = ravengun-test-rainbowbombergirl
DllOverrides = winhttp=n,b;d3d11,d3d10core,dxgi=b
GStreamerPlugins = ~/.local/share/ravengun/tools/gst-extra/plugins

[Display]
CustomResolution = 1920x1080

[Input]
Route = tp-shm
Layout = WartranTroopers
Note = geparkeerd (vijftiende ronde): de game start direct (BepInEx-plugin BBGTPPlugin laadt, winhttp=n,b) tot de attract met twee schermen (staand hoofdscherm rechts, aanraakscherm links onder), het I/O-testmenu toont alle knoppen (links = trekker, midden = herladen, rechts = granaat, EXT = aux1, test, service, munt via toets 5), maar na munt en start blijft het bij SYSTEM ENTRY / de PASELI-melding hangen en komt de game niet bij de personagekeuze; UserProfiles/RainbowBombergirl.env: TP_REMOTETHREAD=off, RG_WINEPREFIX (eigen prefix met Wine-virtueel bureaublad 1920x1080), GST_PLUGIN_PATH (gst-libav voor de asf-films), zie findings/RainbowBombergirl.md

[Status]
Status = parked
Note = Start niet verder dan het begin van de game: de game start tot de attract (twee schermen: staand hoofdscherm rechts, aanraakscherm links onder), het testmenu (TEST toets 0, service F3) en de invoercontrole tonen alle knoppen, maar na munt (toets 5) en start blijft hij bij SYSTEM ENTRY / de PASELI-melding hangen. Geparkeerd.
NoteEN = Does not get past the start of the game: it starts through to the attract (two screens: portrait main screen on the right, touch screen bottom left), and the test menu (TEST key 0, service F3) and input check show every button, but after coin (key 5) and start it stays at SYSTEM ENTRY / the PASELI notice. Parked.
