Note = GEPARKEERD 2026-10-19 (punt G): er valt niets te starten, want de game staat niet op deze machine. Opnieuw gezocht op 2026-10-19: in de NAS-boom (spidernas_emulation, ook een niveau dieper), in de hele thuismap en op de aangesloten media staat geen map of bestand met "mahjong" of "cosplay" -- alleen de profielen in patches/. De motor zegt hetzelfde: "game niet gevonden: '' (voeg de map met de game toe als gamemap in de app)". Drie wegen geprobeerd: (1) de NAS doorzoeken, (2) de hele machine en de media doorzoeken, (3) de gamemap van de app toevoegen -- maar er is geen map om toe te voegen. LET OP (review 16): dit profiel is NIET klaar om te proberen. Het mist [Launch] Mode = direct, [Loader] Core = ravengun en een [Identify]-blok (Folder/Path/Size), dus zonder die drie zou een start terugvallen op de TeknoParrot-lader. Die drie zijn niet toe te voegen zolang de bestanden er niet zijn: [Identify] moet de map, het bestand en de grootte noemen, en die zijn er niet. Zodra de bestanden er zijn is het profiel een begin: het is een Taito Type X-game met EmulationProfile = TaitoTypeXGeneric, Japanse landinstelling (LANG/LC_ALL = ja_JP.UTF-8) en RequireWindowed voor gamescope.
NoteEN = PARKED 2026-10-19 (item G): there is nothing to start because the game is not on this machine. Searched again on 2026-10-19: in the NAS tree (spidernas_emulation, one level deeper as well), across the whole home directory and on the mounted media there is no folder or file named "mahjong" or "cosplay" -- only the profiles under patches/. The engine says the same: "game niet gevonden" (add the folder with the game as a game map in the app. Three approaches tried: (1) search the NAS, (2) search the whole machine and the media, (3) add the app's game map -- but there is no folder to add. NOTE (review 16): this profile is NOT ready to try. It lacks [Launch] Mode = direct, [Loader] Core = ravengun and an [Identify] block (Folder/Path/Size), so without those three a start would fall back to the TeknoParrot loader. Those three cannot be added while the files are missing: [Identify] has to name the folder, the file and the size, and they are not there. Once the files are there this profile is a starting point: it is a Taito Type X game with EmulationProfile = TaitoTypeXGeneric, Japanese locale (LANG/LC_ALL = ja_JP.UTF-8) and RequireWindowed for gamescope.

