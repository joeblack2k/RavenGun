; Gegenereerd door scripts/migrate-game-settings.py (docs/per-game-patches.md). Sleutels die het script afleidt uit de oude bronnen worden bij
; elke run opnieuw gezet; handwerk in andere sleutels blijft staan.

[Game]
Name = Transformers: Shadows Rising
Profile = TransformersShadowsRising
Type = TeknoParrot
EmulationProfile = TransformersShadowsRising
Executable = shell.exe;Transformers2.exe
ProfileRevision = 10

[Launch]
Mode = direct
; Pass 2, R1 (2026-10-19): dezelfde Sega-shell als SegaGameShell, met dezelfde schrijfplekken. In de view
; waren ShellData, temp en shell/variables map-koppelingen naar de NAS en de logbestanden in shell/
; bestands-koppelingen; de schrijflaag van bwrap liet 105 whiteouts en 52 bestanden in Sega/shell en 8
; bestanden in Sega/shell/variables zien. Wine verwijdert en hernoemt DOOR een bestands-koppeling heen
; (wineserver werkt met het echte pad), dus alleen die schrijflaag hield de NAS heel. Nu: de drie mappen
; zijn schrijfmappen (bij de start een echte map met een kopie; op de NAS samen ~2,6 KB), en in shell/
; worden alle bestands-koppelingen lokale kopieën (ViewLocalFiles; ~28 MB, binnen de grens van 256 MiB).
; Graphics en Sounds blijven koppelingen (alleen lezen), Shell.exe ook (de exe van het plan).
ViewWritable = ShellData, temp, shell/variables
ViewLocalFiles = shell

[Loader]
; Onze eigen lader en kern (OpenParrot): zonder TeknoParrot gemeten 2026-10-17, TeknoParrot-map weg, 5+ min attract, geen
; TeknoParrot-bestand in het geheugen van Shell.exe of Transformers2.exe.
Build = ravengun
Core = ravengun
RemoteThread =
PostStartMs = 3000

[Wine]
Prefix = ravengun-test-tsr
Runner = wrapper

[Input]
Route = hid-board
Layout = TransformersShadowsRising
; Twee borden: het geweerbord (uinput, DirectInput) en het IO-bord van de kast dat Shell.exe zoekt (uhid, VERIFICATIERUN.md).
; Board blijft staan: de startcontrole vraagt hem; de daemon gebruikt Boards als die er is.
Board = SaeGunBoard
Boards = SaeGunBoard, SaeIoBoard
Note = Transformers2.exe leest zijn gun via DirectInput (GUID_Joystick); de daemon maakt dat bord na (hid-boards.json). Alternatief: --route tp-shm (werkt niet: de kern zit niet in het gameproces).

; Bediening voor de knoppen-uitleg bij de eerste start (docs/per-game-patches.md, "Bediening per game"); labels uit het
; TeknoParrot-profiel (GameProfiles/<P>.xml), "Not confirmed yet" = de werking is nog niet gemeten.
[Controls]
trigger = Shoot | Fires the gun.
reload = Hyperenergy attack | Pushes the lever forward: a Hyperenergy attack.
grenade = Hyperenergy defense | Pulls the lever back: defends.

[Status]
Status = working
Note = WERKT via dubbelklik in de app (2026-10-15): laden ~2 min, daarna 6,5 min gespeeld met de muismodus: munt, START, richten en schieten, continue, eindbaas, score 29402. De bevriezing van 2026-10-14 (~1 min na START) kwam in twee runs niet terug. Open: de hendel ('PUSH THE LEVER') is niet nagedaan; het spel gaat zonder door. Correctie 2026-10-19 (pass 2): de shell schrijft in ShellData, temp en shell/variables en verwijdert oude logbestanden in shell/. Die waren in de view koppelingen naar de NAS, en Wine verwijdert en hernoemt door een bestands-koppeling heen; alleen de schrijflaag van bwrap hield de NAS heel. Sindsdien zijn ShellData, temp en shell/variables schrijfmappen (ViewWritable) en worden de bestands-koppelingen in shell/ bij de start lokale kopieën (ViewLocalFiles). Na die wijziging is het spel nog niet opnieuw gespeeld.
NoteEN = WORKING via double-click in the app (2026-10-15): ~2 min loading, then played 6.5 min in mouse mode: coin, START, aim and shoot, continue, boss, score 29402. The freeze of 2026-10-14 (~1 min after START) did not return in two runs. Open: the lever ('PUSH THE LEVER') is not emulated; the game carries on without it. Correction 2026-10-19 (pass 2): the shell writes in ShellData, temp and shell/variables and deletes old log files in shell/. Those were links to the NAS in the view, and Wine deletes and renames through a file link; only the bwrap writelayer kept the NAS intact. Since then ShellData, temp and shell/variables are writable directories (ViewWritable) and the file links in shell/ become local copies at start (ViewLocalFiles). The game has not been played again since that change.
Findings = findings/TransformersShadowsRising.md

