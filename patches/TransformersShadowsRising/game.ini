; elke run opnieuw gezet; handwerk in andere sleutels blijft staan.

[Game]
Name = Transformers: Shadows Rising
Profile = TransformersShadowsRising
Type = TeknoParrot
EmulationProfile = TransformersShadowsRising
Executable = shell.exe;Transformers2.exe
ProfileRevision = 10

[Launch]
Mode = direct

[Loader]
RemoteThread =
PostStartMs = 3000

[Wine]
Prefix = ravengun-test-tsr
Runner = wrapper

[Input]
Route = hid-board
Layout = TransformersShadowsRising
Board = SaeGunBoard
Note = Transformers2.exe leest zijn gun via DirectInput (GUID_Joystick); de daemon maakt dat bord na (hid-boards.json). Alternatief: --route tp-shm (werkt niet: de kern zit niet in het gameproces).

[Status]
Status = playable
Note = Speelbaar met de Move: de daemon speelt het gun-bord van de game na (route hid-board). Start (toets 1 of Move-start), trekker en richten werken; de eerste keer laden duurt ongeveer 3,5 minuut ("SYSTEM INITIALIZING"). Geen munt nodig (free play). Het gun-kalibratiescherm, het testmenu en de hendels (aanval/verdediging) zijn nog niet uitgeprobeerd. Daemon niet herstarten terwijl de game draait.
NoteEN = Playable with the Move: the engine acts as the gun board of the game (hid-board route). Start (key 1 or Move Start), trigger and aiming work; the first load takes about 3.5 minutes ("SYSTEM INITIALIZING"). No coin needed (free play). The gun calibration screen, the test menu and the levers (attack/defend) have not been tried yet. Do not restart the engine while the game runs.

; Profiel uit TeknoParrot-sjabloon GameProfiles/TransformersShadowsRising.xml, revisie 10 (scripts/import-tp-profiles.py; opnieuw importeren in plaats van met de hand wijzigen)
