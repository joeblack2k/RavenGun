; Gegenereerd door scripts/migrate-game-settings.py (docs/per-game-patches.md). Sleutels die het script afleidt uit de oude bronnen worden bij
; elke run opnieuw gezet; handwerk in andere sleutels blijft staan.

[Game]
Name = Transformers: Shadows Rising
Profile = TransformersShadowsRising
Type = TeknoParrot
EmulationProfile = TransformersShadowsRising
Executable = shell.exe;Transformers2.exe
ProfileRevision = 10

[Launch]
Mode = direct

[Loader]
RemoteThread =
PostStartMs = 3000

[Wine]
Prefix = ravengun-test-tsr
Runner = wrapper

[Input]
Route = hid-board
Layout = TransformersShadowsRising
; Twee borden: het geweerbord (uinput, DirectInput) en het IO-bord van de kast dat Shell.exe zoekt (uhid, VERIFICATIERUN.md).
; Board blijft staan: de startcontrole vraagt hem; de daemon gebruikt Boards als die er is.
Board = SaeGunBoard
Boards = SaeGunBoard, SaeIoBoard
Note = Transformers2.exe leest zijn gun via DirectInput (GUID_Joystick); de daemon maakt dat bord na (hid-boards.json). Alternatief: --route tp-shm (werkt niet: de kern zit niet in het gameproces).

[Status]
Status = playable
Note = Speelbaar met de Move: de daemon speelt het gun-bord van de game na (route hid-board). Vizier nagemeten op de tv (2026-10-11): binnen 1,5% van het scherm op alle rasterpunten (assen verwisseld, bereik -217..557 in hid-boards.json). Start (Move-start), trekker en richten werken; laden duurt ongeveer 4 minuten.
NoteEN = Playable with the Move: the engine acts as the gun board of the game (hid-board route). Crosshair checked on the TV (2026-10-11): within 1.5% of the screen at every grid point. Start (Move Start), trigger and aiming work; loading takes about 4 minutes.
Findings = findings/TransformersShadowsRising.md

