[Status]
Status = parked
Note = 2026-10-16: JVS werkt (bord TaitoEADP), logo TEAM FRONTLINE, dan crash na ~30 s. Oorzaak gemeten: NxCreatePhysicsSDK(2.8.0) uit de PhysXLoader.dll van het spel (2.8.1) geeft NULL ("Unable to initialize the PhysX SDK"); de PhysX-scene (ds:0x610AA8) blijft NULL en game.exe+0xC3EFF leest hem. De lader zoekt de PhysX-kern via HKLM\Software\AGEIA Technologies (PhysXCore Path, enableLocalPhysXCore). Nodig: PhysXCore.dll 2.8.1 (oude PhysX-systeemsoftware van NVIDIA); de 2.8.4-kern van Infinity Blade FX werkt niet (ook niet lokaal met enableLocalPhysXCore = 1). Niet D3D9: ook met DXVK hetzelfde.
NoteEN = 2026-10-16: crashes after the logo because the PhysX 2.8 SDK cannot be created: it needs the PhysX 2.8.1 core (legacy NVIDIA PhysX System Software), which is not installed.
