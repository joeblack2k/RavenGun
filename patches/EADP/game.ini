[Game]
Name = Elevator Action Death Parade
Profile = EADP
Executable = Game.exe
Type = OpenParrot
EmulationProfile = EADP
ProfileRevision = 11

[Launch]
Mode = direct
; PhysX 2.8 (lader 2.8.1, SDK 2.8.0): zonder de systeemsoftware van NVIDIA crasht het spel na het logo (docs/redist.md)
PhysX = true

[Display]
Gamescope = true
GamescopePath = /usr/bin/gamescope

; Recept Music GunGun 2 (Taito Type X2): het JVS-bord van de daemon over de pipe (start, munt, test) plus de tp-shm-indeling EADP
; (trekkers en richten, TeknoParrotUi EADPPipe).
[Input]
Route = jvs
; TaitoEADP: Taito-commando's (0x05/0x04 aan node 0, 0x7D), Enter = START (packaging/jvs-boards.json)
Board = TaitoEADP
JvsTransport = pipe
Layout = EADP
Note = JVS-bord van de daemon (TaitoEADP) plus tp-shm EADP

; Bediening voor de knoppen-uitleg bij de eerste start (docs/per-game-patches.md, "Bediening per game"); labels uit het
; TeknoParrot-profiel (GameProfiles/<P>.xml), "Not confirmed yet" = de werking is nog niet gemeten.
[Controls]
trigger = Shoot | Fires the gun.
reload = Reload | Reloads your gun. Not confirmed yet.

[Status]
Status = playable
Note = 2026-10-16: start via dubbelklik: JVS (bord TaitoEADP), PhysX 2.8 (systeemsoftware van NVIDIA, scripts/setup-physx.sh), logo, intro en spelscenes in attract. Open: het beeld is een smalle staande strook (de kast heeft een staand scherm; Multi Screen = 1 start niet), knopindeling (Enter = START, Select = aux1) en kalibratie nog niet gemeten.
NoteEN = 2026-10-16: starts by double-click (JVS, PhysX 2.8 system software) and runs its attract. Open: the picture is a narrow portrait strip; controls and calibration not yet measured.
