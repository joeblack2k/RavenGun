Note = GEMETEN 2026-10-19 13:55 (punt G): de shell START en TEKENT op onze eigen lader en kern. Shell.exe is een 32-bits Windows-app; hij loopt via onze OpenParrot-lader met Core = ravengun, met DXVK niet nodig (hij tekent zijn eigen scherm) en de view die hierbij hoort. De foto (docs/screenshots/segamegameshell-game-error-2026-10-19.png) laat het scherm van de shell zelf zien: "Game Shell / Version 180605 / GAME ERROR". Dus: de start, het laden van de exe en het tekenen kloppen, maar de shell meldt zelf een fout omdat er in deze map geen spel voor hem staat -- GameData bevat alleen "compiled" en de map heeft verder alleen de shell en Transformers2 (dat een eigen profiel heeft). Wat er in deze ronde voor nodig was: een eigen profiel (dat was er niet: alleen een leeg sjabloon), een view met de map van de exe als ECHTE map (anders vindt de motor de game niet in de view), ViewWritable voor ShellData en temp, en een Input-route (tp-shm met WartranTroopers) omdat de motor anders op de evdev-route uitkomt. Correctie 2026-10-19 (review 16): mijn eerste controle op de NAS was niet goed genoeg. "find" ziet geen VERWIJDERINGEN en de schrijflaag van bwrap verbergt het schrijven, dus "0 nieuwe bestanden" zei niets. Wat er werkelijk gebeurde: de start van 13:45 verwijderde 157 oude "Attract - 2610xx.log"-koppelingen in shell/ en schreef shell/variables/erlg(.bak); in de schrijflaag staan daarvoor 157 whiteouts en 2 bestanden. De NAS zelf is ongemoeid -- er staan nog 209 logbestanden -- omdat die bestanden in de view KOPPELINGEN zijn en bwrap een schrijflaag gebruikt. Op een naakte rg-direct --run zonder die laag was het wel misgegaan met shell/variables, want dat was een map-koppeling naar de NAS. Daarom is de hele shell-map nu ViewWritable. Volgende stap: uitzoeken wat de shell nodig heeft om een spel te vinden (GameData/compiled of een licentiebestand) en of de Transformers2-map er een is die de shell hoort te starten.
NoteEN = MEASURED 2026-10-19 13:55 (item G): the shell STARTS and DRAWS on our own loader/core. Shell.exe is a 32-bit Windows app; it runs through our OpenParrot loader with Core = ravengun, in the view that belongs to it. The screenshot (docs/screenshots/segamegameshell-game-error-2026-10-19.png) shows the shell's own screen: "Game Shell / Version 180605 / GAME ERROR". So the start, loading the exe and drawing are fine, but the shell reports an error itself because this folder holds no game for it -- GameData only has "compiled" and the folder otherwise holds the shell and Transformers2 (which has its own profile). What this round needed: an own profile (there was none: only an empty template), a view with the exe's directory as a REAL directory (otherwise the engine does not find the game in the view), ViewWritable for ShellData and temp, and an Input route (tp-shm with WartranTroopers) because the engine otherwise picks the evdev route. Correction 2026-10-19 (review 16): my first NAS check was not good enough. "find" does not see DELETIONS and the bwrap writelayer hides the writes, so "0 new files" proved nothing. What actually happened: the 13:45 start deleted 157 old "Attract - 2610xx.log" links in shell/ and wrote shell/variables/erlg(.bak); the writelayer holds 157 whiteouts and 2 files for that. The NAS itself is untouched -- 209 log files are still there -- because those files are LINKS in the view and bwrap uses a writelayer. On a bare rg-direct --run without that layer it would have gone wrong with shell/variables, which was a directory link to the NAS. That is why the whole shell directory is ViewWritable now. Next step: find out what the shell needs to find a game (GameData/compiled or a licence file) and whether the Transformers2 folder is one it should start.
