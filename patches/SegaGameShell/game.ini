Note = GEMETEN 2026-10-19 13:55 (punt G): de shell START en TEKENT op de eigen lader en kern van RavenGun. Shell.exe is een 32-bits Windows-app; hij loopt via de OpenParrot-lader van RavenGun met Core = ravengun, zonder DXVK (hij tekent zijn eigen scherm), in de view die hierbij hoort. De foto (docs/screenshots/segamegameshell-game-error-2026-10-19.png) laat het scherm van de shell zelf zien: "Game Shell / Version 180605 / GAME ERROR". De start, het laden van de exe en het tekenen kloppen dus, maar de shell meldt zelf een fout omdat er in deze map geen spel voor hem staat -- GameData bevat alleen "compiled" en de map heeft verder alleen de shell en Transformers2 (dat een eigen profiel heeft). Nodig in deze ronde: een eigen profiel (er was alleen een leeg sjabloon), een view met de map van de exe als ECHTE map (anders vindt de motor de game niet in de view), schrijfmappen (ViewWritable) voor ShellData, temp en shell/variables, en een Input-route (tp-shm met WartranTroopers) omdat de motor anders op de evdev-route uitkomt. Correctie 2026-10-19 (review 16): "find" ziet geen VERWIJDERINGEN en de schrijflaag van bwrap verbergt het schrijven, dus "0 nieuwe bestanden" bewees niets. De start van 13:45 verwijderde 157 oude "Attract - 2610xx.log"-bestanden in shell/ en schreef shell/variables/erlg(.bak); in de schrijflaag staan daarvoor 157 whiteouts en 2 bestanden. Correctie 2026-10-19 (pass 2): Wine verwijdert en hernoemt DOOR een bestands-koppeling heen (wineserver werkt met het echte pad), dus die verwijderingen troffen de bestanden op de NAS en niet de koppelingen in de view. Alleen de schrijflaag van bwrap hield de NAS heel (er staan nog 209 logbestanden); een kale rg-direct --run zonder die laag had ze gewist. Daarom staat shell/ nu in ViewLocalFiles: bij de start worden alle bestands-koppelingen in shell/ lokale kopieën, Graphics en Sounds blijven koppelingen, en een kale rg-direct --run weigert zolang er nog een bestands-koppeling naar de NAS in shell/ staat. Volgende stap: uitzoeken wat de shell nodig heeft om een spel te vinden (GameData/compiled of een licentiebestand) en of de Transformers2-map er een is die de shell hoort te starten.
NoteEN = MEASURED 2026-10-19 13:55 (item G): the shell STARTS and DRAWS on RavenGun's own loader and core. Shell.exe is a 32-bit Windows app; it runs through RavenGun's OpenParrot loader with Core = ravengun, without DXVK (it draws its own screen), in the view that belongs to it. The screenshot (docs/screenshots/segamegameshell-game-error-2026-10-19.png) shows the shell's own screen: "Game Shell / Version 180605 / GAME ERROR". So the start, loading the exe and drawing are fine, but the shell reports an error itself because this folder holds no game for it -- GameData only has "compiled" and the folder otherwise holds the shell and Transformers2 (which has its own profile). Needed in this round: an own profile (there was only an empty template), a view with the exe's directory as a REAL directory (otherwise the engine does not find the game in the view), writable directories (ViewWritable) for ShellData, temp and shell/variables, and an Input route (tp-shm with WartranTroopers) because the engine otherwise picks the evdev route. Correction 2026-10-19 (review 16): "find" does not see DELETIONS and the bwrap writelayer hides the writes, so "0 new files" proved nothing. The 13:45 start deleted 157 old "Attract - 2610xx.log" files in shell/ and wrote shell/variables/erlg(.bak); the writelayer holds 157 whiteouts and 2 files for that. Correction 2026-10-19 (pass 2): Wine deletes and renames THROUGH a file link (wineserver works with the real path), so those deletes hit the files on the NAS, not the links in the view. Only the bwrap writelayer kept the NAS intact (209 log files are still there); a bare rg-direct --run without that layer would have deleted them. That is why shell/ is now in ViewLocalFiles: at start every file link in shell/ becomes a local copy, Graphics and Sounds stay links, and a bare rg-direct --run refuses while a file link to the NAS remains in shell/. Next step: find out what the shell needs to find a game (GameData/compiled or a licence file) and whether the Transformers2 folder is one it should start.
