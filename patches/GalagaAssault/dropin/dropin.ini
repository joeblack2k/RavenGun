; Drop-in van RavenGun voor de 32-bits Raw Thrills-ELF onder ElfLdr2/BudgieLoader.
; Uitleg en metingen: docs/rt-glfix.md, docs/hasp-elf-hook.md, docs/hasp-layer.md.
; Indeling en contract: docs/dropins.md.
;
; Preload = true laat de launcher het bestand in de view van de game zetten en zijn pad publiceren
; als RG_DROPIN_PRELOAD. De launcher zet het NIET in LD_PRELOAD: de start gaat altijd via Wine, en
; BudgieLoader is een Cygwin-programma dat LD_PRELOAD zelf leest. Het probeert onze ELF dan als
; Windows-DLL te laden en sterft met "fatal error - error while loading shared libraries", nog
; voordat de game begint. Gemeten op 2026-10-11; zie docs/rt-glfix.md, "Het kanaal".
;
; Voor deze games moet RG_DROPIN_PRELOAD in LD_AUDIT van het Wine-proces terechtkomen. LD_AUDIT
; kent Cygwin niet en glibc wel, en de bibliotheek komt zo in hetzelfde 32-bits proces als het spel
; (wine-preloader, ELF 32-bits i386).
[librt-glfix.so]
To = .
Preload = true
Env = RAVENGUN_GLFIX_GAME=GalagaAssault;RAVENGUN_GLFIX_LOG=rt-glfix.log

; ---------------------------------------------------------------------------------------------------
; De HASP-inline-hook (docs/hasp-elf-hook.md). De HASP-client van deze game is STATISCH in `game`
; gelinkt: 28 hasp_-symbolen in de dynsym (4718 dynamische symbolen), 0 ongedefinieerde
; hasp-symbolen en 0 PLT-verplaatsingen. Er is dus geen PLT-slot en geen GOT-invoer om te vullen;
; deze bibliotheek haakt de functies op hun ingangspunt aan en leidt ze naar de emulator.
;
; LET OP: zet deze hook pas aan als de GL-fix hierboven werkt. Deze game stopt nu al eerder, op de
; ontbrekende lettertypen (images/fonts/zoinks*.tga, AlSeana*.tga); zie patches/GalagaAssault/README.md.
[libravengun-hasphook.so]
To = .
Preload = true
; Audit = false: een inline-hook in LD_AUDIT komt in het proces van de
; Cygwin-lader en legt die om (gemeten: exitcode 1 / SIGSEGV). librt-glfix
; hoort daar juist wel. Zie docs/dropins.md en docs/elfldr2-route.md.
Audit = false
Env = RAVENGUN_HASP_DIR=ravengun-hasp;RAVENGUN_HASP_GAME=GalagaAssault;RAVENGUN_HASP_ELF_LOG=hasphook.log;RAVENGUN_HASP_VERBOSE=1

; De 64-bits hook is een overblijfsel van scripts/build-hasphook.sh, dat BEIDE breedtes in elke game
; legt. Deze game is 32-bits en de lezer is 32-bits, dus deze bibliotheek doet hier niets: een
; 64-bits object wordt geweigerd met "wrong ELF class: ELFCLASS64". Hij krijgt daarom een sectie
; ZONDER Preload -- een bestand zonder sectie wordt niet uitgerold (docs/dropins.md). Weglaten mag
; ook; hij komt terug zodra build-hasphook.sh opnieuw draait.
[libravengun-hasphook-x64.so]
To = .

; ---------------------------------------------------------------------------------------------------
; De dongle (docs/dropins.md, docs/hasp-layer.md). De emulator krijgt GEEN Preload: glibc eist van
; een bibliotheek in LD_AUDIT dat hij `la_version` exporteert, en ravengun-hasp.so doet dat niet
; ("undefined symbol: la_version; ignored"). De inline-hook hierboven laadt de emulator zelf.
[ravengun-hasp.so]
To = .

[ravengun-hasp/GalagaAssault/dongle.json]
To = .

[ravengun-hasp/GalagaAssault/memory/00000000000000001111111111110000]
To = .
