; Onderzoek 2026-10-11 (docs/research/antwoorden-tp-ronde23-en-jp.md, docs/decisions.md "32-bits Raw Thrills-familie"):
; geen GL-imports (GL via dlsym); de GOT staat in het BESTAND al gevuld met absolute 0xb7xxxxxx-adressen uit een
; draaiend proces op de originele kast, en elke PLT-stub pusht 0xdeadbeef in plaats van een relocatie-index.
;
; Correctie 2026-10-12 (statische meting, zie patches/ELF-LADER-SPEC.md): niet "~60 vaste GOT-slots" maar 357;
; die ~60 is het aantal GL-imports daarbinnen. Van die imports hebben er 99 een naam en 258 niet
; (st_name = 0, aaneengesloten); 99 + 258 = 357, precies het aantal stubs. Het bestand heeft nul
; sectiekoppen en draagt de marker PATCHED_WITH_HASPE_LINUX_LOADER_1.1.
; Geen eigen GOT-reconstructie; alleen de lader van TeknoParrot zelf.
[Status]
Status = parked
Note = Geparkeerd: de lader van TeknoParrot start hem onder Wine niet door. Statisch gemeten (zie patches/ELF-LADER-SPEC.md): 357 PLT-stubs waarvan 99 imports met een naam en 258 met een gewiste naam, samen precies 357; nul sectiekoppen en elke stub pusht 0xdeadbeef, dus luie binding is onmogelijk. De tabel die de slots aan namen koppelt staat niet in het bestand. Bij Jurassic Park -- dezelfde pakker en dezelfde klasse -- is gemeten dat de rt-glfix-brug de GL-blokkade wegneemt maar dat de game daarna omvalt op een onopgeloste niet-GL-import; voor Galaga Assault is dat nog niet gemeten. Wacht op de resolutietabel uit een lopende ElfLdr2-run.
NoteEN = Parked: TeknoParrot's loader does not get it past start-up under Wine. Measured statically (see patches/ELF-LADER-SPEC.md): 357 PLT stubs, of which 99 imports have a name and 258 have an erased name, together exactly 357; zero section headers and every stub pushes 0xdeadbeef, so lazy binding is impossible. The table that maps slots to names is not in the file. For Jurassic Park -- the same packer and the same class -- it was measured that the rt-glfix bridge removes the GL blocker but that the game then falls over on an unresolved non-GL import; for Galaga Assault that has not been measured yet. Waiting on the resolution table from a running ElfLdr2 run.
Findings = findings/GalagaAssault.md

