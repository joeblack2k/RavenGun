; Onderzoek 2026-10-11 (docs/research/antwoorden-tp-ronde23-en-jp.md, docs/decisions.md "32-bits Raw Thrills-familie"):
; geen GL-imports (GL via dlsym); de GOT staat in het BESTAND al gevuld met absolute 0xb7xxxxxx-adressen uit een
; draaiend proces op de originele kast, en elke PLT-stub pusht 0xdeadbeef in plaats van een relocatie-index.
;
; Correctie 2026-10-12 (statische meting, zie patches/ELF-LADER-SPEC.md): niet "~60 vaste GOT-slots" maar 442;
; die ~60 is het aantal GL-imports daarbinnen. Het aantal stubs is gelijk aan het aantal UND-imports,
; maar de verdeling met en zonder naam is voor deze game niet apart geteld.
; Geen eigen GOT-reconstructie; alleen de lader van TeknoParrot zelf.
[Status]
Status = parked
Note = Geparkeerd: de lader van TeknoParrot start hem onder Wine niet door. Statisch gemeten (zie patches/ELF-LADER-SPEC.md): 442 PLT-stubs, nul sectiekoppen, elke stub pusht 0xdeadbeef en de GOT staat in het bestand al gevuld met absolute 0xb7xxxxxx-adressen uit een draaiend proces op de originele kast. Het aantal stubs is gelijk aan het aantal UND-imports, maar hoeveel daarvan hun naam kwijt zijn is voor deze game niet te meten: de UND-tabel groeit mee met de bovengrens die je kiest, dus het einde van de tabel is hier niet gevonden. Dezelfde klasse als Jurassic Park, waar gemeten is dat de rt-glfix-brug de GL-blokkade wegneemt maar de game daarna omvalt op een onopgeloste niet-GL-import. Wacht op de resolutietabel uit een lopende ElfLdr2-run.
NoteEN = Parked: TeknoParrot's loader does not get it past start-up under Wine. Measured statically (see patches/ELF-LADER-SPEC.md): 442 PLT stubs, zero section headers, every stub pushes 0xdeadbeef and the GOT is already filled in the file with absolute 0xb7xxxxxx addresses from a running process on the original cabinet. The number of stubs equals the number of UND imports, but how many of those lost their name cannot be measured for this game: the UND table grows with whichever upper bound you pick, so the end of the table was not found here. Same class as Jurassic Park, where it was measured that the rt-glfix bridge removes the GL blocker but the game then falls over on an unresolved non-GL import. Waiting on the resolution table from a running ElfLdr2 run.
Findings = findings/PacmanChompMania.md

