; Gunslinger Stratos 3 (Taito Type X4, 64 bits). Profiel uit TeknoParrot-sjabloon GameProfiles/Gunslinger.xml, revisie 23
; (scripts/import-tp-profiles.py). Geen lightgun-spel (twee sticks met geweergrepen), wel in de bibliotheek.
[Game]
Name = Gunslinger Stratos 3
Profile = GunslingerStratos3
Executable = game.exe
Type = TeknoParrot
EmulationProfile = GunslingerStratos3
Is64Bit = true
ProfileRevision = 23
Patreon = true

[Launch]
Mode = direct

[Display]
Gamescope = true

[Input]
; Plaatshouder: TeknoParrot bedient deze game via FastIOPipe (64-byte rapporten op TeknoParrotPipe); die indeling bestaat nog niet.
Route = tp-shm
Layout = WartranTroopers
Note = plaatshouder: nog geen FastIO-indeling (TeknoParrotUi FastIOPipe); alleen om te starten

[Status]
Status = parked
Note = 2026-10-17: profiel geïmporteerd (TP Gunslinger.xml, rev 23), directe route met gamescope. De exe crasht direct na de start (sprong naar 0x4FD8AED0, page fault) voordat de kern geïnjecteerd is; met onze lader en die van TeknoParrot, ook met PostStartMs = 3000. Vermoeden: de beschermingslaag (NESYS/HASP, zie BESCHERMING-STATUS.md). Geen lightgun-spel. Invoer: plaatshouder (FastIO bestaat nog niet).
NoteEN = 2026-10-17: crashes right after launch (jump to an unmapped address) before the core is injected; likely the protection layer. Not a lightgun game. Parked.

[Identify]
Path = game.exe

