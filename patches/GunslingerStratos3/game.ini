; Gunslinger Stratos 3 (Taito Type X4, 64 bits). Profiel uit TeknoParrot-sjabloon GameProfiles/Gunslinger.xml, revisie 23
; (scripts/import-tp-profiles.py). Geen lightgun-spel (twee sticks met geweergrepen), wel in de bibliotheek.
[Game]
Name = Gunslinger Stratos 3
Profile = GunslingerStratos3
Executable = game.exe
Type = TeknoParrot
EmulationProfile = GunslingerStratos3
Is64Bit = true
ProfileRevision = 23
Patreon = true

[Launch]
Mode = direct
; Wine's xaudio2_7 crashte vanuit game.exe (access violation in xaudio2_7.dll); de native uit de DirectX-redist niet (2026-10-17).
NativeDlls = xaudio2_7
; Direct3D 11: met wined3d een wit venster ("DXGI device window"), met DXVK zwart (zie de status).
Dxvk = true

[Display]
Gamescope = true

[Input]
; TeknoParrot bedient deze game via FastIOPipe: 64-byte rapporten op TeknoParrotPipe (indeling FastIO in
; packaging/control-pipe-profiles.json; de game verbindt na ~17 s). De sticks (8 bits op 8/9) zijn nog niet ingevuld.
Route = tp-shm
Layout = WartranTroopers
ControlPipe = FastIO
Note = FastIO-pipe voor knoppen, test, service en munt; sticks en geweer nog niet

[Status]
Status = parked
Note = 2026-10-17: de eerdere crash op 0x4FD8AED0 was de 32-bits game.exe van Cooper's 9 (herkenning zonder Size vond die map eerst); met Size start de echte game.exe. Daarna: access violation in Wine's xaudio2_7 (native uit de redist lost dat op), FastIO-pipe verbindt, maar het beeld blijft zwart: DXVK presenteert 60 fps met 3 queue-submissions per frame (er wordt niets getekend) en de game opent geen bestanden uit resource/, ook na 5 minuten niet. Vermoeden: wacht in de opstart op iets van de kern (NESYS/kaartlezer/I/O). Geen lightgun-spel.
NoteEN = 2026-10-17: the earlier crash was Cooper's 9's game.exe (identification without Size); the real game.exe now runs, with native xaudio2_7 and the FastIO pipe, but the picture stays black (60 fps, nothing drawn, no assets loaded after 5 minutes). Not a lightgun game. Parked.

[Identify]
Path = game.exe
; game.exe is ook de naam bij Cooper's 9 en andere Type X-spellen: zonder Size vond de herkenning Cooper's 9 (2026-10-17)
Size = 52772352

