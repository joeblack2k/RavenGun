;
; matrix.ini - de gegevens van de Matrix/SBK-donglelaag van deze game.
;
; De bibliotheek (matrix64.dll, naast dit bestand in de drop-in-map) leest dit bestand zelf; de
; launcher weet er niets van (docs/geen-dongle-in-de-loader.md). De drop-in geeft de weg mee met
; RAVENGUN_MATRIX_DIR=matrix in dropin.ini.
;
; Deze game leest GEEN dongle-geheugen: SBK.Matrix.MatrixManager vraagt alleen het aantal dongles en
; een serienummer. Daarom staat er geen memory-regel. Zou een game wel geheugen lezen, dan zet je hier
; memory = matrix.bin en leg je dat bestand naast dit bestand.
;
; poort   de poort waarop de game controleert. Rabbids Hollywood gebruikt 85 (niet 40: dat is de
;         ongebruikte tweede controlevariant in de assembly, zie docs/matrix-layer.md).
; aantal  het aantal dongles dat wij opgeven. De controle eist > 0; er staat nog een ongebruikte
;         variant in de assembly die > 1 eist. 2 voldoet aan allebei, net als TeknoParrot's eigen
;         matrix32.dll (bewezen met objdump: `mov eax,2; ret`).
;
; Het serienummer staat hier bewust NIET in: dat is een vaste, zelfgekozen waarde in de bibliotheek
; (0x10F2C, dezelfde als TeknoParrot's emulator). Er hoort geen echt serienummer in een bestand te
; staan, en er wordt er ook geen gelezen of gelogd.

poort = 85
aantal = 2
