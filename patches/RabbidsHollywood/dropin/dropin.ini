;
; dropin.ini - wat de launcher letterlijk in de view van Rabbids Hollywood zet (docs/dropins.md).
;
; Dit is de DLL-route voor de Matrix-dongle: onze eigen matrix64.dll beantwoordt de dongle-controle
; in de DLL zelf, in plaats van de Harmony-patch in plugins/unity/. De afweging tussen die twee
; staat in docs/matrix-layer.md.
;
; De standaardroute is de patch (patches/<Game>/game.ini laat [Dongle] Enabled weg, dus uit). Zet de
; eigenaar in zijn eigen laag [Dongle] Enabled = true met Source = drop-in, dan plaatst de launcher
; dit bestand en zet hij de omgevingsvariabelen hieronder. RAVENGUN_MATRIX_DLL=1 zet de Matrix-patches
; van de plugin uit, zodat de DLL het alleen doet en te zien is welke route werkt.
;
; Alleen matrix64.dll: Rabbids Hollywood is 64-bits en MatrixDLLCSharp.MatrixWrapper.DLL_PATH is
; "matrix64.dll". scripts/build-matrix.sh bouwt ook matrix32.dll, voor 32-bits games.
;
; Het bestand komt uit matrix/out/ (scripts/build-matrix.sh). Het is een drop-in in de zin van
; docs/dropins.md: wij hebben hem zelf gebouwd, het is geen kopie van een bestand van TeknoParrot.

[matrix64.dll]
To = .
DllOverride = native
Env = RAVENGUN_MATRIX_GAME=RabbidsHollywood;RAVENGUN_MATRIX_DLL=1
