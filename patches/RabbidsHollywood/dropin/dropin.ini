;
; dropin.ini - wat er in de view van Rabbids Hollywood komt (docs/dropins.md,
; docs/geen-dongle-in-de-loader.md).
;
; Dit is de Matrix/SBK-donglelaag als drop-in: onze eigen matrix64.dll beantwoordt de dongle-controle
; in de DLL zelf, en leest zijn eigen gegevens uit matrix/matrix.ini ernaast. De launcher kopieert
; bestanden en zet omgevingsvariabelen; hij weet niet wat een dongle is.
;
; To = Game_Data/Plugins, niet '.' (de hoofdmap van de game). Gemeten met WINEDEBUG=+loaddll: de game
; laadt weliswaar beide exemplaren, maar de aanroepen uit MatrixDLLCSharp.MatrixWrapper komen uit
; Game_Data/Plugins/matrix64.dll. Met onze DLL alleen in de hoofdmap sloot de game zich na ongeveer
; een minuut nog steeds af; met onze DLL in Game_Data/Plugins bleef hij draaien (docs/matrix-layer.md,
; "Metingen"). Game_Data is in de view een koppeling naar de NAS, dus wie dit bestand plaatst moet die
; map eerst lokaal maken (een echte map met koppelingen naar de rest) -- anders wijst het doel naar de
; NAS en hoort de drop-in-motor te weigeren. scripts/matrix.py --install doet dat al.
;
; RAVENGUN_MATRIX_DLL=1 zet de Matrix-patches van de RavenGun-plugin (plugins/unity/) uit, zodat de
; DLL het alleen doet. Zonder die variabele wint de patch en wordt de DLL nooit aangeroepen; de patch
; blijft dus de terugval voor zolang de drop-in niet geleverd kan worden.
;
; scripts/build-matrix.sh bouwt ook matrix32.dll, voor 32-bits games.
;
; Het bestand komt uit matrix/out/ (scripts/build-matrix.sh): wij hebben het zelf gebouwd, het is geen
; kopie van een bestand van TeknoParrot.

[matrix64.dll]
To = Game_Data/Plugins
DllOverride = native
Env = RAVENGUN_MATRIX_DIR=matrix;RAVENGUN_MATRIX_GAME=RabbidsHollywood;RAVENGUN_MATRIX_DLL=1
