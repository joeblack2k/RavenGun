Note = WERKT op onze eigen route (2026-10-14): een dubbelklik in RavenGun start de game zonder scripts en zonder TeknoParrot (daemon -> Proton met onze BepInEx-plugin, invoer over TCP). Gemeten op de tv met de muismodus: munt (toets 5), START (toets 1 even vasthouden), richten en schieten; 5:19 min gedraaid met een gespeelde ronde. De dongle-controle (SBK.Matrix) is beantwoord, zie DONGLE-ONDERZOEK.md. Nog niet gemeten: of de savegame bewaard blijft over twee starts, en spelen met de echte Move-knoppen.
NoteEN = WORKING on our own route (2026-10-14): a double-click in RavenGun starts the game without scripts and without TeknoParrot (daemon -> Proton with our BepInEx plugin, input over TCP). Measured on the TV in mouse mode: coin (key 5), START (hold key 1 briefly), aim and trigger; ran 5:19 min with a played round. The dongle check (SBK.Matrix) is answered, see DONGLE-ONDERZOEK.md. Not yet measured: whether the savegame survives two starts, and playing with the real Move buttons.
