[Wine]
DllOverrides = winhttp=n,b

[Input]
Route = unity-tcp

[Status]
Status = untested
Note = Start op de eigen route (zonder TeknoParrot) en blijft draaien: gemeten 2026-10-12, 288 s in de attract-lus, zelf gestopt. De eigen dongle-controle van de game (SBK.Matrix) wordt beantwoord -- Dongle_Count(85) -> 2, Dongle_ReadSerNr -> 69420, en de game logt zelf "**** DONGLE FOUND: 69420"; geen "DONGLE NOT FOUND" en geen Application.Quit meer. NIET in die meting gemeten: munt, start en vizier, want die liep headless (gamescope zonder scherm) en daar komen de virtuele toetsen niet aan; dat vraagt een proef op de tv. Op deze route wel eerder gezien (log 2026-10-11 17:13, nog met de oude plugin): munten liepen op tot 6, start gaf "speelt 1" en de wereldkeuze kwam in beeld. De savegame-versleuteling van dezelfde dongle wordt sinds deze ronde ook beantwoord; of dat de opslag echt herstelt is nog niet met twee starts gemeten. Bewijs en afweging: patches/RabbidsHollywood/DONGLE-ONDERZOEK.md.
NoteEN = Starts on its own route (no TeknoParrot) and keeps running: measured 2026-10-12, 288 s in the attract loop, stopped by us. The game's own dongle check (SBK.Matrix) is answered -- Dongle_Count(85) -> 2, Dongle_ReadSerNr -> 69420, and the game itself logs "**** DONGLE FOUND: 69420"; no more "DONGLE NOT FOUND" and no Application.Quit. NOT measured in that run: coin, start and crosshair, because it ran headless (gamescope without a display) and the virtual keys do not arrive there; that needs a run on the TV. Seen earlier on this route (log 2026-10-11 17:13, still with the old plugin): credits rose to 6, start produced "speelt 1" and world select appeared. The same dongle also drives the savegame encryption, now answered as well; whether that really restores persistence has not yet been measured with two starts. Evidence and trade-offs: patches/RabbidsHollywood/DONGLE-ONDERZOEK.md.
Findings = findings/RabbidsHollywood.md

