; Voorbereid in pass 1 (docs/goal-90-native.md): profiel uit het TeknoParrot-sjabloon, herkenning gemeten aan de NAS-map "Night Hunter - After Dark, Chapter 2"
; (alleen gelezen), invoerroute gekozen naar het EmulationProfile. Niet gestart.

[Game]
Name = Night Hunter - After Dark, Chapter 2
Profile = AfterDark2
Executable = qumo2_en.exe
Type = TeknoParrot
EmulationProfile = WartranTroopers
Is64Bit = true
ProfileRevision = 6

[Launch]
Mode = direct
; Zonder TeknoParrot (2026-10-17): BepInEx 5.4.23.2 (scripts/fetch-bepinex.sh 5.4.23.2; 5.4.21.0 laadde bij Unity 5.5.3 niet, 2026-10-18) naast qumo2_en.exe, voor onze eigen plugin
; RavenGun.AfterDark2 (plugins/bepinex/AfterDark2/, dropin/). De gesloten kern beantwoordde de TeknoParrot-plugin NHAD2TPPlugin
; (knoppen, richtpunt in pixels, resolutie via ReadFile/WriteFile op een nep-handvat). Onze plugin zet de game op zijn eigen
; muisroute en levert richtpunt, trekker, munt, start, speciaal, wapen, stuur en testmenu zelf uit het bordbeeld; NHAD2TPPlugin gaat uit.
BepInEx = 5.4.23.2

[Loader]
; Geen lader en geen kern: Wine start qumo2_en.exe zelf. Op de tv gemeten zonder TP-map (2026-10-18 13:02): attract, titel
; (Free Play), start, laden en spel, geluid; BepInEx 5.4.23.2 met het ingangspunt op MonoBehaviour (dropin/BepInEx.cfg).
Core = none

[Wine]
; winhttp=n,b: de doorstop van BepInEx (de drop-in van [Launch] BepInEx zet hem ook).
DllOverrides = winhttp=n,b
; De attract-film (AVPro Video, Media Foundation, mp4) via GStreamer: dezelfde plug-ins als Raccoon Rampage.
GStreamerPlugins = ~/.local/share/ravengun/tools/gst-extra/plugins

; Schermvullend in gamescope. GEEN DXVK: met DXVK bleef de game op "Initializing..." staan (de video van AVPro kwam niet als
; D3D11-texture binnen); met Wine's eigen D3D11 loopt hij door naar de attract en het spel (gemeten 2026-10-15).
[Display]
Gamescope = true
GamescopePath = /usr/bin/gamescope

[Input]
Route = tp-shm
Layout = WartranTroopers
Note = zonder TeknoParrot leest onze plugin RavenGun.AfterDark2 het bordbeeld in de game (richtpunt en trekker speler 1/2, munt, start, herladen = speciaal, granaat = wapen wisselen, menu omhoog/omlaag = stuur links/rechts, test = testmenu). Met de kern en NHAD2 gemeten 2026-10-15: munt, START, missiekeuze, schieten, score

; Bediening voor de knoppen-uitleg bij de eerste start (docs/per-game-patches.md, "Bediening per game"); labels uit het
; TeknoParrot-profiel (GameProfiles/<P>.xml), "Not confirmed yet" = de werking is nog niet gemeten.
[Controls]
trigger = Shoot | Fires the gun.
reload = Special | Fires your special weapon.
grenade = Change weapon | Switches to the next weapon. Not confirmed yet.

[Status]
Status = working
Note = Sinds 2026-10-18 zonder TeknoParrot (onze plugin RavenGun.AfterDark2, Sense4-controle in de plugin, BepInEx 5.4.23.2): op de tv attract, titel, start, laden en spel, geluid. Eerder WORKING via dubbelklik in de app (2026-10-15): attract (ranglijst), START, missiekeuze, spelen met score, game over en continue; 5,5 min gespeeld. Zonder DXVK (met DXVK bleef hij op Initializing... staan: de AVPro-video), BepInEx-plug-in NHAD2 voor de invoer, GStreamer-plug-ins voor de film, gamescope.
NoteEN = Since 2026-10-18 without TeknoParrot (our plugin RavenGun.AfterDark2, Sense4 check in the plugin, BepInEx 5.4.23.2): on the TV attract, title, start, loading and play, sound. Earlier WORKING via double-click in the app (2026-10-15): attract (ranking), START, mission select, play with score, game over and continue; played 5.5 min. Without DXVK (with DXVK it stayed on Initializing...: the AVPro video), BepInEx plugin NHAD2 for input, GStreamer plugins for the movie, gamescope.


