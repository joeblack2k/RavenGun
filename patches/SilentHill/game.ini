; Deze titel draait op ONZE EIGEN kern: de drop-in vervangt shaiolib.dll, en dat is gemeten met onze kern en niet met de gesloten.
[Loader]
Core = ravengun

[Status]
Status = parked
Note = Draait zijn attract-film op ONZE EIGEN kern (2026-10-13, op de tv) -- maar is NIET speelbaar: de vervangende IO-bibliotheek levert nog geen invoer (geen knoppen, munten of geweren). Wat het daar bracht: onze eigen shaiolib.dll in de drop-in (het origineel wacht op twee seriele borden en de beveiligingsstekker: "LOW CONTROL ERROR 5-1500"), een 32-bits GStreamer voor Wine (zonder: het spel stopt zodra de openingsfilm moet beginnen), en een geheugenpatch van drie bytes die de aanroep StopWhenReady weghaalt (zonder: de film blijft zwart). De regio is nu Azie (modelcode GNGHLAAA); Europa vraagt een luidsprekerinstelling die de dump niet heeft. Zie ATTRACT-RUN.md.
NoteEN = Plays its attract movie on OUR OWN core (2026-10-13, on the TV) -- but is NOT playable: the replacement I/O library delivers no inputs yet (no buttons, coins or guns). What got it there: our own shaiolib.dll in the drop-in (the original waits for two serial boards and the security plug: "LOW CONTROL ERROR 5-1500"), a 32-bit GStreamer for Wine (without it the game quits when the opening movie should start), and a three-byte in-memory patch that removes the StopWhenReady call (without it the movie stays black). The region is Asia for now (model code GNGHLAAA); Europe needs a speaker setting the dump does not have. See ATTRACT-RUN.md.
