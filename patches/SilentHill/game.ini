; Silent Hill: The Arcade (Konami PC Based, 2007). Profiel uit het TeknoParrot-sjabloon GameProfiles/SilentHill.xml, revisie 16
; (scripts/tp-add-game.py, 2026-10-13). Wat deze game nodig heeft en waarom: ATTRACT-RUN.md en README.md.

[Game]
Name = Silent Hill: The Arcade
Type = TeknoParrot
EmulationProfile = SilentHill
ProfileRevision = 16
Executable = KSHG.exe
Profile = SilentHill

[Launch]
Mode = direct
; De attract-film loopt via Wine's DirectShow: 32-bits GStreamer (docs/gst32.md).
Gst32 = true

[Display]
Gamescope = true
GamescopePath = /usr/bin/gamescope
AimAspect = 4:3

; Invoer: de daemon schrijft de TeknoParrot-indeling SilentHill (tp-shm); onze shaiolib.dll leest die in rg_poll_inputs().
[Input]
Route = tp-shm
Layout = SilentHill
Note = tp-shm, indeling SilentHill (TeknoParrotUi SilentHillPipe), gelezen door onze shaiolib.dll

[Config]
General/Input API = RawInput
General/FreePlay = 1
General/Windowed = 0
General/CustomResolution = 0
General/ResolutionWidth = 640
General/ResolutionHeight = 480
General/SkipToStage = stage1-1-1
General/HideCursor = 0
General/EnableAmdFix = 0
Crosshair/Enable = 0
Crosshair/Render Hook = Present
General/Use Relative Input = 0
General/Player 1 Relative Sensitivity = 8
General/Player 2 Relative Sensitivity = 8
Cheats/Enable = 0
Cheats/P1 Unlimited Health = 0
Cheats/P1 Unlimited Ammo = 0
Cheats/P2 Unlimited Health = 0
Cheats/P2 Unlimited Ammo = 0

[ConfigType]
General/Input API = Dropdown
General/FreePlay = Bool
General/Windowed = Bool
General/CustomResolution = Bool
General/ResolutionWidth = Text
General/ResolutionHeight = Text
General/SkipToStage = Dropdown
General/HideCursor = Bool
General/EnableAmdFix = Bool
Crosshair/Enable = Bool
Crosshair/Render Hook = Dropdown
General/Use Relative Input = Bool
General/Player 1 Relative Sensitivity = Slider
General/Player 2 Relative Sensitivity = Slider
Cheats/Enable = Bool
Cheats/P1 Unlimited Health = Bool
Cheats/P1 Unlimited Ammo = Bool
Cheats/P2 Unlimited Health = Bool
Cheats/P2 Unlimited Ammo = Bool

[ConfigOptions]
General/Input API = DirectInput|XInput|RawInput
General/SkipToStage = stage1-1-1|stage1-2-1|stage1-2-2|stage1-2-3|stage1-3-1|stage1-3-2|stage2-1-1|stage2-2-1|stage2-2-2|stage2-3-1|stage3-1-1|stage3-1-2|stage3-2-1|stage3-2-2|stage3-2-3|stage3-3-1|stage3-3-2
Crosshair/Render Hook = EndScene|Present

[Identify]
Path = KSHG.exe
Size = 3022848

; Deze titel draait op ONZE EIGEN kern: de drop-in vervangt shaiolib.dll, en dat is gemeten met onze kern en niet met de gesloten.
[Loader]
Core = ravengun

[Status]
Status = working
Note = Speelbaar vanuit de app (dubbelklik, 2026-10-15): munt en START, dan stage 1 met de lightgun (richten, schieten, herladen), 5,5 min gespeeld. Onze shaiolib.dll leest de invoer (tp-shm SilentHill); stereo-geluid via [Audio] Channels. Open: 16:9-patch, e-AMUSEMENT PASS.
NoteEN = Playable from the app (double-click, 2026-10-15): coin and START, then stage 1 with the lightgun (aim, shoot, reload); played for 5.5 minutes. Our shaiolib.dll reads the input (tp-shm SilentHill); stereo sound. Open: a 16:9 patch and the e-AMUSEMENT PASS.
