Status = working
Note = WERKT op de Lindbergh-route (2026-10-15): dubbelklik in RavenGun, main.exe met lindbergh.so van lindbergh-loader, JVS via de daemon, zink. 5,5 min gespeeld in muismodus: munt (5), START (1), schieten, herladen. Het aanraakscherm (bestemming kiezen) ontbreekt bewust; het spel kiest dan zelf na de timer.
NoteEN = WORKING on the Lindbergh route (2026-10-15): double-click in RavenGun, main.exe with lindbergh-loader's lindbergh.so, JVS through the daemon, zink. Played 5.5 min in mouse mode: coin (5), START (1), shooting, reloading. The touch screen (choosing a destination) is deliberately absent; the game picks one when the timer runs out. Gun aim measured 2026-10-22 (headless, 640x480) in the game's own test menu (GUN ADJUSTMENT > CHECK shows the point the game thinks each gun aims at): 13 points per player, every point within 1.5 px in x and 2.5 px in y (0.23% / 0.52% of the screen) with the owner's calibration, which is the game's factory default (OLD/NEW all 0; byte-identical to a fresh eeprom.bin); nothing to calibrate. The test menu is the same program started with -t: put a user-layer patches/Primevil/native.json with "args": ["-t"] (service = F3 or START steps, TEST = key 0).

