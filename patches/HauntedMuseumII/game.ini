; Gegenereerd door scripts/migrate-game-settings.py (docs/per-game-patches.md). Sleutels die het script afleidt uit de oude bronnen worden bij
; elke run opnieuw gezet; handwerk in andere sleutels blijft staan.
;
; Uit het oude UserProfiles/HauntedMuseumII.env:
; door tp-add-game.py; Type X2 (OpenParrot), elfde ronde 2026-10-11 (zie packaging/games-status.md)
; - TP_REMOTETHREAD=off: standaardroute van de lader (entry-point-trampoline), geen POSTSTART/ENTRYPOINT (antwoorden_ronde3, vraag 14)
; - WINEDLLOVERRIDES=d3d9=b: Wine's ingebouwde d3d9
; - RG_LOADER_FPFIX=true: kopie van de lader zonder CONTEXT_FLOATING_POINT (Wine-bug: SetThreadContext zet MXCSR op 0)
; - RG_JVS_BOARD=true: standaard JVS-bord achter de pipe (scripts/launch-direct.py)

[Game]
Name = Haunted Museum II
Profile = HauntedMuseumII
Type = OpenParrot
EmulationProfile = HauntedMuseum2
Executable = game.exe
ProfileRevision = 7

[Launch]
; Geen ViewWritable = data (pass 2, 2026-10-19): de game schrijft niet in data/ (in de view staan daar sinds 2026-10-16 alleen
; links, geen enkel eigen bestand; de kalibratie gaat naar OpenParrot/HM2*, zie [Status]). data/ bevat de grote mappen chara, map,
; model, sound enz. op de NAS; als schrijfmap weigert de daemon die terecht en startte de game niet meer. Schrijft hij ooit
; een los bestand in data/, zet dat dan in [Launch] ViewCopies.
Mode = direct
; data/ een echte map met links: Proton meldt een gelinkte map als reparse point (0x410) en het spel wil precies 0x10, anders
; chdir("..\\") en SOUND ERROR (gemeten 2026-10-16, game.exe 0x4017F7)
ViewRealDirs = data

[Input]
Route = jvs
; TaitoGun: hetzelfde bord als SegaGun2P, START van speler 1/2 op P1 omhoog/omlaag, Taito-commando's (packaging/jvs-boards.json)
Board = TaitoGun
JvsTransport = pipe
Layout = MusicGunGun2Pipe
Note = JVS-bord van de daemon (TaitoGun) over de pipe plus tp-shm MusicGunGun2Pipe (trekkers en richten); recept Gaia Attack 4

[Display]
; gamescope schermvullend met Windowed = 1
Gamescope = true

; Bediening voor de knoppen-uitleg bij de eerste start (docs/per-game-patches.md, "Bediening per game"); labels uit het
; TeknoParrot-profiel (GameProfiles/<P>.xml), "Not confirmed yet" = de werking is nog niet gemeten.
[Controls]
trigger = Shoot | Fires the gun.

[Status]
Status = working
Note = WORKING via dubbelklik (2026-10-16): attract, munt, START, spel; recept Gaia Attack 4. Geweerkalibratie P1+P2 en datum meegeleverd (seed/OpenParrot/HM2*, in het testmenu gemaakt); opnieuw kalibreren: TEST > GUN CHECK > START 1, opslaan met TEST.
NoteEN = WORKING via double-click (2026-10-16): attract, coin, START, game; same recipe as Gaia Attack 4. Gun calibration (P1 and P2) and the date ship with RavenGun (made in the test menu); to recalibrate: TEST > GUN CHECK > START 1, save with TEST.
Findings = findings/HauntedMuseum.md

; Profiel uit TeknoParrot-sjabloon GameProfiles/HauntedMuseumII.xml, revisie 7 (scripts/import-tp-profiles.py; opnieuw importeren in plaats van met de hand wijzigen)
