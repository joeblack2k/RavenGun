; Gegenereerd door scripts/migrate-game-settings.py. Zet een gedeelde patch aan (definitie in _defaults/<Type>.patches.ini); andere patches in dit bestand zijn handwerk en blijven staan.

[Patch: OpenParrotLoader zonder CONTEXT_FLOATING_POINT]
Enabled = true

[Patch: Gun-schrijfacties uit, versie 2100 (0x9D970)]
Enabled = false
Kind = memory
Category = input
AppliedBy = core
Module = game.exe
Offset = 0x9D970
Action = jmp-returns-true
Size = 6
Find = 83 EC 34 A1 FC E2
Version = 2100
Note = Deze set hoort bij de build die in onze dump staat: de CRC die de kern zelf rekent over de eerste 0x400 bytes is 0x5a7fa241 en dat is in GameDetect.cpp `GameID::HauntedMuseum2100` ("USA 1.00"). De Find is op die build gemeten.
Source = OpenParrot TypeX2Generic.cpp (GPL-3.0), regel 2176
Reason = OpenParrot-commentaar: "Disable Gun Writes". De OpenParrot-kern zet op deze plek een JMP naar een functie die altijd 1 teruggeeft (ReturnsTrue); hij past dit zelf al toe (AppliedBy = core). Alleen documentatie: RavenGun past dit niet toe en schrijft hier niets. De bron noemt geen originele bytes; de Find is op onze eigen dump gemeten.

[Patch: Crash-NOP, versie 2100 (0x1391)]
Enabled = false
Kind = memory
Category = crash
AppliedBy = core
Module = game.exe
Offset = 0x1391
Action = nop
Size = 1
Version = 2100
Note = Let op: de byte op deze plek is in onze dump al 0x90, dus deze patch verandert daar niets. Hij staat er als documentatie van wat de kern doet. Daarom heeft hij geen Find: die zou trivially waar zijn.
Source = OpenParrot TypeX2Generic.cpp (GPL-3.0), regel 2178
Reason = OpenParrot-commentaar: "Stupid crash caused by this sometimes??". De OpenParrot-kern maakt hier 1 byte NOP en past dit zelf al toe (AppliedBy = core). Alleen documentatie: RavenGun past dit niet toe. De bron noemt geen originele bytes en de byte is in onze dump al 0x90, dus Find is leeg.

