; SPDX-License-Identifier: GPL-3.0-or-later
;
; Drop-ins for House of the Dead: Scarlet Dawn without TeknoParrot (docs/dropins.md).
;
; rg-allsio.dll (tools/rg-allsio, tools/dev/build-allsio.sh) fakes the Sega ALLS USB-IO board that amdaemon.exe looks
; up as a HID device, and feeds it from the TeknoParrotPipe control pipe (the AllsUsbIo report of our own daemon). The
; loader preloads it into every process of the game; it only acts in amdaemon.exe and in the game process it only
; provides the COM1 gun sensor when RG_ALLSIO_GUN_SENSOR=1. Log: rg-allsio.log next to the DLL (the game folder in the
; view). Optional environment in [Env] of game.ini: RG_ALLSIO_PIPE, RG_ALLSIO_PERIOD_MS, RG_ALLSIO_OFF=1.
;
; config.json: the AMDaemon configuration (USB-IO node with coin input, 8 start switches and the unique-IO feature the
; game expects, plus the input table with start, gun select, gun special, test and service).
;
; To disable: remove the section (then there is no USB-IO board and the game starts without input from the daemon).

[rg-allsio.dll]
To = .
Preload = true

[config.json]
To = ../../../AMDaemon
