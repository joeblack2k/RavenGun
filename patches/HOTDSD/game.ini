; Gegenereerd door scripts/migrate-game-settings.py (docs/per-game-patches.md). Sleutels die het script afleidt uit de oude bronnen worden bij
; elke run opnieuw gezet; handwerk in andere sleutels blijft staan.
;
; Uit het oude UserProfiles/HOTDSD.env:
; HOTDSD (twee exe): via TeknoParrotUi met de wine-prefix-wrapper; RG_UNSET_REMOTETHREAD haalt TP_REMOTETHREAD weg (standaardroute van de lader)

[Game]
Name = House of the Dead: Scarlet Dawn
Profile = HOTDSD
Type = TeknoParrot
EmulationProfile = ALLSHOTDSD
Executable = Hodzero-Win64-Shipping.exe
Executable2 = amdaemon.exe
Is64Bit = true
ProfileRevision = 21
HasTwoExecutables = true
LaunchSecondExecutableFirst = true

[Launch]
Mode = tpui

[Loader]
RemoteThread =

[Wine]
Prefix = shared
Runner = wrapper

[Input]
Route = evdev
Note = speelbaar via TeknoParrotUi (twee exe's: amdaemon.exe en de game; launch-direct.py start geen profielen met twee exe's): UserProfiles/HOTDSD.env heeft RG_WINEPREFIX en RG_UNSET_REMOTETHREAD=1, UserProfiles/HOTDSD.xml heeft WineRunnerPath = wrappers/wine-prefix. TeknoParrotUi zet onder Wine zelf TP_REMOTETHREAD (remote-thread-route: 'Failed to find kernel32.dll in target process'); de wrapper haalt die weg, zodat de lader zijn standaardroute neemt. Invoer: RawInput-bindingen op de virtuele apparaten (start toets 1, trekker linkerknop, subtrekker rechterknop), de kern praat via de pipes TeknoParrotPipe en TeknoParrot_JVS met TeknoParrotUi; vrij spel (FreePlay=1)

[Env]
RG_UNSET_REMOTETHREAD = 1

; Voor de directe start met twee exe's (open punt): eerst amdaemon.exe (ExecutableName2, LaunchSecondExecutableFirst),
; 5 seconden wachten (DAEMON_WAIT_SECONDS uit StartApp.bat), dan Hodzero-Win64-Shipping.exe. AMDaemon/config.json heeft
; error.auto_reset = true: een herstart na een fout is gewoon gedrag.
[Status]
Status = playable
Note = Speelbaar via TeknoParrotUi (twee programma's: AM Daemon en de game): start (toets 1), vizier (gemeten op hoeken en midden), trekker (linkerknop) en subtrekker (rechterknop, wisselt van wapen) werken; vrij spel, een ronde gespeeld. Laden naar de eerste ronde duurt ongeveer 1,5 minuut. Echte Move-knoppen, speler 2 en testmenu niet getest.
NoteEN = Playable through the TeknoParrot UI (two programs: AM Daemon and the game): start (key 1), crosshair (measured at the corners and centre), trigger (left button) and sub trigger (right button, switches weapon) work; free play, one round played. Loading to the first stage takes about 1.5 minutes. Real Move buttons, player 2 and the test menu not tested.

; Profiel uit TeknoParrot-sjabloon GameProfiles/HOTDSD.xml, revisie 21 (scripts/import-tp-profiles.py; opnieuw importeren in plaats van met de hand wijzigen)
