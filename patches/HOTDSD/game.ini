; House of the Dead: Scarlet Dawn (Sega ALLS, Unreal Engine 4.18, 64-bit).
; The profile name is the folder in patches/; the game itself lives in the NAS folder "HOTD Scarlet Dawn".
;
; Route: rg-direct with RavenGun's own core (OpenParrot64, [Loader] Core = ravengun). No TeknoParrot core,
; no TeknoParrotUi, no start script. amdaemon.exe runs first (it is the Sega AM Daemon), then the game.
;
; What amdaemon needs from us:
;  * the platform identity in the registry (HKLM\System\SEGA\SystemProperty; [Launch] Registry = data/platform.reg);
;  * the Sega ALLS USB-IO board, which it looks up as a HID device: patches/HOTDSD/dropin/rg-allsio.dll fakes it
;    in the daemon process and feeds it from the AllsUsbIo control pipe of our own daemon;
;  * the gun sensor on COM1 inside the game process (RG_ALLSIO_GUN_SENSOR=1) and the local Unreal gun mode
;    (RG_ALLSIO_GUN_CONFIG=1).

[Game]
Name = House of the Dead: Scarlet Dawn
Profile = HOTDSD
Type = TeknoParrot
EmulationProfile = ALLSHOTDSD
Executable = Hodzero-Win64-Shipping.exe
Executable2 = amdaemon.exe
Is64Bit = true
ProfileRevision = 21
HasTwoExecutables = true
LaunchSecondExecutableFirst = true

[Launch]
Arguments = -UNATTENDED
Mode = direct
; The platform identity amdaemon.exe reads from HKLM\System\SEGA\SystemProperty\Static (PlatformId, exactly four
; characters). data/platform.reg holds synthetic values in the format the daemon validates; see the comments there.
Registry = data/platform.reg
; UE4 renders through Direct3D 11; wined3d (OpenGL) cannot even create a context for it in this prefix
; ("err:d3d:wined3d_caps_gl_ctx_create Failed to find a suitable pixel format", measured 2026-10-20), so DXVK
; (Vulkan) does the rendering, exactly like MarioKartDX. The DLLs land next to BOTH exe's in the view, because the
; override (d3d9,d3d11,dxgi = native) holds for the whole run and our loader loads the core in both processes;
; that core imports d3d9.dll (amdaemon.exe stopped with "import_dll Library d3d9.dll ... not found" without them).
Dxvk = true

[Loader]
; RavenGun's own OpenParrot64 core in both processes (generic route, the drive-letter redirect of patch 0004).
Core = ravengun
; The loader's default route (entry-point trampoline) is the only one that lets the core attach: the launcher then leaves
; TP_REMOTETHREAD unset (direct.cpp erases it for "off"). The remote-thread injection needs TeknoParrotUi and does not
; work under Wine. This is the same setting as _defaults/TeknoParrot.ini, made explicit because it matters here.
RemoteThread = off

[Wine]
; Plain Wine through the engine, like MarioKartDX: no wrapper script in the launch path (the old [Wine] Runner = wrapper
; pointed at scripts/wine-prefix.sh, which only set WINEPREFIX and unset TP_REMOTETHREAD -- both are engine behaviour now,
; [Wine] Prefix below and [Loader] RemoteThread above).
Prefix = shared

[Display]
; Full screen through gamescope, like MarioKartDX: UE4 opens a 16:9 window and gamescope scales it to the whole screen.
; [Display] GamescopeBackend (docs/game-opties.md) is honoured here too: "headless" for a measurement while the TV is in use.
Gamescope = true
GamescopePath = /usr/bin/gamescope

[Input]
; Triggers and aim through the shared memory (HOTDSDPipe layout); START, sub-trigger, controller select, test and
; coin through the ALLS USB-IO report on \\.\pipe\TeknoParrotPipe (control pipe AllsUsbIo).
Route = tp-shm
Layout = HOTDSDPipe
ControlPipe = AllsUsbIo
Note = rg-direct starts amdaemon.exe first, waits 5 s (DAEMON_WAIT_SECONDS in StartApp.bat) and then starts the game. The daemon writes triggers and aim into the shared memory (HOTDSDPipe) and the 64-byte ALLS USB-IO report for START, sub-trigger (grenade), controller select (aux1), test (key 0 / F2) and coin (key 5); rg-direct streams that report every 15 ms to \\.\pipe\TeknoParrotPipe. Free play is on (FreePlay=1).

[Env]
; rg-allsio.dll: the 15-character main-board identity of the emulated ALLS board, and the two gun options for the
; game process (COM1 gun sensor + the local Unreal gun mode in Game.ini).
RG_ALLSIO_MAIN_ID = RAVENGUN0000001
RG_ALLSIO_PLATFORM = 1
RG_ALLSIO_GUN_SENSOR = 1
RG_ALLSIO_GUN_CONFIG = 1

; Button labels for the first-start explanation (docs/per-game-patches.md, "Controls per game").
[Controls]
trigger = Trigger | Fires the gun; in the menus, shoot to select.
reload = Reload | Aim off screen (or press reload): the ammo restocks.
grenade = Sub-trigger | Switches to your next item (shotgun, grenade launcher, ...).
aux1 = Controller select | Also switches the item.

[Status]
Status = untested
Note = Measured 2026-10-20 on the shipped no-TeknoParrot route, headless gamescope, started with ravengunctl game start HOTDSD (plain Wine, our own OpenParrot64 core in both exe's, amdaemon.exe first, rg-allsio.dll as the Sega ALLS USB-IO board and the COM1 gun sensor, synthetic platform values, DXVK). ATTRACT: PL_InitializeTest then PL_Advertise, the game's own attract with the title and 'PRESS START BUTTON / FREE PLAY', more than 5 minutes without a crash (docs/screenshots/hotdsd-attract-2026-10-20.png). PLAY: free play, no coin needed. START during the attract first jumps to the title; a second START enters the game (PL_Entry, mode select). Shooting selects in the menus (story mode, two items, YES); PL_StageSelect, PL_Stage0, the intro skips with START ('CANCEL WITH THE START BUTTON'). In the stage the trigger fires (hits, 'EXCELLENT', the machine-gun ammo bar goes down), the reload button refills the ammo bar (RavenGun's reload bit in HOTDSDPipe, which rg-allsio reports as gun off screen with the trigger pulled; the game also restocks by itself when you aim off screen), the sub-trigger (Cross) switches to the next item (shotgun 12 shots, firing it leaves 11) and controller select does the same. After a lost life CONTINUE? accepts START (free play) and GAME OVER returns to the attract. AIM: the game's stored gun adjustment did not match (a centred aim showed the cursor at about 0.54/0.37). It was adjusted ONCE in the game's own TEST menu (CONTROLLER ADJUSTMENT, the five targets shot with test-pattern points; player 1 now TOP 48, LEFT 28, CENTER 514/514, RIGHT 995, BOTTOM 975), stored in the game's backup in RavenGun's write layer (writelayer/HOTDSD .../AMDaemon/TeknoParrot/D/SDET/appfile.dat). Since then the cursor follows test-pattern points to the four corners (0.1/0.9) and the middle within 0.01. Player 2 is not adjusted. A new write layer starts from the NAS backup again and needs that adjustment again. Without DXVK the game gets no Direct3D context, so [Launch] Dxvk is required; the DXVK DLLs also go next to amdaemon.exe, because our core imports d3d9.dll in both processes. Not measured: the real PS Move (rumble, Sharp Shooter pump), player 2.
NoteEN = Measured 2026-10-20 on the shipped no-TeknoParrot route, headless gamescope, started with ravengunctl game start HOTDSD (plain Wine, our own OpenParrot64 core in both exe's, amdaemon.exe first, rg-allsio.dll as the Sega ALLS USB-IO board and the COM1 gun sensor, synthetic platform values, DXVK). ATTRACT: PL_InitializeTest then PL_Advertise, the game's own attract with the title and 'PRESS START BUTTON / FREE PLAY', more than 5 minutes without a crash (docs/screenshots/hotdsd-attract-2026-10-20.png). PLAY: free play, no coin needed. START during the attract first jumps to the title; a second START enters the game (PL_Entry, mode select). Shooting selects in the menus (story mode, two items, YES); PL_StageSelect, PL_Stage0, the intro skips with START ('CANCEL WITH THE START BUTTON'). In the stage the trigger fires (hits, 'EXCELLENT', the machine-gun ammo bar goes down), the reload button refills the ammo bar (RavenGun's reload bit in HOTDSDPipe, which rg-allsio reports as gun off screen with the trigger pulled; the game also restocks by itself when you aim off screen), the sub-trigger (Cross) switches to the next item (shotgun 12 shots, firing it leaves 11) and controller select does the same. After a lost life CONTINUE? accepts START (free play) and GAME OVER returns to the attract. AIM: the game's stored gun adjustment did not match (a centred aim showed the cursor at about 0.54/0.37). It was adjusted ONCE in the game's own TEST menu (CONTROLLER ADJUSTMENT, the five targets shot with test-pattern points; player 1 now TOP 48, LEFT 28, CENTER 514/514, RIGHT 995, BOTTOM 975), stored in the game's backup in RavenGun's write layer (writelayer/HOTDSD .../AMDaemon/TeknoParrot/D/SDET/appfile.dat). Since then the cursor follows test-pattern points to the four corners (0.1/0.9) and the middle within 0.01. Player 2 is not adjusted. A new write layer starts from the NAS backup again and needs that adjustment again. Without DXVK the game gets no Direct3D context, so [Launch] Dxvk is required; the DXVK DLLs also go next to amdaemon.exe, because our core imports d3d9.dll in both processes. Not measured: the real PS Move (rumble, Sharp Shooter pump), player 2.
Findings = findings/HOTDScarletDawn.md

