# Walking Dead (Raw Thrills), native route (game, 19.165.184 B, sha256 efbd9b52...0006, the dumped HASPE image): the RIO
# lightgun board, answered AS THE BOARD over USB. Read by tools/rio-bridge/rg_rio_bridge.c (32-bit lib32/librg_rio_bridge.so)
# through RG_RIO_TABLE. Same model as Jurassic Park, and like Aliens Armageddon WITHOUT encryption.
#
# MEASURED 2026-10-14 (static, objdump on the dump; no run). No symbols for the RIO code; found the same way as for Aliens
# Armageddon (patches/AliensArmageddon/rio-invoer.ini):
#   * pmrt_usb_open(0x0c70, 0x0780) is called from 0x081cee13 (RIO_Connect) and 0x081cef34 (RIO_ConnectEx) -> 0x0827b98b.
#     Block: open, close 0x0827bc84, reset 0x0827bd80, bulk_read 0x0827bdd6, bulk_write 0x0827be93, interrupt_write 0x0827bf47,
#     interrupt_read 0x0827bffb (same order and sizes as Jurassic Park).
#   * RIO_GetReport 0x081cf0d7: interrupt_read(devp, buf, 0x40), no xrtea; no XTEA key in the image -> `versleuteling geen`.
#   * read thread 0x081d17a6 -> parse_in_report 0x081cfce2 -> message table 0x08a6e1e0 -> type 2 -> 0x081d0b2d: 19 process_sw +
#     4 process_adc, byte for byte Jurassic Park's layout (reportmap.py output identical).
# The switch ids and the gun inputs were measured on 2026-10-22 (see the RIO and UMC sections below). The dongle text says
# "Defaulting to mounted gun": the mounted crossbows (position, trigger, reload lever) are read from the UMC board, not the RIO.
proces      naam=rg-elfloader
beeld       bits=8
usb         vid=0c70 pid=0780 interval=4 type=2 lengte=64 som=63
haak        naam=pmrt_usb_open            rol=open    adres=0827b98b sig=5589e583ec58
haak        naam=pmrt_usb_interrupt_read  rol=lees    adres=0827bffb sig=5589e55383ec34
haak        naam=pmrt_usb_interrupt_write rol=schrijf adres=0827bf47 sig=5589e55383ec34
haak        naam=pmrt_usb_close           rol=sluit   adres=0827bc84 sig=5589e583ec28
# UMC-bord en 12V (statisch gemeten 2026-10-18, objdump op de dump):
#   * pmrt_usb_count(vid,pid) = 0x0827c1dc; de game vraagt (0c70,0784) en opent dan /dev/umc als seriele poort via 0x081ceaac
#     (serial_open(&handvat, pad, 115200, 0, &fout)); "UMC verbonden" = poort geopend (0x081cb78f -> [obj+4] != 0).
#   * 12V: 0x081caa55 leest poort 0x1c = byte 0xf van de payload van een rapport TYPE 1 (rapportbyte 18), bit 3 (0x08) moet gezet zijn
#     (0x081d01f8, type-1-verwerker, schrijft het in 0x1b8 van de momentopname). Zonder type-1-rapport blijft het 0 -> RIO_12V_ERROR.
haak        naam=pmrt_usb_count           rol=tel     adres=0827c1dc sig=5589e583ec48
haak        naam=pmrt_serial_open         rol=seriel  adres=081ceaac sig=5589e583ec68
umc         vid=0c70 pid=0784 pad=/dev/umc crc=b2 begin=23 interval=10
# THE GUNS ARE ON THE UMC BOARD, NOT ON THE RIO BOARD (measured 2026-10-22, headless, TEST > Input Tests):
#   * RIO: no switch id 0..18 lights "Gun 1/2 Trigger" in Switch Tests, no type-1 status bit does, and moving the RIO ADC
#     channels 19..22 does not move the Gun Tracking cursors. The RIO board only carries the cabinet switches below.
#   * UMC (/dev/umc, ASCII frames "W<type><hex fields><crc8 2 hex>z", see umc_zender in rg_rio_bridge.c): parser 0x081ce0ff,
#     CRC-8 0x081ce88d (reflected polynomial b2, start byte 0x23 at 0x08a6e080; checked: our CRC of "W033" is 07, the poll
#     frame the game itself sends is "W03307z"). Type '2' = switches 0..3 (2 hex, a transition counter, odd = pressed) and
#     analogs 0..3 (3 hex); type '3' = switches 4..7 and analogs 4..7. Measured by setting one field at a time
#     (RG_RIO_UPROBE) with the game in its own test screens:
#       switch 4 (W3 pos 2)  = Gun 1 Trigger (Switch Tests "Active"; also advances the LEFT GUN calibration)
#       switch 6 (W3 pos 6)  = Gun 2 Trigger (Switch Tests "Active")
#       analog 4 (W3 pos 10) = gun 1 X, analog 5 (pos 13) = gun 1 Y, analog 6 (pos 16) = gun 2 X, analog 7 (pos 19) = gun 2 Y;
#                              lower value = further right / further down (0x300 put the reticle at 0.81 of the screen).
#                              Gun 1 = LEFT gun = player 1 (green in the game's screens; its calibration reads analogs 4/5 and
#                              stores them in mountedGun0Calibration), gun 2 = RIGHT gun = player 2 (blue, mountedGun1Calibration)
#       analog 2 (W2 pos 18) = P1 reload lever, analog 3 (W2 pos 21) = P2 reload lever (Reload Test bar: 000 = left/yellow
#                              end, 008 and higher = right/red end)
#     Switches 0..3, 5, 7, analogs 0..1 and the byte at W2 pos 2: no effect found in Switch Tests, Gun Tracking or Reload Test.
#   Before this the bridge only drained /dev/umc; its drain thread stopped on the first EAGAIN, the game's poll writes then
#   failed and the game reopened the port in a loop (gamelog "CMGR-Device:UMC State:IO_CMRG_STATE_RETRY").
umcframe    type=2 lengte=24
umcframe    type=3 lengte=22
umcveld     type=2 pos=18 breedte=3 bit=7  aan=000 uit=800    # P1 reload lever (p1.reload)
umcveld     type=2 pos=21 breedte=3 bit=11 aan=000 uit=800    # P2 reload lever (p2.reload)
umcveld     type=3 pos=2  breedte=2 id=40                     # gun 1 trigger (counter of id 40 = p1.trigger)
umcveld     type=3 pos=6  breedte=2 id=41                     # gun 2 trigger (counter of id 41 = p2.trigger)
umcveld     type=3 pos=10 breedte=3 ch=40                     # gun 1 X (player 1)
umcveld     type=3 pos=13 breedte=3 ch=41                     # gun 1 Y
umcveld     type=3 pos=16 breedte=3 ch=42                     # gun 2 X (player 2)
umcveld     type=3 pos=19 breedte=3 ch=43                     # gun 2 Y
status      type=1 elke=16
statusbyte  byte=18 waarde=08
versleuteling geen
# Report type 2 (payload byte N = report byte 3+N), identical to Jurassic Park.
veld id=0  byte=3  deel=hoog
veld id=1  byte=3  deel=laag
veld id=2  byte=4  deel=hoog
veld id=18 byte=4  deel=laag
veld id=3  byte=5  deel=hoog
veld id=4  byte=5  deel=laag
veld id=5  byte=6  deel=hoog
veld id=6  byte=6  deel=laag
veld id=7  byte=8  deel=hoog
veld id=8  byte=8  deel=laag
veld id=9  byte=9  deel=hoog
veld id=10 byte=9  deel=laag
veld id=11 byte=10 deel=hoog
veld id=12 byte=10 deel=laag
veld id=17 byte=11 deel=hoog
veld id=13 byte=12 deel=hoog
veld id=14 byte=12 deel=laag
veld id=15 byte=13 deel=hoog
veld id=16 byte=13 deel=laag
# Board image: layout RawThrillsGUN (game.ini [Input] Layout): bit 0 test, 1 service, 2 coin1, 3 coin2, 4 p1.start,
# 5 p1.trigger, 6 p1.grenade, 7 p1.reload, 8 p2.start, 9 p2.trigger, 10 p2.grenade, 11 p2.reload, 12 volume_up, 13 volume_down.
# RIO switch ids measured 2026-10-22 in TEST > Input Tests > Switch Tests (RG_RIO_PROBE, one bit at a time): 0 Coin Slot 1,
# 1 Coin Slot 2, 2 DBV, 3 Test, 4 Service, 5 Vol +, 6 Vol -, 7 Player 1 Start, 8 Player 2 Start; 9..18 change nothing there.
schakelaar bit=0  id=3            # test        -> 3 Test
schakelaar bit=1  id=4            # service     -> 4 Service
schakelaar bit=2  id=0            # coin1       -> 0 Coin Slot 1
schakelaar bit=3  id=1            # coin2       -> 1 Coin Slot 2
schakelaar bit=4  id=7 min=300    # p1.start    -> 7 Player 1 Start
schakelaar bit=8  id=8 min=300    # p2.start    -> 8 Player 2 Start
schakelaar bit=12 id=5            # volume_up   -> 5 Vol +
schakelaar bit=13 id=6            # volume_down -> 6 Vol -
# Gun triggers: counters for the UMC frames above (ids 40/41 are not RIO switches, no `veld` line sends them to the RIO).
schakelaar bit=5  id=40           # p1.trigger
schakelaar bit=9  id=41           # p2.trigger
# Gun position for the UMC analogs: 12-bit, inverted (lower = right / down). Calibration in the game's own screen.
kanaal bron=12 ch=40 min=0 max=4095 inverteer=ja    # p1.x
kanaal bron=16 ch=41 min=0 max=4095 inverteer=ja    # p1.y
kanaal bron=20 ch=42 min=0 max=4095 inverteer=ja    # p2.x
kanaal bron=24 ch=43 min=0 max=4095 inverteer=ja    # p2.y
