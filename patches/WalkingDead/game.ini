Note = Niet getest met de PS Move. Op de testbank (synthetisch richten): start direct naar attract in free play, kruisboog schiet en scoort, herladen werkt, richten binnen 10 px, 2 spelers, game over terug naar attract. Zie NoteEN.
NoteEN = UNTESTED with the PS Move: it stays untested until the owner has played it with the Move. Measured on the headless bench on 2026-10-22 with a mouse source and synthetic aim (ravengunctl test-pattern), not with the Move. The mounted crossbows are not on the RIO board but on the UMC board (/dev/umc, an ASCII "W...z" protocol with a CRC-8): the RIO bridge now answers as that board (rio-invoer.ini; before this the game reopened /dev/umc every 6 s, "IO_CMRG_STATE_RETRY", and no gun input reached it). Clean start: with the seeded free play setting and both mounted-gun calibrations (patches/WalkingDead/data, made with the game's own Adjustments and calibration screens, aiming at the screen corners) the game goes straight to attract showing FREEPLAY, no calibration screen and no money screen. Switch ids from the game's own Switch Tests: coin 0/1, DBV 2, Test 3, Service 4, Vol+/- 5/6, Start 7/8 (RIO); gun 1/2 trigger = UMC switch 4/6, gun 1 X/Y = UMC analog 4/5, gun 2 X/Y = analog 6/7 (both inverted), reload lever P1/P2 = analog 2/3 (Reload Test). Aim: the game's reticle in the test menu sits within 10 px (0.5% of the width) of the commanded point at the middle, the four 0.1/0.9 corners and the edge midpoints, for both guns (17 of 18 points measured; P1 at 0.9,0.5 was hidden by a menu highlight). Play: Start, then a shot on Story Mode starts a mission; bolts hit and kill (kills counted per player), the reload lever refills the bolts (0 -> 8); 3 minutes with both players (P1 12 kills, P2 18 kills), then left alone: CONTINUE? countdown, game over and back to attract with FREEPLAY. Not measured: rumble/recoil (the game drives the RIO lamp outputs while playing; force-feedback commands to the UMC board were not logged), grenade (no such input found).
