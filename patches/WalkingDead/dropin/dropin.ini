; Drop-in van RavenGun voor The Walking Dead (Raw Thrills, 32-bits ELF, HASPE-gepakt zoals Jurassic Park). Indeling: docs/dropins.md.
;
; eerste-plt-slots.tsv koppelt de 806 import-slots van de gedumpte game aan namen (EERSTE-PLT-SLOTS.md); rg-elfloader leest
; hem via RG_ELF_SLOT_TABLE. Nog niet gestart: zie EERSTE-PLT-SLOTS.md, "Loader blocker" (e_entry is main) en libcaca.so.0.
[eerste-plt-slots.tsv]
To = .
Env = RG_ELF_SLOT_TABLE=eerste-plt-slots.tsv

; De HASP-HL-cliënt (statisch): de inline-hook met de adreslijst hasp-haken.ini. Zie aldaar.
[libravengun-hasphook.so]
To = .
Preload = true
Audit = false
Env = RAVENGUN_HASP_DIR=ravengun-hasp;RAVENGUN_HASP_GAME=WalkingDead;RAVENGUN_HASP_ELF_LIB=./ravengun-hasp.so;RAVENGUN_HASP_ELF_ADRESLIJST=hasp-haken.ini;RAVENGUN_HASP_VERBOSE=1

[ravengun-hasp.so]
To = .

[hasp-haken.ini]
To = .

[ravengun-hasp/WalkingDead/dongle.json]
To = .
