; After Dark (UNIS, 2012; Virtools GamePlayer.exe, 32-bits). Profiel uit het TeknoParrot-sjabloon, herkenning gemeten aan de
; NAS-map "After Dark" (alleen gelezen).
;
; Drie dingen waren nodig (bench 2026-10-15):
; 1. dropin/rg-compat.dll: de speler roept IDirectInput::Initialize aan met een lege HINSTANCE en Wine weigert dat; zonder de fix
;    stopt hij met "Initalization Error - Cannot Initalize Input Manager" (gemeten met WINEDEBUG=+dinput).
; 2. Films: de hoofdthread bleef op "System initializing, please wait..." staan direct na het openen van Res\Video01.WMV (gemeten
;    met WINEDEBUG=trace+file). Met Gst32 + data/wmv-asyncreader.reg (hetzelfde recept als OG) speelt de attractfilm en loopt het
;    spel door.
; 3. Beeld: met wined3d en met alleen DXVK waren grote delen van de wereld zwart (gebouwen, weerwolven, voertuig); de cutscene-
;    figuren eerst ook. De speler maakt zijn materialen met D3DXCreateEffect (d3dx9_41, .fx-bronnen); de ingebouwde d3dx9_41 van
;    Wine kan die niet vertalen. Met de d3dx9_41 van Microsoft (NativeDlls, uit de DirectX-map van Steam, nooit in git) plus DXVK is
;    alles getextureerd (vacht, klauwen, dorp).

[Game]
Name = After Dark
Profile = AfterDark
Executable = GamePlayer.exe
Type = TeknoParrot
EmulationProfile = WartranTroopers
ProfileRevision = 3

[Launch]
Mode = direct
Gst32 = true
Dxvk = true
NativeDlls = d3dx9_41
Registry = data/wmv-asyncreader.reg

[Display]
Gamescope = true
GamescopePath = /usr/bin/gamescope

[Input]
Route = tp-shm
Layout = WartranTroopers
Note = tp-shm, indeling WartranTroopers (recept Raccoon Rampage): munt (toets 5), START (toets 1), trekker en richten komen aan

; Bediening voor de knoppen-uitleg bij de eerste start (docs/per-game-patches.md, "Bediening per game"); labels uit het
; TeknoParrot-profiel (GameProfiles/<P>.xml), "Not confirmed yet" = de werking is nog niet gemeten.
[Controls]
trigger = Shoot | Fires the gun.

[Status]
Status = parked
Note = PARKED sinds 2026-10-19: op onze eigen kern ([Loader] Core = ravengun) start het spel en komt het tot zijn eigen donglecontrole, "Init Dongle Failed!"; de attract vraagt de dongle-antwoorden en die hebben we niet (bench-captures/AfterDark/20261019-dongle.png). Met de gesloten TeknoParrot-kern speelde het wel -- WERKT via dubbelklik in de app (2026-10-15): attract met film, munt, START, twee levels (Silent Valley, Castle of Shadows), continue, score 69000; 5,5 min gespeeld met de muismodus. Recept: rg-compat (DirectInput met lege HINSTANCE), Gst32 + data/wmv-asyncreader.reg (film), DXVK + d3dx9_41 van Microsoft (zonder die twee zwarte wereld), gamescope. Open: de eigenaar hoorde haperend geluid in de eerste run (wined3d); na DXVK nog niet nagemeten. HERMETEN 2026-10-19 (punt G): opnieuw een start op onze eigen kern gedaan; het logboek zegt "Success! / Have fun :)" en de foto (docs/screenshots/afterdark-dongle-failed-2026-10-19.png) laat precies hetzelfde zien als bij het parkeren: het venster "Init Dongle Failed !" met een OK-knop. De parkeerreden staat dus nog.
NoteEN = READ 2026-10-21 (static, on our own view copy): the gate is one branch. Window procedure path of GameLaunch: 0x406474 call 0x415ca0 -> 0x406479 test al,al -> 0x40647b jne 0x4064a2 (continue); the fall-through at 0x40647d pushes MB_ICONHAND with caption "GameLaunch" (0x7d12b4) and text "Init Dongle Failed !" (0x7d1a78) and returns false. 0x415ca0 itself: it creates the ATL object (0x415b30, stored at 0x8987b0), then walks a fixed array of object slots at 0x8983b0 (0x400 bytes = up to 0x100 dwords, slots released and cleared on failure) and for each slot calls vtable [0x1c], then a pair with [0x14](obj, out, "InsGame", 0) and [0x10](obj, &slot, out), then [0x58](obj, "3DGame", 6) and [0x10](obj, &slot, out); ebx counts the slots that passed and AL is what the caller tests. "InsGame" and "3DGame" are ATL property names, so the dongle is read as a property bag by name, not as a serial number we could guess. Measured under plain Wine (+file, no board): hid.dll is loaded from system32 and the trace has no access to \\.\ITOKEN2 at all in that early run, so the first failure is a property read, before any device I/O. MEASURED 2026-10-21 08:26 (full recipe: rg-direct --run of the plan, gamescope headless, rg-compat loaded, "Have fun :)"): with the unpatched exe the game sits idle at the dongle gate (0.6 % CPU after a minute) -- that is the "Init Dongle Failed !" box. Then one byte at 0x40647b was changed in a local copy of the exe (75 -> EB, "jne success" becomes "jmp success"; the old bytes were checked first) and that copy was put in the view in place of the symlink for one run (symlink restored afterwards): the game does NOT crash and does NOT show the box, it exits with code 0 within seconds. So skipping that single gate is not enough -- the dongle object has to answer its properties, otherwise the game shuts itself down. NEXT: read the ATL property map of the class behind 0x415b30 to get every property name with its type and the value each slot is asked for, then answer them (device/ATL stub) or patch this one gate -- one byte at 0x40647b (75 25 -> eb 25) forces the success branch, but the success path dereferences 0x8983b0, so it is only safe once the object exists. READ FURTHER 2026-10-21 09:15 (static, own view copy): the dongle object is ATL CComObject<CCoDongle2> with interface ICoDongle2; its constructor is 0x415930 (allocates 0x30 bytes from 0x415b30) and it stores the vtable 0x7d3ca4, which holds 17 entries (QueryInterface 0x4159c0, AddRef, Release 0x415990, then 0x492e20, 0x40af60, 0x40a7b0, 0x40a890, 0x40a5f0, 0x40ab90, 0x415ad0, 0x84402c, 0x415c80, 0x415bf0, 0x415c00, 0x7027d0, 0x415c10, 0x415c60). What 0x415ca0 and the success path ask of it: [vt+0x1c](this), then per slot of up to 0x100 at 0x8983b0 "[vt+0x14](this,&out,\"InsGame\",0) then [vt+0x10](this,&slot,&out)" and "[vt+0x58](this,\"3DGame\",6) then [vt+0x10](this,&slot,&out)"; after the gate, 0x4064a2 does [vt+0x10], [vt+0x30](this,&local), [vt+0x50](this,0,&buf,8,0x42) -- an 8-byte dongle read with mode 0x42 -- and then starts a thread (0x415850 with proc 0x415560) and sets 0x439168(this,\"InsGame\",1). NOTE: +0x50 and +0x58 lie outside the 17-entry vtable of CComObject<CCoDongle2>, so the object the game holds is the ATL aggregate/contained wrapper; that wrapper (and therefore the real member functions the names go to) is the next thing to pin down. The device is addressed by a 16-byte id: 0x436260 compares four dwords against a table at 0x874e00 and returns the name "ITOKEN2" (0x7d4bfc); the strings "UserBB Dongle" (0x7d2790, used at 0x40c4d2 and 0x40c702) and "Dongle Auth" (0x7d27b8, used at 0x40c72f) belong to a dongle status dialog worth reading for the values it expects. PLAN: log the real call sequence with a small 32-bit drop-in that hooks CreateFileA/DeviceIoControl/ReadFile for the ITOKEN2 name (the rg-rhio pattern) and answer it from what the code above checks, then patch the getter by patchmem only for values that cannot be produced. PARKED since 2026-10-19: on our own core ([Loader] Core = ravengun) the game starts and reaches its own dongle check, "Init Dongle Failed!"; the attract needs the dongle answers and we do not have them (bench-captures/AfterDark/20261019-dongle.png). With the closed TeknoParrot core it did play -- WORKING via double-click in the app (2026-10-15): attract with movie, coin, START, two stages (Silent Valley, Castle of Shadows), continue, score 69000; played 5.5 min in mouse mode. Recipe: rg-compat (DirectInput with a NULL HINSTANCE), Gst32 + data/wmv-asyncreader.reg (movie), DXVK + Microsoft d3dx9_41 (without those the world renders black), gamescope. Open: the owner heard audio hitches in the first run (wined3d); not re-checked after DXVK.


