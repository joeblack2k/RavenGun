; After Dark (UNIS, 2012; Virtools GamePlayer.exe, 32-bits). Profiel uit het TeknoParrot-sjabloon, herkenning gemeten aan de
; NAS-map "After Dark" (alleen gelezen).
;
; Drie dingen waren nodig (bench 2026-10-15):
; 1. dropin/rg-compat.dll: de speler roept IDirectInput::Initialize aan met een lege HINSTANCE en Wine weigert dat; zonder de fix
;    stopt hij met "Initalization Error - Cannot Initalize Input Manager" (gemeten met WINEDEBUG=+dinput).
; 2. Films: de hoofdthread bleef op "System initializing, please wait..." staan direct na het openen van Res\Video01.WMV (gemeten
;    met WINEDEBUG=trace+file). Met Gst32 + data/wmv-asyncreader.reg (hetzelfde recept als OG) speelt de attractfilm en loopt het
;    spel door.
; 3. Beeld: met wined3d en met alleen DXVK waren grote delen van de wereld zwart (gebouwen, weerwolven, voertuig); de cutscene-
;    figuren eerst ook. De speler maakt zijn materialen met D3DXCreateEffect (d3dx9_41, .fx-bronnen); de ingebouwde d3dx9_41 van
;    Wine kan die niet vertalen. Met de d3dx9_41 van Microsoft (NativeDlls, uit de DirectX-map van Steam, nooit in git) plus DXVK is
;    alles getextureerd (vacht, klauwen, dorp).

[Game]
Name = After Dark
Profile = AfterDark
Executable = GamePlayer.exe
Type = TeknoParrot
EmulationProfile = WartranTroopers
ProfileRevision = 3

[Launch]
Mode = direct
Gst32 = true
Dxvk = true
NativeDlls = d3dx9_41
Registry = data/wmv-asyncreader.reg

[Display]
Gamescope = true
GamescopePath = /usr/bin/gamescope

[Input]
Route = tp-shm
Layout = WartranTroopers
Note = tp-shm, indeling WartranTroopers (recept Raccoon Rampage): munt (toets 5), START (toets 1), trekker en richten komen aan

; Bediening voor de knoppen-uitleg bij de eerste start (docs/per-game-patches.md, "Bediening per game"); labels uit het
; TeknoParrot-profiel (GameProfiles/<P>.xml), "Not confirmed yet" = de werking is nog niet gemeten.
[Controls]
trigger = Shoot | Fires the gun.

[Status]
Status = untested
Note = 2026-10-21: op onze eigen kern voorbij de dongle (rg-compat) en speelbaar headless gemeten: munt, START, trekker, richten en speler 2 via het eigen seriele geweerbord op COM1 (rg-unisgun.dll). Herladen heeft het spel niet. De PS Move-test van de eigenaar staat nog open; details in NoteEN.
NoteEN = GUN BOARD ON OUR CORE 2026-10-21 17:00 (Claude, headless; owner's PS Move test pending): the gun input is a SERIAL board on COM1, not DirectInput and not the HID device -- read in GamePlayer.exe: 0x40e5d0 opens \\.\COM1 (0x416008) at 19200 8N1, the reader 0x40e340 takes 26-byte frames 40 80 .. 0d <xor>, 0x410580 copies them; byte 2/3 = Gun(A)/Gun(B) Buttons (bit 7 = coin, counted on its own), bytes 7-14 = A x, A y, B x, B y big-endian in coin.ini calibration units, byte 4 = gun error. The game writes 50 90 0d only when its 15 s wait times out (22 polls in 5 min), so the board streams. tools/rg-unisgun (rg-unisgun.dll, loaded by rg-compat with RG_COMPAT_LOAD; table dropin/rg-unisgun.ini) answers COM1 in-process from the tp-shm board image: 74.7 reports/s measured (23294 in 312 s), reads coin.ini calibration (gun 1 x 286..3967 y 1575..4092). Bits measured with a probe file: bit 0 = START, bit 1 = trigger, bit 3 = TEST (test menu opens), bit 2 = "Platform Motion Stopped" (never set). MEASURED (screenshots state/ravengun/shots-afterdark2/): attract with "Please Insert Coins" 00/01 (s1.jpg); key 5 -> 01/01 "Push Start Button" (r3-coin.jpg); key 1 -> stage select (r3-start.jpg); trigger selects Castle of Shadows, beam to the crosshair, score 1000 (s6-hold02.jpg); continue with coin + START, game over, back to attract with the movie. Aim (crosshair centre found in full-res shots on the stage map): corners 0.05/0.95 within 1.5 px x and 1 px y, 0.2/0.8 x 0.35/0.65 within 0.5/2 px, centre +3.5/+2 px (the 1-byte tp-shm axis is a 7.5 px step); y grows upwards in the game (aim 0.9,0.9 drew the crosshair top right), hence y.invert = 1. No seed needed (the DLL reads the game's own coin.ini). Off-screen + trigger: the crosshair disappears and the shot goes off-screen; the game has no ammo or reload (no ammo HUD, continuous fire), the reload button does nothing. Player 2: key 6 + key 2 join, red crosshair at the aimed 0.3,0.5, both guns fire with combos (r4-p2.jpg). 5 min 38 s without a crash (16:55:37-17:01:15); the dongle block Do ran 6 times in that run (re-checks during play) and passed every time. OPEN: the test menu does not react to any button bit tried (byte 2 bits 0-6, byte 5 bits 0-1, byte 6 bit 0) -- it may need the gun on its items or another byte; output frames 40 80 <lamps> (bit 0x01 set while P1 fires: 0x60 -> 0x61) are logged only, no PS Move rumble yet. PAST THE DONGLE 2026-10-21 16:30: with RG_DONGLE2_ECHO=1 (the skipped mode-0x30 transform hands its 8 input bytes back, so the block Check Bytes become the scene ID Bytes) and the block internal compare nop-ed (search patch 8b540c183b540c7d7515 -> 8b540c183b540c7d9090 at +0xc418), the game goes past the softdog: the Do runs twice (haak[2] 0xC328 twice), the red "Softdog Init Failed" and "System initializing, please wait..." are gone and the attract scene draws with "Please Insert Coins" and "00/01" (state/ravengun/shots-afterdark/AfterDark-past-dongle-20261021-1631.jpg). So the scene checks the 8 Check Bytes, and for this title they follow the ID Bytes; the echo is the measured answer until the real transform is known. AfterDark now belongs to Claude (movie/attract/input are not dongle work). READ 2026-10-21 (static, on our own view copy): the gate is one branch. Window procedure path of GameLaunch: 0x406474 call 0x415ca0 -> 0x406479 test al,al -> 0x40647b jne 0x4064a2 (continue); the fall-through at 0x40647d pushes MB_ICONHAND with caption "GameLaunch" (0x7d12b4) and text "Init Dongle Failed !" (0x7d1a78) and returns false. 0x415ca0 itself: it creates the ATL object (0x415b30, stored at 0x8987b0), then walks a fixed array of object slots at 0x8983b0 (0x400 bytes = up to 0x100 dwords, slots released and cleared on failure) and for each slot calls vtable [0x1c], then a pair with [0x14](obj, out, "InsGame", 0) and [0x10](obj, &slot, out), then [0x58](obj, "3DGame", 6) and [0x10](obj, &slot, out); ebx counts the slots that passed and AL is what the caller tests. "InsGame" and "3DGame" are ATL property names, so the dongle is read as a property bag by name, not as a serial number we could guess. Measured under plain Wine (+file, no board): hid.dll is loaded from system32 and the trace has no access to \\.\ITOKEN2 at all in that early run, so the first failure is a property read, before any device I/O. MEASURED 2026-10-21 08:26 (full recipe: rg-direct --run of the plan, gamescope headless, rg-compat loaded, "Have fun :)"): with the unpatched exe the game sits idle at the dongle gate (0.6 % CPU after a minute) -- that is the "Init Dongle Failed !" box. Then one byte at 0x40647b was changed in a local copy of the exe (75 -> EB, "jne success" becomes "jmp success"; the old bytes were checked first) and that copy was put in the view in place of the symlink for one run (symlink restored afterwards): the game does NOT crash and does NOT show the box, it exits with code 0 within seconds. So skipping that single gate is not enough -- the dongle object has to answer its properties, otherwise the game shuts itself down. NEXT: read the ATL property map of the class behind 0x415b30 to get every property name with its type and the value each slot is asked for, then answer them (device/ATL stub) or patch this one gate -- one byte at 0x40647b (75 25 -> eb 25) forces the success branch, but the success path dereferences 0x8983b0, so it is only safe once the object exists. READ FURTHER 2026-10-21 09:15 (static, own view copy): the dongle object is ATL CComObject<CCoDongle2> with interface ICoDongle2; its constructor is 0x415930 (allocates 0x30 bytes from 0x415b30) and it stores the vtable 0x7d3ca4, which holds 17 entries (QueryInterface 0x4159c0, AddRef, Release 0x415990, then 0x492e20, 0x40af60, 0x40a7b0, 0x40a890, 0x40a5f0, 0x40ab90, 0x415ad0, 0x84402c, 0x415c80, 0x415bf0, 0x415c00, 0x7027d0, 0x415c10, 0x415c60). What 0x415ca0 and the success path ask of it: [vt+0x1c](this), then per slot of up to 0x100 at 0x8983b0 "[vt+0x14](this,&out,\"InsGame\",0) then [vt+0x10](this,&slot,&out)" and "[vt+0x58](this,\"3DGame\",6) then [vt+0x10](this,&slot,&out)"; after the gate, 0x4064a2 does [vt+0x10], [vt+0x30](this,&local), [vt+0x50](this,0,&buf,8,0x42) -- an 8-byte dongle read with mode 0x42 -- and then starts a thread (0x415850 with proc 0x415560) and sets 0x439168(this,\"InsGame\",1). NOTE: +0x50 and +0x58 lie outside the 17-entry vtable of CComObject<CCoDongle2>, so the object the game holds is the ATL aggregate/contained wrapper; that wrapper (and therefore the real member functions the names go to) is the next thing to pin down. The device is addressed by a 16-byte id: 0x436260 compares four dwords against a table at 0x874e00 and returns the name "ITOKEN2" (0x7d4bfc); the strings "UserBB Dongle" (0x7d2790, used at 0x40c4d2 and 0x40c702) and "Dongle Auth" (0x7d27b8, used at 0x40c72f) belong to a dongle status dialog worth reading for the values it expects. PLAN: log the real call sequence with a small 32-bit drop-in that hooks CreateFileA/DeviceIoControl/ReadFile for the ITOKEN2 name (the rg-rhio pattern) and answer it from what the code above checks, then patch the getter by patchmem only for values that cannot be produced. READ 2026-10-21 09:20: the object the game really calls has a 28-entry vtable at 0x7d2564 (methods in the 0x40b-0x40c range, next to the "UserBB Dongle"/"Dongle Auth" strings), not the 17-entry 0x7d3ca4 of CComObject<CCoDongle2> -- so the game holds an ATL wrapper whose interface adds the methods 0x415ca0 uses. The two named calls are RECORD READS, not flags: [vt+0x14] is 0x40b860, which rejects a size above 0x18 (E_INVALIDARG 0x80070057) and copies up to 24 bytes into the caller buffer, and [vt+0x58] is 0x40bab0, which rejects a size above 8 and copies up to 8 bytes. That is why the call sites pass "InsGame" with 0 and "3DGame" with 6: name plus maximum length of the record the dongle is asked for. The success path reads 8 bytes with mode 0x42 through [vt+0x50] (0x40c110). After the gate the game also records the key itself: 0x439168 builds a string from "InsGame" with value 1 and inserts it into the settings map at [esi+0x1c] (0x4389e2), i.e. "InsGame" is a cabinet setting the game takes from the dongle -- its own text files have no such key (coin.ini only has CoinSet/CoinData/GunType/gun calibration corners), so the values have to come out of the device and the record contents are unknown. INSTRUMENT BUILT 2026-10-21 09:20: fix 5 of rg-compat (rg_compat.c) with RG_DONGLE2_LOG=<path> borrows \\.\ITOKEN2 (fake handle, logs CreateFile/DeviceIoControl/ReadFile/WriteFile with code, sizes and the first input bytes, answers zeros) and the After Dark drop-in now sets that variable, so the next run shows the device protocol the in-process object speaks. MEASURED 2026-10-21 09:37 (ravengunctl game start, headless, rg-compat with RG_DONGLE2_LOG, rg-dongle2.log in the view): the game never opens \\.\ITOKEN2 -- zero CreateFile/DeviceIoControl lines -- because it first looks for the dongle through SetupAPI, and finds nothing there. The meter logged SetupDiGetClassDevsA with flags 0x12 (PRESENT|DEVICEINTERFACE) for two classes: {4d1e55b2-f16f-11cf-88cb-001111000030} (GUID_DEVINTERFACE_HID) and {171638f7-1ead-4873-ba98-c966abcf0142} (the cabinet dongle device class). The exe imports exactly four SetupAPI functions -- SetupDiGetClassDevsA, SetupDiEnumDeviceInfo, SetupDiGetDeviceRegistryPropertyA, SetupDiDestroyDeviceInfoList -- so it enumerates device INSTANCES and reads registry properties (that is where the "InsGame"/"3DGame" data and the VID/PID check live), it does not use the interface-detail route. With Wine enumerating no device the object fails before any device I/O, which is why the one-byte gate patch ended in a clean exit instead of a start. NEXT: let the meter answer SetupDiEnumDeviceInfo with one synthetic device and log every property the game asks for, so the accepted VID/PID and record values come out of the game own requests; then answer CreateFile/DeviceIoControl for the DevicePath that produces. READ 2026-10-21 09:45: the device search itself is at 0x4369e0-0x436c10. It resolves SetupDiEnumDeviceInterfaces and SetupDiGetDeviceInterfaceDetailA DYNAMICALLY with GetProcAddress (strings 0x7d4c68 and 0x7d4c44, stored at 0x8b9530/0x8b952c), so they are not in the import table and an IAT hook never sees them -- that is why the first meter run logged only SetupDiGetClassDevsA. The route is: GetClassDevsA(guid, 0, 0, 0x12) -> EnumDeviceInterfaces -> GetDeviceInterfaceDetailA to get a device path -> CreateFile on that path. There is also a SECOND, repeated verification: 0x40c3a9 walks the same 0x8983b0 slots, calls [vt+0x10] and reads 8 bytes with mode 0x42 through [vt+0x50] just like the startup path, and a negative HRESULT jumps to an error path at 0x40c42f -- the 8-byte read at 0x40c380 builds its buffer byte by byte via 0x44a0a0. So bypassing the gate once can never be enough: the object is re-checked while the game runs. The meter now hooks GetProcAddress and answers both dynamic functions with one synthetic HID interface whose path carries vid_0471&pid_485e, which the CreateFileA hook then lends, so the next run shows the DeviceIoControl protocol this object speaks. READ 2026-10-21 09:52: the re-check is a CHALLENGE/RESPONSE, read from the code at 0x40c3c6: it reads 8 bytes through [vt+0x50](this, mode, &buf, 8, 0x42), then asks the same method for a transform of those bytes ([vt+0x50](this, &in, &out, 9, 0x30)) and compares the 8-byte result with the 8 bytes it read (0x40c410: mov edx,[esp+ecx+0x18]; cmp edx,[esp+ecx+0x7d]; jne naar de fout bij 0x40c42f). Both sides come from the dongle, so a device that answers CONSISTENTLY passes even with synthetic content -- zeros for both sides compare equal, which is why the meter answers zeros for every call instead of inventing a crypto. The keep-alive loop at 0x40b420 pings with mode 1 every 3000 ms through the same method, so the session has to stay alive. MEASURED 2026-10-21 10:22 (rented bench, ravengunctl game start, headless): with the meter answering SetupAPI the game now really looks for the dongle and opens it -- the log shows SetupDiGetClassDevsA({4d1e55b2-...} HID), EnumDeviceInterfaces(0) -> one interface, GetDeviceInterfaceDetailA -> "\\?\hid#vid_0471&pid_485e#7&1a2b3c4d&0&0000#{4d1e55b2-...}", then CreateFileA(that path, access=0x80000000, share=0) taking the lent handle, and EnumDeviceInterfaces(1) -> end. It also resolved HidD_GetHidGuid/HidD_GetFeature/HidD_SetFeature; the last two are now answered by the meter. After the open NOTHING happens on the device: no HidD_Set/GetFeature, no DeviceIoControl, no ReadFile/WriteFile. The sampler (RG_COMPAT_SAMPLE=700) shows the main thread 45/45 samples inside win32u.dll+0x11248 (message wait) called from GamePlayer.exe+0x3d12b4, i.e. a dialog is up, and the other threads wait in ntdll+0xd410/d110; total CPU 0.3 %. So the open succeeds and the object then fails (or blocks) before it speaks the protocol. The next read is [vt+0x40] right after the CreateFile result is stored (0x415f35 -> 0x415f37), which takes the object lock and asks [vt+0x1c] for the record "E002" (0x40bf20 -> 0x40bfe0, which rejects a length above 0x80 and then calls 0x430a30); that path is where the first device traffic should come from, so the next step is to instrument 0x430a30 (or to answer the HID report lengths it expects) instead of guessing replies. READ 2026-10-21 10:06: the HID transport at 0x4367D0-0x436881 sends and receives one feature report: it writes report byte 0 = 1, byte 1 = 0, then the packet, calls HidD_SetFeature(handle, buf, 0x102) and, when that returns false, retries while GetLastError() == 0x79 (ERROR_SEM_TIMEOUT). After a successful SetFeature it does NOT call GetFeature; it reads the ANSWER BACK FROM THE SAME BUFFER: byte 1 is taken as the payload length (0x436845 movzx eax,[esp+0x15]) and the payload is copied from byte 2 (0x436859). Our meter answered zeros, so the length byte was 0 and every record read came back empty. The reply now starts with 01 18 and zeros (RG_DONGLE2_REPLY in the drop-in Env): report id 1, payload length 0x18, empty record. A second thing measured: the transport only runs when the object capability field is at least 0x20000 (0x4332DF), which is what RG_COMPAT_PATCH 0x4332df:b800000200 changes (cmp eax,0x20000 -> mov eax,0x20000) -- with patchmem in the drop-in the process did load it but the gate A/B test showed no change and its stderr never reached our log, so the patch moved into rg-compat where it is logged in rg-dongle2.log. MEASURED 2026-10-21 11:40-11:52 (bench, ravengunctl game start, headless): the loaded image has its sections where the file says they are -- probe: ImageBase 0x400000, .text va 0x1000 raw 0x400, .rdata 0x3d0000, .data 0x468000, .rsrc 0x4d2000 -- and memory address = 0x400000 + (objdump VA - 0x400000), so the gate byte is at 0x40647b ("poort 0x647b=7525", read from base+0x647b) and the transport compare at base+0x332df = "3d00000200". My earlier read of base+0x4332df was simply the wrong address (it landed in .rdata, "the u"), so there is no encryption and no self-modifying code: the first patch did land and was useless because the failing check was a different one. The instrument now patches by unique byte pattern (RG_COMPAT_PATCH_SEARCH=<pattern>,<new>[|...]) and three patches are applied and logged: 0x4332df cmp eax,0x20000 -> mov eax,0x20000; 0x42f8c5 cmp dword [eax+4],0x20000 -> compare with 0; and the call to the state validator 0x42f8b0 at 0x430a9b replaced by mov eax,1. All three land ("zoekpatch: patroon op +0x332df / +0x2f8c5 / +0x30a9b"), and STILL no HidD_SetFeature/GetFeature follows: the record read returns before it builds a report, so the object is not simply blocked by those three checks. The next honest step is to instrument the object itself (log [vt+0x10]/[vt+0x14]/[vt+0x1c]/[vt+0x40]/[vt+0x50] with their arguments and HRESULTs through a per-game drop-in that rg-compat loads), because the static chain E002 -> 0x430a30 -> 0x4332b0 is evidently not the path the running object takes. MEASURED 2026-10-21 11:53 (bench, ravengunctl game start, headless): with the gate itself also patched (0x406479 test al,al / 0x40647b jne: 84c07525 -> 84c0eb25, unique, applied and logged) the game no longer shows "Init Dongle Failed !" and the run ends with exitcode 0 within seconds (rg-direct log direct-AfterDark-20261021-113954.log). So the four patches together do change the gate, and the game then leaves through the success path and stops on its own -- still without a single HidD_SetFeature/GetFeature call, i.e. [vt+0x50] (the 8-byte read at 0x4064c1 with mode 0x42) also returns before the object builds a report. What is therefore known and missing: the device model (SetupAPI device, interface path, CreateFile, feature-report hooks, reply 01 18 + zeros) is in place and the game really opens it; the object capability and connected checks are patched; but the object refuses at a third point inside its own read method, and the only way to see that point is to log the object methods themselves (ICoDongle2 [vt+0x10]/[vt+0x14]/[vt+0x1c]/[vt+0x40]/[vt+0x50]) with their arguments and HRESULTs through a per-game drop-in that rg-compat loads (the TP_PRELOAD_DLL slot is single). That is a vtable wrapper with __thiscall thunks, i.e. real work of its own. PARKED since 2026-10-19: on our own core ([Loader] Core = ravengun) the game starts and reaches its own dongle check, "Init Dongle Failed!"; the attract needs the dongle answers and we do not have them (bench-captures/AfterDark/20261019-dongle.png). With the closed TeknoParrot core it did play -- WORKING via double-click in the app (2026-10-15): attract with movie, coin, START, two stages (Silent Valley, Castle of Shadows), continue, score 69000; played 5.5 min in mouse mode. Recipe: rg-compat (DirectInput with a NULL HINSTANCE), Gst32 + data/wmv-asyncreader.reg (movie), DXVK + Microsoft d3dx9_41 (without those the world renders black), gamescope. Open: the owner heard audio hitches in the first run (wined3d); not re-checked after DXVK. MEASURED 2026-10-21 12:01 (ravengunctl game start, headless, new vtable-wrapper fix 7 in rg-compat): the dongle object's vtable is image+0x3D3CA4 (0x7d3ca4) and its calls now come out with arguments and HRESULTs. The gate calls [vt+0x1c] (0x40a5f0) first, which is only a thunk to [vt+0x20] (0x40ab90); that table fill returns 0x80004005 (E_FAIL) and leaves the table empty (0 records, count 0 at [obj+0x24]). Then [vt+0x14] (0x40a7b0) is asked for the record "InsGame" (arg3=0x7d1a70, size 0) and returns 0x80004002 (E_NOINTERFACE: the table lookup miss), which also makes [vt+0x10] (0x40af60, slot create) return 0x80004002, and the game exits with code 0 -- exactly the earlier symptom, now with its cause. The device model is not the blocker any more: SetupAPI and CreateFileA still run (the meter lends the handle) but 0x40ab90 gives up BEFORE any report traffic, at its first state check (0x42f8e0(&local,0) returns neither 0 nor 0x11; that call goes through 0x432ab0), so HidD_SetFeature/GetFeature is never reached. NEXT: satisfy that state check the way the code checks it, or answer the table from the thunk ([vt+0x20]: one synthetic record named "InsGame", name at +0x60, payload at +0x00) and measure how far the slot object from 0x40af60 gets. MEASURED 2026-10-21 12:17 (bench, ravengunctl game start, headless; answer mode plus a fixed-RVA patch): with the record unpack 0x40b350 replaced by mov eax,0/ret 4 (RG_COMPAT_PATCH=0xB350:b800000000c20400) the dongle gate goes through COMPLETELY for the first time: [vt+0x20] is answered with one synthetic record, [vt+0x1c] S_OK, [vt+0x14]("InsGame") S_OK, [vt+0x10] S_OK (the slot object is created by 0x40ae20, vtable 0x7d2564), [vt+0x58]("3DGame") answered S_OK, then record[+0x10] -> 0x40c060 -> record[+0x50] answered S_OK, and the keep-alive pings on record[+0x50] follow. The process no longer exits: it stays