; After Dark (UNIS, 2012; Virtools GamePlayer.exe, 32-bits). Profiel uit het TeknoParrot-sjabloon, herkenning gemeten aan de
; NAS-map "After Dark" (alleen gelezen).
;
; Drie dingen waren nodig (bench 2026-10-15):
; 1. dropin/rg-compat.dll: de speler roept IDirectInput::Initialize aan met een lege HINSTANCE en Wine weigert dat; zonder de fix
;    stopt hij met "Initalization Error - Cannot Initalize Input Manager" (gemeten met WINEDEBUG=+dinput).
; 2. Films: de hoofdthread bleef op "System initializing, please wait..." staan direct na het openen van Res\Video01.WMV (gemeten
;    met WINEDEBUG=trace+file). Met Gst32 + data/wmv-asyncreader.reg (hetzelfde recept als OG) speelt de attractfilm en loopt het
;    spel door.
; 3. Beeld: met wined3d en met alleen DXVK waren grote delen van de wereld zwart (gebouwen, weerwolven, voertuig); de cutscene-
;    figuren eerst ook. De speler maakt zijn materialen met D3DXCreateEffect (d3dx9_41, .fx-bronnen); de ingebouwde d3dx9_41 van
;    Wine kan die niet vertalen. Met de d3dx9_41 van Microsoft (NativeDlls, uit de DirectX-map van Steam, nooit in git) plus DXVK is
;    alles getextureerd (vacht, klauwen, dorp).

