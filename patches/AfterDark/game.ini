[Status]
Status = parked
Note = PARKED sinds 2026-10-19: op onze eigen kern ([Loader] Core = ravengun) start het spel en komt het tot zijn eigen donglecontrole, "Init Dongle Failed!"; de attract vraagt de dongle-antwoorden en die hebben we niet (bench-captures/AfterDark/20261019-dongle.png). Met de gesloten TeknoParrot-kern speelde het wel -- WERKT via dubbelklik in de app (2026-10-15): attract met film, munt, START, twee levels (Silent Valley, Castle of Shadows), continue, score 69000; 5,5 min gespeeld met de muismodus. Recept: rg-compat (DirectInput met lege HINSTANCE), Gst32 + data/wmv-asyncreader.reg (film), DXVK + d3dx9_41 van Microsoft (zonder die twee zwarte wereld), gamescope. Open: de eigenaar hoorde haperend geluid in de eerste run (wined3d); na DXVK nog niet nagemeten. HERMETEN 2026-10-19 (punt G): opnieuw een start op onze eigen kern gedaan; het logboek zegt "Success! / Have fun :)" en de foto (docs/screenshots/afterdark-dongle-failed-2026-10-19.png) laat precies hetzelfde zien als bij het parkeren: het venster "Init Dongle Failed !" met een OK-knop. De parkeerreden staat dus nog.
NoteEN = READ 2026-10-21 (static, on our own view copy): the gate is one branch. Window procedure path of GameLaunch: 0x406474 call 0x415ca0 -> 0x406479 test al,al -> 0x40647b jne 0x4064a2 (continue); the fall-through at 0x40647d pushes MB_ICONHAND with caption "GameLaunch" (0x7d12b4) and text "Init Dongle Failed !" (0x7d1a78) and returns false. 0x415ca0 itself: it creates the ATL object (0x415b30, stored at 0x8987b0), then walks a fixed array of object slots at 0x8983b0 (0x400 bytes = up to 0x100 dwords, slots released and cleared on failure) and for each slot calls vtable [0x1c], then a pair with [0x14](obj, out, "InsGame", 0) and [0x10](obj, &slot, out), then [0x58](obj, "3DGame", 6) and [0x10](obj, &slot, out); ebx counts the slots that passed and AL is what the caller tests. "InsGame" and "3DGame" are ATL property names, so the dongle is read as a property bag by name, not as a serial number we could guess. Measured under plain Wine (+file, no board): hid.dll is loaded from system32 and the trace has no access to \\.\ITOKEN2 at all in that early run, so the first failure is a property read, before any device I/O. MEASURED 2026-10-21 08:26 (full recipe: rg-direct --run of the plan, gamescope headless, rg-compat loaded, "Have fun :)"): with the unpatched exe the game sits idle at the dongle gate (0.6 % CPU after a minute) -- that is the "Init Dongle Failed !" box. Then one byte at 0x40647b was changed in a local copy of the exe (75 -> EB, "jne success" becomes "jmp success"; the old bytes were checked first) and that copy was put in the view in place of the symlink for one run (symlink restored afterwards): the game does NOT crash and does NOT show the box, it exits with code 0 within seconds. So skipping that single gate is not enough -- the dongle object has to answer its properties, otherwise the game shuts itself down. NEXT: read the ATL property map of the class behind 0x415b30 to get every property name with its type and the value each slot is asked for, then answer them (device/ATL stub) or patch this one gate -- one byte at 0x40647b (75 25 -> eb 25) forces the success branch, but the success path dereferences 0x8983b0, so it is only safe once the object exists. READ FURTHER 2026-10-21 09:15 (static, own view copy): the dongle object is ATL CComObject<CCoDongle2> with interface ICoDongle2; its constructor is 0x415930 (allocates 0x30 bytes from 0x415b30) and it stores the vtable 0x7d3ca4, which holds 17 entries (QueryInterface 0x4159c0, AddRef, Release 0x415990, then 0x492e20, 0x40af60, 0x40a7b0, 0x40a890, 0x40a5f0, 0x40ab90, 0x415ad0, 0x84402c, 0x415c80, 0x415bf0, 0x415c00, 0x7027d0, 0x415c10, 0x415c60). What 0x415ca0 and the success path ask of it: [vt+0x1c](this), then per slot of up to 0x100 at 0x8983b0 "[vt+0x14](this,&out,\"InsGame\",0) then [vt+0x10](this,&slot,&out)" and "[vt+0x58](this,\"3DGame\",6) then [vt+0x10](this,&slot,&out)"; after the gate, 0x4064a2 does [vt+0x10], [vt+0x30](this,&local), [vt+0x50](this,0,&buf,8,0x42) -- an 8-byte dongle read with mode 0x42 -- and then starts a thread (0x415850 with proc 0x415560) and sets 0x439168(this,\"InsGame\",1). NOTE: +0x50 and +0x58 lie outside the 17-entry vtable of CComObject<CCoDongle2>, so the object the game holds is the ATL aggregate/contained wrapper; that wrapper (and therefore the real member functions the names go to) is the next thing to pin down. The device is addressed by a 16-byte id: 0x436260 compares four dwords against a table at 0x874e00 and returns the name "ITOKEN2" (0x7d4bfc); the strings "UserBB Dongle" (0x7d2790, used at 0x40c4d2 and 0x40c702) and "Dongle Auth" (0x7d27b8, used at 0x40c72f) belong to a dongle status dialog worth reading for the values it expects. PLAN: log the real call sequence with a small 32-bit drop-in that hooks CreateFileA/DeviceIoControl/ReadFile for the ITOKEN2 name (the rg-rhio pattern) and answer it from what the code above checks, then patch the getter by patchmem only for values that cannot be produced. READ 2026-10-21 09:20: the object the game really calls has a 28-entry vtable at 0x7d2564 (methods in the 0x40b-0x40c range, next to the "UserBB Dongle"/"Dongle Auth" strings), not the 17-entry 0x7d3ca4 of CComObject<CCoDongle2> -- so the game holds an ATL wrapper whose interface adds the methods 0x415ca0 uses. The two named calls are RECORD READS, not flags: [vt+0x14] is 0x40b860, which rejects a size above 0x18 (E_INVALIDARG 0x80070057) and copies up to 24 bytes into the caller buffer, and [vt+0x58] is 0x40bab0, which rejects a size above 8 and copies up to 8 bytes. That is why the call sites pass "InsGame" with 0 and "3DGame" with 6: name plus maximum length of the record the dongle is asked for. The success path reads 8 bytes with mode 0x42 through [vt+0x50] (0x40c110). After the gate the game also records the key itself: 0x439168 builds a string from "InsGame" with value 1 and inserts it into the settings map at [esi+0x1c] (0x4389e2), i.e. "InsGame" is a cabinet setting the game takes from the dongle -- its own text files have no such key (coin.ini only has CoinSet/CoinData/GunType/gun calibration corners), so the values have to come out of the device and the record contents are unknown. INSTRUMENT BUILT 2026-10-21 09:20: fix 5 of rg-compat (rg_compat.c) with RG_DONGLE2_LOG=<path> borrows \\.\ITOKEN2 (fake handle, logs CreateFile/DeviceIoControl/ReadFile/WriteFile with code, sizes and the first input bytes, answers zeros) and the After Dark drop-in now sets that variable, so the next run shows the device protocol the in-process object speaks. MEASURED 2026-10-21 09:37 (ravengunctl game start, headless, rg-compat with RG_DONGLE2_LOG, rg-dongle2.log in the view): the game never opens \\.\ITOKEN2 -- zero CreateFile/DeviceIoControl lines -- because it first looks for the dongle through SetupAPI, and finds nothing there. The meter logged SetupDiGetClassDevsA with flags 0x12 (PRESENT|DEVICEINTERFACE) for two classes: {4d1e55b2-f16f-11cf-88cb-001111000030} (GUID_DEVINTERFACE_HID) and {171638f7-1ead-4873-ba98-c966abcf0142} (the cabinet dongle device class). The exe imports exactly four SetupAPI functions -- SetupDiGetClassDevsA, SetupDiEnumDeviceInfo, SetupDiGetDeviceRegistryPropertyA, SetupDiDestroyDeviceInfoList -- so it enumerates device INSTANCES and reads registry properties (that is where the "InsGame"/"3DGame" data and the VID/PID check live), it does not use the interface-detail route. With Wine enumerating no device the object fails before any device I/O, which is why the one-byte gate patch ended in a clean exit instead of a start. NEXT: let the meter answer SetupDiEnumDeviceInfo with one synthetic device and log every property the game asks for, so the accepted VID/PID and record values come out of the game own requests; then answer CreateFile/DeviceIoControl for the DevicePath that produces. READ 2026-10-21 09:45: the device search itself is at 0x4369e0-0x436c10. It resolves SetupDiEnumDeviceInterfaces and SetupDiGetDeviceInterfaceDetailA DYNAMICALLY with GetProcAddress (strings 0x7d4c68 and 0x7d4c44, stored at 0x8b9530/0x8b952c), so they are not in the import table and an IAT hook never sees them -- that is why the first meter run logged only SetupDiGetClassDevsA. The route is: GetClassDevsA(guid, 0, 0, 0x12) -> EnumDeviceInterfaces -> GetDeviceInterfaceDetailA to get a device path -> CreateFile on that path. There is also a SECOND, repeated verification: 0x40c3a9 walks the same 0x8983b0 slots, calls [vt+0x10] and reads 8 bytes with mode 0x42 through [vt+0x50] just like the startup path, and a negative HRESULT jumps to an error path at 0x40c42f -- the 8-byte read at 0x40c380 builds its buffer byte by byte via 0x44a0a0. So bypassing the gate once can never be enough: the object is re-checked while the game runs. The meter now hooks GetProcAddress and answers both dynamic functions with one synthetic HID interface whose path carries vid_0471&pid_485e, which the CreateFileA hook then lends, so the next run shows the DeviceIoControl protocol this object speaks. READ 2026-10-21 09:52: the re-check is a CHALLENGE/RESPONSE, read from the code at 0x40c3c6: it reads 8 bytes through [vt+0x50](this, mode, &buf, 8, 0x42), then asks the same method for a transform of those bytes ([vt+0x50](this, &in, &out, 9, 0x30)) and compares the 8-byte result with the 8 bytes it read (0x40c410: mov edx,[esp+ecx+0x18]; cmp edx,[esp+ecx+0x7d]; jne naar de fout bij 0x40c42f). Both sides come from the dongle, so a device that answers CONSISTENTLY passes even with synthetic content -- zeros for both sides compare equal, which is why the meter answers zeros for every call instead of inventing a crypto. The keep-alive loop at 0x40b420 pings with mode 1 every 3000 ms through the same method, so the session has to stay alive. MEASURED 2026-10-21 10:22 (rented bench, ravengunctl game start, headless): with the meter answering SetupAPI the game now really looks for the dongle and opens it -- the log shows SetupDiGetClassDevsA({4d1e55b2-...} HID), EnumDeviceInterfaces(0) -> one interface, GetDeviceInterfaceDetailA -> "\\?\hid#vid_0471&pid_485e#7&1a2b3c4d&0&0000#{4d1e55b2-...}", then CreateFileA(that path, access=0x80000000, share=0) taking the lent handle, and EnumDeviceInterfaces(1) -> end. It also resolved HidD_GetHidGuid/HidD_GetFeature/HidD_SetFeature; the last two are now answered by the meter. After the open NOTHING happens on the device: no HidD_Set/GetFeature, no DeviceIoControl, no ReadFile/WriteFile. The sampler (RG_COMPAT_SAMPLE=700) shows the main thread 45/45 samples inside win32u.dll+0x11248 (message wait) called from GamePlayer.exe+0x3d12b4, i.e. a dialog is up, and the other threads wait in ntdll+0xd410/d110; total CPU 0.3 %. So the open succeeds and the object then fails (or blocks) before it speaks the protocol. The next read is [vt+0x40] right after the CreateFile result is stored (0x415f35 -> 0x415f37), which takes the object lock and asks [vt+0x1c] for the record "E002" (0x40bf20 -> 0x40bfe0, which rejects a length above 0x80 and then calls 0x430a30); that path is where the first device traffic should come from, so the next step is to instrument 0x430a30 (or to answer the HID report lengths it expects) instead of guessing replies. PARKED since 2026-10-19: on our own core ([Loader] Core = ravengun) the game starts and reaches its own dongle check, "Init Dongle Failed!"; the attract needs the dongle answers and we do not have them (bench-captures/AfterDark/20261019-dongle.png). With the closed TeknoParrot core it did play -- WORKING via double-click in the app (2026-10-15): attract with movie, coin, START, two stages (Silent Valley, Castle of Shadows), continue, score 69000; played 5.5 min in mouse mode. Recipe: rg-compat (DirectInput with a NULL HINSTANCE), Gst32 + data/wmv-asyncreader.reg (movie), DXVK + Microsoft d3dx9_41 (without those the world renders black), gamescope. Open: the owner heard audio hitches in the first run (wined3d); not re-checked after DXVK.


