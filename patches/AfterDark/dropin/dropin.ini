; Drop-in van RavenGun voor After Dark (UNIS, Virtools GamePlayer.exe, 32-bits).
; Indeling en contract: docs/dropins.md. Bron en bouw: tools/rg-compat/rg_compat.c, scripts/build-compat.sh.
;
; rg-compat.dll zet IDirectInput::Initialize recht: de speler roept het aan met een lege HINSTANCE en Wine weigert dat
; (DIERR_INVALIDPARAM -> "Cannot Initalize Input Manager", gemeten met WINEDEBUG=+dinput op 2026-10-15). Preload = true
; laat de OpenParrot-lader de DLL via TP_PRELOAD_DLL na de kern in het spelproces laden.
;
; Env zet de apparaatmeter aan (fix 5 in rg_compat.c, 2026-10-21): een CreateFile op \\\\.\\ITOKEN2 levert een nephandvat
; en elke DeviceIoControl/ReadFile/WriteFile daarop wordt met zijn bytes in rg-dongle2.log geschreven (antwoord: nullen).
; Dat is het meetinstrument voor de dongle van dit spel (ATL CCoDongle2); haal de regel weg om het weer uit te zetten.
[rg-compat.dll]
To = .
Preload = true
Env = RG_DONGLE2_LOG=rg-dongle2.log
