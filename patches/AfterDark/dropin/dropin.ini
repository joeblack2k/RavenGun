; Drop-in van RavenGun voor After Dark (UNIS, Virtools GamePlayer.exe, 32-bits).
; Indeling en contract: docs/dropins.md. Bron en bouw: tools/rg-compat/rg_compat.c, scripts/build-compat.sh.
;
; Een drop-in: rg-compat.dll (Preload = true via TP_PRELOAD_DLL), met drie taken.
;
; 1. IDirectInput::Initialize rechtzetten (lege HINSTANCE; Wine weigert dat: DIERR_INVALIDPARAM ->
;    "Cannot Initalize Input Manager", gemeten met WINEDEBUG=+dinput op 2026-10-15).
; 2. De apparaatmeter (fix 5): SetupAPI antwoordt met een synthetisch HID-apparaat, CreateFile op dat pad en
;    HidD_SetFeature/GetFeature worden geleend, en elke aanroep komt met zijn bytes in rg-dongle2.log
;    (antwoorden nullen, of RG_DONGLE2_REPLY=<hex>). RG_COMPAT_SAMPLE zet de meetdraad aan.
; 3. RG_COMPAT_PATCH (fix 6) zet de dongle-transportfunctie 0x4332B0 langs zijn capaciteitscontrole op
;    0x4332DF: zonder dongle blijft die waarde nul, geeft elke recordvraag meteen 2 terug en komt er nooit
;    apparaatverkeer. De patch vervangt cmp eax,0x20000 door mov eax,0x20000 in het LOPENDE proces;
;    het bestand op de NAS blijft ongemoeid.
[rg-compat.dll]
To = .
Preload = true
Env = RG_DONGLE2_LOG=rg-dongle2.log;RG_COMPAT_SAMPLE=700;RG_COMPAT_SAMPLE_LOG=rg-sample.txt;RG_COMPAT_PATCH=0x4332df:b800000200
