; Drop-in van RavenGun voor After Dark (UNIS, Virtools GamePlayer.exe, 32-bits).
; Indeling en contract: docs/dropins.md. Bron en bouw: tools/rg-compat/rg_compat.c, scripts/build-compat.sh.
;
; Twee instrumenten, en de ene laadt de andere (de lader heeft via TP_PRELOAD_DLL maar plaats voor een):
;
; ravengun-patchmem32.dll  onze eigen geheugen-motor (memory/src, docs/memory-engine.md). Leest patchmem.txt en schrijft
;                          die bytes in het LOPENDE proces (de NAS blijft ongemoeid). Met RAVENGUN_PATCHMEM_HOOK laadt hij
;                          daarna rg-compat.dll in hetzelfde proces.
; patchmem.txt             de patch die de dongle-transportfunctie 0x4332B0 langs de capaciteitscontrole op 0x4332DF
;                          laat komen (zonder dongle blijft die waarde nul en komt er nooit apparaatverkeer).
;
; rg-compat.dll            zet IDirectInput::Initialize recht (de speler roept het aan met een lege HINSTANCE en Wine
;                          weigert dat: DIERR_INVALIDPARAM -> "Cannot Initalize Input Manager", gemeten met
;                          WINEDEBUG=+dinput op 2026-10-15) en bevat de apparaatmeter (fix 5): SetupAPI antwoordt met een
;                          synthetisch HID-apparaat, HidD_SetFeature/GetFeature en CreateFile op dat pad worden geleend en
;                          elke aanroep komt met zijn bytes in rg-dongle2.log. Antwoorden zijn nullen, of RG_DONGLE2_REPLY.
;                          RG_COMPAT_SAMPLE zet de meetdraad aan (waar wachten de draden).
;
; Uitzetten: haal de Env-regel weg (meter uit) of de Preload-regel (alles uit).
[ravengun-patchmem32.dll]
To = .
Preload = true
Env = RAVENGUN_PATCHMEM_FILE=patchmem.txt;RAVENGUN_PATCHMEM_VERBOSE=1;RAVENGUN_PATCHMEM_HOOK=rg-compat.dll

[patchmem.txt]
To = .

[rg-compat.dll]
To = .
Env = RG_DONGLE2_LOG=rg-dongle2.log;RG_COMPAT_SAMPLE=700;RG_COMPAT_SAMPLE_LOG=rg-sample.txt
