; rg-unisgun table for After Dark (format: tools/rg-unisgun/rg_unisgun_kern.h).
; Board image bits (WartranTroopers): 0 test, 1 service, 2 coin 1, 3 coin 2, 4 menu up, 5 menu down,
; P1 6 start, 7 trigger, 8 reload, 9 grenade, 10 aux1; P2 11 start, 12 trigger, 13 reload, 14 grenade, 15 aux1.
; Gun(A)/Gun(B) Buttons, measured with RG_UNISGUN_PROBE on 2026-10-21 (screenshots in the NoteEN):
;   bit 0 = START (attract "Push Start Button" -> stage select), bit 1 = trigger (beam to the crosshair, score),
;   bit 3 = TEST (the test menu opens), bit 7 = coin (the game's own code, 0x410580).
;   bit 2 showed "Platform Motion Stopped" (a motion-platform switch): never set.
a.0 = 6
a.1 = 7
a.3 = 0
a.7 = 2
b.0 = 11
b.1 = 12
b.7 = 3
offscreen = 0
; Measured 2026-10-21 (aim 0.9,0.9 drew the crosshair at the top right): the game's y grows upwards.
y.invert = 1
