; elke run opnieuw gezet; handwerk in andere sleutels blijft staan.
;
; Uit het oude UserProfiles/TombRaider.env:
; door tp-add-game.py; zie packaging/games-status.md

[Game]
Name = Tomb Raider Arcade
Profile = TombRaider
Type = TeknoParrot
EmulationProfile = WartranTroopers
Executable = game.exe
Is64Bit = true
ProfileRevision = 6

[Loader]
PostStartMs = 3000

[Wine]
DllOverrides = winhttp=n,b

[Input]
Route = unity-tcp

[Status]
Status = working
Note = WERKT op onze eigen route (2026-10-14): een dubbelklik in RavenGun start de game zonder scripts en zonder TeknoParrot (daemon -> Proton met onze BepInEx-plugin, invoer over TCP). Gemeten op de tv met de muismodus: munt (toets 5), START (toets 1 even vasthouden; een korte tik telt niet), richten, schieten, een level gespeeld; 5:24 min gedraaid. Nog niet met de echte Move-knoppen gespeeld.
NoteEN = WORKING on our own route (2026-10-14): a double-click in RavenGun starts the game without scripts and without TeknoParrot (daemon -> Proton with our BepInEx plugin, input over TCP). Measured on the TV in mouse mode: coin (key 5), START (hold key 1 briefly; a very short tap does not count), aim, trigger, a level played; ran 5:24 min. Not yet played with the real Move buttons.

; Profiel uit TeknoParrot-sjabloon GameProfiles/TombRaider.xml, revisie 6 (scripts/import-tp-profiles.py; opnieuw importeren in plaats van met de hand wijzigen)
[Identify]
Path = Game.exe
Size = 652288

[Config]
General/Input API = RawInput
General/Windowed = 0
General/HideCursor = 1
General/Use Relative Input = 0
General/Player 1 Relative Sensitivity = 8
General/Player 2 Relative Sensitivity = 8
General/Player 3 Relative Sensitivity = 8
General/Player 4 Relative Sensitivity = 8

[ConfigType]
General/Input API = Dropdown
General/Windowed = Bool
General/HideCursor = Bool
General/Use Relative Input = Bool
General/Player 1 Relative Sensitivity = Slider
General/Player 2 Relative Sensitivity = Slider
General/Player 3 Relative Sensitivity = Slider
General/Player 4 Relative Sensitivity = Slider

[ConfigOptions]
General/Input API = DirectInput|XInput|RawInput
