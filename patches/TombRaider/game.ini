; Gegenereerd door scripts/migrate-game-settings.py (docs/per-game-patches.md). Sleutels die het script afleidt uit de oude bronnen worden bij
; elke run opnieuw gezet; handwerk in andere sleutels blijft staan.
;
; Uit het oude UserProfiles/TombRaider.env:
; door tp-add-game.py; zie packaging/games-status.md

[Game]
Name = Tomb Raider Arcade
Profile = TombRaider
Type = TeknoParrot
EmulationProfile = WartranTroopers
Executable = game.exe
Is64Bit = true
ProfileRevision = 6

[Loader]
PostStartMs = 3000

[Wine]
DllOverrides = winhttp=n,b

[Input]
Route = unity-tcp

[Status]
Status = playable
Note = Werkt zonder TeknoParrot: lightgun, herladen, munt en start, trillen bij schieten. Nog niet met de echte Move-knoppen gespeeld.
NoteEN = Works without the TeknoParrot UI: lightgun, reload, coin and start, rumble when shooting. Not yet played with the real Move buttons.

; Profiel uit TeknoParrot-sjabloon GameProfiles/TombRaider.xml, revisie 6 (scripts/import-tp-profiles.py; opnieuw importeren in plaats van met de hand wijzigen)
[Identify]
Path = Game.exe
Size = 652288

[Config]
General/Input API = RawInput
General/Windowed = 0
General/HideCursor = 1
General/Use Relative Input = 0
General/Player 1 Relative Sensitivity = 8
General/Player 2 Relative Sensitivity = 8
General/Player 3 Relative Sensitivity = 8
General/Player 4 Relative Sensitivity = 8

[ConfigType]
General/Input API = Dropdown
General/Windowed = Bool
General/HideCursor = Bool
General/Use Relative Input = Bool
General/Player 1 Relative Sensitivity = Slider
General/Player 2 Relative Sensitivity = Slider
General/Player 3 Relative Sensitivity = Slider
General/Player 4 Relative Sensitivity = Slider

[ConfigOptions]
General/Input API = DirectInput|XInput|RawInput
