;
; Drop-ins of Pigs Might Fly (docs/dropins.md).
;
; rg-pigsio.dll: RavenGun's synthetic USB HID I/O board (VID_1043 PID_0000, GAMEPAD collection) for Sega/Shell/Shell.exe
; (tools/rg-pigsio/, built with tools/rg-pigsio/build.sh; the format is in tools/rg-pigsio/rg_pigs_board.h, read from the
; shell's own code). It redirects the shell's SetupAPI/HID/CreateFileA/ReadFile/WriteFile/CloseHandle imports to the board and
; fills its input report from the shared memory TeknoParrot_JvsState (layout WartranTroopers). Its log rg-pigsio.log lands next
; to Shell.exe in the view: no log = the DLL was not loaded.
[rg-pigsio.dll]
To = .
Preload = true
; A Windows PE DLL, not ELF: not in LD_AUDIT (docs/dropins.md, "Audit = false").
Audit = false

; DK2WIN32.dll: RavenGun's synthetic Dinkey Pro key for Shell.exe (tools/rg-dk2win/, built with
; tools/rg-dk2win/build.sh; the ordinals and what the shell does with each answer are in rg_dk2win.c). Shell.exe imports
; the DLL by ordinal, so it is an ordinary drop-in next to the exe and no preload is needed. Its log rg-dk2.log lands next
; to Shell.exe in the view: no log = the DLL was not loaded. RG_DK2_DESIGN=C makes the key report the COW design instead
; of PIG (GameSettings.ini DESIGN TYPE).
[DK2WIN32.dll]
To = .
Env = RG_DK2_LOG=rg-dk2.log
