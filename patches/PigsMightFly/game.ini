; Gegenereerd door scripts/migrate-game-settings.py (docs/per-game-patches.md). Sleutels die het script afleidt uit de oude bronnen worden bij
; elke run opnieuw gezet; handwerk in andere sleutels blijft staan.
;
; Uit het oude UserProfiles/PigsMightFly.env:
; door tp-add-game.py; 2026-10-11 nacht: standaardroute van de lader (entry-point-trampoline), zonder TP_REMOTETHREAD_MS
; eigen prefix-kopie met C:\Sega -> de Sega-map van Pigs Might Fly (de shell zoekt C:\Sega\...)

[Game]
Name = Pigs Might Fly
Profile = PigsMightFly
Type = TeknoParrot
EmulationProfile = WartranTroopers
Executable = shell.exe
ProfileRevision = 1
Patreon = true

[Launch]
; Direct3D 9 via DXVK on the engine's plain Wine and shared prefix (no wrapper script in the launch path).
Dxvk = true
Mode = direct
; The shell looks for its game at C:\Sega\PigsMightFly (no window and a test menu without it). Until 2026-10-19 that was a hand-made
; link inside the machine prefix ravengun-test-pigs, which the prefix no longer has; the engine now makes it for the run.
Drives = C:\Sega=Sega
; The cabinet's own launcher (Launcher/SystemLauncher.exe, format string '/k=%08x') starts the shell with a checksum of
; Shell.exe; without it the shell's boot step 2 (0x4059b0) shows SECURITY FAILURE 2 and returns to step 0. The value is the
; shell's own checksum (0x417f30/0x41eed0: table at 0x485280, start value at 0x482020) over Sega/Shell/Shell.exe.
Arguments = /k=036f5813
; Shell/Game.ini on the NAS sets [Variables] Directory to the NAS path itself (Z:\home\deck\mnt\...\shell\variables\), so the
; shell would read and write its counters there. seed/Game.ini is the same file with Directory=.\variables\ and the variables
; directory is a local copy in the view.
ViewWritable = Sega/Shell/variables

[Wine]
; The shell wants C:\Sega (Drives above), which must not leak into other games: its own prefix, made by the engine.
PrefixMode = Isolated

[Display]
; Via gamescope: zonder gamescope werd het hele scherm zwart na de eerste ronde (DIRECT-ROUTE-BEELD.md, 2026-10-14).
Gamescope = true
GamescopePath = /usr/bin/gamescope

[Input]
Route = tp-shm
Layout = WartranTroopers
Note = speelbaar via tp-shm: UserProfiles/PigsMightFly.env heeft TP_REMOTETHREAD=off (standaardroute van de lader) en RG_WINEPREFIX naar een prefix-kopie waarin C:\Sega naar de Sega-map van de game wijst (de shell zoekt C:\Sega\PigsMightFly; zonder dat blijft hij in zijn testmenu). Staande (portret) game: trekker = hendel (lanceert het varken), start = toets 1, testmenu: TEST (toets 0), service = F3

[Status]
Status = parked
Note = 2026-10-19 op onze eigen kern ([Loader] Core = ravengun): het spel start in gamescope (eigen prefix ravengun-test-pigs, C:\Sega naar de game) en blijft draaien, maar er komt geen venster in beeld (de daemon startte hem met een muisgeweer op speler 1, ravengunctl mouse-gun). VERONDERSTELLING: de oorzaak is dat er geen PS Move aangesloten is en dat het spel daar zelf op wacht; wat dat zou bevestigen is een start met een aangesloten en gekoppelde Move (dan hoort het venster er wel te komen), vijf keer. AANVULLING 2026-10-19 (optionele game): dezelfde start is herhaald en gaf hetzelfde beeld -- de game loopt, maar er komt geen venster in beeld (de foto is het bureaublad). De oude meting "met de Move aan -- speelbaar" (start met toets 1 en de trekker, de hendel die het varken lanceert, werken; staand beeld) is op de TEKNO PARROT-KERN gedaan, niet op de onze, dus Move en kern lopen daar door elkaar: die meting laat niet zien dat het op onze kern met een Move werkt van de tv. Testmenu: TEST (toets 0), service (F3). Draait in een eigen Wine-prefix waarin C:\Sega naar de game wijst.
NoteEN = MEASURED 2026-10-21 15:55 (headless, claude-pigs): BLOCKER 2 FIXED with the drop-in rg-pigsio.dll (tools/rg-pigsio, a synthetic USB HID board VID_1043 PID_0000, GAMEPAD collection, format read from the shell's own code in rg_pigs_board.h). Its log: enumeration, CreateFile, HidD_GetAttributes, HidP_GetCaps, then commands E0/E1/F0/F1 answered B0/B1/B2/B3; the shell's memory: board-found 0x491d34 = 1, handshake ALL OK 0x491d38 = 1, HID state 0x491d4c = 9, IO sub-step 1 -> 3 -> 4 ("IO Board OK"), boot step 3 -> 15 (Dinkey check 0x4053f0 entered: its flag 0x487358 = 1) -> back to step 0. Shell CPU 4 % (input reads paced at 4 ms). BLOCKER 3, OPEN (dongle lane): the Dinkey Pro key (DK2WIN32.dll). The two bytes the shell derives from the board's ID replies (0xc6, 0xbb with reply data 0; RG_PIGSIO_ID changes them) start the 15-byte block [0x48b3dc] given to DK2WIN32 ordinal 20. Earlier: MEASURED 2026-10-21 14:58 (headless, claude-tnx, ravengunctl game start PigsMightFly; boot state read from the shell's memory: step at 0x487480, IO sub-step at 0x4874cc, board-found flag at 0x491d34). The shell is a boot state machine (jump table 0x407720), not a file loop. BLOCKER 1, FIXED: step 2 (0x4059b0) wants '/k=<checksum of Shell.exe>' on the command line, which the cabinet's Launcher/SystemLauncher.exe passes ('/k=%08x'); without it SECURITY FAILURE 2 and back to step 0. [Launch] Arguments = /k=036f5813 (the shell's own checksum routine 0x417f30/0x41eed0 over Shell.exe): step 3 was reached 6 s after start. BLOCKER 2, OPEN: step 3 waits 5 s for its HID I/O board (USB\VID_1043&PID_0000, found flag 0x491d34 stayed 0), prints IO BOARD FAILURE (sub-steps 1 -> 3 -> 4) and parks in step 0, which only polls the TEST key (0x405b80); ~92 % CPU, still no frame presented (no screenshot file). BLOCKER 3, NEXT: with the board found, step 4 goes to step 15 (0x4053f0), the Dinkey Pro key check through DK2WIN32.dll (0x415430/0x414df0; 'ERROR : No Security Key Found'). The I/O board handshake and the Dinkey key are security hardware: handed to the dongle lane. NAS: Shell/Game.ini pointed [Variables] Directory at the NAS path itself; seed/Game.ini (Directory=.\variables\, landed in the write layer) and ViewWritable = Sega/Shell/variables (local copy) keep the counters off the NAS; find on the NAS folder after the run: 0 files newer than today. Earlier notes: MEASURED 2026-10-20 (second pass): with WINEDEBUG=err+all,+loaddll,+setupapi,+hid,+file the shell loads hid.dll and enumerates the host's HID devices once through SetupDi (it sees the PS Move VID_054C PID_03D5 and others; no I/O board of its own), then loops: 2827 ReadFile calls in 60 s on its variables files (Z:\...\Sega\shell\variables\*.bak, 8-byte reads, path taken from Shell/Game.ini 'Directory=' which points at the NAS path of the old machine) at ~100 % CPU, while no frame is presented. The strings of Shell.exe contain 'Status: Waiting For IO Board', 'ERROR : No Security Key Found' and a DK2WIN32.DLL import (a hardware key), so the likely blockers are the I/O board (HID) and the key; neither is emulated yet. Not measured: which of the two the loop waits for. NOTE: the NAS mount is rw (cifs); the game's own writes are caught by the bwrap overlay, files under Sega/Shell/variables were not touched (checked by mtime). Earlier notes: MEASURED 2026-10-20 (headless gamescope, plain Wine, [Launch] Dxvk, no wrapper script, two starts of about 3 min): the engine now creates drive_c of the isolated prefix and the link C:\Sega -> view/Sega (checked: ~/.local/share/ravengun/prefixes/PigsMightFly/drive_c/Sega exists after the start), Shell.exe starts and DXVK creates its 768x1280 swapchain (gamescope WSI log), i.e. the window now exists, which it did not before. NOT reached: a picture. Shell.exe then sits at about 100 % CPU (RSS 90 MB), no PigsMightFly.exe child process appears, gamescopectl screenshot never produces a file (no frame presented), and WINEDEBUG=err+all,fixme+all prints nothing relevant. Not a Wine error, so the next step is to find what Shell.exe waits for (the older note says it waited for a Move / the old Tekno Parrot core did something here). Status stays parked. Earlier notes: STATIC 2026-10-20 (not started yet): the old fix for 'no window' was a hand-made link C:\Sega -> .../Pigs Might Fly/Sega inside the machine prefix ravengun-test-pigs, and that prefix no longer has it (drive_c has no Sega entry). The profile now asks the engine for it ([Launch] Drives = C:\Sega=Sega, own prefix with [Wine] PrefixMode = Isolated, DXVK through [Launch] Dxvk, no wrapper script); direct.cpp creates drive_c of a fresh prefix. rg-direct --plan is ok; the headless start is still to be measured. Earlier notes: 2026-10-19 on our own core ([Loader] Core = ravengun): the game starts under gamescope (its own prefix ravengun-test-pigs, C:\Sega pointing at the game) and keeps running but shows no window (the daemon started it with a mouse gun on player 1, ravengunctl mouse-gun). ADDITION 2026-10-19 (optional game): the same start was repeated and gave the same picture -- the game runs but no window appears (the screenshot is the desktop). HYPOTHESIS: the cause is that no PS Move is connected and the game itself waits for one; what would confirm that is a start with a connected and paired Move (then the window should appear), five times. The older "with the Move on -- playable" measurement (start with key 1 and the trigger, the lever that launches the pig, work; portrait picture) ran on the TEKNO PARROT CORE, not on ours, so Move and core are confounded there: it does not show that it works on our core with a Move. Test menu: TEST (key 0), service (F3). Runs in its own Wine prefix where C:\Sega points at the game.
