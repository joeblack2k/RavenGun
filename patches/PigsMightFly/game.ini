; Gegenereerd door scripts/migrate-game-settings.py (docs/per-game-patches.md). Sleutels die het script afleidt uit de oude bronnen worden bij
; elke run opnieuw gezet; handwerk in andere sleutels blijft staan.
;
; Uit het oude UserProfiles/PigsMightFly.env:
; door tp-add-game.py; 2026-10-11 nacht: standaardroute van de lader (entry-point-trampoline), zonder TP_REMOTETHREAD_MS
; eigen prefix-kopie met C:\Sega -> de Sega-map van Pigs Might Fly (de shell zoekt C:\Sega\...)

[Game]
Name = Pigs Might Fly
Profile = PigsMightFly
Type = TeknoParrot
EmulationProfile = WartranTroopers
Executable = shell.exe
ProfileRevision = 1
Patreon = true

[Launch]
Mode = direct

[Display]
; Via gamescope: zonder gamescope werd het hele scherm zwart na de eerste ronde (DIRECT-ROUTE-BEELD.md, 2026-10-14).
Gamescope = true
GamescopePath = /usr/bin/gamescope

[Wine]
Prefix = ravengun-test-pigs
Runner = wrapper
; DXVK voor Direct3D 9 (d3d9.dll uit GE-Proton in syswow64 van deze prefix; het origineel staat ernaast als d3d9.dll.wined3d-bewaard).
DllOverrides = d3d9=n,b

[Input]
Route = tp-shm
Layout = WartranTroopers
Note = speelbaar via tp-shm: UserProfiles/PigsMightFly.env heeft TP_REMOTETHREAD=off (standaardroute van de lader) en RG_WINEPREFIX naar een prefix-kopie waarin C:\Sega naar de Sega-map van de game wijst (de shell zoekt C:\Sega\PigsMightFly; zonder dat blijft hij in zijn testmenu). Staande (portret) game: trekker = hendel (lanceert het varken), start = toets 1, testmenu: TEST (toets 0), service = F3

[Status]
Status = playable
Note = Speelbaar: start (toets 1) en trekker (de hendel die het varken lanceert) werken; staand beeld (portret) in het midden van de tv. Testmenu: TEST (toets 0), service (F3). Draait in een eigen Wine-prefix waarin C:\Sega naar de game wijst.
NoteEN = Playable: start (key 1) and trigger (the lever that launches the pig) work; portrait picture in the middle of the TV. Test menu: TEST (key 0), service (F3). Runs in its own Wine prefix where C:\Sega points at the game.
Findings = findings/PigsMightFly.md

; Profiel uit TeknoParrot-sjabloon GameProfiles/PigsMightFly.xml, revisie 1 (scripts/import-tp-profiles.py; opnieuw importeren in plaats van met de hand wijzigen)
[Identify]
Path = Sega/Shell/Shell.exe
Size = 546304

[Config]
General/Input API = RawInput
General/Windowed = 0
General/HideCursor = 0
General/CustomResolution = 0
General/ResolutionWidth = 1366
General/ResolutionHeight = 768
Bezel/Enable = 0

[ConfigType]
General/Input API = Dropdown
General/Windowed = Bool
General/HideCursor = Bool
General/CustomResolution = Bool
General/ResolutionWidth = Text
General/ResolutionHeight = Text
Bezel/Enable = Bool

[ConfigOptions]
General/Input API = DirectInput|XInput|RawInput

[Loader]
; Onze eigen OpenParrot-kern in plaats van de gesloten TeknoParrot-kern: die zit niet meer in de
; draaiende map (de runtime staat als *.verborgen) en er is geen TeknoParrot meer nodig.
Core = ravengun
