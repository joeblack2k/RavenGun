; Gegenereerd door scripts/migrate-game-settings.py (docs/per-game-patches.md). Sleutels die het script afleidt uit de oude bronnen worden bij
; elke run opnieuw gezet; handwerk in andere sleutels blijft staan.
;
; Uit het oude UserProfiles/PigsMightFly.env:
; door tp-add-game.py; 2026-10-11 nacht: standaardroute van de lader (entry-point-trampoline), zonder TP_REMOTETHREAD_MS
; eigen prefix-kopie met C:\Sega -> de Sega-map van Pigs Might Fly (de shell zoekt C:\Sega\...)

[Game]
Name = Pigs Might Fly
Profile = PigsMightFly
Type = TeknoParrot
EmulationProfile = WartranTroopers
Executable = shell.exe
ProfileRevision = 1
Patreon = true

[Launch]
; Direct3D 9 via DXVK on the engine's plain Wine and shared prefix (no wrapper script in the launch path).
Dxvk = true
Mode = direct
; The shell looks for its game at C:\Sega\PigsMightFly (no window and a test menu without it). Until 2026-10-19 that was a hand-made
; link inside the machine prefix ravengun-test-pigs, which the prefix no longer has; the engine now makes it for the run.
Drives = C:\Sega=Sega

[Wine]
; The shell wants C:\Sega (Drives above), which must not leak into other games: its own prefix, made by the engine.
PrefixMode = Isolated

[Display]
; Via gamescope: zonder gamescope werd het hele scherm zwart na de eerste ronde (DIRECT-ROUTE-BEELD.md, 2026-10-14).
Gamescope = true
GamescopePath = /usr/bin/gamescope

[Input]
Route = tp-shm
Layout = WartranTroopers
Note = speelbaar via tp-shm: UserProfiles/PigsMightFly.env heeft TP_REMOTETHREAD=off (standaardroute van de lader) en RG_WINEPREFIX naar een prefix-kopie waarin C:\Sega naar de Sega-map van de game wijst (de shell zoekt C:\Sega\PigsMightFly; zonder dat blijft hij in zijn testmenu). Staande (portret) game: trekker = hendel (lanceert het varken), start = toets 1, testmenu: TEST (toets 0), service = F3

[Status]
Status = parked
Note = 2026-10-19 op onze eigen kern ([Loader] Core = ravengun): het spel start in gamescope (eigen prefix ravengun-test-pigs, C:\Sega naar de game) en blijft draaien, maar er komt geen venster in beeld (de daemon startte hem met een muisgeweer op speler 1, ravengunctl mouse-gun). VERONDERSTELLING: de oorzaak is dat er geen PS Move aangesloten is en dat het spel daar zelf op wacht; wat dat zou bevestigen is een start met een aangesloten en gekoppelde Move (dan hoort het venster er wel te komen), vijf keer. AANVULLING 2026-10-19 (optionele game): dezelfde start is herhaald en gaf hetzelfde beeld -- de game loopt, maar er komt geen venster in beeld (de foto is het bureaublad). De oude meting "met de Move aan -- speelbaar" (start met toets 1 en de trekker, de hendel die het varken lanceert, werken; staand beeld) is op de TEKNO PARROT-KERN gedaan, niet op de onze, dus Move en kern lopen daar door elkaar: die meting laat niet zien dat het op onze kern met een Move werkt van de tv. Testmenu: TEST (toets 0), service (F3). Draait in een eigen Wine-prefix waarin C:\Sega naar de game wijst.
NoteEN = MEASURED 2026-10-20 (headless gamescope, plain Wine, [Launch] Dxvk, no wrapper script, two starts of about 3 min): the engine now creates drive_c of the isolated prefix and the link C:\Sega -> view/Sega (checked: ~/.local/share/ravengun/prefixes/PigsMightFly/drive_c/Sega exists after the start), Shell.exe starts and DXVK creates its 768x1280 swapchain (gamescope WSI log), i.e. the window now exists, which it did not before. NOT reached: a picture. Shell.exe then sits at about 100 % CPU (RSS 90 MB), no PigsMightFly.exe child process appears, gamescopectl screenshot never produces a file (no frame presented), and WINEDEBUG=err+all,fixme+all prints nothing relevant. Not a Wine error, so the next step is to find what Shell.exe waits for (the older note says it waited for a Move / the old Tekno Parrot core did something here). Status stays parked. Earlier notes: STATIC 2026-10-20 (not started yet): the old fix for 'no window' was a hand-made link C:\Sega -> .../Pigs Might Fly/Sega inside the machine prefix ravengun-test-pigs, and that prefix no longer has it (drive_c has no Sega entry). The profile now asks the engine for it ([Launch] Drives = C:\Sega=Sega, own prefix with [Wine] PrefixMode = Isolated, DXVK through [Launch] Dxvk, no wrapper script); direct.cpp creates drive_c of a fresh prefix. rg-direct --plan is ok; the headless start is still to be measured. Earlier notes: 2026-10-19 on our own core ([Loader] Core = ravengun): the game starts under gamescope (its own prefix ravengun-test-pigs, C:\Sega pointing at the game) and keeps running but shows no window (the daemon started it with a mouse gun on player 1, ravengunctl mouse-gun). ADDITION 2026-10-19 (optional game): the same start was repeated and gave the same picture -- the game runs but no window appears (the screenshot is the desktop). HYPOTHESIS: the cause is that no PS Move is connected and the game itself waits for one; what would confirm that is a start with a connected and paired Move (then the window should appear), five times. The older "with the Move on -- playable" measurement (start with key 1 and the trigger, the lever that launches the pig, work; portrait picture) ran on the TEKNO PARROT CORE, not on ours, so Move and core are confounded there: it does not show that it works on our core with a Move. Test menu: TEST (key 0), service (F3). Runs in its own Wine prefix where C:\Sega points at the game.
Findings = findings/PigsMightFly.md

