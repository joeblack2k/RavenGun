Note = native route: Unreal-motor met SDL 1.2; muis en toetsenbord via X (gamescope). In DefUser.ini van de game: F1/F2 = START speler 1/2, C = munt; de linkerknop vuurt.

[Status]
Status = untested
Note = Nooit gestart. Statisch onderzocht (2026-10-14): i386, ongepakt, Unreal Engine 2 (armyops-bin, SDL 1.2 uit de spelmap, libstdc++.so.5 uit ElfLdr2/libs). Invoer via SDL (X-muis en -toetsenbord). Open: START is F1 en munt is C in de game, de daemon stuurt 1 en 5; de virtuele lightgun beweegt de X-cursor niet (LIBINPUT_IGNORE_DEVICE), dus richten werkt alleen met een echte muis.
NoteEN = Never started. Statically examined (2026-10-14): i386, unpacked, Unreal Engine 2 (armyops-bin, SDL 1.2 from the game folder, libstdc++.so.5 from ElfLdr2/libs). Input through SDL (X mouse and keyboard). Open: START is F1 and coin is C in the game, the daemon sends 1 and 5; the virtual lightgun does not move the X cursor (LIBINPUT_IGNORE_DEVICE), so aiming only works with a physical mouse.

