; Gegenereerd door scripts/migrate-game-settings.py (docs/per-game-patches.md). Sleutels die het script afleidt uit de oude bronnen worden bij
; elke run opnieuw gezet; handwerk in andere sleutels blijft staan.
;
; Uit het oude UserProfiles/InfinityBladeFX.env:
; door tp-add-game.py; geparkeerd: 32-bit TeknoParrot-kern (zie [Status] in game.ini)

[Game]
Name = Infinity Blade FX
Profile = InfinityBladeFX
Type = TeknoParrot
EmulationProfile = InfinityBlade
Executable = SwordGame.exe
ProfileRevision = 4

[Launch]
Mode = direct
; proef 7 (2026-10-17): de game schrijft Launch.log in SwordGame/Logs; die map op de NAS is alleen-lezen, dus een eigen map in de view
ViewRealDirs = SwordGame/Logs
; DXVK: met wined3d bleef het zwart
Dxvk = true
; WIT BEELD ZONDER TELOS (2026-10-18, docs/research/losse/InfinityBladeFX.md "Wit beeld"): de gesloten kern gaf de game altijd een
; opdrachtregel mee ("-Fullscreen -simmobileinput", bij Windowed = 1: "-ResX=1280 -ResY=853 -Windowed -simmobileinput"). De eigen kern
; (generieke route) geeft er geen: Launch.log toont "Init: Command line:" leeg en "Shader platform (RHI): PC-D3D-SM4" (de D3D10-weg,
; "Found D3D10 adapter 0"), terwijl ALLE negen runs met de opdrachtregel van de kern "PC-D3D-SM3" (D3D9) gaven en daarmee de attract
; haalden. De keuze staat op SwordGame.exe 0x73e4d8..0x73e593 (RHI-keuze): D3D10 als het vlagwoord 0x31af960 gezet is of -d3d10/-sm4 meekomt.
; Hier dezelfde opdrachtregel als de kern bij Windowed = 1 (venster in gamescope; exclusief schermvullend bleef wit, 2026-10-17).
Arguments = -ResX=1280 -ResY=853 -Windowed -simmobileinput

; KANDIDAAT zonder TeknoParrot (docs/research/losse/InfinityBladeFX.md). Wat dit anders doet dan de meegeleverde game.ini:
;  1. [Loader] Build/Core = ravengun: de eigen OpenParrot-lader en -kern (generieke route, geen hooks) in plaats van TeknoParrot.dll.
;  2. [Wine] DllOverrides = dinput8=b: de map van de game levert TeknoParrot's TPFIX-dinput8.dll mee (readme.txt daar), en
;     TPFIX.ini wijst naar TeknoParrot.dll; Wine moet zijn eigen dinput8 nemen en nooit dat bestand laden.
;  3. dropin: rg-kaboom.dll (tools/rg-kaboom/) bootst het Kaboom-bord (COM9) na dat de kern deed; zie de sectie
;     [rg-kaboom.dll] in docs/research/losse/InfinityBladeFX.dropin.ini, die in patches/InfinityBladeFX/dropin/dropin.ini hoort.
[Loader]
Build = ravengun
Core = ravengun

[Wine]
DllOverrides = dinput8=b

[Display]
Gamescope = true

[Input]
Route = tp-shm
Layout = TimeCrisis5
Note = Start via dubbelklik (2026-10-17): directe route met DXVK, dongle in orde (Matrix-ordinalen), UE3-opstartscherm en dan de attract (ARE YOU READY?, 0/4 CREDITS). Nodig: Windowed = 1 in gamescope (met 0 bleef het wit). Kaboom (munten, keypad, tickets) faalt nog: CKaboomCom in SwordGame.exe opent een seriële poort. Spelen niet gemeten.

[Status]
Status = working
Note = Sinds 2026-10-18 zonder TeknoParrot (onze kern, rg-kaboom/PQMTClient/Matrix van ons): op de tv zonder TP-map attract-film, munt (2/4 CREDITS), geluid, D3D9 (SM3). Eerder: 2026-10-16: directe route met DXVK: de dongle (Matrix, import op ordinaal #40/#55/#61) klopt nu, het UE3-opstartscherm komt, daarna wit. Launch.log stopt bij "Kaboom: InitLib() failed" (CKaboomCom zit in SwordGame.exe zelf en opent een seriële poort; KaboomComDll.dll wordt niet gebruikt); de hoofddraad pompt berichten (PeekMessage), geen berichtvenster. Open. Speelproef 2026-10-17 (muismodus): munt komt niet aan (0/4 CREDITS); de Kaboom-I/O van de kast faalt.
NoteEN = Since 2026-10-18 without TeknoParrot (our core, our rg-kaboom/PQMTClient/Matrix): on the TV without the TP folder attract movie, coin (2/4 CREDITS), sound, D3D9 (SM3). Starts by double-click (2026-10-17): DXVK, dongle passes, then the attract (are you ready, 0/4 credits). Needs Windowed = 1 under gamescope. The cabinet I/O (Kaboom: coins, keypad, tickets) still fails; play not measured. Play test 2026-10-17 (mouse mode): coins do not arrive (0/4 credits); the cabinet's Kaboom I/O fails.
Findings = findings/InfinityBladeFX.md

