;
; dropin.ini - wat er in de view van Infinity Blade FX komt (docs/dropins.md,
; docs/geen-dongle-in-de-loader.md).
;
; Onze eigen matrix32.dll beantwoordt de Matrix/SBK-dongle-controle van deze game en leest zijn eigen
; gegevens uit matrix/matrix.ini ernaast. De launcher kopieert bestanden en zet omgevingsvariabelen;
; hij weet niet wat een dongle is.
;
; CONTRACT (docs/dropins.md): dest = <map van de game-exe> + To + sectienaam. LET OP: die basis is de
; map van de EXE, niet de hoofdmap van de game. Bij de Unity-games staat de exe in de hoofdmap van de
; view en is dat hetzelfde; bij deze game staat hij diep in de boom
; ([Identify] Path = Binaries/Win32/SwordGame.exe), dus de basis is <view>/Binaries/Win32 en is
; `To = .` hier goed. Met `To = Binaries/Win32` zou het bestand in
; <view>/Binaries/Win32/Binaries/Win32/ terechtkomen.
;
; To = . (naast de exe) is ook functioneel de juiste plek: dit is een NATIVE 32-bits game, geen
; Unity-game. SwordGame.exe (Binaries/Win32, 49878016 bytes) importeert matrix32.dll rechtstreeks in
; zijn importtabel -- de enige game in de inventaris die dat doet; de Unity-games laden de DLL via
; P/Invoke uit managed code. Gemeten: de importtabel van SwordGame.exe noemt de module `matrix32.dll`
; met drie ordinalen (#40, #55 en #61), en het originele bestand is daar bewaard als
; `matrix32.TEKNOPARROT.dll` met TeknoParrot's emulator in de plaats (readme.txt in die map beschrijft
; precies die twee stappen).
;
; De gegevensmap staat NAAST de bibliotheek (dus in <view>/Binaries/Win32/matrix/): de bibliotheek
; zoekt `matrix.ini` in RAVENGUN_MATRIX_DIR en anders naast zichzelf.
;
; GEEN RAVENGUN_MATRIX_DLL: die variabele zet alleen de Matrix-patches van plugins/unity/src/rabbids/
; uit; deze game is native en heeft geen BepInEx-plugin.
;
; RAVENGUN_MATRIX_LOG=matrix.log laat de bibliotheek haar antwoorden opschrijven (in de werkmap van de
; game, dus in de view en nooit op de NAS). Dat is het bewijs dat ONZE dll is aangeroepen en niet het
; origineel.
;
; matrix32.dll komt uit matrix/out/ (scripts/build-matrix.sh): zelf gebouwd, geen kopie van een
; bestand van TeknoParrot. Deze game is 32-bits en importeert matrix32.dll; matrix64.dll hoort hier
; NIET -- een bestand zonder eigen sectie wordt niet uitgerold.
;
; LET OP bij het uitrollen: de map van de exe moet een ECHTE map in de view zijn. Is <view>/Binaries
; (of <view>/Binaries/Win32) een koppeling naar de NAS, dan weigert de drop-in-motor terecht, want
; schrijven zou dan op de NAS uitkomen. De view van deze game is daarom tot op Binaries/Win32
; uitgerold als echte mappen met koppelingen naar de inhoud -- precies wat dropin_materialiseer in
; scripts/launch-direct.py anders zelf doet.

[matrix32.dll]
To = .
DllOverride = native
Env = RAVENGUN_MATRIX_DIR=matrix;RAVENGUN_MATRIX_GAME=InfinityBladeFX;RAVENGUN_MATRIX_LOG=matrix.log

[matrix/matrix.ini]
To = .

[ravengun-hasp/InfinityBladeFX/dongle.json]
To = .

[rg-kaboom.dll]
To = .
Preload = true
Audit = false
Env = RG_KABOOM_PORT=9;RG_KABOOM_LOG=rg-kaboom.log

; PQMTClient.dll: vervangt de client van de PQ-Labs-multitouchserver ("TouchFX" in SwordGame.exe; tools/rg-pqmt/). De echte client praat
; via TCP met een server op 127.0.0.1; die is er niet, ConnectServer faalt ("TouchFX Error: ConnectServer() failed") en de game blijft
; na ~29 s op een wit scherm (tv-meting 2026-10-17). Onze DLL heeft dezelfde 16 exports (namen en ordinalen), laat ConnectServer,
; SendRequest en SendThreshold slagen en geeft de aanraking uit het gedeelde geheugen door: trekker (bit 0x10) = vinger neer,
; X/Y-bytes = positie in pixels van het venster. De game importeert de DLL op naam uit de map van de exe; de view heeft er een
; symlink naar de NAS die de drop-in-motor vervangt. Het logboek komt naast de exe in de view.
[PQMTClient.dll]
To = .
DllOverride = native
Env = RG_PQMT_LOG=rg-pqmt.log
