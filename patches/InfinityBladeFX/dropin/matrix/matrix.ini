;
; matrix.ini - de gegevens van de Matrix/SBK-donglelaag van Infinity Blade FX.
;
; De bibliotheek (matrix32.dll, in dezelfde drop-in) leest dit bestand zelf; de launcher weet er niets
; van (docs/geen-dongle-in-de-loader.md). De drop-in geeft de weg mee met RAVENGUN_MATRIX_DIR=matrix,
; en de bibliotheek zoekt het bestand daar en anders naast zichzelf.
;
; Deze game leest GEEN dongle-geheugen: hij importeert alleen Init_MatrixAPI, Dongle_Count en
; Dongle_ReadSerNr (ordinalen #40, #55 en #61 van matrix32.dll, zie dongle.json). Daarom staat er geen
; memory-regel.
;
; aantal  het aantal dongles dat wij opgeven: 2. Dat is geen gok: TeknoParrot's eigen matrix32.dll
;         staat in deze map (Binaries/Win32, 109056 bytes, md5 3a5bed5fc3de3797073fced37b33d41f) en
;         zijn export op ordinaal 55 is letterlijk `b8 02 00 00 00 c3` = `mov eax,2; ret`. Die DLL
;         hoort bij deze game (readme.txt in die map), dus 2 is de waarde die deze game krijgt.
;
; poort   NIET GEZET, en dat is met opzet. De poort van deze game is niet gemeten: SwordGame.exe
;         importeert de drie functies wel (ordinalen #40, #55, #61), maar er staat geen enkele
;         statische aanroep naar die imports in het beeld -- geen `call dword ptr [<IAT>]`, geen
;         E8-aanroep naar de import-thunk, en de IAT- en thunk-adressen komen nergens anders in het
;         bestand voor (ook niet in .reloc). De aanroepen worden dus tijdens het draaien opgelost en
;         zijn niet uit het bestand te lezen. Zonder deze regel gebruikt de bibliotheek haar
;         standaardwaarde (85, matrix/src/matrix.h); dat verandert niets aan het antwoord, want
;         Dongle_Count en Dongle_ReadSerNr gebruiken de poort niet. TeknoParrot's eigen emulator doet
;         hetzelfde: die geeft op ordinaal 55 altijd 2 terug, ongeacht de poort.
;
; Het serienummer staat hier bewust NIET in: dat is een vaste, zelfgekozen waarde in de bibliotheek
; (0x10F2C = 69420, precies de waarde die TeknoParrot's DLL op ordinaal 61 teruggeeft). Er hoort geen
; echt serienummer in een bestand te staan, en er wordt er ook geen gelezen of gelogd.

aantal = 2
