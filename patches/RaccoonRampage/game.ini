; Gegenereerd door scripts/migrate-game-settings.py (docs/per-game-patches.md). Sleutels die het script afleidt uit de oude bronnen worden bij
; elke run opnieuw gezet; handwerk in andere sleutels blijft staan.
;
; Uit het oude UserProfiles/RaccoonRampage.env:
; door tp-add-game.py; test 2026-10-11: standaardroute van de lader (entry-point-trampoline), zonder TP_REMOTETHREAD

[Game]
Name = Raccoon Rampage
Profile = RaccoonRampage
Type = TeknoParrot
EmulationProfile = WartranTroopers
Executable = RSGame-Win64-Shipping.exe
Is64Bit = true
ProfileRevision = 8

[Launch]
Mode = direct

[Loader]
; KANDIDAAT (2026-10-17), niet de huidige game.ini: zonder TeknoParrot. Geen lader en geen kern ([Loader] Core = none, Wine start de exe
; zelf); de game praat met zijn UNIS-bord via RSGame/Plugins/UsbPluginsDll.dll en die is hier onze eigen rg-unis (tools/rg-unis/,
; dropin/UsbPluginsDll.dll, tabel dropin/rg-unis.ini): ParseIOData leest het bordbeeld (trekkers, test/service/enter, ruwe aanwijspunten
; b*257, munten) uit TeknoParrot_JvsState van rg-jvsbridge. [Status] hieronder is die van de route met de kern van TeknoParrot en
; geldt voor deze route NIET tot de tv-proef in docs/research/wartran/README.md ("Tv-recept UNIS") is gedaan.
; Gamescope zoals Rampage/Mars Sortie (de eerste zonder-lader-run van Rampage had zwart beeld zonder gamescope; GEGOKT dat dat hier ook geldt).
Core = none

[Wine]
Prefix = ravengun-test-dxvk
DllOverrides = d3d11,d3d10core,dxgi=n,b
Runner = wrapper
GStreamerPlugins = ~/.local/share/ravengun/tools/gst-extra/plugins

[Display]
Gamescope = true
GamescopePath = /usr/bin/gamescope
DisplayMode = Fullscreen Windowed
CustomResolution = 1920x1080

[Input]
Route = tp-shm
Layout = WartranTroopers
Note = speelbaar via tp-shm: UserProfiles/RaccoonRampage.env heeft TP_REMOTETHREAD=off (standaardroute van de lader; met TP_POSTSTART_REMOTETHREAD_MS komt er geen invoer aan). Testmenu: TEST (toets 0), service (F3) = omlaag, F4 = enter; kalibratie staat in Setting_Hardware.ini. Draait met DXVK-prefix (tp-add-game.py --dxvk); de films in RSGame/Content/Movies spelen met [Wine] GStreamerPlugins, een lege Movies-map is niet meer nodig (ATTRACT-RUN.md, 2026-10-14). Op onze eigen kern komt er geen invoer aan: de gesloten kern bedient de I/O van de game uit TeknoParrot_JvsState, de game leest die niet zelf

; Bediening voor de knoppen-uitleg bij de eerste start (docs/per-game-patches.md, "Bediening per game"); labels uit het
; TeknoParrot-profiel (GameProfiles/<P>.xml), "Not confirmed yet" = de werking is nog niet gemeten.
[Controls]
trigger = Shoot | Fires the gun.

[Status]
Status = working
Note = WERKT op onze eigen route (2026-10-14): een dubbelklik in RavenGun start de game zonder scripts en zonder TeknoParrotUi (daemon -> rg-direct -> Wine -> OpenParrot-lader). Gemeten op de tv met de muismodus: trekker = start, richten en schieten, gespeeld tot een eindbaas (score 22046), 5:17 min gedraaid. Munt (toets 5), testmenu (toets 0, F3, F4); de kalibratie staat in de game-opslag. Nog niet met de echte Move gespeeld op deze route.
NoteEN = WORKING on our own route (2026-10-14): a double-click in RavenGun starts the game without scripts and without TeknoParrotUi (daemon -> rg-direct -> Wine -> OpenParrot loader). Measured on the TV in mouse mode: trigger = start, aim and shoot, played up to a boss (score 22046), ran 5:17 min. Coin (key 5), test menu (key 0, F3, F4); calibration is stored in the game's save data. Not yet played with the real Move on this route.
Findings = findings/RaccoonRampage.md

