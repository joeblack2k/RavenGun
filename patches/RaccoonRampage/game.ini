; Gegenereerd door scripts/migrate-game-settings.py (docs/per-game-patches.md). Sleutels die het script afleidt uit de oude bronnen worden bij
; elke run opnieuw gezet; handwerk in andere sleutels blijft staan.
;
; Uit het oude UserProfiles/RaccoonRampage.env:
; door tp-add-game.py; test 2026-10-11: standaardroute van de lader (entry-point-trampoline), zonder TP_REMOTETHREAD

[Game]
Name = Raccoon Rampage
Profile = RaccoonRampage
Type = TeknoParrot
EmulationProfile = WartranTroopers

[Launch]
Mode = direct

[Wine]
Prefix = ravengun-test-dxvk
DllOverrides = d3d11,d3d10core,dxgi=n,b

[Display]
DisplayMode = Fullscreen Windowed
CustomResolution = 1920x1080

[Input]
Route = tp-shm
Layout = WartranTroopers
Note = speelbaar via tp-shm: UserProfiles/RaccoonRampage.env heeft TP_REMOTETHREAD=off (standaardroute van de lader; met TP_POSTSTART_REMOTETHREAD_MS komt er geen invoer aan). Testmenu: TEST (toets 0), service (F3) = omlaag, F4 = enter; kalibratie staat in Setting_Hardware.ini. Draait met DXVK-prefix en lege Movies-map (tp-add-game.py --dxvk --empty-dir)

[Status]
Status = playable
Note = Speelbaar: richten, trekker (ook = start) en munt (toets 5) werken; testmenu met TEST (toets 0), service (F3) en F4. De kalibratie is eenmalig gedaan en staat in de game-opslag. Draait met DXVK en zonder intro-video's.
NoteEN = Playable: aiming, trigger (also start) and coin (key 5) work; test menu with TEST (key 0), service (F3) and F4. Calibration was done once and is stored in the game's save data. Runs with DXVK and without intro videos.
Findings = findings/RaccoonRampage.md
