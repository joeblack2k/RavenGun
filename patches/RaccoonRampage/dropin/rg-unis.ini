;
; rg-unis.ini voor Raccoon Rampage (zie tools/rg-unis/rg-unis.voorbeeld.ini voor de uitleg). Dit is de ingebouwde standaard voor deze game,
; expliciet gemaakt.
;
; Profiel RaccoonRampage.xml (TeknoParrot): Test = "Test Menu Up", Service1 = "Test Menu Down", Enter = P1Button5, "Credits P1..P4" =
; de startknoppen van speler 1..4, trekker = Button1 van elke speler. In het spel (ParseIOData, RVA 0x9bfd00): IoData1 bit 2/1/0 = test /
; service / enter, IoData4 bit 7..4 = trekker 1..4 (de opgaande flank is ook "start": StartPlay), munten tellen in de DLL.
; Bits van het bordbeeld: 0 test, 1 service, 2 munt 1, 3 munt 2, 4 menu omhoog (F4 = enter in het testmenu), dan per speler vanaf
; 6 / 11 / 16 / 21: start (= "credits"), trekker.

game = rr
usbio = 1
; Water tank: 1 = tank OK (inputs bit 3 and bit 2 on, bit 1 off: no water message), 0 = empty tank (all off: "Water level low").
; Bit 1 on would be "Water level is too high" (CheckIsOpenWaterTank, RVA 0x9ab780).
water = 1
test = 0
service = 1
enter = 4
trig1 = 7
trig2 = 12
trig3 = 17
trig4 = 22
coin1 = 6, 2
coin2 = 11, 3
coin3 = 16
coin4 = 21
aim.mode = full
