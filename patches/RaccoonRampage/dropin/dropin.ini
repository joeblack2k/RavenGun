;
; KANDIDAAT (2026-10-17): Raccoon Rampage zonder TeknoParrot. De UNIS-bibliotheek van de game, RSGame/Plugins/UsbPluginsDll.dll (de
; game laadt hem met een absoluut pad: UUsbBPLibrary::Usb_ImportDLL, ProjectPluginsDir + "UsbPluginsDll.dll", daarna GetDllExport op
; de BIND_*-namen), wordt onze eigen rg-unis (tools/rg-unis/, gebouwd met tools/dev/build-unis.sh --out <deze map>): geen kopie van
; het origineel en niet de op 8 bytes aangepaste versie van TeknoParrot. rg-unis.ini ernaast zegt welke bit van het bordbeeld welke
; ingang van het bord is.
;
; RG_UNIS_LOG schrijft het logboek van de DLL naast de DLL (RSGame/Plugins/rg-unis.log in de view, een lokale map, nooit de NAS): het
; bewijs dat ONZE DLL laadt, met de tabel die hij gebruikt, de eerste aanroep van elke BIND-functie en elke 10 s een telregel.
;
; To is relatief aan de map van de exe (<Game>/Binaries/Win64); ../../Plugins is <Game>/Plugins (docs/dropins.md). De drop-in-motor maakt die map eerst lokaal als ze in de view een koppeling naar de NAS is.
[UsbPluginsDll.dll]
To = ../../Plugins
Env = RG_UNIS_LOG=rg-unis.log

[rg-unis.ini]
To = ../../Plugins
