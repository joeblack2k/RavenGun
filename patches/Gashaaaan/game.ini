[Game]
Name = Gashaaaan!!!!
Profile = Gashaaaan
Type = TeknoParrot
EmulationProfile = WartranTroopers
Executable = ballshooting.exe
ProfileRevision = 10

[Launch]
Mode = direct

[Input]
Route = tp-shm
Layout = WartranTroopersKonami
Note = start direct (zonder TeknoParrotUi) via tp-shm; UserProfiles/Gashaaaan.env heeft TP_REMOTETHREAD=off; P1 aux1 is ook start van speler 3 (testmenu: uitvoeren)

[Status]
Status = playable
Note = Speelbaar: munt (toets 5), start (toets 1), vizier en trekker (de bal) werken; eerste start toont 'BACKUP DATA ERROR': eenmaal TEST (toets 0) herstelt het. Gratis spelen kan via het testmenu (P1 aux1 = uitvoeren).
NoteEN = Playable: coin (key 5), start (key 1), aiming and trigger (the ball) work. First start shows 'BACKUP DATA ERROR': press TEST (key 0) once to repair. Free play can be set in the test menu (P1 aux1 = execute).
Findings = findings/Gashaaaan.md

