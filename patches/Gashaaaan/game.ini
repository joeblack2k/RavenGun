Status = working
Note = WERKT op onze eigen route (2026-10-14): dubbelklik in RavenGun, zonder TeknoParrotUi (rg-direct, IO-brug tp-shm). Eerste start: OPTION/BOOKKEEPING BACKUP DATA ERROR, TEST (toets 0) herstelt de gegevens. Gemeten met het testpatroon: munt (toets 5), START (toets 1), een ronde ballen gooien, terug naar attract; meer dan 5 min. Nog open: het beeld is niet schermvullend (de taakbalk blijft zichtbaar).
NoteEN = WORKING on our own route (2026-10-14): double-click in RavenGun, no TeknoParrotUi (rg-direct, tp-shm I/O bridge). First start: OPTION/BOOKKEEPING BACKUP DATA ERROR, TEST (key 0) repairs the data. Measured with the test pattern: coin (key 5), START (key 1), a round of throwing balls, back to attract; more than 5 min. Still open: the picture is not full screen (the taskbar stays visible).
