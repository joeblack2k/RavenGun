Note = native route: de dump brengt zijn eigen bordemulator mee (tt_emu.so + libXshooter.so). Toetsen van het virtuele toetsenbord (KBD_HOOK=/dev/input/ravengun-kbd): 1/2 START, 5/6 munt, 7 service, 8 test, 0 biljet, pijl op/neer volume. Geweren: de virtuele lightguns van de daemon (Xshooter.ini: 1209:7202 en 7203).

[Status]
Status = untested
Note = Nooit gestart. Voorbereid voor de native route (2026-10-14): i386, ongepakt, gewone ld.so. De dump heeft een eigen emulator van het JAMMA-bord en de dongle (tt_emu.so, LD_PRELOAD, zoals runGame.sh op de kast); de koppeling /dev/ttyS0 <-> /tmp/ttyJamma die tt_daemon.sh met socat maakte, doet librg_ptylink.so. Toetsen en geweren: zie [Input]. Niet gemeten: of Xshooter de virtuele lightgun als geweer herkent, en geluid (OSS /dev/dsp).
NoteEN = Never started. Prepared for the native route (2026-10-14): i386, unpacked, plain ld.so. The dump carries its own emulator of the JAMMA board and the dongle (tt_emu.so, LD_PRELOAD, as runGame.sh on the cabinet); the /dev/ttyS0 <-> /tmp/ttyJamma link that tt_daemon.sh made with socat is done by librg_ptylink.so. Keys and guns: see [Input]. Not measured: whether Xshooter accepts the virtual lightgun as a gun, and sound (OSS /dev/dsp).

