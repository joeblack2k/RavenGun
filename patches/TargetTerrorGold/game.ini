[Input]
Route = evdev
Note = native route: de dump brengt zijn eigen bordemulator mee (tt_emu.so + libXshooter.so). Toetsen van het virtuele toetsenbord (KBD_HOOK=/dev/input/ravengun-kbd): 1/2 START, 5/6 munt, 7 service, 8 test, 0 biljet, pijl op/neer volume. Geweren: de virtuele lightguns van de daemon (Xshooter.ini: 1209:7202 en 7203).

[Status]
Status = working
Note = WORKING via dubbelklik in de app (2026-10-15), native: titel, START, Mission Select, 5,5 min gespeeld; schoten komen aan (herladen, vijanden neer). Voorwaarde: het virtuele geweer heeft een USB-pad (libXshooter neemt alleen apparaten met phys usb*). Beeld 4:3 (1024x768); richten op een 16:9-tv volgt de hele tv, nog geen pillarbox-correctie.
NoteEN = WORKING via double-click in the app (2026-10-15), native: title, START, Mission Select, played 5.5 min; shots arrive (reload, enemies down). Requires the virtual gun to have a USB phys path (libXshooter only takes devices with phys usb*). Picture 4:3 (1024x768); aiming on a 16:9 TV spans the whole TV, no pillarbox correction yet.

; Profiel uit TeknoParrot-sjabloon GameProfiles/TargetTerrorGold.xml, revisie 12 (scripts/import-tp-profiles.py; opnieuw importeren in plaats van met de hand wijzigen)
