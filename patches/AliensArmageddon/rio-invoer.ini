# Aliens Armageddon, native route (game, 9.149.556 B, sha256 be7ebd1b...acf, the 1920x1080 build): the RIO lightgun board,
# answered AS THE BOARD over USB. Read by tools/rio-bridge/rg_rio_bridge.c (loader repo, 32-bit lib32/librg_rio_bridge.so)
# through RG_RIO_TABLE. Same model as Jurassic Park (patches/JurassicPark/rio-invoer.ini), with one difference: NO encryption.
#
# MEASURED 2026-10-14 (static, objdump on the dump; no run). The game has no symbols for the RIO code, so every address below
# was found from the board's own constants and the call graph, and compared function by function with Jurassic Park:
#   * pmrt_usb_open: the only two callers that pass (0x0c70, 0x0780) are at 0x081b6ca2 (RIO_Connect) and 0x081b6dc9
#     (RIO_ConnectEx); both call 0x08346b16. The pmrt_usb block that follows has the same order and the same sizes as in
#     Jurassic Park: open, close 0x08346e13, reset, bulk_read 0x08346f65 (189 B), bulk_write 0x08347022 (180 B),
#     interrupt_write 0x083470d6 (180 B), interrupt_read 0x0834718a (189 B).
#   * RIO_GetReport (0x081b6f81) calls interrupt_read(devp, buf, 0x40) like Jurassic Park, but WITHOUT the xrtea call after
#     it; the XTEA key of JP/NERF (e4176525...) and JP's xrtea pattern are not in the image -> `versleuteling geen`.
#   * The read thread (0x081b95f8) -> parse_in_report (0x081b7bbc, no checksum check) -> message table 0x088b1660 -> type 2
#     -> 0x081b89ae, the report decoder: 19 process_sw + 4 process_adc, with EXACTLY the byte/nibble layout of Jurassic Park's
#     parse_device_input_report (reportmap.py of patches/JurassicPark/bewijs-bord-20261014/tools, run on both).
# NOT MEASURED: which switch id means what on THIS cabinet. The ids below are those measured on Jurassic Park and NERF (same
# board, the same ids for START/TEST/volume on both). Find a missing one live with RG_RIO_PROBE (see the bridge's header).
# NOT COVERED HERE: aim. Aliens Armageddon aims with IR cameras in the guns (cmgr/FTDI, io_irtrack, "42 inch irtrack array"),
# like Halo; the RIO lightgun channels 19..22 below may be unused by this cabinet.
proces      naam=rg-elfloader
beeld       bits=8
usb         vid=0c70 pid=0780 interval=4 type=2 lengte=64 som=63
haak        naam=pmrt_usb_open            rol=open    adres=08346b16 sig=5589e583ec58
haak        naam=pmrt_usb_interrupt_read  rol=lees    adres=0834718a sig=5589e55383ec34
haak        naam=pmrt_usb_interrupt_write rol=schrijf adres=083470d6 sig=5589e55383ec34
haak        naam=pmrt_usb_close           rol=sluit   adres=08346e13 sig=5589e583ec28
versleuteling geen
# Report type 2 (payload byte N = report byte 3+N), identical to Jurassic Park.
veld id=0  byte=3  deel=hoog
veld id=1  byte=3  deel=laag
veld id=2  byte=4  deel=hoog
veld id=18 byte=4  deel=laag
veld id=3  byte=5  deel=hoog
veld id=4  byte=5  deel=laag
veld id=5  byte=6  deel=hoog
veld id=6  byte=6  deel=laag
veld id=7  byte=8  deel=hoog
veld id=8  byte=8  deel=laag
veld id=9  byte=9  deel=hoog
veld id=10 byte=9  deel=laag
veld id=11 byte=10 deel=hoog
veld id=12 byte=10 deel=laag
veld id=17 byte=11 deel=hoog
veld id=13 byte=12 deel=hoog
veld id=14 byte=12 deel=laag
veld id=15 byte=13 deel=hoog
veld id=16 byte=13 deel=laag
adcveld ch=19 hoog=14 deel=hoog laag=16
adcveld ch=20 hoog=14 deel=laag laag=17
adcveld ch=21 hoog=15 deel=hoog laag=18
adcveld ch=22 hoog=15 deel=laag laag=19
# Board image: layout RawThrillsGUN (game.ini [Input] Layout): bit 0 test, 1 service, 2 coin1, 3 coin2, 4 p1.start,
# 5 p1.trigger, 6 p1.grenade, 7 p1.reload, 8 p2.start, 9 p2.trigger, 10 p2.grenade, 11 p2.reload, 12 volume_up, 13 volume_down.
schakelaar bit=0  id=3            # test        -> 3 TEST (JP/NERF)
schakelaar bit=2  id=0            # coin1       -> 0 (JP)
schakelaar bit=3  id=1            # coin2       -> 1 (JP)
schakelaar bit=1  id=4            # service     -> 4 (JP: a coin type; NOT measured as service)
schakelaar bit=4  id=7 min=300    # p1.start    -> 7 P1 START (JP/NERF)
schakelaar bit=5  id=15           # p1.trigger  -> 15 P1 TRIGGER (JP/NERF)
schakelaar bit=6  id=13           # p1.grenade  -> 13 (JP)
schakelaar bit=7  id=7 min=300    # p1.reload   -> START as well (mouse player: right button = reload in the daemon)
schakelaar bit=8  id=8 min=300    # p2.start    -> 8 P2 START (JP/NERF)
schakelaar bit=11 id=8 min=300    # p2.reload   -> P2 START (same reason)
schakelaar bit=10 id=12           # p2.grenade  -> 12 (JP)
schakelaar bit=12 id=5            # volume_up   -> 5 (JP/NERF)
schakelaar bit=13 id=6            # volume_down -> 6 (JP/NERF)
# Lightgun channels (only if this cabinet reads them; see above): 12-bit, like Jurassic Park.
kanaal bron=12 ch=19 min=-32.6 max=4127.7 inverteer=nee   # p1.x
kanaal bron=16 ch=20 min=-32.6 max=4127.7 inverteer=ja    # p1.y
kanaal bron=20 ch=21 min=-32.6 max=4127.7 inverteer=nee   # p2.x
kanaal bron=24 ch=22 min=-32.6 max=4127.7 inverteer=ja    # p2.y
