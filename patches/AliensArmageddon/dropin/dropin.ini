; Drop-in van RavenGun voor Aliens Armageddon (32-bits Raw Thrills/Play Mechanix-ELF). Indeling en contract: docs/dropins.md.
;
; De native route (rg-elfloader, packaging/native-games.json, profiel AliensArmageddon) neemt deze bestanden zelf mee: de hook
; en de emulator als bibliotheek, hasp-haken.ini als /rg/hasp-haken.ini, ravengun-hasp/ als begintoestand in /pm/ravengun-hasp.
; Dit bestand beschrijft ze voor de andere routes en voor de controle tests/test_patches_layout.py.
;
; De HASP-HL-client zit statisch en gestript in de game: de inline-hook vindt hem via de adreslijst hasp-haken.ini (gemaakt met
; ../find-hasp-adressen.py uit het anker 'patch' in de spelmap). Zie BESCHERMING-STATUS.md.
[libravengun-hasphook.so]
To = .
Preload = true
Audit = false
Env = RAVENGUN_HASP_DIR=ravengun-hasp;RAVENGUN_HASP_GAME=AliensArmageddon;RAVENGUN_HASP_ELF_LIB=./ravengun-hasp.so;RAVENGUN_HASP_ELF_ADRESLIJST=hasp-haken.ini;RAVENGUN_HASP_VERBOSE=1

[ravengun-hasp.so]
To = .

[hasp-haken.ini]
To = .

[ravengun-hasp/AliensArmageddon/dongle.json]
To = .

[ravengun-hasp/AliensArmageddon/memory/00000000000000001111111111110000]
To = .

[ravengun-hasp/AliensArmageddon/memory/00000000000000001111111111110010]
To = .
