; Operation G.H.O.S.T. (Sega RingWide, 2012).
;
; Nieuw toegevoegd door de regio/PCB-donglelaag: deze game vraagt een regio- en printplaat-dongle en
; had nog geen map in deze repo. De game staat op de NAS in de map OAV6DU~3; de app kent hem al
; (packaging/game-options.json, id operation_ghost, TeknoParrot-profiel OG, exe gs2.exe) en
; findings/11_hardware_patches_dongles.md heeft er een sectie "Operation G.H.O.S.T. - OG".
;
; De regiowaarden komen uit het TeknoParrot-sjabloon GameProfiles/OG.xml (DongleRegion = JAPAN,
; PcbRegion = JAPAN) en staan ook in findings/data/target_hw_patch.json. Ze zijn hier vastgelegd,
; niet gemeten aan een draaiende game.
;
; [Status] working sinds 2026-10-15 (bench, 5,5 min gespeeld; zie [Status] Note).

[Game]
Name = Operation G.H.O.S.T.
Profile = OG
Type = TeknoParrot
EmulationProfile = SegaJvsGoldenGun
DongleRegion = JAPAN
PcbRegion = JAPAN
Executable = gs2.exe
ProfileRevision = 21

[Launch]
Mode = direct
; Films via DirectShow (titelfilm .wmv): 32-bits GStreamer (docs/gst32.md) en .wmv via de GStreamer-splitter (data/wmv-asyncreader.reg;
; de ASF-lezer van Proton liep vast bij Stop). Native XACT 3.3: met Wine's xactengine3_3 een access violation na het geluidsscherm.
Gst32 = true
NativeDlls = xactengine3_3
Registry = data/wmv-asyncreader.reg

; Schermvullend in gamescope (Windowed = 0 hieronder). Het spel kiest zelf 1024x768 (4:3); gamescope schaalt naar 1440x1080.
[Display]
Gamescope = true
GamescopePath = /usr/bin/gamescope

; Recept Let's Go Island: EmulationProfile SegaJvsGoldenGun met het generieke Sega-gunbord over de JVS-pipe. Gemeten 2026-10-15:
; START, munt en schieten werken (score loopt op in Mission 1).
[Input]
Route = jvs
Board = SegaGun2P
ComPort = COM4
JvsTransport = pipe
Note = JVS over de pipe naar het generieke Sega-gunbord SegaGun2P (recept Let's Go Island); gemeten 2026-10-15: START en schieten werken

[Status]
Status = working
Note = WORKING via dubbelklik in de app (2026-10-15): attract, START, schieten in de trein met oplopende score, 5,5 min gespeeld. Films via Gst32 + data/wmv-asyncreader.reg (de ASF-lezer van Proton liep vast bij Stop), native XACT 3.3, gamescope schermvullend. Beeld 4:3 (het spel kiest 1024x768).
NoteEN = WORKING via double-click in the app (2026-10-15): attract, START, shooting in the train with a rising score, played 5.5 min. Movies via Gst32 + data/wmv-asyncreader.reg (Proton's ASF reader hung on Stop), native XACT 3.3, gamescope fullscreen. Picture is 4:3 (the game picks 1024x768).
Findings = findings/11_hardware_patches_dongles.md

; Profiel uit TeknoParrot-sjabloon GameProfiles/OG.xml, revisie 21 (scripts/import-tp-profiles.py; opnieuw importeren in plaats van met de hand wijzigen)
