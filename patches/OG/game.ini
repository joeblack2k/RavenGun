; Operation G.H.O.S.T. (Sega RingWide, 2012).
;
; Nieuw toegevoegd door de regio/PCB-donglelaag: deze game vraagt een regio- en printplaat-dongle en
; had nog geen map in deze repo. De game staat op de NAS in de map OAV6DU~3; de app kent hem al
; (packaging/game-options.json, id operation_ghost, TeknoParrot-profiel OG, exe gs2.exe) en
; findings/11_hardware_patches_dongles.md heeft er een sectie "Operation G.H.O.S.T. - OG".
;
; De regiowaarden komen uit het TeknoParrot-sjabloon GameProfiles/OG.xml (DongleRegion = JAPAN,
; PcbRegion = JAPAN) en staan ook in findings/data/target_hw_patch.json. Ze zijn hier vastgelegd,
; niet gemeten aan een draaiende game.
;
; [Status] staat op untested: er is nog geen startmeting van deze game.

[Game]
Name = Operation G.H.O.S.T.
Profile = OG
Type = TeknoParrot
EmulationProfile = SegaJvsGoldenGun
DongleRegion = JAPAN
PcbRegion = JAPAN
Executable = gs2.exe
ProfileRevision = 21

[Status]
Status = untested
Note = Nog niet gestart. De game vraagt een regio- en printplaat-dongle; de waarden (JAPAN/JAPAN) staan in dropin/ravengun-hasp/OG/dongle.json. De dongle is hier gegevens en geen binary: de 32-bits TeknoParrot-kern kent de regiokeys DongleRegion en PcbRegion niet, dus de waarde wordt vastgelegd en niet afgedwongen. Zie README.md en docs/region-layer.md.
NoteEN = Not started yet. The game asks for a region and PCB dongle; the values (JAPAN/JAPAN) are in dropin/ravengun-hasp/OG/dongle.json. The dongle here is data, not a binary: the 32-bit TeknoParrot core does not know the DongleRegion and PcbRegion keys, so the value is recorded and not enforced. See README.md and docs/region-layer.md.
Findings = findings/11_hardware_patches_dongles.md

; Profiel uit TeknoParrot-sjabloon GameProfiles/OG.xml, revisie 21 (scripts/import-tp-profiles.py; opnieuw importeren in plaats van met de hand wijzigen)
