; Operation G.H.O.S.T. (Sega RingWide, 2012).
;
; Nieuw toegevoegd door de regio/PCB-donglelaag: deze game vraagt een regio- en printplaat-dongle en
; had nog geen map in deze repo. De game staat op de NAS in de map OAV6DU~3; de app kent hem al
; (packaging/game-options.json, id operation_ghost, TeknoParrot-profiel OG, exe gs2.exe) en
; findings/11_hardware_patches_dongles.md heeft er een sectie "Operation G.H.O.S.T. - OG".
;
; De regiowaarden komen uit het TeknoParrot-sjabloon GameProfiles/OG.xml (DongleRegion = JAPAN,
; PcbRegion = JAPAN) en staan ook in findings/data/target_hw_patch.json. Ze zijn hier vastgelegd,
; niet gemeten aan een draaiende game.
;
; [Status] staat op untested: er is nog geen startmeting van deze game.

[Game]
Name = Operation G.H.O.S.T.
Profile = OG
Type = TeknoParrot
EmulationProfile = SegaJvsGoldenGun
DongleRegion = JAPAN
PcbRegion = JAPAN
Executable = gs2.exe
ProfileRevision = 21

[Launch]
Mode = direct

; Pass 1 (docs/goal-90-native.md): recept Let's Go Island. EmulationProfile SegaJvsGoldenGun gebruikt het generieke Sega-gunbord; het
; kalibratievenster per game is nog niet gemeten. Niet gestart met deze route.
[Input]
Route = jvs
Board = SegaGun2P
ComPort = COM4
JvsTransport = pipe
Note = voorbereid, niet gestart: JVS over de pipe naar het generieke Sega-gunbord SegaGun2P (recept Let's Go Island); kalibratievenster per game nog te meten

[Status]
Status = untested
Note = Gestart, niet gespeeld. De game start en blijft draaien (STARTTEST.md met de eigen lader; ZONDER-LADER.md zonder enige lader, 20 en 70 s). De regio/printplaat-dongle wordt niet afgedwongen: zonder enige regiobron start hij door. Speelbaarheid is niet gemeten.
NoteEN = Started, not played. The game starts and keeps running (STARTTEST.md with our own loader; ZONDER-LADER.md with no loader at all, 20 and 70 s). The region/PCB dongle is not enforced: without any region source it starts anyway. Playability was not measured.
Findings = findings/11_hardware_patches_dongles.md

