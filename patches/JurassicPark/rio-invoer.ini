# Jurassic Park Arcade, native route (game 1.08, sha256 c18a9329...): the RIO lightgun board, answered AS THE BOARD over USB.
# Read by tools/rio-bridge/rg_rio_bridge.c (loader repo, 32-bit build lib32/librg_rio_bridge.so) through RG_RIO_TABLE.
#
# Why USB and not the NERF way: this game takes the board as EVENTS. The RIO library (0.13) is linked into `game`; its read
# thread reads 64-byte reports from USB 0c70:0780, decrypts them (xrtea, the library's own XTEA variant) and queues one callback
# per changed switch or channel. Nothing is polled (measured, patches/JurassicPark/bewijs-bord-20261014/). So the bridge answers
# the four pmrt_usb functions of the game image for that one device, and every read gets an input report (type 2).
#
# Board image: the daemon's tp-shm route for this game writes layout RawThrillsGUN (game.ini [Input] Layout): a 32-bit field
# at offset 8 (bit 0 test, 1 service, 2 coin1, 3 coin2, 4 p1.start, 5 p1.trigger, 6 p1.grenade, 7 p1.reload, 8 p2.start,
# 9 p2.trigger, 10 p2.grenade, 11 p2.reload, 12 volume_up, 13 volume_down) and one byte per axis at 12/16/20/24.
proces      naam=rg-elfloader
beeld       bits=8
usb         vid=0c70 pid=0780 interval=4 type=2 lengte=64 som=63
# The first whole instructions of each function in THIS build of `game` (another build -> other bytes -> the bridge does nothing).
haak        naam=pmrt_usb_open            rol=open    adres=0845f595 sig=5589e583ec68
haak        naam=pmrt_usb_interrupt_read  rol=lees    adres=0845fc30 sig=5589e55383ec34
haak        naam=pmrt_usb_interrupt_write rol=schrijf adres=0845fb7c sig=5589e55383ec34
haak        naam=pmrt_usb_close           rol=sluit   adres=0845f8ca sig=5589e583ec28
versleuteling adres=083715dd sig=5589e5575653 sleutel=08b26d5c
# Report type 2 as the game's own decoder (parse_device_input_report, 0x836d011) reads it: byte 0 type, 1..2 sequence, then the
# payload; byte 63 = sum of bytes 0..62. A switch is a 4-bit counter of transitions (odd = pressed).
veld id=0  byte=3  deel=hoog
veld id=1  byte=3  deel=laag
veld id=2  byte=4  deel=hoog
veld id=18 byte=4  deel=laag
veld id=3  byte=5  deel=hoog
veld id=4  byte=5  deel=laag
veld id=5  byte=6  deel=hoog
veld id=6  byte=6  deel=laag
veld id=7  byte=8  deel=hoog
veld id=8  byte=8  deel=laag
veld id=9  byte=9  deel=hoog
veld id=10 byte=9  deel=laag
veld id=11 byte=10 deel=hoog
veld id=12 byte=10 deel=laag
veld id=17 byte=11 deel=hoog
veld id=13 byte=12 deel=hoog
veld id=14 byte=12 deel=laag
veld id=15 byte=13 deel=hoog
veld id=16 byte=13 deel=laag
adcveld ch=19 hoog=14 deel=hoog laag=16
adcveld ch=20 hoog=14 deel=laag laag=17
adcveld ch=21 hoog=15 deel=hoog laag=18
adcveld ch=22 hoog=15 deel=laag laag=19
# Which id means what. MEASURED 2026-10-14 (events through the library's own queue, the game's log in the same second):
#   7 "Player 1 joined. Game Started", 8 "Player 2 joined.", 0/1/2/4 "Coin in. Type 0/1/3/4", 3 "Entering Diag Menu" (TEST),
#   5 volume up, 6 volume down, 13 "Player 1 fired grenade", 12 and 16 "Player 2 fired grenade".
schakelaar bit=0  id=3     # test        -> 3 TEST
schakelaar bit=2  id=0     # coin1       -> 0 coin type 0
schakelaar bit=3  id=1     # coin2       -> 1 coin type 1
schakelaar bit=1  id=4     # service     -> 4 coin type 4 (service credit: NOT measured as such)
schakelaar bit=4  id=7     # p1.start    -> 7 P1 START
schakelaar bit=5  id=15    # p1.trigger  -> 15 P1 TRIGGER (measured 2026-10-14: held -> laser to the crosshair, score 0 -> 50, 'STREAK X2')
schakelaar bit=6  id=13    # p1.grenade  -> 13 P1 grenade
schakelaar bit=7  id=7     # p1.reload   -> 7 START as well: START on a lightgun button for a MOUSE player (right button = reload in
                           #   the daemon); this game has no reload. With a Move, START/square stays START (2026-10-14).
schakelaar bit=8  id=8     # p2.start    -> 8 P2 START
schakelaar bit=11 id=8     # p2.reload   -> 8 P2 START (same reason)
schakelaar bit=10 id=12    # p2.grenade  -> 12 P2 grenade
schakelaar bit=12 id=5     # volume_up   -> 5
schakelaar bit=13 id=6     # volume_down -> 6
# Lightgun channels: 12-bit; the game's default calibration is 0..4096 per axis (pmuser/aud/save/gun0Calibration).
# The daemon keeps an on-screen axis on 2..253; min/max stretch that onto 0..4095.
kanaal bron=12 ch=19 min=-32.6 max=4127.7 inverteer=nee   # p1.x
kanaal bron=16 ch=20 min=-32.6 max=4127.7 inverteer=ja    # p1.y (board channel 0 = BOTTOM, image 0 = top; measured by the owner with a Move 2026-10-14: up/down were swapped)
kanaal bron=20 ch=21 min=-32.6 max=4127.7 inverteer=nee   # p2.x
kanaal bron=24 ch=22 min=-32.6 max=4127.7 inverteer=ja    # p2.y (same as p1.y, as on NERF)
