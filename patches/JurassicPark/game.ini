[Input]
; tp-shm: de daemon schrijft het bordbeeld (indeling RawThrillsGUN); de RIO-brug (rio-invoer.ini) antwoordt daaruit als het
; lightgun-bord over USB. De native route leest de route uit packaging/native-games.json; deze regel is wat de app toont.
Route = tp-shm
Layout = RawThrillsGUN

; Onderzoek 2026-10-11 (docs/research/antwoorden-tp-ronde23-en-jp.md, docs/decisions.md "32-bits Raw Thrills-familie"):
; geen GL-imports (GL via dlsym); de GOT staat in het BESTAND al gevuld met absolute 0xb7xxxxxx-adressen uit een
; draaiend proces op de originele kast, en elke PLT-stub pusht 0xdeadbeef in plaats van een relocatie-index.
;
; Correctie 2026-10-12 (statische meting, zie patches/ELF-LADER-SPEC.md): niet "~60 vaste GOT-slots" maar 577;
; die ~60 is het aantal GL-imports daarbinnen. Van die imports hebben er 105 een naam en 472 niet;
; 105 + 472 = 577, precies het aantal stubs. Van deze game is ook de ongebonden fase bewaard
; (game_original): daar staan de slots nog op 0x08xxxxxx in plaats van op 0xb7xxxxxx.
; Geen eigen GOT-reconstructie; alleen de lader van TeknoParrot zelf.
; Pistool (voor als het ooit draait): bereik 0..4096 per as (12 bits, niet 0..255), vier pistolen, kalibratie twee punten
; per as in pmuser/aud/save/gun<N>Calibration.*.xml (door de game zelf beheerd). Resolutie: utils/default.cfg (1360x768).
[Status]
Status = playable
Note = Speelbaar op onze eigen lader, gestart met een dubbelklik in de RavenGun-app (2026-10-14): native Linux, OpenGL via Vulkan (zink). Het lightgun-bord antwoordt als het echte USB-bord (RIO-brug, rio-invoer.ini): geen "RIO Disconnected" meer; START (toets 1), richten en trekker werken (score en kills gemeten), opties van het spel (freeplay, moeilijkheid, volume, ...) staan in de app. Vier glow-shaders die Mesa weigerde zijn gerepareerd (data/shaders). Niet gemeten: de trekker van speler 2, een echte muis en de PS Move. Zie bewijs-speelbaar-20261014/LEESMIJ.md.
NoteEN = Playable on our own loader, started by double-clicking it in the RavenGun app (2026-10-14): native Linux, OpenGL on Vulkan (zink). The lightgun board answers as the real USB board (RIO bridge, rio-invoer.ini): no more "RIO Disconnected"; START (key 1), aim and trigger work (score and kills measured), the game's own settings (free play, difficulty, volume, ...) are in the app. Four glow shaders Mesa rejected are fixed (data/shaders). Not measured: player 2's trigger, a physical mouse and the PS Move. See bewijs-speelbaar-20261014/LEESMIJ.md.
Findings = findings/JurassicPark.md

