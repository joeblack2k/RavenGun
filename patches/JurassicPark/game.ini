; Onderzoek 2026-10-11 (docs/research/antwoorden-tp-ronde23-en-jp.md, docs/decisions.md "32-bits Raw Thrills-familie"):
; geen GL-imports (GL via dlsym); de GOT staat in het BESTAND al gevuld met absolute 0xb7xxxxxx-adressen uit een
; draaiend proces op de originele kast, en elke PLT-stub pusht 0xdeadbeef in plaats van een relocatie-index.
;
; Correctie 2026-10-12 (statische meting, zie patches/ELF-LADER-SPEC.md): niet "~60 vaste GOT-slots" maar 577;
; die ~60 is het aantal GL-imports daarbinnen. Van die imports hebben er 105 een naam en 472 niet;
; 105 + 472 = 577, precies het aantal stubs. Van deze game is ook de ongebonden fase bewaard
; (game_original): daar staan de slots nog op 0x08xxxxxx in plaats van op 0xb7xxxxxx.
; Geen eigen GOT-reconstructie; alleen de lader van TeknoParrot zelf.
; Pistool (voor als het ooit draait): bereik 0..4096 per as (12 bits, niet 0..255), vier pistolen, kalibratie twee punten
; per as in pmuser/aud/save/gun<N>Calibration.*.xml (door de game zelf beheerd). Resolutie: utils/default.cfg (1360x768).
[Status]
Status = parked
Note = Beeld komt nog niet. De oude GL-blokkade is weg: de rt-glfix-brug herleidt ~140 GOT-sloten in het 32-bits spelproces en de game leeft daarmee ~112 s (24 threads) tegenover ~14 s zonder. Wat overblijft is een wilde indirecte sprong: EXCEPTION_ACCESS_VIOLATION op eip=0x819c524b met ebp=0, midden in Wine's gereserveerde blok 80080000-98000000 zonder r/w/x -- dus een niet-GL-import die ElfLdr2 onopgelost laat, geen gewone bug. Van de 577 PLT-stubs hebben er 472 geen naam meer in het bestand en de slot-naam-tabel staat er niet in; een ingreep in de ABI/GL-laag lost dat niet op (een no-op-stub verplaatst de crash alleen). Geparkeerd met deze diagnose; uitwerking in docs/research/jurassicpark-stand.md en findings/games/JurassicPark/CRASH-OPLOSSING.md (lader-repo).
NoteEN = No picture yet. The old GL blocker is gone: the rt-glfix bridge reroutes ~140 GOT slots inside the 32-bit game process and the game then lives ~112 s (24 threads) versus ~14 s without it. What remains is a wild indirect jump: EXCEPTION_ACCESS_VIOLATION at eip=0x819c524b with ebp=0, inside Wine's reserved block 80080000-98000000 with no r/w/x -- so a non-GL import that ElfLdr2 leaves unresolved, not an ordinary bug. Of the 577 PLT stubs, 472 no longer carry a name in the file and the slot-to-name table is not in it; a change in the ABI/GL layer does not fix that (a no-op stub only moves the crash). Parked with this diagnosis; write-up in docs/research/jurassicpark-stand.md and findings/games/JurassicPark/CRASH-OPLOSSING.md (loader repo).
Findings = findings/JurassicPark.md

