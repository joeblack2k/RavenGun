; Onderzoek 2026-10-11 (docs/research/antwoorden-tp-ronde23-en-jp.md, docs/decisions.md "32-bits Raw Thrills-familie"):
; geen GL-imports (GL via dlsym); de GOT staat in het BESTAND al gevuld met absolute 0xb7xxxxxx-adressen uit een
; draaiend proces op de originele kast, en elke PLT-stub pusht 0xdeadbeef in plaats van een relocatie-index.
;
; Correctie 2026-10-12 (statische meting, zie patches/ELF-LADER-SPEC.md): niet "~60 vaste GOT-slots" maar 577;
; die ~60 is het aantal GL-imports daarbinnen. Van die imports hebben er 105 een naam en 472 niet;
; 105 + 472 = 577, precies het aantal stubs. Van deze game is ook de ongebonden fase bewaard
; (game_original): daar staan de slots nog op 0x08xxxxxx in plaats van op 0xb7xxxxxx.
; Geen eigen GOT-reconstructie; alleen de lader van TeknoParrot zelf.
; Pistool (voor als het ooit draait): bereik 0..4096 per as (12 bits, niet 0..255), vier pistolen, kalibratie twee punten
; per as in pmuser/aud/save/gun<N>Calibration.*.xml (door de game zelf beheerd). Resolutie: utils/default.cfg (1360x768).
[Status]
Status = parked
Note = Geparkeerd. Een van drie Raw Thrills-games (met Jurassic Park, Pac-Man Chomp-Mania en Galaga Assault) die de lader van TeknoParrot onder Wine nog niet start. De blokkade is een werkende OpenGL-context (GL_MAX_TEXTURE_SIZE > 2047); de PLT/GOT van de gepakte ELF is beschadigd. Wacht op de lader.
NoteEN = Parked. One of three Raw Thrills games (with Jurassic Park, Pac-Man Chomp-Mania and Galaga Assault) that TeknoParrot's loader does not start under Wine yet. The blocker is a working OpenGL context (GL_MAX_TEXTURE_SIZE > 2047); the PLT/GOT of the packed ELF is damaged. Waiting on the loader.
Findings = findings/JurassicPark.md

