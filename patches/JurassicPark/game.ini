; Gegenereerd door scripts/migrate-game-settings.py (docs/per-game-patches.md). Sleutels die het script afleidt uit de oude bronnen worden bij
; elke run opnieuw gezet; handwerk in andere sleutels blijft staan.

[Game]
Name = Jurassic Park Arcade
Profile = JurassicPark
Type = ElfLdr2
EmulationProfile = RawThrillsGUN

[Input]
Route = evdev
Layout = RawThrillsGUN

; Onderzoek 2026-10-11 (docs/research/antwoorden-tp-ronde23-en-jp.md, docs/decisions.md "32-bits Raw Thrills-familie"):
; geen GL-imports (GL via dlsym), ~60 vaste GOT-slots uit een dump, PLT-indexen gewist door de pakker. Geen eigen
; GOT-reconstructie; alleen de lader van TeknoParrot zelf.
; Pistool (voor als het ooit draait): bereik 0..4096 per as (12 bits, niet 0..255), vier pistolen, kalibratie twee punten
; per as in pmuser/aud/save/gun<N>Calibration.*.xml (door de game zelf beheerd). Resolutie: utils/default.cfg (1360x768).
[Status]
Status = parked
Note = Geparkeerd. Een van drie Raw Thrills-games (met Jurassic Park, Pac-Man Chomp-Mania en Galaga Assault) die de lader van TeknoParrot onder Wine nog niet start. Een eigen oplossing zou het werk van de kopieerbeveiliging moeten terugdraaien; dat doen we niet. Wacht op de lader van TeknoParrot.
NoteEN = Parked. One of three Raw Thrills games (with Jurassic Park, Pac-Man Chomp-Mania and Galaga Assault) that TeknoParrot's loader does not start under Wine yet. A home-made fix would have to undo the copy protection's work, which we don't do. Waiting on TeknoParrot's loader.
Findings = findings/JurassicPark.md
