; Drop-in van RavenGun voor de 32-bits Raw Thrills-ELF onder ElfLdr2/BudgieLoader.
; Uitleg en metingen: docs/rt-glfix.md. Indeling en contract: docs/dropins.md.
;
; Preload = true laat de launcher het bestand in de view van de game zetten en zijn pad publiceren
; als RG_DROPIN_PRELOAD. De launcher zet het NIET in LD_PRELOAD: de start gaat altijd via Wine, en
; BudgieLoader is een Cygwin-programma dat LD_PRELOAD zelf leest. Het probeert onze ELF dan als
; Windows-DLL te laden en sterft met "fatal error - error while loading shared libraries", nog
; voordat de game begint. Gemeten op 2026-10-11; zie docs/rt-glfix.md, "Het kanaal".
;
; Voor deze games moet RG_DROPIN_PRELOAD in LD_AUDIT van het Wine-proces terechtkomen. LD_AUDIT
; kent Cygwin niet en glibc wel, en de bibliotheek komt zo in hetzelfde 32-bits proces als het spel
; (wine-preloader, ELF 32-bits i386).
[librt-glfix.so]
To = .
Preload = true
Env = RAVENGUN_GLFIX_GAME=JurassicPark;RAVENGUN_GLFIX_LOG=rt-glfix.log

; ---------------------------------------------------------------------------------------------------
; De HASP-inline-hook (docs/hasp-elf-hook.md). De HASP-cliënt van deze game is STATISCH in `game`
; gelinkt (0 ongedefinieerde hasp-symbolen, 0 PLT-verplaatsingen, wél gedefinieerde hasp-symbolen in
; de dynsym, plus de envelope-handtekening comaladdinhlx86envspoony@@HASPE_LINUX_LOADER_1.1). Er is
; dus geen PLT-slot en geen GOT-invoer om te vullen; deze bibliotheek haakt de functies op hun
; ingangspunt aan en leidt ze naar de emulator.
;
; LET OP: zet deze hook pas aan als de GL-fix hierboven werkt. Zonder een werkende OpenGL-context
; komt de game niet voorbij zijn start en bereikt hij zijn HASP-controle nooit (gemeten; zie
; docs/hasp-elf-hook.md, sectie 4.3).
[libravengun-hasphook.so]
To = .
Preload = true
Env = RAVENGUN_HASP_ELF_LOG=hasphook.log;RAVENGUN_HASP_VERBOSE=1
