; Drop-in van RavenGun voor de 32-bits Raw Thrills-ELF onder ElfLdr2/BudgieLoader.
; Uitleg en metingen: docs/rt-glfix.md, docs/hasp-elf-hook.md, docs/hasp-layer.md.
; Indeling en contract: docs/dropins.md.
;
; Preload = true laat de launcher het bestand in de view van de game zetten en zijn pad publiceren
; als RG_DROPIN_PRELOAD. De launcher zet het NIET in LD_PRELOAD: de start gaat altijd via Wine, en
; BudgieLoader is een Cygwin-programma dat LD_PRELOAD zelf leest. Het probeert onze ELF dan als
; Windows-DLL te laden en sterft met "fatal error - error while loading shared libraries", nog
; voordat de game begint. Gemeten op 2026-10-11; zie docs/rt-glfix.md, "Het kanaal".
;
; Voor deze games moet RG_DROPIN_PRELOAD in LD_AUDIT van het Wine-proces terechtkomen. LD_AUDIT
; kent Cygwin niet en glibc wel, en de bibliotheek komt zo in hetzelfde 32-bits proces als het spel
; (wine-preloader, ELF 32-bits i386).
[librt-glfix.so]
To = .
Preload = true
Env = RAVENGUN_GLFIX_GAME=JurassicPark;RAVENGUN_GLFIX_LOG=rt-glfix.log

; ---------------------------------------------------------------------------------------------------
; De HASP-inline-hook (docs/hasp-elf-hook.md). De HASP-client van deze game is STATISCH in `game`
; gelinkt: 30 hasp_-symbolen in de dynsym, alle met shndx 11 en st_value != 0, en 0 ongedefinieerde
; hasp-symbolen en 0 PLT-verplaatsingen. Er is dus geen PLT-slot en geen GOT-invoer om te vullen;
; deze bibliotheek haakt de functies op hun ingangspunt aan en leidt ze naar de emulator.
;
; LET OP: zet deze hook pas aan als de GL-fix hierboven werkt. Zonder een werkende OpenGL-context
; komt de game niet voorbij zijn start en bereikt hij zijn HASP-controle nooit (gemeten; zie
; docs/hasp-elf-hook.md, sectie 4.3).
;
; RAVENGUN_HASP_DIR + RAVENGUN_HASP_GAME wijzen de emulator naar de dongle hieronder. Het pad is
; RELATIEF: de bibliotheek draait in het spelproces en de werkmap daarvan is de view, dus
; "ravengun-hasp" + "JurassicPark" komt uit op <view>/ravengun-hasp/JurassicPark/dongle.json.
[libravengun-hasphook.so]
To = .
Preload = true
Env = RAVENGUN_HASP_DIR=ravengun-hasp;RAVENGUN_HASP_GAME=JurassicPark;RAVENGUN_HASP_ELF_LOG=hasphook.log;RAVENGUN_HASP_VERBOSE=1

; De 64-bits hook is een overblijfsel van scripts/build-hasphook.sh, dat BEIDE breedtes in elke game
; legt. Deze game is 32-bits en de lezer is 32-bits, dus deze bibliotheek doet hier niets: een
; 64-bits object wordt geweigerd met "wrong ELF class: ELFCLASS64". Hij krijgt daarom een sectie
; ZONDER Preload -- een bestand zonder sectie wordt niet uitgerold (docs/dropins.md), en dan is het
; onduidelijk of het er hoort. Weglaten mag ook; hij komt terug zodra build-hasphook.sh opnieuw draait.
[libravengun-hasphook-x64.so]
To = .

; ---------------------------------------------------------------------------------------------------
; De dongle (docs/dropins.md, docs/hasp-layer.md). Een dongle is geen loaderbegrip: het is een
; gewone drop-in met zijn eigen gegevens ernaast, die de bibliotheek zelf leest.
;
; LET OP: de emulator krijgt hier GEEN Preload. glibc eist van een bibliotheek in LD_AUDIT dat hij
; `la_version` exporteert; ravengun-hasp.so doet dat niet en wordt geweigerd ("undefined symbol:
; la_version; ignored"). De inline-hook hierboven laadt de emulator zelf met dlopen. De kopie hier
; staat er omdat het drop-in-contract zegt dat de emulatorbibliotheek in de drop-in hoort.
[ravengun-hasp.so]
To = .

[ravengun-hasp/JurassicPark/dongle.json]
To = .

[ravengun-hasp/JurassicPark/memory/00000000000000001111111111110010]
To = .
