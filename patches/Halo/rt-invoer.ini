# Halo: Fireteam Raven (Game Rev 57529) -- invoertabel voor de NATIVE route (tools/rt-input-shim, packaging/native-games.json).
# De kastschakelaars (vervangen de ingebouwde standaard van de hulp). GEMETEN 2026-10-15 met RG_RT_PROBE (een schakelaar live
# verplaatsen) en de druktellers (+0x10) van de schakelaar-structs van de game (getter 0x4ad030, naam/nummer-tabel 0x16f7800..):
#   bord 0 k 0  -> Cab0Diag (+ CabDiag)      bord 1 k 0 -> Cab1Diag      bord 0 k 12 -> CabStart0 (speler 1)
#   bord 1 k 1  -> Cab1Service               bord 1 k 2 -> Cab1VolUp     bord 0 k 13 -> CabStart3 (de tweede start)
#   bord 1 k 3  -> Cab1VolDown
# Bord 0 k 1..3 (Cab0Service/VolUp/VolDown) volgen bij analogie met bord 1; de munten op bord 0/1 k 5 tellen ("Money In" loopt op),
# maar hun schakelaar-struct is nog niet benoemd. DIAG/SERVICE volgen het niveau van de toets (puls=0): het testmenu wil een
# vastgehouden DIAG (een puls van 300 ms telt wel, maar opent niets).
# De trekkers van de geweren (0x208..0x235) zitten NIET op dit bord: die komen uit het geweer zelf (IRTrack, FTDI).
schakelaar bit=6  bord=0 k=12 puls=300   # START speler 1 (CabStart0)
schakelaar bit=11 bord=0 k=13 puls=300   # START speler 2
schakelaar bit=0  bord=0 k=0  puls=0     # TEST = DIAG (Cab0Diag), zolang ingedrukt
schakelaar bit=1  bord=0 k=1  puls=0     # SERVICE (Cab0Service, bij analogie)
schakelaar bit=1  bord=1 k=1  puls=0     # SERVICE (Cab1Service, gemeten)
schakelaar bit=4  bord=0 k=2  puls=300   # volume omhoog (Cab0VolUp, bij analogie)
schakelaar bit=5  bord=0 k=3  puls=300   # volume omlaag (Cab0VolDown, bij analogie)
schakelaar bit=2  bord=0 k=5  puls=60    # munt 1 (telt)
schakelaar bit=3  bord=1 k=5  puls=60    # munt 2
#
# Kasttype 8 = STANDARD MOUNTED (een scherm, twee geweren op een steun, richten via analoge kanalen). Gemeten 2026-10-15:
# - de game leest het kasttype een keer uit de dongle (fileid 0xfff4, byte 0x29; in de dump 4 = getetherd) en bewaart het
#   op 0x1800e60; staat daar al 1..13, dan leest hij de dongle niet meer (getter 0x5864b0);
# - kasttype 3 of 8 zet de analoge geweerdriver (bit 0x8) aan: masker 0x90c i.p.v. 0x904, spelerstructuur 0x181f7e0 gevuld;
#   3 = DUAL-SCREEN MOUNTED (twee schermen, vier geweren), 8 = STANDARD MOUNTED (P1 en P2);
# - de QR-scanner-meldingen verdwijnen; open blijft "P1/P2 GUN NOT CONNECTED": de geweren zijn apparaten met een serienummer
#   die het geweersubsysteem (0xdd1xxx, gereedvlaggen 0x1aa3424/0x1aa3428) eerst moet vinden.
# Dit is dezelfde instelling als CabinetType in het TeknoParrot-profiel; de dongle en de NAS blijven ongewijzigd.
zet adres=0x1800e60 breedte=4 waarde=8
#
# Fabrieksinstelling (Factory Setup). Gemeten 2026-10-15 (statisch + op de bank):
# - de attract start alleen een spel als de vlag 0x174a220 (getter 0x444a80) staat (0x449348); zonder vlag staat er
#   "Factory Setup Has Not Been Completed!" en doet START niets;
# - die vlag wordt maar op een plek gezet: aan het eind van FactorySetupProc (0x44497f), na de regio, het serienummer en de
#   fabrieksvlag (fileid 0xfff4, bytes 0x2a/0x2b/0x28) in de dongle te schrijven; hij wordt bij het opstarten niet uit de dongle gelezen;
# - FactorySetupProc start alleen via de CabDiag-handler 0x41b3c0, en die wordt bij dit kasttype niet geregistreerd (masker
#   0x181d8a0 heeft bit 0x4; 0x41be81): TEST in de attract doet dus niets.
# De vlag vasthouden is wat de fabrieksinstelling zelf als laatste doet; de dongle en de NAS blijven ongewijzigd. Het richtpunt van
# de geweren loopt niet via de kalibratie van de game (zie irtrack.ini), dus de kalibratiestap van de fabrieksinstelling is niet nodig.
zet adres=0x174a220 breedte=1 waarde=1
