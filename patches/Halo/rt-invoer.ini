# Halo: Fireteam Raven (Game Rev 57529) -- invoertabel voor de NATIVE route (tools/rt-input-shim, packaging/native-games.json).
# Geen `schakelaar`-regels: de ingebouwde kastschakelaars van de hulp blijven gelden (START, TEST, service, munt).
#
# Kasttype 8 = STANDARD MOUNTED (een scherm, twee geweren op een steun, richten via analoge kanalen). Gemeten 2026-10-15:
# - de game leest het kasttype een keer uit de dongle (fileid 0xfff4, byte 0x29; in de dump 4 = getetherd) en bewaart het
#   op 0x1800e60; staat daar al 1..13, dan leest hij de dongle niet meer (getter 0x5864b0);
# - kasttype 3 of 8 zet de analoge geweerdriver (bit 0x8) aan: masker 0x90c i.p.v. 0x904, spelerstructuur 0x181f7e0 gevuld;
#   3 = DUAL-SCREEN MOUNTED (twee schermen, vier geweren), 8 = STANDARD MOUNTED (P1 en P2);
# - de QR-scanner-meldingen verdwijnen; open blijft "P1/P2 GUN NOT CONNECTED": de geweren zijn apparaten met een serienummer
#   die het geweersubsysteem (0xdd1xxx, gereedvlaggen 0x1aa3424/0x1aa3428) eerst moet vinden.
# Dit is dezelfde instelling als CabinetType in het TeknoParrot-profiel; de dongle en de NAS blijven ongewijzigd.
zet adres=0x1800e60 breedte=4 waarde=8
