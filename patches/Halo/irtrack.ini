# Halo: Fireteam Raven (Game Rev 57529) -- de IRTrack-geweren op de NATIVE route (tools/rt-irtrack, librg_irtrack.so).
# Het protocol en alle adressen: IRTRACK-PROTOCOL.md (statisch gelezen). Gemeten 2026-10-15 in het draaiende spel:
# - de geweerdriver (kasttype 8 op 0x1800e60) zet de richtkanalen 793/794 (P1) en 798/799 (P2) met bereik 0..1;
# - het geweersubsysteem kiest zijn eigen kasttype uit de tekst SysInfoGameCabinetType, en die komt uit de dongle-byte
#   (fileid 0xfff4, byte 0x29; in de dump 4): bij 4 start het subsysteem zonder geweren (aantal 0, 0x1f392d0).

# Deze build: de eerste bytes van de richtpunt-getter (met een rip-relatief adres erin, dus per build verschillend).
build      adres=0xdd6c60 signatuur=4885f674334885d2742e488d0d4fcbcc

# De statisch gelinkte libftdi 1.x van de game (IRTRACK-PROTOCOL.md par. 1.1).
ftdi       new=0xff98c0 free=0xff9bb0 find_all=0xff9cd0 list_free=0xffa020 get_strings=0xffa0b0 reset=0xffa2b0 purge=0xffa4d0 close=0xffa5f0 baudrate=0xffab40 open_dev=0xffb120 open_desc=0xffb8d0 write=0xffbe00 read=0xffc250 bitmode=0xffc660 error_string=0x1000d50

# De verbindingstabel: 32 slots vanaf 0x1a7cb20, per slot 0x1348 bytes; de ftdi-context op +0x8, de speler op +0x3c
# (leesdraad 0xdd2420: lea 0x1a7cb20 + slot*0x1348, ftdi_read_data(slot+0x8)). Zo gaan de knoppen van een geweer naar de
# speler die de game dat geweer gaf (guninfo.txt), ook als de volgorde ooit anders is.
verbinding basis=0x1a7cb20 aantal=32 stap=0x1348 ftdi=0x8 speler=0x3c

# Twee geweren (kasttype 8 = STANDARD MOUNTED, P1 en P2). Het serienummer is vrij: de game vergelijkt alleen.
geweer     serie=RVG00001
geweer     serie=RVG00002

# Knoppen en assen uit het bordbeeld van de daemon (packaging/tp-shm-profiles.json, de vier-spelers-shooterindeling):
# a = trekker (sw0), b = herladen (sw1), c = granaat (sw3): de drie knoppen die de geweerdriver leest (0x624040, idx 0, 1, 3).
speler     nr=1 a=7  b=8  c=9  x=12 y=13
speler     nr=2 a=12 b=13 c=14 x=14 y=15

# Het richtpunt: de getter van de geweerdriver (0xdd6c60, aangeroepen in de poll 0x624110) geeft 0..1 per as, (-1, -1) buiten beeld.
richtpunt  functie=0xdd6c60 inverteer_x=nee inverteer_y=ja

# De LED-zoeker (0xdd8350) meldt "gezien" en zet statusslot 5 (LED's gezien) op ok via 0xdd87f0, zoals de game bij n > 0 doet.
leds       functie=0xdd8350 status=0xdd87f0 slot=5

# Het kasttype uit de dongle (0x639950 leest fileid 0xfff4 byte 0x29): 8 = STANDARD MOUNTED. Dezelfde instelling als CabinetType
# in het TeknoParrot-profiel; de dongle en de NAS blijven ongewijzigd. Hiermee wordt SysInfoGameCabinetType "8": de getter
# 0x5864b0 (0x1800e60) en het geweersubsysteem (0x61c940: 8 -> IRTrack-type 9, twee geweren) zien dan hetzelfde kasttype.
kasttype   functie=0x639950 waarde=8
