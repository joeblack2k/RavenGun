; SPDX-License-Identifier: GPL-3.0-or-later
;
; Drop-ins van Halo Fireteam Raven (docs/dropins.md).
;
; De HASP-emulator van RavenGun, 64-bits (de game is een 64-bits ELF). De launcher zet het bestand in de map
; van de game en levert het pad als RG_DROPIN_PRELOAD; de native route of de eigen lader zet dat in LD_PRELOAD
; van het ELF-proces. In de omgeving van Wine gaat het NIET: Wine geeft die door aan BudgieLoader, een
; Cygwin-programma dat aan een LD_PRELOAD-regel sterft (gemeten; docs/hasp-layer.md, sectie 4).
;
; De donglegegevens komen uit dongle.json; die zet de launcher in RAVENGUN_HASP_DIR + RAVENGUN_HASP_GAME zodra
; [Dongle] Enabled = true is.
;
; Het bestand wordt gebouwd met scripts/build-hasp.sh (dat het ook hier neerzet).
;
; Uitzetten: haal dit bestand weg, of zet Preload = false. Zonder [Dongle] Enabled = true laadt de bibliotheek
; wel maar doet ze niets (geen dongle).

[ravengun-hasp-x64.so]
To = .
Preload = true
