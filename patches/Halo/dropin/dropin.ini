; SPDX-License-Identifier: GPL-3.0-or-later
;
; Drop-ins van Halo Fireteam Raven (docs/dropins.md).
;
; Twee bibliotheken en de donglegegevens:
;   ravengun-hasp-x64.so       de HASP-emulator (hasp/src/, gebouwd met scripts/build-hasp.sh)
;   libravengun-hasphook-x64.so de inline-hook voor de statisch gelinkte hasp-aanroepen
;   ravengun-hasp/Halo/        de dongle-beschrijving + de geheugenimages
;
; De launcher zet elk bestand hieronder in de view van de game en zet de omgevingsvariabelen.
; LET OP: elk bestand dat de game nodig heeft moet een EIGEN sectie hebben, anders wordt het niet
; gekopieerd.
;
; Het pad naar de donglegegevens is RELATIEF: de bibliotheek draait in het spelproces, en de
; werkmap daarvan is de view. Zo hoeft er geen Z:\-pad in te staan.

[ravengun-hasp-x64.so]
To = .
Preload = true
Env = RAVENGUN_HASP_DIR=ravengun-hasp;RAVENGUN_HASP_GAME=Halo

[libravengun-hasphook-x64.so]
To = .
Preload = true
Env = RAVENGUN_HASP_ELF_LOG=hasphook.log

[ravengun-hasp/Halo/dongle.json]
To = ravengun-hasp/Halo

[ravengun-hasp/Halo/memory/00000000000000001111111111110100]
To = ravengun-hasp/Halo/memory

[ravengun-hasp/Halo/memory/00000000000000001111111111110101]
To = ravengun-hasp/Halo/memory

[ravengun-hasp/Halo/memory/fff4]
To = ravengun-hasp/Halo/memory
