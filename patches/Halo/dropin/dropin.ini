;
; Drop-ins van Halo Fireteam Raven (docs/dropins.md).
;
; Twee bibliotheken en de donglegegevens:
;   ravengun-hasp-x64.so       de HASP-emulator (hasp/src/, gebouwd met scripts/build-hasp.sh)
;   libravengun-hasphook-x64.so de inline-hook voor de statisch gelinkte hasp-aanroepen
;   ravengun-hasp/Halo/        de dongle-beschrijving + de geheugenimages
;
; De launcher zet elk bestand hieronder in de view van de game en zet de omgevingsvariabelen.
; LET OP: elk bestand in deze map moet een EIGEN sectie hebben, anders wordt het niet gekopieerd.
; Daarom heeft ook de 32-bits hook hieronder een sectie, al wordt die niet geladen.
;
; Het pad naar de donglegegevens is RELATIEF: de bibliotheek draait in het spelproces, en de
; werkmap daarvan is de view. Zo hoeft er geen Z:\-pad in te staan.

[ravengun-hasp-x64.so]
To = .
Preload = true
Env = RAVENGUN_HASP_DIR=ravengun-hasp;RAVENGUN_HASP_GAME=Halo

[libravengun-hasphook-x64.so]
To = .
Preload = true
Env = RAVENGUN_HASP_ELF_LOG=hasphook.log

; De 32-bits hook staat hier ook omdat scripts/build-hasphook.sh BEIDE architecturen in elke game van
; zijn GAMES-lijst legt (JurassicPark GalagaAssault Halo Terminator). Halo is 64-bits -- het
; `game`-bestand is een x86-64 ELF -- dus alleen de x64-hook hierboven wordt geladen. Deze 32-bits
; versie krijgt daarom GEEN Preload: zonder Preload wordt het bestand wel in de view gezet, maar
; nergens in geladen. Een 32-bits ELF in het 64-bits spelproces zetten is fataal (ELFCLASS64;
; docs/dropins.md, "Preload = true"). De sectie is verplicht: een bestand zonder sectie wordt niet
; uitgerold (docs/dropins.md).
;
; Opruimen mag: haal libravengun-hasphook.so uit dropin/ en deze sectie weg, dan blijft er precies
; over wat Halo nodig heeft.
[libravengun-hasphook.so]
To = .

[ravengun-hasp/Halo/dongle.json]
To = .

[ravengun-hasp/Halo/memory/00000000000000001111111111110100]
To = .

[ravengun-hasp/Halo/memory/00000000000000001111111111110101]
To = .

[ravengun-hasp/Halo/memory/fff4]
To = .
