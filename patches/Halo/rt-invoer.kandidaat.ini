# KANDIDAAT 2 (14:40), NIET GEMETEN -- trekker en aim van Halo: Fireteam Raven (Game Rev 57529) via het IO-BORD.
# Kandidaat 1 (apparaatblokken en het kommagetal-paar op 0x1f392a0) richtte zich op de camerageweer-laag; die voedt in deze build
# het richtpunt niet. Zie LEZING-GEWEERLAAG.md, sectie 00, voor de adressen en wat nog niet gelezen is.
# Dit bestand heet met opzet NIET rt-invoer.ini: play-native.sh pakt alleen rt-invoer.ini vanzelf op. Gebruik het in een
# gerichte run met:  --bind-ro <dit bestand> /rg/tabel/rt-invoer.ini --env RG_RT_TABLE=/rg/tabel/rt-invoer.ini
# De IO-brug moet draaien (ravengunctl iobridge start Halo --route tp-shm) en de hulp moet het bordbeeld van de daemon lezen.

# De kastschakelaars zoals de hulp ze ingebouwd heeft (een tabel met schakelaar-regels vervangt de ingebouwde, dus ze staan hier).
schakelaar bit=6  bord=0 k=0 puls=300
schakelaar bit=11 bord=1 k=0 puls=300
schakelaar bit=16 bord=2 k=0 puls=300
schakelaar bit=21 bord=3 k=0 puls=300
schakelaar bit=0  bord=0 k=4 puls=300
schakelaar bit=0  bord=1 k=4 puls=300
schakelaar bit=0  bord=2 k=4 puls=300
schakelaar bit=0  bord=3 k=4 puls=300
schakelaar bit=1  bord=0 k=3 puls=300
schakelaar bit=2  bord=0 k=5 puls=14
schakelaar bit=3  bord=1 k=5 puls=14
schakelaar bit=4  bord=0 k=1 puls=300
schakelaar bit=5  bord=0 k=2 puls=300

# De geweerknoppen van speler 1: vak 21, 22 en 23 van bord 0, ingedrukt zolang de knop ingedrukt is (puls=0).
# WELKE van de drie de trekker is, is niet gelezen: vak 21 (actie 0x208) is de aanname.
schakelaar bit=7  bord=0 k=21 puls=0     # p1.trigger -> actie 0x208
schakelaar bit=8  bord=0 k=23 puls=0     # p1.reload  -> actie 0x209
schakelaar bit=9  bord=0 k=22 puls=0     # p1.grenade -> actie 0x20a

# Het richtpunt van speler 1: vak 17 (X) en 18 (Y) van bord 0 zijn analoge kanalen (soortveld 0: niet aanraken).
# De waarde staat op vak+0xc en de ruwe waarde op vak+0x14. De EENHEID is niet gelezen; eerste poging 0..1.
as bron=12 adres=0x181627c soort=f32 marge=2 schaal=0.00392156862745098
as bron=12 adres=0x1816284 soort=f32 marge=2 schaal=0.00392156862745098
as bron=13 adres=0x18162cc soort=f32 marge=2 schaal=0.00392156862745098
as bron=13 adres=0x18162d4 soort=f32 marge=2 schaal=0.00392156862745098
