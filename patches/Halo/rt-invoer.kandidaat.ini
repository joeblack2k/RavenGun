# KANDIDAAT, NIET GEMETEN -- de invoertabel voor trekker en aim van Halo: Fireteam Raven (Game Rev 57529).
# Dit bestand heet met opzet NIET rt-invoer.ini: play-native.sh pakt alleen rt-invoer.ini vanzelf op. Gebruik het in een
# gerichte run met:  --bind-ro <dit bestand> /rg/tabel/rt-invoer.ini --env RG_RT_TABLE=/rg/tabel/rt-invoer.ini
# Waar de adressen vandaan komen en wat er nog onbekend is: LEZING-GEWEERLAAG.md in deze map.
# Alleen speler 1. De kastschakelaars (start, test, service, munt, volume) blijven de ingebouwde van de hulp.

# Er is een geweer voor speler 1: apparaatblok 0 (0x1a7cb20, 0x1348 per blok): +0 = aanwezig, +0x3c = spelernummer.
zet     adres=0x1a7cb20 breedte=4 waarde=1
zet     adres=0x1a7cb5c breedte=4 waarde=0

# De knoppen: overgangstellers van 4 bits (bit 0 = ingedrukt) op blok+0xc8 + 4*knop. Het spel leest knop 0, 1 en 3.
# WELKE knop de trekker is, is niet gelezen; knop 0 is de aanname.
teller  bit=7 adres=0x1a7cbe8 breedte=4 modulo=16     # p1.trigger -> knop 0
teller  bit=8 adres=0x1a7cbec breedte=4 modulo=16     # p1.reload  -> knop 1
teller  bit=9 adres=0x1a7cbf4 breedte=4 modulo=16     # p1.grenade -> knop 3

# De aim: twee kommagetallen per speler op 0x1f392a0 + 8*speler (x, dan y); -1,-1 leest het spel als "geen richtpunt".
# De EENHEID is niet gelezen. Eerste poging: 0..1 over het scherm (schaal = 1/255).
as      bron=12 adres=0x1f392a0 soort=f32 marge=2 schaal=0.00392156862745098 buiten=-1
as      bron=13 adres=0x1f392a4 soort=f32 marge=2 schaal=0.00392156862745098 buiten=-1
