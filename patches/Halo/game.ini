; Gegenereerd door scripts/migrate-game-settings.py (docs/per-game-patches.md). Sleutels die het script afleidt uit de oude bronnen worden bij
; elke run opnieuw gezet; handwerk in andere sleutels blijft staan.

[Game]
Name = HALO Fireteam Raven
Profile = Halo
Type = ElfLdr2
EmulationProfile = WartranTroopers
Executable = game
Is64Bit = true
ProfileRevision = 2
Patreon = true

[Launch]
Mode = direct

[Display]
CustomResolution = 1920x1080

[Input]
Route = tp-shm
Layout = WartranTroopers
Note = start direct (zonder TeknoParrotUi) via tp-shm; via TeknoParrotUi werkt ook evdev (--tpui --route evdev)

; Klasse (statische meting 2026-10-12, zie patches/ELF-LADER-SPEC.md): ONGEPAKT qua
; importtopologie (ELF64, 33.554.432 B, entry 0x414600), maar het bestand draagt wel de
; HASPE-marker en heeft nul sectiekoppen. De 64-bits PLT/GOT is niet geanalyseerd, en de
; libdruk is niet met ldd te meten (x64/libs/libc.so.6 sloopt de shell).

[Status]
Status = working
Note = WERKT op onze eigen route (2026-10-14): een dubbelklik in RavenGun start de game zonder scripts en zonder TeknoParrotUi (daemon -> rg-direct -> Wine -> BudgieLoader, invoer via de IO-brug tp-shm). Gemeten op de tv met de muismodus: kalibratie overslaan met twee keer TEST (toets 0 even vasthouden), munt (toets 5), START (toets 1), richten, schieten, herladen (rechterknop), een kill; 5:12 min gedraaid. De native route (Linux, eigen lader) bestaat ook en slaat de kalibratie met START over.
NoteEN = WORKING on our own route (2026-10-14): a double-click in RavenGun starts the game without scripts and without TeknoParrotUi (daemon -> rg-direct -> Wine -> BudgieLoader, input through the tp-shm I/O bridge). Measured on the TV in mouse mode: skip calibration with TEST twice (hold key 0 briefly), coin (key 5), START (key 1), aim, shoot, reload (right button), a kill; ran 5:12 min. The native route (Linux, own loader) also exists and skips calibration with START.
Findings = findings/Halo.md

; Profiel uit TeknoParrot-sjabloon GameProfiles/Halo.xml, revisie 2 (scripts/import-tp-profiles.py; opnieuw importeren in plaats van met de hand wijzigen)
