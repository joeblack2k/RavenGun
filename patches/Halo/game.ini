; Gegenereerd door scripts/migrate-game-settings.py (docs/per-game-patches.md). Sleutels die het script afleidt uit de oude bronnen worden bij
; elke run opnieuw gezet; handwerk in andere sleutels blijft staan.

[Game]
Name = HALO Fireteam Raven
Profile = Halo
Type = ElfLdr2
EmulationProfile = WartranTroopers
Executable = game
Is64Bit = true
ProfileRevision = 2
Patreon = true

[Launch]
Mode = direct

[Display]
CustomResolution = 1920x1080

[Input]
Route = tp-shm
Layout = WartranTroopers
Note = start direct (zonder TeknoParrotUi) via tp-shm; via TeknoParrotUi werkt ook evdev (--tpui --route evdev)

[Status]
Status = playable
Note = Werkt volledig: lightgun, knoppen, trillen.
NoteEN = Fully working: lightgun, buttons and rumble.
Findings = findings/Halo.md

; Profiel uit TeknoParrot-sjabloon GameProfiles/Halo.xml, revisie 2 (scripts/import-tp-profiles.py; opnieuw importeren in plaats van met de hand wijzigen)
[Identify]
Path = game
Size = 33554432

[Config]
General/Input API = RawInput
General/HideCursor = 1
General/Windowed = 1
General/BypassFilesystemIntegrityTest = 0
General/TPCheckAndFixBadDump = 0
General/CabinetType = STANDARD TETHERED
General/CustomResolution = 0
General/ResolutionWidth = 1920
General/ResolutionHeight = 1080
General/Use Relative Input = 0
General/Player 1 Relative Sensitivity = 8
General/Player 2 Relative Sensitivity = 8
General/Player 3 Relative Sensitivity = 8
General/Player 4 Relative Sensitivity = 8
Crosshairs/Enable = 0

[ConfigType]
General/Input API = Dropdown
General/HideCursor = Bool
General/Windowed = Bool
General/BypassFilesystemIntegrityTest = Bool
General/TPCheckAndFixBadDump = Bool
General/CabinetType = Dropdown
General/CustomResolution = Bool
General/ResolutionWidth = Text
General/ResolutionHeight = Text
General/Use Relative Input = Bool
General/Player 1 Relative Sensitivity = Slider
General/Player 2 Relative Sensitivity = Slider
General/Player 3 Relative Sensitivity = Slider
General/Player 4 Relative Sensitivity = Slider
Crosshairs/Enable = Bool

[ConfigOptions]
General/Input API = DirectInput|XInput|RawInput
General/CabinetType = DUAL-SCREEN MOUNTED|SUPER DELUXE TETHERED|STANDARD MOUNTED|STANDARD TETHERED
