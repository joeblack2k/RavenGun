; Lost Land Adventure (Namco ES3X). Profiel uit TeknoParrot-sjabloon GameProfiles/LostLand.xml, revisie 28 (scripts/import-tp-profiles.py);
; route zoals Time Crisis 5 (zelfde platform en dongle-runtime).
[Game]
Name = Lost Land Adventure
Profile = LostLandAdventure
Executable = RSLauncher.exe
Type = TeknoParrot
EmulationProfile = LostLandAdventures
Is64Bit = true
ProfileRevision = 28
; Two exes: the launcher (in gamescope) first, the ALL.Net auth server 5 s later. RSLauncher asks for the COM class
; {4603bb03-058d-43d9-b96f-639be908c1ed} with CoCreateInstance; that GUID sits in AMAuthd.exe (and in
; AMUpdater.exe), and AMAuthd registers it at runtime with CoRegisterClassObject (its import list, read
; 2026-10-21). Without AMAuthd running the class is not registered and Wine logs
; "class {4603bb03-...} not registered" -- the only error in the 2026-10-20 measurement.
Executable2 = AMCUS/AMAuthd.exe
HasTwoExecutables = true
; Launcher first (2026-10-21): the first windowed Wine process of the session creates the desktop (explorer.exe), and every
; later process uses the display driver explorer picked. AMAuthd first, outside gamescope without DISPLAY, put the desktop on
; winewayland on the host compositor, so RSLauncher and the game inside gamescope drew there and nothing reached gamescope.
; With the launcher first the desktop is winex11 on gamescope's Xwayland and the game draws (measured, see NoteEN).
LaunchSecondExecutableFirst = false
; AMAuthd is not a game: it stops at once with our core in it ("Failed to Load DLL! (Error 4)" was measured
; for the same server on Mario Kart DX), so it starts bare like there.
SecondBare = true

[Launch]
Mode = direct
WorkingDirectory = .
; RSLauncher.exe importeert mfc100u.dll (Visual C++ 2010 MFC, 64 bits); uit Steam's vcredist via scripts/setup-redist.sh
NativeDlls = mfc100u
; De view heeft dezelfde AMAuth-machinerie als Mario Kart DX (AMCUS met AMAuthd.exe en iauthdll.dll,
; plus PreprocessAmAuth.exe in de spelmap); daarom staat AMCUS in ViewWritable en staan de eenmalige
; stappen hieronder klaar. De game laadt op onze kern (Loading core, Have fun) en de JVS-pijp verbindt.
ViewWritable = AMCUS
; Deze stappen staan UIT: ze werken wel (ze lopen), maar PreprocessAmAuth.exe zegt bij deze titel
; "Checking. / NG!" en eindigt met status 1, en een mislukte stap laat de start stoppen. Zolang dat zo
; is heeft starten zonder deze stappen meer nut: dan zien we wat de game zelf doet.
; PrefixSetup = run . PreprocessAmAuth.exe -wait | copy prefix:drive_c/windows/WritableConfig.ini AMCUS/WritableConfig.ini | run AMCUS regsvr32.exe /s iauthdll.dll

