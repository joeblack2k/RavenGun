Note = GEMETEN 2026-10-19 (punt G, optionele game). Wat WEL lukt op onze eigen lader en kern: RSLauncher.exe start (logboek: "Loading core...", "Have fun :)"), mfc100u.dll wordt bijgewerkt uit de NativeDlls en de JVS-pijp verbindt ("JVS-pipe: game verbonden"). Correctie 2026-10-19 (review 16): de eerste meting liep ZONDER gamescope. De sleutel Gamescope stond in [Launch], maar de motor leest hem alleen uit [Display] (gamesettings.cpp), dus die poging deed niets. De sleutel staat nu in [Display] en de meting is overgedaan: met gamescope komt er WEL een venster en tekent de game een zwart scherm (foto docs/screenshots/lostlandadventure-zwart-scherm-2026-10-19.png, 9.790 bytes). Zonder gamescope was er helemaal geen venster (de foto was het bureaublad). Gamescope maakt hier dus wel verschil. De oorzaak zit in de AMAuth-kant van deze titel: de view heeft dezelfde machinerie als Mario Kart DX (AMCUS met AMAuthd.exe en iauthdll.dll, plus PreprocessAmAuth.exe in de spelmap), dus ik heb dezelfde eenmalige stappen als bij Mario Kart DX in het profiel gezet. Die lopen ook, maar PreprocessAmAuth.exe zegt bij deze titel "Checking. / NG!" en eindigt met status 1 -- bij Mario Kart DX zegt hetzelfde programma "Ok!". Een mislukte stap laat de start stoppen, dus die stappen staan nu UIT (als commentaar in het profiel) en de game start zonder; dan blijft het venster weg. VERONDERSTELLING: het gaat om de regio- of donglecontrole van deze kast (de view heeft AMConfig_JPDevLan/EXDevLan enz., en er staat hasp_windows_x64_106993.dll in). WAT DAT ZOU BEVESTIGEN: uitzoeken welke AMConfig deze titel nodig heeft en of de HASP-controle met een dongle of een patch over te slaan is; daarna vijf starts met en vijf zonder. Verder is deze titel hetzelfde platform als Time Crisis 5, en dat profiel wordt door de motor geweigerd. NAS: bij de meting van 14:44 liep de stap PreprocessAmAuth in de GEDEELDE prefix (prefixes/shared/wine). Nagekeken: daar is geen WritableConfig.ini geschreven; wat er in die prefix veranderde zijn user.reg en userdef.reg en de dosdevices/com*-koppelingen (het gewone opstarten van wine), 38 dingen in totaal. In de view is AMCUS een echte map geworden (ViewWritable) met kopieen van de NAS; er is niets verwijderd.
NoteEN = MEASURED 2026-10-19 (item G, optional game). What DOES work on our own loader/core: RSLauncher.exe starts (log: "Loading core...", "Have fun :)"), mfc100u.dll is refreshed from NativeDlls and the JVS pipe connects ("JVS-pipe: game verbonden"). Correction 2026-10-19 (review 16): the first measurement ran WITHOUT gamescope. The Gamescope key sat in [Launch], but the engine only reads it from [Display] (gamesettings.cpp), so that attempt did nothing. The key is now in [Display] and the measurement was redone: with gamescope a window DOES appear and the game draws a black screen (screenshot docs/screenshots/lostlandadventure-zwart-scherm-2026-10-19.png, 9,790 bytes). Without gamescope there was no window at all (the screenshot was the desktop). So gamescope does make a difference here. The cause is this title's AMAuth side: the view has the same machinery as Mario Kart DX (AMCUS with AMAuthd.exe and iauthdll.dll, plus PreprocessAmAuth.exe in the game folder), so I put the same once-per-prefix steps in the profile as for Mario Kart DX. They do run, but PreprocessAmAuth.exe says "Checking. / NG!" for this title and exits with status 1 -- for Mario Kart DX the same program says "Ok!". A failed step stops the start, so those steps are now OFF (as a comment in the profile) and the game starts without them; the window then stays away. HYPOTHESIS: this is the cabinet's region or dongle check (the view has AMConfig_JPDevLan/EXDevLan etc., and hasp_windows_x64_106993.dll is present). WHAT WOULD CONFIRM IT: find out which AMConfig this title needs and whether the HASP check can be skipped with a dongle or a patch; then five starts with and five without. This title is also the same platform as Time Crisis 5, and that profile is refused by the engine.

