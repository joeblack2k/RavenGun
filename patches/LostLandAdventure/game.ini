; Lost Land Adventure (Namco ES3X). Profiel uit TeknoParrot-sjabloon GameProfiles/LostLand.xml, revisie 28 (scripts/import-tp-profiles.py);
; route zoals Time Crisis 5 (zelfde platform en dongle-runtime).
[Game]
Name = Lost Land Adventure
Profile = LostLandAdventure
Executable = RSLauncher.exe
Type = TeknoParrot
EmulationProfile = LostLandAdventures
Is64Bit = true
ProfileRevision = 28

[Launch]
Mode = direct
WorkingDirectory = .
; RSLauncher.exe importeert mfc100u.dll (Visual C++ 2010 MFC, 64 bits); uit Steam's vcredist via scripts/setup-redist.sh
NativeDlls = mfc100u

[Input]
Route = tp-shm
Layout = LostLandAdventures
Note = tp-shm, indeling LostLandAdventures (TeknoParrotUi LostLandPipe): trekkers en richten; start en munt nog niet gemeten

; Bediening voor de knoppen-uitleg bij de eerste start (docs/per-game-patches.md, "Bediening per game"); labels uit het
; TeknoParrot-profiel (GameProfiles/<P>.xml), "Not confirmed yet" = de werking is nog niet gemeten.
[Controls]
trigger = Shoot | Fires the gun.

[Status]
Status = untested
Note = Start via dubbelklik (2026-10-16): na ~2 min laden de attract (DEMO PLAY, koepelbeeld). Nodig: mfc100u.dll (NativeDlls). Open: de tekst is Japans terwijl [Arguments] Text Language = English in teknoparrot.ini staat (de dump heeft ook initT_EX*.ps1); munt en start niet gemeten. Speelproef 2026-10-17: de invoer viel in de laadtijd van ~2 min; opnieuw meten met later invoer.
NoteEN = Starts by double-click (2026-10-16): attract (DEMO PLAY) after ~2 min loading. Open: the text is Japanese; coin and start not measured. Play test 2026-10-17: input came during the ~2 min load; measure again with later input.

