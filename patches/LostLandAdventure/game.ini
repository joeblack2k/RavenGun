Note = GEMETEN 2026-10-19 (punt G, optionele game). Wat WEL lukt op onze eigen lader en kern: RSLauncher.exe start (logboek: "Loading core...", "Have fun :)"), mfc100u.dll wordt bijgewerkt uit de NativeDlls en de JVS-pijp verbindt ("JVS-pipe: game verbonden"). Correctie 2026-10-19 (review 17): de bewering dat er met gamescope een venster kwam is niet vol te houden. De opname waarop dat steunde is byte-identiek aan de Mario Kart-opname van 13:28 (beide 10.669 bytes, sha256 707d1f84...), dus dat is een lege opname. Opnieuw gemeten met de sleutel in [Display] (16:12-16:16): gamescope start wel (65 regels in het logboek), maar na 3,5 minuut was het beeld nog steeds zwart. Of er een venster was is NIET vast te stellen: gamescope draait zijn eigen Xwayland, en xdotool op het scherm van de host ziet vensters daarbinnen niet. Zonder gamescope was er wel een venster, maar heel klein: 113x28 (RSLauncher). De eerlijke stand: met gamescope bleef het beeld zwart na 3,5 minuut; of er een venster was is niet vast te stellen. VERONDERSTELLING over de oorzaak (let op: in deze meting stonden de AMAuth-stappen UIT, dus dit is niet gemeten maar afgeleid): de AMAuth-kant van deze titel. de view heeft dezelfde machinerie als Mario Kart DX (AMCUS met AMAuthd.exe en iauthdll.dll, plus PreprocessAmAuth.exe in de spelmap), dus staan dezelfde eenmalige stappen als bij Mario Kart DX klaar in het profiel -- als commentaar, want ze laten de start stoppen zolang PreprocessAmAuth "NG!" zegt. Toen ze nog aan stonden liepen ze wel, maar PreprocessAmAuth.exe zegt bij deze titel "Checking. / NG!" en eindigt met status 1 -- bij Mario Kart DX zegt hetzelfde programma "Ok!". Een mislukte stap laat de start stoppen, dus die stappen staan nu UIT (als commentaar in het profiel) en de game start zonder; of er dan een venster komt is niet vast te stellen (zie de correctie over gamescope). VERONDERSTELLING: het gaat om de regio- of donglecontrole van deze kast (de view heeft AMConfig_JPDevLan/EXDevLan enz., en er staat hasp_windows_x64_106993.dll in). WAT DAT ZOU BEVESTIGEN: uitzoeken welke AMConfig deze titel nodig heeft en of de HASP-controle met een dongle of een patch over te slaan is; daarna vijf starts met en vijf zonder. Verder is deze titel hetzelfde platform als Time Crisis 5, en dat profiel wordt door de motor geweigerd. NAS: bij de meting van 14:44 liep de stap PreprocessAmAuth in de GEDEELDE prefix (prefixes/shared/wine). Nagekeken: daar is geen WritableConfig.ini geschreven; wat er in die prefix veranderde zijn user.reg en userdef.reg en de dosdevices/com*-koppelingen (het gewone opstarten van wine), 38 dingen in totaal. In de view is AMCUS een echte map geworden (ViewWritable) met kopieen van de NAS; er is niets verwijderd.
NoteEN = MEASURED 2026-10-21 11:15-11:42 (headless, claude-lostland2). (D) FATAL ERROR, PART 1 = THE DONGLE, FIXED: DSGameInfo.CheckDongle (script text in the game's own DomeShooterGame.u) starts DOME_FatalError when RSDongleHandler.Result.ErrorCode is not DESC_VALID. The verdict comes from 0x140a2ade0: hasp_read fileid 0xFFF0 offset 0xD00 length 64, hasp_decrypt, byte 0x3F == ~byte 0x3E, bytes 0..12 against the serial pattern that SetDongleSettingFromLang picks (language JPN -> FOREIGN '27282*15****' on HASP). Two causes, both measured: the dongle had no fileid 65520 (read failed, no decrypt call in rg-hasp.log), and our emulator kept the dongle dir relative while the game moves its cwd to Binaries/Win64 after loading the DLL (hasp/src/dongle.c now makes it absolute; tests/test_hasp.py RelatieveMap fails on the old code, passes now). With the synthetic read-only image (dongle.json notes) rg-hasp.log shows login/read/decrypt/logout and RAVENGUN_HASP_PEEK=16b2268:4 reads the verdict global as 00 (VALID); the pattern at 0x1416b2248 reads '27282*15****', the copied record '272820150001'. (E) FATAL ERROR, PART 2 = THE LAUNCHER'S AUTH CAMERA: the screen stays FATAL ERROR (shots-lostland/r2/LLE-70.png) because RSLauncher sets bErrorFatal: RAVENGUN_HASP_PEEK_MAP=RSSharedData shows int 0x30 (CreditsData.bErrorFatal) = 1; DSGameInfo.CheckFatalErrorEnd goes to DS_Attract once it is 0. RSLauncher 0x140041450 calls nbamMfCapture's EnumerateDevices up to 25 times 200 ms apart and then raises error 40 = '08-01 AUTH CAMERA ERROR' (registered without the playable flag); WINEDEBUG +mfplat shows 26 MFEnumDeviceSources(VIDCAP) calls, each 'Not implemented for video capture devices' (scratchpad rslauncher-mfplat.log). NEXT: a 64-bit tools/rg-mfcam that redirects nbamMfCapture.dll's import of MFEnumDeviceSources (it already imports MFEnumDeviceSources + MFCreateSourceReaderFromMediaSource, the same API rg-mfcam answers for Mario Kart DX), preloaded into RSLauncher; then check whether other launcher errors stay (06-02 GUN CAMERA is raised from 0x140063488). MEASURED 2026-10-21 10:55-11:07 (headless, claude-lostland2). (C) THE DESKTOP DRIVER WAS THE BLOCKER, NOT A CRASH: /proc/<pid>/maps and the peer of each process's unix sockets show that with AMAuthd first (outside gamescope, no DISPLAY, WAYLAND_DISPLAY=wayland-0) explorer.exe /desktop, AMAuthd, RSLauncher and DomeShooterGame (inside gamescope, DISPLAY=:1) all map winewayland.so and connect to the host /run/user/1000/wayland-0; a KWin window list shows 'RSLauncher' and AMAuthd's conhost on the KDE desktop; no screenshot file (scratchpad probe-lla-1.txt). In the same session MarioKartDX, HOTDSD (amdaemon outside gamescope loads no display driver) and GaiaAttack4 map winex11.so in their game and explorer, connected to gamescope's X1 only, no KDE windows, attract screenshots (shots-lostland/MarioKartDX-20.png, HOTDSD-29.png, GaiaAttack4-20.png). A scratch prefix reproduces it with notepad + winecfg: the first windowed process outside gamescope decides the driver for the whole session, an unset WAYLAND_DISPLAY still lands on wayland-0 (libwayland default), and a non-existent WAYLAND_DISPLAY for the outside process leaves the session without a driver (tried in rg-direct: RSLauncher then maps no driver and the game never starts; reverted). FIX: LaunchSecondExecutableFirst = false (launcher in gamescope first, AMAuthd 5 s later): every gamescope process maps winex11.so, AMAuthd maps none, no KDE windows, ONE game pid for 48 s (no exit-3 restart loop), the logo screen 'Spherical Display Exotic Adventure Gun Game / LOST LAND ADVENTURE' at 20-38 s (shots-lostland/LostLandAdventure-38.png), then a red 'FATAL ERROR' screen at 46 s (LostLandAdventure-46.png). The game now reaches the dongle: LLA/Binaries/Win64/rg-hasp.log shows hasp_login (vendor_code 4294901760), hasp_read fileid 65520 offset 3328 length 64, hasp_logout, repeated (6 logins). NEXT: what the game expects in that 64-byte read (and whether FATAL ERROR follows it), then the camera checks. MEASURED 2026-10-21 09:48-10:09 (headless, claude-lostland). (A) THE X ERROR IS THE HOST DISPLAY: same plan through rg-direct, gamescope argv identical in every run (-W 1920 -H 1080 -S fit -f --backend headless), only the env varied: DISPLAY=:0 + WAYLAND_DISPLAY=wayland-0 -> 'X Error ... BadWindow (X_UnmapWindow)' and the run ends 2-3 s after the game starts (2/2); only WAYLAND_DISPLAY removed -> same X error (2/2); only DISPLAY removed -> no X error, the launcher keeps running and restarts the game (2/2); both removed -> no X error (2/2); --backend wayland: with DISPLAY X error, without none (1/1 each). Inside gamescope the launcher and the game see DISPLAY=:1 in every variant, so it is the processes started before gamescope in the same wineserver session (JVS bridge, AMAuthd) that carry :0. Removing DISPLAY only from gamescope's own environment was NOT enough (daemon run 10:00: X error); removing it for the whole run fixes it (daemon run 10:03: no X error, game restarted every ~13 s for 60 s). Fix: rg-direct runs a gamescope plan without DISPLAY (launch::gamescope_start_env). (B) THE GAME ITSELF EXITS WITH CODE 3 about 13 s after each start (+process: NtTerminateProcess exit_code 3 from its main thread, every restart); right before it, +file shows a crash-handler stack walk (dbghelp looks for C:\unrailshooter\Binaries\Win64\DomeShooterGame-Win64-Shipping.pdb and lists system32 and Win64), and the last ordinary loads are hasp_windows_x64_106993.dll, winewayland.drv, gameux.dll and dxgi.dll (builtin). hasp_login is never called; no UE3 log is written (LLA/DomeShooterGame/Logs writable via ViewRealDirs/ViewWritable stays empty); gamescopectl screenshot writes no file, and that is real: the same screenshot command (written to a path outside /tmp) gives attract pictures for MarioKartDX, HOTDSD and GaiaAttack4 in the same session (10:20-10:30), but still no file for Lost Land 12-24 s after start. Run alone (no launcher) the game exits with code 0 instead, after an RPC_S_SERVER_UNAVAILABLE exception, so the alone run is not the same failure. [Launch] Dxvk = true is worse: d3d9.dll (x64) cannot be imported and the game dies within 1 s. NEXT: find the crash before the stack walk (+seh on the game only, e.g. a run of the game exe alone under the same prefix and gamescope), the graphics path (winewayland vs winex11, DXVK dxgi/d3d11 without d3d9), then the camera checks. MEASURED 2026-10-21 08:59-09:45 (headless, claude-lostland). (1) THE 08:40 REGRESSION IS THE JVS PIPE, not the view or the HASP DLL: with a clean view (Win64 back to a drop-in-materialised dir, ViewWritable = AMCUS only) RSLauncher still spun at ~83 % CPU after one WAJVUpdate whenever 'JVS-pipe: game verbonden' was logged (all 9 daemon runs 08:42-09:10); perf puts the spinning main thread in the wait loop of its card-reader start (0x14002eb27, polling a status that stays 1; the reader string is COM4, chosen by Data/romVersion.txt). The 07:39/07:41 runs and two rg-direct runs at 09:06/09:08 passed only because an orphaned rg-jvsbridge.exe from 07:33 held \\.\pipe\TeknoParrot_JVS (CreateNamedPipe failed: 231); after killing it rg-direct spun too. Fix in the engine: LostLandAdventures joins the shm-only JVS profiles (src/ravengun/launch/direct.cpp no_pipe); with pipe_mode shm the launcher runs its frame loop (WAJVGetStatus/GetNodeCount/GetInput/Update/SetOutput at ~55 Hz) and starts DomeShooterGame-Win64-Shipping.exe. (2) HASP: our hasp_windows_x64_106993.dll must replace the vendor runtime in BOTH places (RSLauncher.exe imports it too, from the game root): dropin.ini places it at . and at LLA/Binaries/Win64. Both processes load it and load the synthetic dongle (RAVENGUN_HASP_LOG=rg-hasp.log in the view: 'dongle Lost Land Adventure geladen', one line per process), but NO process ever calls hasp_login: the game dies before its dongle check, so HASP is not the current blocker. (3) THE GAME IS RESTARTED EVERY ~14 s: with the launcher alive (rg-direct, DISPLAY/WAYLAND_DISPLAY not inherited) the game pid changes every 13-14 s for 45+ s; it loads D3D (DXGID3D10CreateDevice) and audio, writes no UE3 log (LLA/DomeShooterGame/Logs made writable via ViewRealDirs: stays empty, nothing new under drive_c) and gamescopectl screenshot writes no file (nothing presented). (4) UNDER THE DAEMON the run ends 2-3 s after the game starts: 'X Error of failed request: BadWindow (X_UnmapWindow)', then 'Primary child shut down' and rg-direct stops the rest (3/3 daemon runs). The same plan through rg-direct also fails with the session's DISPLAY=:0 and WAYLAND_DISPLAY=wayland-0 in its env and survives without them (measured 09:40 vs 09:42), so the engine leaks the desktop's display variables into the gamescope child; not fixed (shared engine code). (5) Core = none: the launcher passes the gate too but exits with the same X error after ~10 s; Core = ravengun is kept. NEXT: stop passing DISPLAY/WAYLAND_DISPLAY to gamescope children (engine), then find why the UE3 game exits after ~14 s (+seh/+process on the game, its exit code), then the camera checks. MEASURED 2026-10-20 (second pass, headless): RSLauncher.exe (64-bit) runs for 3+ minutes as the only game process (no child exe appears), the screenshot is fully black, the JVS pipe connects and rg-wajvio logs WAJVSetFunctionSettings, WAJVOpen and three WAJVGetStatus calls, then nothing more. WINEDEBUG=err+all,+loaddll shows its modules (LIBEAY32, SSLEAY32, wajvio, nbamsavdat, Nbam_QR_Code, nbamMfCapture, OpenParrot64) and exactly one error: 'err:ole:create_server class {4603bb03-058d-43d9-b96f-639be908c1ed} not registered' (the GUID is inside RSLauncher.exe at file offset 0x2B4278). The launcher's strings include '08-01 AUTH CAMERA ERROR', '03-03 AUTH CAMERA PCB ERROR 1', '06-02 GUN CAMERA ERROR', varBoolCameraCheck and the nbamMfCapture Media Foundation capture classes, so it waits for camera checks (the gun and the auth QR camera). CLSID FOUND AND ANSWERED (2026-10-21): the class is AMAuthd own -- the GUID sits in AMCUS/AMAuthd.exe and AMCUS/AMUpdater.exe and nowhere else in the game folder, and AMAuthd registers it at runtime with CoRegisterClassObject (its import list). The profile now starts it first (Executable2 = AMCUS/AMAuthd.exe, HasTwoExecutables, LaunchSecondExecutableFirst, SecondBare, [Identify] Path2), the same way Mario Kart DX starts the same server. MEASURED with rg-direct --run of that plan, gamescope headless: both exes run, "Have fun :)" in the log, and the "class {4603bb03-...} not registered" error is GONE (0 hits in the log). The launcher still draws nothing: no window is mapped (gamescopectl screenshot writes no file), rg-wajvio still logs WAJVSetFunctionSettings/WAJVOpen/3x WAJVGetStatus and nothing more, and RSLauncher spins at ~38 % CPU (39 s of CPU in 104 s, one thread in anon_pipe_read) instead of blocking. Next: find that spin with the sampling thread of tools/rg-mfcam as a drop-in part, then the camera side (nbamMfCapture). STEP FURTHER (2026-10-21 07:53, same plan through rg-direct --run, gamescope headless): RSLauncher now starts the real game -- LLA\Binaries\Win64\DomeShooterGame-Win64-Shipping.exe -NOINI -Language=JPN (Unreal Engine 4), and its rg-wajvio counters keep running the frame path at ~54 Hz for 7+ minutes. But the game process is short-lived: measured pids come and go every 30-60 s (four different ones in two minutes), so the launcher starts it again and again. Nothing is presented: gamescopectl screenshot writes no file for this run (it does write one for a d3d9 title through DXVK), and an X11 grab of the gamescope Xwayland display is black with only the cursor. Run alone under the same prefix the game loads bink2w64, PhysXExtensions, ApexFramework, tbbmalloc and hasp_windows_x64 and then exits with code 3 without a word (that run had Wine builtin dxgi, no DXVK override). Under the launcher the log does show "[Gamescope WSI] Executable name: DomeShooterGame-Win64-Shipping.exe", so D3D init gets that far before it dies. CAUSE FOUND (2026-10-21 08:09): the dongle. Measured alone under the same prefix and gamescope headless with the full DXVK overrides: every import resolves (XINPUT1_3, D3DCOMPILER_43 native, d3dxof, d3dx9_43, d3dx11_43, d3dcompiler_47) and then LLA/Binaries/Win64/hasp_windows_x64_106993.dll loads from the game folder -- the Aladdin HASP HL runtime, strings "\\\\.\\HARDLOCK.VXD", "\\\\.\\FEnteDev", "USB\Hardlock", "<haspid>%u</haspid>" -- and the game then exits with code 0 and no output, no window, no exception under +seh. A silent exit right after the dongle library loads is a failed dongle check, not a grahpics problem: the stack excuse is gone (measured SizeOfStackReserve = 0x4c4b40 = 5 MB, so a bigger stack is not needed). NEXT STEPS: answer the HASP calls of hasp_windows_x64_106993.dll the way the other dongle titles are answered (the game calls them through the DLL, its own strings have no hasp_login, so the layer has to be built on that DLL), and only then the camera checks ("08-01 AUTH CAMERA ERROR", "06-02 GUN CAMERA ERROR", nbamMfCapture), which need a 64-bit camera stub because rg-mfcam.dll is 32-bit (pei-i386) and cannot load into this 64-bit launcher. NOTE: "ravengunctl game start" itself did nothing for this game (the daemon stayed on "Zet de PS Move" and started no process), so this was measured with the same plan through rg-direct --run; that daemon path needs a look too. Earlier notes: MEASURED 2026-10-19 (item G, optional game). What DOES work on our own loader/core: RSLauncher.exe starts (log: "Loading core...", "Have fun :)"), mfc100u.dll is refreshed from NativeDlls and the JVS pipe connects ("JVS-pipe: game verbonden"). Correction 2026-10-19 (review 17): the claim that a window appeared with gamescope does not hold. The capture it rested on is byte-identical to the Mario Kart capture of 13:28 (both 10,669 bytes, sha256 707d1f84...), so it is an empty grab. Re-measured with the key in [Display] (16:12-16:16): gamescope does start (65 lines in the log), but after 3.5 minutes the screen was still black. Whether there was a window is NOT determined: gamescope runs its own Xwayland, and xdotool on the host display cannot see windows inside it. Without gamescope there was a window, but a very small one: 113x28 (RSLauncher). The honest position: with gamescope the screen stayed black after 3.5 minutes; whether there was a window is not determined. HYPOTHESIS about the cause (note: the AMAuth steps were OFF in this measurement, so this is inferred, not measured): this title's AMAuth side. the view has the same machinery as Mario Kart DX (AMCUS with AMAuthd.exe and iauthdll.dll, plus PreprocessAmAuth.exe in the game folder), so the same once-per-prefix steps as for Mario Kart DX are ready in the profile -- as a comment, because they stop the start while PreprocessAmAuth says "NG!". They do run, but PreprocessAmAuth.exe says "Checking. / NG!" for this title and exits with status 1 -- for Mario Kart DX the same program says "Ok!". A failed step stops the start, so those steps are now OFF (as a comment in the profile) and the game starts without them; whether a window then appears is not determined (see the gamescope correction). HYPOTHESIS: this is the cabinet's region or dongle check (the view has AMConfig_JPDevLan/EXDevLan etc., and hasp_windows_x64_106993.dll is present). WHAT WOULD CONFIRM IT: find out which AMConfig this title needs and whether the HASP check can be skipped with a dongle or a patch; then five starts with and five without. This title is also the same platform as Time Crisis 5, and that profile is refused by the engine.

