[Game]
Name = Lost Land Adventure
Profile = LostLandAdventure
Executable = RSLauncher.exe
Type = TeknoParrot
EmulationProfile = LostLandAdventures
Is64Bit = true
ProfileRevision = 28

[Launch]
Mode = direct
; GEMETEN 2026-10-19 (punt G): zonder gamescope loopt de game wel (onze lader, onze kern, de JVS-pijp
; verbonden) maar er komt geen venster in beeld. Daarom net als TC5 in gamescope.
Gamescope = true
WorkingDirectory = .
; RSLauncher.exe importeert mfc100u.dll (Visual C++ 2010 MFC, 64 bits); uit Steam's vcredist via scripts/setup-redist.sh
NativeDlls = mfc100u
; GEMETEN 2026-10-19 (punt G): de view heeft dezelfde AMAuth-machinerie als Mario Kart DX (AMCUS met
; AMAuthd.exe en iauthdll.dll, plus PreprocessAmAuth.exe in de spelmap), dus dezelfde eenmalige stappen
; per prefix. De game laadt wel op onze kern (Loading core, Have fun) en de JVS-pijp verbindt, maar er
; komt geen venster in beeld; dit is de volgende stap.
ViewWritable = AMCUS
; Deze stappen staan UIT: ze werken wel (ze lopen), maar PreprocessAmAuth.exe zegt bij deze titel
; "Checking. / NG!" en eindigt met status 1, en een mislukte stap laat de start stoppen. Zolang dat zo
; is heeft starten zonder deze stappen meer nut: dan zien we wat de game zelf doet.
; PrefixSetup = run . PreprocessAmAuth.exe -wait | copy prefix:drive_c/windows/WritableConfig.ini AMCUS/WritableConfig.ini | run AMCUS regsvr32.exe /s iauthdll.dll

[Input]
Route = tp-shm
Layout = LostLandAdventures
Note = tp-shm, indeling LostLandAdventures (TeknoParrotUi LostLandPipe): trekkers en richten; start en munt nog niet gemeten

; Bediening voor de knoppen-uitleg bij de eerste start (docs/per-game-patches.md, "Bediening per game"); labels uit het
; TeknoParrot-profiel (GameProfiles/<P>.xml), "Not confirmed yet" = de werking is nog niet gemeten.
[Controls]
trigger = Shoot | Fires the gun.

[Status]
Status = parked
Note = GEMETEN 2026-10-19 (punt G, optionele game). Wat WEL lukt op onze eigen lader en kern: RSLauncher.exe start (logboek: "Loading core...", "Have fun :)"), mfc100u.dll wordt bijgewerkt uit de NativeDlls en de JVS-pijp verbindt ("JVS-pipe: game verbonden"). Wat NIET lukt: er komt geen venster in beeld -- met de desktop en met gamescope allebei niet (de foto is het bureaublad). De oorzaak zit in de AMAuth-kant van deze titel: de view heeft dezelfde machinerie als Mario Kart DX (AMCUS met AMAuthd.exe en iauthdll.dll, plus PreprocessAmAuth.exe in de spelmap), dus ik heb dezelfde eenmalige stappen als bij Mario Kart DX in het profiel gezet. Die lopen ook, maar PreprocessAmAuth.exe zegt bij deze titel "Checking. / NG!" en eindigt met status 1 -- bij Mario Kart DX zegt hetzelfde programma "Ok!". Een mislukte stap laat de start stoppen, dus die stappen staan nu UIT (als commentaar in het profiel) en de game start zonder; dan blijft het venster weg. VERONDERSTELLING: het gaat om de regio- of donglecontrole van deze kast (de view heeft AMConfig_JPDevLan/EXDevLan enz., en er staat hasp_windows_x64_106993.dll in). WAT DAT ZOU BEVESTIGEN: uitzoeken welke AMConfig deze titel nodig heeft en of de HASP-controle met een dongle of een patch over te slaan is; daarna vijf starts met en vijf zonder. Verder is deze titel hetzelfde platform als Time Crisis 5, en dat profiel wordt door de motor geweigerd.
NoteEN = MEASURED 2026-10-19 (item G, optional game). What DOES work on our own loader/core: RSLauncher.exe starts (log: "Loading core...", "Have fun :)"), mfc100u.dll is refreshed from NativeDlls and the JVS pipe connects ("JVS-pipe: game verbonden"). What does NOT work: no window appears -- neither with the desktop nor with gamescope (the screenshot is the desktop). The cause is this title's AMAuth side: the view has the same machinery as Mario Kart DX (AMCUS with AMAuthd.exe and iauthdll.dll, plus PreprocessAmAuth.exe in the game folder), so I put the same once-per-prefix steps in the profile as for Mario Kart DX. They do run, but PreprocessAmAuth.exe says "Checking. / NG!" for this title and exits with status 1 -- for Mario Kart DX the same program says "Ok!". A failed step stops the start, so those steps are now OFF (as a comment in the profile) and the game starts without them; the window then stays away. HYPOTHESIS: this is the cabinet's region or dongle check (the view has AMConfig_JPDevLan/EXDevLan etc., and hasp_windows_x64_106993.dll is present). WHAT WOULD CONFIRM IT: find out which AMConfig this title needs and whether the HASP check can be skipped with a dongle or a patch; then five starts with and five without. This title is also the same platform as Time Crisis 5, and that profile is refused by the engine.

