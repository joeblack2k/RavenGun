;
; Drop-ins of Lost Land Adventure (docs/dropins.md). Measured 2026-10-21.
;
; wajvio.dll: RavenGun's replacement for Namco's WinArc JVS library (tools/rg-lostland/, built with
; tools/rg-lostland/build.sh). RSLauncher.exe imports it by name from its own folder. Its log
; rg-wajvio.log lands next to RSLauncher.exe in the view: no log = the DLL was not loaded.
[wajvio.dll]
To = .
DllOverride = native

; hasp_windows_x64_106993.dll: our HASP HL emulator (hasp/src, scripts/build-hasp.sh) under the name of
; the vendor runtime. Both exes import it by ordinal: RSLauncher.exe from the game root and the real game
; LLA/Binaries/Win64/DomeShooterGame-Win64-Shipping.exe from its own folder, so the same file goes to both
; places (the second copy is the path under dropin/ with To = ., which the engine reaches by making LLA,
; LLA/Binaries and Win64 real view dirs). The synthetic dongle sits in ravengun-hasp/ below.
[hasp_windows_x64_106993.dll]
To = .
DllOverride = native
Env = RAVENGUN_HASP_DIR=ravengun-hasp;RAVENGUN_HASP_GAME=LostLandAdventure;RAVENGUN_HASP_VERBOSE=1;RAVENGUN_HASP_LOG=rg-hasp.log

[LLA/Binaries/Win64/hasp_windows_x64_106993.dll]
To = .

[ravengun-hasp/LostLandAdventure/dongle.json]
To = .

[ravengun-hasp/LostLandAdventure/dongle/memory/00000000000000001111111111110100]
To = .

[ravengun-hasp/LostLandAdventure/dongle/memory/00000000000000001111111111110000]
To = .
