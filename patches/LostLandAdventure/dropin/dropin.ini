;
; Drop-ins of Lost Land Adventure (docs/dropins.md). Measured 2026-10-21.
;
; wajvio.dll: RavenGun's replacement for Namco's WinArc JVS library (tools/rg-lostland/, built with
; tools/rg-lostland/build.sh). RSLauncher.exe imports it by name from its own folder. Its log
; rg-wajvio.log lands next to RSLauncher.exe in the view: no log = the DLL was not loaded.
[wajvio.dll]
To = .
DllOverride = native

; rg-mfcam.dll: the 64-bit build of RavenGun's Media Foundation camera (tools/rg-mfcam/rg_mfcam.cpp, built with
; tools/dev/build-mfcam.sh --arch x86_64). RSLauncher.exe asks nbamMfCapture.dll for its auth camera (0x140041450,
; mfCapDevList::EnumerateDevices up to 25 times) and raises "08-01 AUTH CAMERA ERROR" -- a fatal error the game shows as
; FATAL ERROR -- when there is none; Wine has no video capture devices in MFEnumDeviceSources. RG_MFCAM_MODULE puts the
; redirection in nbamMfCapture.dll's import table (the exe does not import MF.dll); RG_MFCAM_SYNTHETIC offers a camera without
; the daemon's camera file, with gray frames, at the size the launcher's capture asks for (0x140040f76: YUY2 640x480, its frame
; callback 0x140040dc0 only feeds nbamQrDecode). RG_CHILD_PRELOAD loads the same DLL into the game the launcher starts
; (DomeShooterGame-Win64-Shipping.exe, CreateProcessW), where RG_DOMEGUN_COMPORT answers the gun peripheral the game reads on COM2
; (dome_gun.h: 12-byte frames from the shared memory; without it the game drops the gun after 60 empty polls and the launcher
; raises the gun camera error from RSSharedData+0x1a4). RG_DOMEGUN_MASKS logs the game's button masks (0x1416b2240).
; Its log rg-mfcam.log lands next to RSLauncher.exe in the view (one line per process names the exe).
[rg-mfcam.dll]
To = .
Preload = true
; A Windows PE DLL, not ELF: not in LD_AUDIT (docs/dropins.md, "Audit = false").
Audit = false
Env = RG_MFCAM_MODULE=nbamMfCapture.dll;RG_MFCAM_SYNTHETIC=640x480;RG_CHILD_PRELOAD=DomeShooterGame-Win64-Shipping.exe;RG_DOMEGUN_COMPORT=COM2;RG_DOMEGUN_MASKS=16b2240

; hasp_windows_x64_106993.dll: our HASP HL emulator (hasp/src, scripts/build-hasp.sh) under the name of
; the vendor runtime. Both exes import it by ordinal: RSLauncher.exe from the game root and the real game
; LLA/Binaries/Win64/DomeShooterGame-Win64-Shipping.exe from its own folder, so the same file goes to both
; places (the second copy is the path under dropin/ with To = ., which the engine reaches by making LLA,
; LLA/Binaries and Win64 real view dirs). The synthetic dongle sits in ravengun-hasp/ below.
[hasp_windows_x64_106993.dll]
To = .
DllOverride = native
Env = RAVENGUN_HASP_DIR=ravengun-hasp;RAVENGUN_HASP_GAME=LostLandAdventure;RAVENGUN_HASP_VERBOSE=1;RAVENGUN_HASP_LOG=rg-hasp.log

[LLA/Binaries/Win64/hasp_windows_x64_106993.dll]
To = .

[ravengun-hasp/LostLandAdventure/dongle.json]
To = .

[ravengun-hasp/LostLandAdventure/dongle/memory/00000000000000001111111111110100]
To = .

[ravengun-hasp/LostLandAdventure/dongle/memory/00000000000000001111111111110000]
To = .
