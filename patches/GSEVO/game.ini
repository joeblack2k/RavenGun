[Controls]
trigger = Shoot | Fires the gun.
reload = Reload | Reloads your gun. Aiming off the screen reloads too.
offscreen = Reload off-screen | Point the gun away from the screen and pull the trigger to reload.
grenade = Action | Action button. Used by the game; exact function not confirmed yet.

[Status]
Status = working
Note = WERKT op de Lindbergh-route (2026-10-15): dubbelklik in RavenGun, vsg met lindbergh.so van lindbergh-loader, Type 1-bord (LindberghType1) via de daemon, zink. 5,5 min gespeeld in muismodus: munt (5), START (1), schieten, herladen. Richten gekalibreerd 2026-10-22: de daemon stuurt de 8-bits assen nu als [waarde, 0], en de kalibratie uit het eigen testmenu van de game (GUN ADJUSTMENT) zit in patches/GSEVO/seed/eeprom.bin; binnen 2 px over het hele scherm voor beide spelers.
NoteEN = WORKING on the Lindbergh route (2026-10-15): double-click in RavenGun, vsg with lindbergh-loader's lindbergh.so, Type 1 board (LindberghType1) through the daemon, zink. Played 5.5 min in mouse mode: coin (5), START (1), shooting, reloading. Aim calibrated 2026-10-22 (headless, 640x480). Root cause of the earlier unusable calibration samples: the daemon sent every 8-bit axis as value*257 (low byte = value), and the game misreads that (the five GUN ADJUSTMENT samples jumped by 640 in x at the screen centre, INPUT TEST showed noise). The daemon now sends boards with analog_bits <= 8 (only LindberghType1) as [value, 0], like lindbergh-loader's own emulation; with that, INPUT TEST GUN-X/GUN-Y show the plain 8-bit value (aim 0.25/0.75 -> 064/191, 0.8/0.2 -> 204/051) and the samples are linear and continuous: TOP 0,225, LEFT -305,0, CENTER 0,0, RIGHT 302,0, BOTTOM 0,-223 (screen pixels from the centre, y up; 2.5 px per axis count in x, 1.875 in y). The game's default calibration (identical in the owner's eeprom.bin and a fresh one: P1 TOP -55,235 LEFT -318,32 CENTER -63,30 RIGHT 207,19 BOTTOM -60,-185; P2 TOP 0,229 LEFT -300,42 CENTER -25,29 RIGHT 242,40 BOTTOM -40,-174) then put the GUN ADJUSTMENT CURSOR up to 95 px off in x (15% of the width) and 44 px in y (9%), and part of the right/bottom of the screen was unreachable (P1 aim 0.5,0.5 landed at 390,271). After calibrating both players at the five marks, the CURSOR is within 1.2 px in x and 2.0 px in y (0.42%) at 15 points per player (centre, 0.1/0.9 corners, 0.3,0.3, 0.7,0.7, 0.15,0.2, 0.85,0.8, the four edge midpoints, 0.02,0.02 and 0.98,0.98). In the game, P1 hit an enemy at the centre and bullet holes on the walls landed within 2.2 px in x and 2.9 px in y of the aim (P1 at 0.05,0.1 / 0.05,0.5 / 0.08,0.8 / 0.92,0.6 / 0.95,0.8 / 0.75,0.75; P2 at 0.05,0.1 / 0.05,0.5 / 0.08,0.75 / 0.92,0.6 / 0.15,0.9); off-screen + trigger reloads (P1 11 -> 30 rounds, P2 too). The calibration lives in eeprom.bin 0x1000-0x107f (copy at 0x1080; values at 0x1040/0x1058); patches/GSEVO/seed/eeprom.bin carries it into a fresh write layer (used only while the write layer has no eeprom.bin; checked 2026-10-22), and only that block differs from a fresh default. To recalibrate: the TEST key only quits the game; start the same program with -t (a user-layer patches/GSEVO/native.json, a full copy of this profile with "args": ["-t"]), SERVICE (F3) steps, TEST (key 0) selects; in GUN ADJUSTMENT SERVICE moves both players' arrows, the trigger takes the sample at the highlighted mark (marks at 16 px from the edges), the CURSOR line shows both cursors (P1 cyan, P2 red), TEST stores and exits. Start crashes: 1 of 4 starts (the first normal start right after a -t session) died at 24 s with lindbergh.so 'Skipping SEGFAULT' repeated; the next start worked.

