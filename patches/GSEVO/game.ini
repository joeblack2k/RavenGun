[Status]
Status = untested
Note = Nog nooit gestart. Lindbergh-route klaar (2026-10-14, docs/lindbergh.md): vsg heeft spel-ID 0x455edaec (DVP-0029A, herkend), Type 1-bord (837-13551, 8-bits assen). Op Mesa patcht de laag de ARB-shaders van de game. Deze map heet naar het TeknoParrot-sjabloon (GSEVO), de naam die de bibliotheek bij een dubbelklik stuurt. Bescherming (statisch onderzoek, BESCHERMING-STATUS.md): de oudere amDongle (Ver.0.12) in de ELF, zonder keychip-laag.
NoteEN = Never started. Lindbergh route ready (2026-10-14, docs/lindbergh.md): vsg has game ID 0x455edaec (DVP-0029A, recognised), Type 1 board (837-13551, 8-bit axes). On Mesa the layer patches the game's ARB shaders. This folder is named after the TeknoParrot template (GSEVO), the name the library sends on a double-click. Protection (static study, BESCHERMING-STATUS.md): the older amDongle (Ver.0.12) inside the ELF, no keychip layer.

[Input]
Route = jvs
Board = LindberghType1
Note = Lindbergh-route: lindbergh.so geeft de JVS-pakketten van het baseboard door aan de pty van de daemon (/dev/ttyRG0 in de sandbox); de daemon is het bord LindberghType1 uit packaging/jvs-boards.json.
