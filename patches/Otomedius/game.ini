[Game]
Name = Otomedius Excellent
Profile = Otomedius
Type = TeknoParrot
EmulationProfile = WartranTroopers
Executable = otomedius.exe
ProfileRevision = 1
Patreon = true

[Input]
Route = tp-shm
Layout = WartranTroopers
Note = geparkeerd: de game wacht op een ACIO-micom op COM2 (open-fout) en blijft op een wit scherm; zie games-status.md, tiende ronde

[Status]
Status = parked
Note = Wisselend, en dat is gemeten. Met volledige logboekuitvoer (WINEDEBUG=+file,err+all) verschijnt het spelproces pas rond 20 s en blijft het daarna leven; in een snelle run vertrekt het rond 2 tot 5 s met exitcode 0. Het merkteken dat het verschil maakt is of libacio.dll en libbms.dll geladen worden: in de gesloten-kern-run staan ze in het log, in de snelle run niet. Dat past bij de aantekening dat deze game naast ACIO op COM2 een BMS-service nodig heeft (de BMS-pipe en bms_GGG.exe), en de oorzaak is dus vermoedelijk geen exitcode maar een ontbrekende tweede proces. Daarnaast heeft het profiel de schakelaar General/DisableFileCheckSum: 22 van de 191 datapakken op de NAS wijken af (bewerkt of vertaald), wat een Conflict Hash geeft en een schone exit. Die schakelaar is bewust NIET aangezet -- dat is een beslissing van de eigenaar en niet iets wat deze repo zelf doet. Speelbaarheid is niet gemeten.
NoteEN = Does not start yet: white window; the game looks for an ACIO micom on COM2 ('COM Port 2 Open Error') and goes no further. Parked.
Findings = findings/Otomedius.md

