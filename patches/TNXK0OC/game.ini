; GEMETEN 2026-10-19: de game start en tekent op onze eigen lader en kern, maar meldt zelf "ERROR 3005
; AMLIB INITIALZE FAILED". De stand staat daarom op parked (zie [Status]).

[Game]
Name = Target Bravo: Operation G.H.O.S.T.
Profile = TNXK0OC
Type = TeknoParrot
; Een Sega-JVS-profiel als stand-in: dit is een Sega RingWide-titel met JVS (gs2.ini heeft EnableJvs=1),
; en TaitoTypeXGeneric hoorde hier niet. De titel zelf is niet geidentificeerd; SegaJvsGoldenGun is
; de dichtstbijzijnde Sega-JVS-indeling die we hebben.
EmulationProfile = SegaJvsGoldenGun
Executable = gs2.exe

[Launch]
Mode = direct
; De kast schrijft in zijn eigen map: mxGetHwInfo.exe -s mxRingwide.ini en gs2.exe lezen/schrijven
; gs2.ini. In de view waren dat koppelingen naar de NAS, dus alleen de schrijflaag van bwrap hield dat
; tegen. Deze twee bestanden zijn nu echte lokale kopieen (review 16, punt 2).
ViewCopies = gs2.ini, mxRingwide.ini
; De kast start eerst mxGetHwInfo.exe -s mxRingwide.ini (dat schrijft de hardwaregegevens) en daarna
; gs2.exe (zie game.bat). Die eerste stap hoort eenmalig per prefix, precies waar [Launch] PrefixSetup
; voor is.
View = auto
AmDaemon = true
; Recipe of Operation G.H.O.S.T. (patches/OG): this is the same game (see [Game]). The title scene plays a .wmv through
; DirectShow; without the 32-bit GStreamer quartz could not build the graph (E_OUTOFMEMORY) and the game used the NULL
; object it got back (access violation at gs2.exe 0x0052280C). Native XACT 3.3: Wine's xactengine3_3 crashed OG after
; the sound-check screen (docs/redist.md).
Gst32 = true
NativeDlls = xactengine3_3
Registry = data/wmv-asyncreader.reg

[Loader]
Core = ravengun

[AmDaemon]
; Platform id AAM = RingWide (mxRingwide.ini: RINGWIDE devices); game id = the name of SDDV_Table.dat in the game folder.
keychip.appboot.platformid = AAM
keychip.appboot.gameid = SDDV

[Display]
Gamescope = true
; The game draws 4:3 (measured: pillarboxed picture in the 1920x1080 gamescope output, shots-tnx 2026-10-21), like OG.
AimAspect = 4:3

[Input]
Route = jvs
Board = SegaGun2PScreenOut
ComPort = COM4
JvsTransport = pipe

; Gun calibration: the game keeps it in the EEPROM (record 'VDDS' at 0x1000 and its copy at 0x107c, CRC32 over 0x78 bytes).
; seed/mxeeprom.bin is the EEPROM after the game's own CONTROLLER ADJUSTMENT with our board mapping (2026-10-21), player 2
; set to the player-1 values (same board mapping). It is copied into the view only when the view has no mxeeprom.bin yet.
[Controls]
trigger = Shoot | Fires the gun (measured: ammo 24 -> 06 after six taps, it fires in bursts).
reload = Reload | Hold reload (the board's SCREEN OUT bit) and pull the trigger: the magazine refills (measured 06 -> 24).
offscreen = Reload off-screen | Aim away from the screen and pull the trigger: the same SCREEN OUT bit.
grenade = Action | ACTION in the game's input test; its use in a mission is not confirmed yet.

[Identify]
Folder = TNXK0O~C
Path = gs2.exe

[Status]
Status = playable
Note = GEMETEN 2026-10-19 (punt G): de game START en TEKENT op onze eigen lader en kern. gs2.exe is 32-bits; hij loopt via onze OpenParrot-lader met Core = ravengun in een view (de map van de exe is een echte map, de bestanden zijn koppelingen), Route = tp-shm met Layout = WartranTroopers. Het logboek zegt "Success! / Loading core... / Resolved target kernel32.dll procedure ... / Have fun :)" en de foto (docs/screenshots/tnxk0oc-amilb-error-2026-10-19.png) laat het eigen scherm van de game zien: "ERROR 3005 / AMLIB INITIALZE FAILED" (spelfout van de game zelf). Dus de start, de kern en het tekenen kloppen; de AM-bibliotheek van de kast (de RingWide I/O) kan zich niet opzetten. Wat de kast zelf doet (game.bat): eerst mxGetHwInfo.exe -s mxRingwide.ini en pas als dat lukt gs2.exe. Die eerste stap staat NIET in dit profiel (er is geen PrefixSetup-regel), want dat programma komt onder wine niet verder dan zijn eigen regel "mxgethwinfo Ver.1.13 Build:May 18 2012" en eindigt met status 1 -- het vraagt de echte RingWide-hardware. Daarom staat de stap nu uit en start gs2.exe direct: dat levert deze foto op. Twee dingen die daarbij gedaan zijn: de profielnaam is TNXK0OC geworden (de daemon staat alleen letters, cijfers, _ en - toe, en de map heet TNXK0O~C; [Identify] Folder verwijst nog naar de echte mapnaam) en mxRingwide.ini en gs2.ini staan als echte kopieen in de view, zodat de game daar niet op de NAS schrijft. Op de NAS is niets geschreven: met find op de NAS (0 nieuwe bestanden) EN in de schrijflaag van bwrap (geen nieuwe whiteouts, geen nieuwe bestanden) nagekeken. Volgende stap: uitzoeken wat AMLIB nodig heeft (welke bestanden of registers mxGetHwInfo normaal vult) en of dat na te bootsen is.
NoteEN = MEASURED 2026-10-21 14:20-14:35 (headless, claude-tnx). CALIBRATION: the factory values in CONTROLLER ADJUSTMENT (gs2.exe -testmode, service = F3, test = 0) are for the cabinet's 1024x600 gun: aiming at the picture centre gave ADJUSTED 523,213 in the game's 1024x768 space, i.e. about 15 px right and 240 px high on a 1080p screen. After the game's own procedure (aim at each green cross with ravengunctl test-pattern point and pull the trigger: TOP 38, LEFT 49, RIGHT 973, BOTTOM 429, CENTER 511,234, EXIT (WITH SAVE)) the CHECK marker lands within 1 px of the aim at the centre, (0.2,0.5), (0.8,0.5) and the four points (0.25/0.75, 0.15/0.85) (shots-tnx/k*.png); in a later normal run the mode select followed the aim (WAVE picked at 0.73,0.5). Seeded as seed/mxeeprom.bin. INPUT TEST: our reload bit is the board's SCREEN OUT (reload -> SCREEN OUT), grenade -> ACTION; CHANGE has no mapping. RELOAD in a mission: reload held + trigger refilled 06 -> 24; aiming at the screen edge (0.0) + trigger just fired (09 -> 06), because board SegaGun2P fed the SCREEN OUT bit from the reload button only. FIXED 2026-10-21 (claude-reload): Board = SegaGun2PScreenOut feeds that bit from the engine's offscreen signal (reload button OR aim off the screen). Measured headless (ravengunctl test-pattern point -0.2 0.5, an aim off the screen, + trigger): ammo 12 -> 24; reload button + trigger 18 -> 24 (~/.local/state/ravengun/shots-reload/tb-ammo.png, four ammo crops: after 4 shots, after off-screen + trigger, after 2 shots, after reload + trigger). ACTION in a mission: no visible effect in the Express mission. TEST in game: the game asks the AM daemon for mxmaster.foreground.next=3 (switch to the test-mode program) and exits (log 14:21:51); the test menu needs a start with -testmode. Earlier: MEASURED 2026-10-21 14:10-14:16 (headless gamescope, claude-tnx, ravengunctl game start TNXK0OC). TITLE: the game's own title screen reads 'TARGET_BRAVO / OPERATION G.H.O.S.T.' (c)SEGA, the export/Chinese build of Operation G.H.O.S.T. (patches/OG): same gs2.exe, og_* assets, en/zh locale, game id SDDV instead of SBWA. CRASH FIXED: the title scene plays scene/title/og_title_movie_en.wmv through DirectShow; without the 32-bit GStreamer quartz failed to build the graph (E_OUTOFMEMORY) and the game used the NULL object it got back (AddRef at gs2.exe 0x0052280C). The OG recipe fixes it: [Launch] Gst32 = true, NativeDlls = xactengine3_3, Registry = data/wmv-asyncreader.reg. Measured: Now Initializing 17..19/20, SOUND ADJUSTMENTS, the TARGET_BRAVO title, RANKING and DEMO PLAY attract with '1 CREDIT(S) TO CONTINUE / CREDIT(S) 0' (~/.local/state/ravengun/shots-tnx/b-*.png), gs2.exe alive 5 min 38 s without a crash, game and explorer map winex11.so (inside gamescope). INPUTS: two coin taps -> CREDIT(S) 2; Start -> SELECT A MODE, then SELECT A MISSION and the Express (train) mission; trigger fires (ammo 24 -> 06 after six taps, c/q-*.png). NOT measured: aim (the game draws no crosshair; aiming at a target was not verified), reload, the PS Move on the TV. Earlier notes: MEASURED 2026-10-20 (second pass): the address-space theory is NOT confirmed. [Env] WINE_LARGE_ADDRESS_AWARE = 1 (verified present in the plan) gives the identical ACCESS_VIOLATION at gs2.exe 0x0052280C (the game's 'Memory: now' went 3368 -> 3690 MB, avail 1016 -> 693 MB, sum constant 4384 MB, so the counter is total minus available). With [Launch] Dxvk = true instead of wined3d the game does not get past a white 4:3 window (its log stays empty, gs2.exe at ~60 % CPU for 1 min). WINEDEBUG=err+all,+loaddll: quartz 'Failed to create filter' for Wave Parser, MPEG-I Stream Splitter, GStreamer splitter and AVI Splitter, all hr 0x8007000E, with quartz.dll and devenum.dll loaded builtin; the crashing code gets its NULL COM pointer from a factory call at 0x516DF0 (called via 0x52D97F), not from XAudio2 (which works). So the NULL object follows the failing DirectShow autoplug of a video/audio file at the title scene; next step: find which file the title scene renders (scene/title/main.lua) and what E_OUTOFMEMORY comes from. Earlier notes: MEASURED 2026-10-20 (headless gamescope, plain Wine, wined3d, three runs): the game now runs far past the AM library. Screens seen: 'WARNING NO LED BOARD 2 / Now Initializing... 18/20', then '1 CREDIT(S) TO CONTINUE / CREDIT(S) 0', then it loads scene/title/main.lua and within about 40 s of start shows a Windows-style error box 'EXCEPTION_ACCESS_VIOLATION' at gs2.exe 0x0052280C (EAX=0: AddRef through a NULL COM pointer, in a sound-slot table function at 0x5226A0 called from 0x533D60), identical with the null sink and with the real HDMI sink (so not the sink). A WINEDEBUG trace of the same run shows XAudio2 2.3 (FAudio) working (mastering voice created) but DirectShow failing: 'err:quartz:autoplug Failed to create filter for Wave Parser, hr 0x8007000e' plus seven fixme:ole:CoCreateInstanceEx failures with hr 0x8007000e (E_OUTOFMEMORY); the game itself logs 'Memory: now=3368MB limit=3525MB avail=1016MB' just before, gs2.exe is not large-address-aware, VmPeak of the process 3.8 GB. Working theory (not proven): the 32-bit address space is exhausted at the title scene. rg-amhw.dll: mxsram/SMBus/mxjvs initialise and answer (JVS packets answered, no ERROR 3005). Not reached: attract, coin/Start, trigger. Next step: find what the 32-bit process maps (VmPeak 3.8 GB with a non-LAA exe) and the NULL pointer's origin at 0x5226A0; check whether the missing ./Sound/Sound.lua (file error 2) matters. Earlier notes: MEASURED 2026-10-20 (headless gamescope, plain Wine): with the RingWide recipe of Dream Raiders / Operation G.H.O.S.T. (AmDaemon, [AmDaemon] platformid AAM + gameid SDDV, dropin/rg-amhw.dll, Input jvs + SegaGun2P) the AM library initialises: rg-amhw opens mxsram, the SMBus EEPROM, columba (DMI) and mxsuperio, and gs2.exe talks JVS over the pipe (6 packets, the board answers; ERROR 3005 does not appear any more). With wined3d the game dies with an access violation after 'Failed to get a GL context for adapter' (ERROR 0009 in its dump.dmp), because the headless gamescope Xwayland has no GL; with [Launch] Dxvk = true (user layer, this test only) it creates a fullscreen 1024x768 Direct3D 9 device and then waits. NOT measured: any picture (headless gamescope gives no screenshot for a Wine/DXVK game), so the attract mode is unconfirmed; Status stays parked. Earlier notes: MEASURED 2026-10-19 (item G): the game STARTS and DRAWS on our own loader/core. gs2.exe is 32-bit; it runs through our OpenParrot loader with Core = ravengun in a view (the exe's directory is a real directory, the files are links), Route = tp-shm with Layout = WartranTroopers. The log says "Success! / Loading core... / Resolved target kernel32.dll procedure ... / Have fun :)" and the screenshot (docs/screenshots/tnxk0oc-amilb-error-2026-10-19.png) shows the game's own screen: "ERROR 3005 / AMLIB INITIALZE FAILED" (the game's own typo). So the start, the core and the rendering are fine; the cabinet's AM library (the RingWide I/O) cannot set itself up. What the cabinet itself does (game.bat): first mxGetHwInfo.exe -s mxRingwide.ini and only if that succeeds gs2.exe. That first step is NOT in this profile (there is no PrefixSetup line), because under wine that program goes no further than its own line "mxgethwinfo Ver.1.13 Build:May 18 2012" and exits with status 1 -- it wants the real RingWide hardware. That is why the step is now off and gs2.exe starts directly: which gives this screenshot. Two other things done: the profile name became TNXK0OC (the daemon only allows letters, digits, _ and -, and the folder is named TNXK0O~C; [Identify] Folder still points at the real folder name) and mxRingwide.ini and gs2.ini are real copies in the view so the game does not write to the NAS there. Nothing was written to the NAS: checked with find on the NAS (0 new files) AND in the bwrap writelayer (no new whiteouts, no new files). Next step: find out what AMLIB needs (which files or registers mxGetHwInfo normally fills) and whether that can be imitated.
