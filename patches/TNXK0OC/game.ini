Note = GEMETEN 2026-10-19 (punt G): de game START en TEKENT op onze eigen lader en kern. gs2.exe is 32-bits; hij loopt via onze OpenParrot-lader met Core = ravengun in een view (de map van de exe is een echte map, de bestanden zijn koppelingen), Route = tp-shm met Layout = WartranTroopers. Het logboek zegt "Success! / Loading core... / Resolved target kernel32.dll procedure ... / Have fun :)" en de foto (docs/screenshots/tnxk0oc-amilb-error-2026-10-19.png) laat het eigen scherm van de game zien: "ERROR 3005 / AMLIB INITIALZE FAILED" (spelfout van de game zelf). Dus de start, de kern en het tekenen kloppen; de AM-bibliotheek van de kast (de RingWide I/O) kan zich niet opzetten. Wat de kast zelf doet (game.bat): eerst mxGetHwInfo.exe -s mxRingwide.ini en pas als dat lukt gs2.exe. Die eerste stap staat in dit profiel als [Launch] PrefixSetup, maar dat programma komt onder wine niet verder dan zijn eigen regel "mxgethwinfo Ver.1.13 Build:May 18 2012" en eindigt met status 1 -- het vraagt de echte RingWide-hardware. Daarom staat de stap nu uit en start gs2.exe direct: dat levert deze foto op. Twee dingen die ik ook gedaan heb: de profielnaam is TNXK0OC geworden (de daemon staat alleen letters, cijfers, _ en - toe, en de map heet TNXK0O~C; [Identify] Folder verwijst nog naar de echte mapnaam) en mxRingwide.ini en gs2.ini staan als echte kopieen in de view, zodat de game daar niet op de NAS schrijft. Op de NAS is niets geschreven (met find gecontroleerd). Volgende stap: uitzoeken wat AMLIB nodig heeft (welke bestanden of registers mxGetHwInfo normaal vult) en of dat na te bootsen is.
NoteEN = MEASURED 2026-10-19 (item G): the game STARTS and DRAWS on our own loader/core. gs2.exe is 32-bit; it runs through our OpenParrot loader with Core = ravengun in a view (the exe's directory is a real directory, the files are links), Route = tp-shm with Layout = WartranTroopers. The log says "Success! / Loading core... / Resolved target kernel32.dll procedure ... / Have fun :)" and the screenshot (docs/screenshots/tnxk0oc-amilb-error-2026-10-19.png) shows the game's own screen: "ERROR 3005 / AMLIB INITIALZE FAILED" (the game's own typo). So the start, the core and the rendering are fine; the cabinet's AM library (the RingWide I/O) cannot set itself up. What the cabinet itself does (game.bat): first mxGetHwInfo.exe -s mxRingwide.ini and only if that succeeds gs2.exe. That first step is in this profile as [Launch] PrefixSetup, but under wine that program goes no further than its own line "mxgethwinfo Ver.1.13 Build:May 18 2012" and exits with status 1 -- it wants the real RingWide hardware. That is why the step is now off and gs2.exe starts directly: which gives this screenshot. Two other things done: the profile name became TNXK0OC (the daemon only allows letters, digits, _ and -, and the folder is named TNXK0O~C; [Identify] Folder still points at the real folder name) and mxRingwide.ini and gs2.ini are real copies in the view so the game does not write to the NAS there. Nothing was written to the NAS (checked with find). Next step: find out what AMLIB needs (which files or registers mxGetHwInfo normally fills) and whether that can be imitated.
