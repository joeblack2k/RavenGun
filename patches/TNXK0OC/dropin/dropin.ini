;
; Drop-in for TNXK0O~C (Sega RingWide, gs2.exe, AM library 2012-09-04): the cabinet devices of a Sega Ring cabinet
; (\\.\columba = DMI, \\.\mxsram = backup SRAM, \\.\mxjvs = JVS). Same recipe as Dream Raiders / Operation G.H.O.S.T.
; rg-amhw.dll: tools/rg-amhw/rg_amhw.cpp, build with tools/dev/build-amhw.sh.

[rg-amhw.dll]
To = .
Preload = true
Audit = false
Env = RG_AMHW_OEM=AAM;RG_AMHW_VENDOR=Supermicro;RG_AMHW_DIPIN=FE,FF;RG_AMHW_REGION=4;RG_AMHW_SRAMSEED=0+1000:200;RG_AMHW_NOREPARSE=1
