; Kopieer dit bestand naar patches/<JouwGame>/patches.ini en haal het commentaarteken weg bij wat je
; nodig hebt. Een patch zonder Enabled = true is uit.
;
; Een gedeelde patch staat één keer in _defaults/<Type>.patches.ini; in de map van de game zet je dan
; alleen de sectienaam plus Enabled = true.
;
; De motor is scripts/patchfile.py (loader-repo). `python3 scripts/patchfile.py --game <Game>
; --game-exe <exe> --take-over-core` laat zien wat hij met jouw patches doet, zonder iets te schrijven.
; `tools/verify-all.py` doet dat voor alle games tegelijk.

; --- Soort 1: zoeken en vervangen in een BESTAND (de directe start past dit toe) --------------
; Target is de lader, de kern of de game zelf. Find moet precies Count keer voorkomen, anders weigert
; de launcher en start de game niet (dat is de versiecontrole). Er wordt op een lokale kopie gepatcht;
; de NAS wordt nooit aangeraakt.
;
; [Patch: <wat het doet>]
; Enabled = true
; Kind = file
; Category = loader
; Target = loader
; TargetName = OpenParrotLoader.exe
; Find = C7 05 C0 9B 42 00 1F 00 01 00
; Replace = C7 05 C0 9B 42 00 17 00 01 00
; Count = 1
; Source = <waar de kennis vandaan komt, bv. de openbare OpenParrot-bron>
; Reason = <waarom dit nodig is, in het Nederlands>

; --- Soort 2: een adres in het proces (documentatie; de directe start past dit NIET toe) ------
; De motor kent deze soort, maar de directe start slaat hem over met de melding "soort memory wordt
; niet door RavenGun toegepast". Hij staat er dus als *beschrijving* van wat de kern zelf doet, met
; AppliedBy = core en Enabled = false. Wie de taak van de kern overneemt, zet Enabled = true en
; draait de motor met --take-over-core.
;
; Verplicht bij deze soort:
;   Module   de hoofdmodule van de game (game.exe), niet een DLL die later geladen wordt
;   Offset   ten opzichte van de imagebase
;   Action   nop | jmp-returns-true | replace-bytes | write-bytes
;   Size     verplicht bij nop en bij jmp-returns-true; die laatste heeft minstens 6 bytes nodig
;            (hij zet `mov eax,1 ; ret` en vult de rest met 0x90)
;   Replace  verplicht bij replace-bytes en write-bytes
;   Find     optioneel maar sterk aangeraden: de originele bytes op die plek, precies Size bytes.
;            Zonder Find meldt de motor "geen Find, dus niet te controleren" -- hij kan dan niet zien
;            of je de juiste spelversie hebt. Meet ze op de echte exe en zet ze er letterlijk in.
;
; [Patch: <wat het doet> (<offset>)]
; Enabled = false
; Kind = memory
; Category = input
; AppliedBy = core
; Module = game.exe
; Offset = 0x113E80
; Action = jmp-returns-true
; Size = 6
; Find = 51 83 3D 18 B8 F3
; Version = <het profiel of de spelversie waar dit bij hoort, als die er is>
; Note = <bijzonderheden, bv. "deze byte staat in onze dump al op 0x90">
; Source = OpenParrot TypeX2Generic.cpp (GPL-3.0), regel 2239
; Reason = <waarom>

; --- Category ---------------------------------------------------------------------------------
; Precies één per patch, uit deze vaste lijst (scripts/gamesettings.py, PATCH_CATEGORIES):
;   graphics, input, timing, audio, paths, crash, network, loader,
;   dongle, region, keychip, integrity, activation
; Een onbekende of ontbrekende Category wijst de lezer af, en een afgewezen patch die aan staat laat
; de start weigeren (exitcode 5) in plaats van de game stilzwijgend zonder die patch te starten.
