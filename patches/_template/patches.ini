; Kopieer dit bestand naar patches/<JouwGame>/patches.ini.
; Een patch zonder Enabled = true is uit. Een gedeelde patch staat één keer in
; _defaults/<Type>.patches.ini en zet je hier alleen aan met de sectienaam plus Enabled = true.

; --- Soort 1: zoeken en vervangen in een BESTAND (werkt vandaag) -----------------------------
; Target mag de lader of de kern zijn. Find moet precies Count keer voorkomen, anders weigert de
; launcher en start de game niet. Er wordt op een lokale kopie gepatcht; de NAS wordt nooit aangeraakt.
;
; [Patch: <wat het doet>]
; Enabled = true
; Kind = file
; Category = loader
; Target = loader
; TargetName = OpenParrotLoader.exe
; Find = C7 05 C0 9B 42 00 1F 00 01 00
; Replace = C7 05 C0 9B 42 00 17 00 01 00
; Count = 1
; Source = <waar de kennis vandaan komt, bv. de openbare OpenParrot-bron>
; Reason = <waarom dit nodig is, in het Nederlands>

; --- Soort 2: een adres in het proces (WORDT NOG NIET TOEGEPAST) ------------------------------
; Deze soort staat hier zodat je hem kunt opschrijven, maar de motor die hem uitvoert bestaat nog
; niet: de launcher slaat hem over met de melding "soort memory wordt niet door RavenGun toegepast".
; Zie docs/community-model.md, punt 1 tot 3.
;
; [Patch: <wat het doet>]
; Enabled = true
; Kind = memory
; Category = input
; AppliedBy = core
; Module = game.exe
; Offset = 0x113E80
; Action = jmp-returns-true
; Source = OpenParrot TypeX2Generic.cpp (GPL-3.0), regel 2239
; Reason = <waarom>
