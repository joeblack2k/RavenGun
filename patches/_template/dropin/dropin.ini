;
; Bestanden in deze map worden LETTERLIJK in de view van de game gezet.
; Een drop-in toevoegen is een bestand hier neerzetten plus een sectie hieronder. Geen codewijziging.
;
; LET OP, dit is de fout die het vaakst misgaat: ELK BESTAND DAT DE GAME NODIG HEEFT MOET EEN EIGEN
; SECTIE HEBBEN. Een bestand dat wel in deze map staat maar geen sectie heeft, wordt NIET
; gekopieerd -- ook een gegevensbestand in een submap niet. De sectienaam is de bestandsnaam
; (met het pad erin, als het in een submap staat) en `To` is de doelmap.
;
; Sleutels per sectie:
;   To           doelmap, relatief aan de view van de game ("." = de map van de exe)
;   DllOverride  native -> <naam>=n ; builtin,native -> <naam>=n,b  (gaat in WINEDLLOVERRIDES)
;   Env          extra omgevingsvariabelen, puntkomma-gescheiden
;   Preload      true -> dit bestand moet in het proces van de game geladen worden
;   Audit        false -> NIET in LD_AUDIT van de Wine-start (standaard true)
;
; Over Preload: de launcher zet het pad NIET in LD_PRELOAD van de start. Voor een Linux-ELF onder
; Wine (de ElfLdr2-games) gaat het naar LD_AUDIT -- LD_PRELOAD is daar fataal, want BudgieLoader is
; een Cygwin-programma dat eraan sterft (gemeten). Voor een echte native start gaat het wel naar
; LD_PRELOAD.
;
; Over Audit: LD_AUDIT laadt de bibliotheek in het proces van de Cygwin-lader, en dat is precies het
; verkeerde proces voor een dongle- of hookbibliotheek: die hoort in het spelproces. Zet dan
; `Audit = false`; het pad blijft in RG_DROPIN_PRELOAD staan voor de native route en voor een eigen
; lader, maar het bestand wordt niet in de lader geladen. Gemeten: een inline-hook in LD_AUDIT laat
; de Cygwin-lader sterven (exitcode 1) of de game een SIGSEGV geven.
;
; Voorbeelden -- haal het commentaarteken weg en vul je eigen namen in:

; [mijnbibliotheek.dll]
; To = .
; DllOverride = native
; Env = RAVENGUN_MIJN_GAME=<JouwGame>

; [libmijnfix.so]
; To = .
; Preload = true
; Env = RAVENGUN_MIJN_GAME=<JouwGame>

; [libmijnhook-x64.so]
; To = .
; Preload = true
; Audit = false
; Env = RAVENGUN_MIJN_GAME=<JouwGame>

; Een dongle is geen loaderbegrip: het is een gewone drop-in met zijn eigen gegevens ernaast, die de
; bibliotheek zelf leest. Er is geen [Dongle]-sectie in game.ini en die komt er ook niet.
; Zo ziet de gegevenskant eruit:

[ravengun-hasp/JouwGame/dongle.json]
To = .

[ravengun-hasp/JouwGame/memory/00000000000000001111111111110100]
To = .
