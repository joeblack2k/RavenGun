; Bestanden in deze map worden LETTERLIJK in de view van de game gezet.
; Een drop-in toevoegen is een bestand hier neerzetten plus één sectie hieronder. Geen codewijziging.
;
; Sleutels:
;   To           doelmap, relatief aan de view van de game (". " = de hoofdmap van de game)
;   DllOverride  native -> <naam>=n ; builtin,native -> <naam>=n,b  (gaat in WINEDLLOVERRIDES)
;   Env          extra omgevingsvariabelen, puntkomma-gescheiden
;   Preload      true -> dit bestand via LD_PRELOAD laden (Linux-games)
;
; [mijnbibliotheek.dll]
; To = .
; DllOverride = native
; Env = RAVENGUN_MIJN_GAME=<JouwGame>
;
; [libmijnfix.so]
; To = .
; Preload = true
; Env = RAVENGUN_MIJN_GAME=<JouwGame>
