; Kopieer dit bestand naar patches/<JouwGame>/game.ini en vul het in.
; Zie docs/per-game-patches.md voor alle sleutels en _defaults/<Type>.ini voor de standaard van dit soort.

[Game]
Name = <de naam zoals de app hem toont>
Profile = <JouwGame>
Type = TeknoParrot
EmulationProfile = <het profiel uit GameProfiles/<JouwGame>.xml>
Executable = <game.exe>
Is64Bit = true
ProfileRevision = <het revisienummer van het profiel>

[Status]
Status = parked
Note = <wat er wel en niet werkt, in het Nederlands>
NoteEN = <hetzelfde in het Engels>
Findings = findings/<JouwGame>.md

; [Dongle] laat je weg tenzij de eigenaar de dongle moet aanzetten. De SOORT dongle staat in
; dongle.json, niet hier. Zie docs/dropins.md.
;
; [Dongle]
; Enabled = true
; Source = drop-in

; Het profiel uit TeknoParrot-sjabloon GameProfiles/<JouwGame>.xml. Opnieuw importeren met
; scripts/import-tp-profiles.py in plaats van met de hand wijzigen.
[Identify]
Path = <game.exe>
Size = <grootte in bytes>
Sha256 = <sha256 van de exe, als je die hebt>

[Config]
General/Input API = RawInput
General/HideCursor = 1
General/Windowed = 1
General/Use Relative Input = 0
General/Player 1 Relative Sensitivity = 8
General/Player 2 Relative Sensitivity = 8
