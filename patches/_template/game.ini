; Kopieer dit bestand naar patches/<JouwGame>/game.ini en vul het in.
; Zie docs/per-game-patches.md (loader-repo) voor alle sleutels en _defaults/<Type>.ini voor de
; standaard van dit soort.
;
; LET OP: er is GEEN [Dongle]-sectie en die komt er ook niet. Een software-dongle is een gewone
; drop-in in patches/<JouwGame>/dropin/, met zijn gegevens in dongle.json ernaast. De loader weet
; niets van dongles. Zie docs/geen-dongle-in-de-loader.md.

[Game]
Name = <de naam zoals de app hem toont>
Profile = <JouwGame>
Type = TeknoParrot
EmulationProfile = <het profiel uit GameProfiles/<JouwGame>.xml>
Executable = <game.exe>
Is64Bit = true
ProfileRevision = <het revisienummer van het profiel>
; ExeSha256 = <sha256 van de exe>   ; optioneel: de launcher weigert dan een andere spelversie

[Status]
Status = parked
Note = <wat er wel en niet werkt, in het Nederlands>
NoteEN = <hetzelfde in het Engels>
Findings = findings/<JouwGame>.md


; Het profiel uit TeknoParrot-sjabloon GameProfiles/<JouwGame>.xml. Opnieuw importeren met
; scripts/import-tp-profiles.py in plaats van met de hand wijzigen.
[Identify]
Path = <game.exe>
Size = <grootte in bytes>
Sha256 = <sha256 van de exe, als je die hebt>

[Config]
General/Input API = RawInput
General/HideCursor = 1
General/Windowed = 1
General/Use Relative Input = 0
General/Player 1 Relative Sensitivity = 8
General/Player 2 Relative Sensitivity = 8

; Alleen voor de Sega-games met een regio/printplaat-dongle (LGI, LGI3D, LGS, OG): dit zijn gewone
; profielinstellingen uit de keuzelijst van dat profiel, geen patch. De waarde hoort bij de
; donglebeschrijving in dropin/ravengun-hasp/<JouwGame>/dongle.json (soort region, met `enforced`
; en `enforced_basis`). Laat ze weg als het profiel deze optie niet heeft: een waarde die niet in de
; keuzelijst staat laat de start weigeren.
;
; General/DongleRegion = JAPAN
; General/PcbRegion = JAPAN
;
; [ConfigType]
; General/DongleRegion = Dropdown
; General/PcbRegion = Dropdown
;
; [ConfigOptions]
; General/DongleRegion = JAPAN|USA|JAP2N|EXPORT|CHINA
; General/PcbRegion = JAPAN|USA|JAP2N|EXPORT|CHINA

; Andere groepen sleutels die de launcher kent (zie docs/per-game-patches.md voor de volledige
; tabel): [Loader] (Build, Gamescope), [Wine] (Prefix), [Display] (DisplayMode, Resolution),
; [Launch] (WorkingDirectory, Arguments), [Input] (Jvs*, Route), [Env] (vrije variabelen, als laatste
; toegepast) en [Bindings] (de knoppen van deze game voor tp-add-game).
