# RavenGun — adreslijst voor de generieke HASP-inline-hook, game: Ghostbusters
#
# De HASP-HL-cliënt zit statisch en gestript in `game`. Anker: het programma `patch` uit de map van Aliens Armageddon (dezelfde
# Play Mechanix-engine, 20 hasp_-symbolen). GEMETEN 2026-10-15 met patches/AliensArmageddon/find-hasp-adressen.py: elke functie
# die de hook gebruikt heeft precies EEN treffer in deze game, alle met dezelfde verschuiving t.o.v. het anker (+0x1c53a0);
# hasp_free volgt uit die verschuiving (een van de treffers). `grootte` en `ingang` zijn de versiecontrole.
game    = GhostBusters
arch    = i386
basis   = absoluut
grootte = 11057832
ingang  = 0x804f960
hasp_decrypt         = 0x083e2868
hasp_encrypt         = 0x083e277c
hasp_get_sessioninfo = 0x083e3170
hasp_get_size        = 0x083e3580
hasp_login           = 0x083e25f0
hasp_logout          = 0x083e2690
hasp_read            = 0x083e33e8
hasp_write           = 0x083e34b4
hasp_free            = 0x083e2eac
