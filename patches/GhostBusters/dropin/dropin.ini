;
; dropin.ini - wat er in de view van GhostBusters komt.
; Contract: docs/dropins.md. De motor rekent dest = view + To + sectienaam.
;
; DE MAP pm IS GEEN DROP-IN.
; De lader van TeknoParrot (ElfLdr2/BudgieLoader) eist dat ALLE bestanden van deze game in een map
; met de naam "pm" staan, en dat het pad naar de game-elf daarbinnen wijst. Gemeten op de Deck:
;
;   game exe    : Z:/.../views/GhostBusters/game
;   game path   : Z:/.../views/GhostBusters
;   Detected Linux game: Ghostbusters (1.17 US)
;   GAME PATH CHECK FAILED!... path=Z:/.../views/GhostBusters        <- de padcontrole kijkt naar de
;                                                                      MAP van de elf, niet naar de elf
; en met de elf in pm/:
;   game exe    : Z:/.../views/GhostBusters/pm/game
;   game path   : Z:/.../views/GhostBusters/pm
;   (geen GAME PATH CHECK FAILED; de lader loopt door tot "Starting Game")
;
; De map pm is de installatiewortel van de game zelf (Play Mechanix): de game opent absolute paden
; als /pm/g6/ghostb/data, /pm/g6/ghostb/efilemaps, /pm/game en /pm/utils/reset_usb_bus.sh, en het
; eigen script utils/check_usb_drivers.sh noemt /pm/utils/splash/. De dump op de NAS heeft die
; bestanden in de wortel van GhostBusters/ (game, g6/, utils/) - samen 2,7 GB.
;
; Daarom staat hier GEEN sectie per bestand: de inhoud van pm is de dump van de eigenaar zelf, en
; die hoort niet in deze repo (docs/dropins.md: dropin/ is wat wij zelf bouwen; en een drop-in kan
; geen symbolische koppeling maken, alleen bestanden kopieren). De map pm komt uit de VIEW:
;
;   python3 scripts/tp-add-game.py GhostBusters "<pad naar GhostBusters/game>" --view
;   V=~/.local/share/ravengun/runtime/views/GhostBusters
;   G="<pad naar de GhostBusters-map>"
;   mkdir -p "$V/pm"
;   ln -sfn "$G/game" "$V/pm/game"; ln -sfn "$G/g6" "$V/pm/g6"; ln -sfn "$G/utils" "$V/pm/utils"
;   (een echte map in de view met koppelingen naar de gamebestanden, zodat de launcher zijn eigen
;    teknoparrot.ini in pm kan schrijven; de NAS is alleen-lezen)
;
; Zie patches/GhostBusters/README.md voor de volledige meting en het recept.
;
; ZODRA WIJ EEN EIGEN BESTAND VOOR DEZE GAME HEBBEN (bijvoorbeeld een HASP-laag als de dongle toch
; nodig blijkt, of een GL-fix), komt het hieronder met het pm-voorvoegsel, zodat het in de map van de
; game zelf landt. De vorm is dan:
;
;   [pm/ravengun-voorbeeld.so]
;   To = .
;   Preload = true
;   Env = RAVENGUN_VOORBEELD_GAME=GhostBusters
;
; (To = . en het pad in de sectienaam: het pad staat maar een keer in het bestand.)

; ---------------------------------------------------------------------------------------------------
; Native route (2026-10-15): rg-elfloader, packaging/native-games.json, profiel GhostBusters. De game staat daar op /pm
; (overlay van de NAS-map), dus de pm-eis hierboven speelt daar niet. Deze bestanden neemt de native route zelf mee.
[libravengun-hasphook.so]
To = .
Preload = true
Audit = false
Env = RAVENGUN_HASP_DIR=ravengun-hasp;RAVENGUN_HASP_GAME=GhostBusters;RAVENGUN_HASP_ELF_LIB=./ravengun-hasp.so;RAVENGUN_HASP_ELF_ADRESLIJST=hasp-haken.ini;RAVENGUN_HASP_VERBOSE=1

[ravengun-hasp.so]
To = .

[hasp-haken.ini]
To = .

[ravengun-hasp/GhostBusters/dongle.json]
To = .
