; Ghostbusters (Raw Thrills / Play Mechanix), native route on our own loader. The route itself is described in native.json.

[Input]
; tp-shm: the daemon writes the board image (layout RawThrillsGUN); the RIO bridge (rio-invoer.ini) answers from it as the
; lightgun board over USB.
Route = tp-shm
Layout = RawThrillsGUN

[Controls]
trigger = Shoot | Fires the proton beam (hold it to keep the beam on). Start also starts a game.

[Status]
Status = untested
Note = Untested with the PS Move. On the bench (synthetic aim): starts straight to attract in free play, trigger fires the beam, aim follows, 6 min without a crash. Cross/reload do nothing (no such switch). See NoteEN.
NoteEN = UNTESTED with the PS Move: it stays untested until the owner has played it with the Move. Measured on the headless bench on 2026-10-20 with a mouse source and synthetic aim (ravengunctl test-pattern), not with the Move: 3 clean starts straight to attract (FREEPLAY, no gun calibration screen, no money screen: the game's free play setting and both mounted-gun calibrations are seeded from patches/GhostBusters/data into the write layer), "Press ANY BUTTON" (trigger or Start) starts a game, the trigger fires the proton beam and scores, and the beam and the game's calibration reticle follow the aim at the top-left and top-right (X and Y both inverted on the RIO channels, see rio-invoer.ini); 6 minutes of play without a crash. Switch ids were read from the game's own Switch Tests screen: Test 3, Service 4, Vol+/- 5/6, coins 0/1/18/2, gun 1 trigger 12/13, gun 2 trigger 15/17; there is no Start, grenade or reload switch, so Cross and reload do nothing. Not measured: player 2 in play, rumble (the game writes nothing to the board while firing; the engine's trigger-driven Move rumble applies).
