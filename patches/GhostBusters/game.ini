; Gegenereerd door scripts/migrate-game-settings.py (docs/per-game-patches.md). Sleutels die het script afleidt uit de oude bronnen worden bij
; elke run opnieuw gezet; handwerk in andere sleutels blijft staan.
;
; Uit het oude UserProfiles/GhostBusters.env:
; door tp-add-game.py; zie packaging/games-status.md
;
; Het pad naar de game-elf staat sinds deze ronde op pm/game: de ElfLdr2-lader eist dat alle
; bestanden van deze game in een map met de naam pm staan (gemeten; zie README.md en
; dropin/dropin.ini). De view moet die map leveren.

[Game]
Name = Ghostbusters
Profile = GhostBusters
Type = ElfLdr2
EmulationProfile = RawThrillsGUN
Executable = game
ProfileRevision = 7

[Display]
Gamescope = true
GamescopePath = /usr/bin/gamescope

; Klasse (statische meting 2026-10-12, zie patches/ELF-LADER-SPEC.md): ONGEPAKT -- volledige
; importtopologie, nul 0xdeadbeef-stubs. Met LD_LIBRARY_PATH=<ElfLdr2/libs> mist hij nog
; libglut.so.3, libesd.so.0 en /usr/lib/libcsv.so (een absoluut DT_NEEDED-pad, waar
; LD_LIBRARY_PATH niet bij helpt).

[Input]
Route = tp-shm
Layout = RawThrillsGUN
Note = native route: de RIO-brug (librg_rio_bridge.so, 32-bits, rio-invoer.ini, zonder versleuteling) antwoordt als het lightgun-bord over USB; tabel en haken overgenomen van Aliens Armageddon (zelfde bordbibliotheek, verschuiving -0x5F0C0, gemeten 2026-10-15)

[Status]
Status = parked
Note = Op onze eigen lader (rg-elfloader, eigen HASP-haak, RIO-brug) bereikt de game op 2026-10-18 de attract: TEST slaat beide geweerkalibraties over, daarna "HOUSE CREEPING" en meer dan 9 minuten zonder crash (screenshots). De padcontrole van de ElfLdr2-lader is opgelost met de pm-map. De HASP-antwoorden die de databestanden ontsleutelen staan alleen in de gebruikerslaag van de eigenaar; een schone installatie heeft ze niet en stopt dan op de RTDT-defs. Er wordt geen TeknoParrot-bibliotheek of -kern geladen.
NoteEN = On our own loader (rg-elfloader, own HASP hook, RIO bridge) the game reaches attract on 2026-10-18: TEST skips both gun calibrations, then "HOUSE CREEPING" and more than 9 minutes without a crash (screenshots). The ElfLdr2 path check is solved with the pm folder. The HASP responses that decrypt the data files exist only in the owner's user layer; a clean install does not have them and stops at the RTDT defs. No TeknoParrot library or core is loaded.
Findings = findings/GhostBusters.md

