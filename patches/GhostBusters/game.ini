; Gegenereerd door scripts/migrate-game-settings.py (docs/per-game-patches.md). Sleutels die het script afleidt uit de oude bronnen worden bij
; elke run opnieuw gezet; handwerk in andere sleutels blijft staan.
;
; Uit het oude UserProfiles/GhostBusters.env:
; door tp-add-game.py; zie packaging/games-status.md
;
; Het pad naar de game-elf staat sinds deze ronde op pm/game: de ElfLdr2-lader eist dat alle
; bestanden van deze game in een map met de naam pm staan (gemeten; zie README.md en
; dropin/dropin.ini). De view moet die map leveren.

[Game]
Name = Ghostbusters
Profile = GhostBusters
Type = ElfLdr2
EmulationProfile = RawThrillsGUN
Executable = game
ProfileRevision = 7

[Display]
Gamescope = true
GamescopePath = /usr/bin/gamescope

; Klasse (statische meting 2026-10-12, zie patches/ELF-LADER-SPEC.md): ONGEPAKT -- volledige
; importtopologie, nul 0xdeadbeef-stubs. Met LD_LIBRARY_PATH=<ElfLdr2/libs> mist hij nog
; libglut.so.3, libesd.so.0 en /usr/lib/libcsv.so (een absoluut DT_NEEDED-pad, waar
; LD_LIBRARY_PATH niet bij helpt).

[Input]
Route = tp-shm
Layout = RawThrillsGUN
Note = native route: de RIO-brug (librg_rio_bridge.so, 32-bits, rio-invoer.ini, zonder versleuteling) antwoordt als het lightgun-bord over USB; tabel en haken overgenomen van Aliens Armageddon (zelfde bordbibliotheek, verschuiving -0x5F0C0, gemeten 2026-10-15)

[Status]
Status = parked
Note = De padcontrole van de ElfLdr2-lader is opgelost. De lader eist dat alle bestanden van deze game in een map met de naam pm staan (de installatiewortel van Play Mechanix) en dat het pad naar de elf daarbinnen wijst; met [Identify] Path = pm/game en een view-map views/GhostBusters/pm met koppelingen naar de gamebestanden loopt hij door tot "Starting Game". Daarna komt de game nog niet in beeld; wat er dan blokkeert (dongle, OpenGL-context) is niet gemeten. De pm-map zelf is geen drop-in: de inhoud is de dump van de eigenaar (2,7 GB), zie README.md.
NoteEN = The ElfLdr2 path check is solved. The loader requires all files of this game to be in a folder named pm (the Play Mechanix install root) with the path to the elf inside it; with [Identify] Path = pm/game and a view folder views/GhostBusters/pm with links to the game files it continues to "Starting Game". The game does not reach a picture yet; what blocks it then (dongle, OpenGL context) has not been measured. The pm folder is not a drop-in: its content is the owner's own dump (2.7 GB), see README.md.
Findings = findings/GhostBusters.md

; Profiel uit TeknoParrot-sjabloon GameProfiles/GhostBusters.xml, revisie 7 (scripts/import-tp-profiles.py; opnieuw importeren in plaats van met de hand wijzigen)
