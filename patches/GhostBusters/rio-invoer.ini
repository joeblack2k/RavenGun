# Ghostbusters (Raw Thrills / Play Mechanix), native route: the RIO lightgun board, answered AS THE BOARD over USB.
# Read by tools/rio-bridge/rg_rio_bridge.c (32-bit lib32/librg_rio_bridge.so) through RG_RIO_TABLE. Same board family and the same
# report layout as Jurassic Park (patches/JurassicPark/rio-invoer.ini) and Aliens Armageddon: no encryption.
#
# The four pmrt_usb hooks were MEASURED on 2026-10-15: the board library's functions are byte-identical in this game, at a fixed
# offset of -0x5F0C0 from Aliens Armageddon (open found uniquely; read/write/close follow from the same offset, signatures checked).
# The switch ids and the lightgun channels were measured on 2026-10-20 (see the comments above each group below).
proces      naam=rg-elfloader
beeld       bits=8
usb         vid=0c70 pid=0780 interval=4 type=2 lengte=64 som=63
haak        naam=pmrt_usb_open            rol=open    adres=082e7a56 sig=5589e583ec58
haak        naam=pmrt_usb_interrupt_read  rol=lees    adres=082e80ca sig=5589e55383ec34
haak        naam=pmrt_usb_interrupt_write rol=schrijf adres=082e8016 sig=5589e55383ec34
haak        naam=pmrt_usb_close           rol=sluit   adres=082e7d53 sig=5589e583ec28
versleuteling geen
# Report type 2 (payload byte N = report byte 3+N), identical to Jurassic Park.
veld id=0  byte=3  deel=hoog
veld id=1  byte=3  deel=laag
veld id=2  byte=4  deel=hoog
veld id=18 byte=4  deel=laag
veld id=3  byte=5  deel=hoog
veld id=4  byte=5  deel=laag
veld id=5  byte=6  deel=hoog
veld id=6  byte=6  deel=laag
veld id=7  byte=8  deel=hoog
veld id=8  byte=8  deel=laag
veld id=9  byte=9  deel=hoog
veld id=10 byte=9  deel=laag
veld id=11 byte=10 deel=hoog
veld id=12 byte=10 deel=laag
veld id=17 byte=11 deel=hoog
veld id=13 byte=12 deel=hoog
veld id=14 byte=12 deel=laag
veld id=15 byte=13 deel=hoog
veld id=16 byte=13 deel=laag
adcveld ch=19 hoog=14 deel=hoog laag=16
adcveld ch=20 hoog=14 deel=laag laag=17
adcveld ch=21 hoog=15 deel=hoog laag=18
adcveld ch=22 hoog=15 deel=laag laag=19
# Board image: layout RawThrillsGUN (game.ini [Input] Layout): bit 0 test, 1 service, 2 coin1, 3 coin2, 4 p1.start, 5 p1.trigger,
# 6 p1.grenade, 7 p1.reload, 8 p2.start, 9 p2.trigger, 10 p2.grenade, 11 p2.reload, 12 volume_up, 13 volume_down.
# Switch ids MEASURED 2026-10-20 in the game's own TEST > Tests > Input Tests > Switch Tests screen (RG_RIO_PROBE, one bit at a time):
#   id 3 = Test, id 4 = Service, id 5 = Vol +, id 6 = Vol -, id 0 = Coin Slot 1, id 1 = Coin Slot 2, id 18 = Coin Slot 3, id 2 = Coin Slot 4,
#   id 12 and 13 = Gun 1 Trigger, id 14 = Gun 1 Ball Loaded Switch, id 15 and 17 = Gun 2 Trigger, id 16 = Gun 2 Ball Loaded Switch.
#   The Start buttons are not on that screen; ids 7/8 are the Jurassic Park / NERF start ids.
schakelaar bit=0  id=3            # test        -> 3 Test (also the "DIAG" button of the gun calibration screens and "Select" in the menus)
schakelaar bit=1  id=4            # service     -> 4 Service (also "Back" in the menus)
schakelaar bit=2  id=0            # coin1       -> 0 Coin Slot 1
schakelaar bit=3  id=1            # coin2       -> 1 Coin Slot 2
schakelaar bit=4  id=13           # p1.start    -> 13 Gun 1 Trigger (the game starts on "Press ANY BUTTON"; id 7 does nothing)
schakelaar bit=5  id=13           # p1.trigger  -> 13 Gun 1 Trigger
schakelaar bit=8  id=15           # p2.start    -> 15 Gun 2 Trigger (same reason)
schakelaar bit=9  id=15           # p2.trigger  -> 15 Gun 2 Trigger
schakelaar bit=12 id=5            # volume_up   -> 5 Vol +
schakelaar bit=13 id=6            # volume_down -> 6 Vol -
# grenade and reload (bits 6, 7, 10, 11): this gun has no such button, so they are deliberately not mapped.
# Lightgun channels: 12-bit, 8-bit source (the daemon keeps an on-screen axis on 2..253, min/max stretch it onto 0..4095).
# MEASURED 2026-10-20 with the game's own gun calibration screen (it prints the raw "GUN1 X/Y" and "GUN2 X/Y" it reads) and with the
# proton beam in a running game, using `ravengunctl test-pattern corners`:
#   * X is channel 20 (gun 1) / 22 (gun 2), Y is channel 19 / 21 (the other way round than Aliens Armageddon).
#   * Y: top of the screen = 4095 (board channel 0 = bottom, like Jurassic Park), so inverteer=ja.
#   * X: with inverteer=nee the calibration screen stored x_orient=0 and the reticle and the beam were MIRRORED (aiming at the left
#     edge sent the beam to the right); with inverteer=ja (left edge = 4095) the game stores x_orient=1 and beam and reticle follow
#     the aim (beam to the top-left for a top-left aim, to the top-right for a top-right aim).
kanaal bron=12 ch=20 min=-32.6 max=4127.7 inverteer=ja    # p1.x
kanaal bron=16 ch=19 min=-32.6 max=4127.7 inverteer=ja    # p1.y
kanaal bron=20 ch=22 min=-32.6 max=4127.7 inverteer=ja    # p2.x
kanaal bron=24 ch=21 min=-32.6 max=4127.7 inverteer=ja    # p2.y
