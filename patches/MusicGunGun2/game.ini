; Gegenereerd door scripts/migrate-game-settings.py (docs/per-game-patches.md). Sleutels die het script afleidt uit de oude bronnen worden bij
; elke run opnieuw gezet; handwerk in andere sleutels blijft staan.
;
; Uit het oude UserProfiles/MusicGunGun2.env:
; door tp-add-game.py; Type X2 (OpenParrot), elfde ronde 2026-10-11 (zie packaging/games-status.md)
; - TP_REMOTETHREAD=off: standaardroute van de lader (entry-point-trampoline), geen POSTSTART/ENTRYPOINT (antwoorden_ronde3, vraag 14)
; - WINEDLLOVERRIDES=d3d9=b: Wine's ingebouwde d3d9
; - RG_LOADER_FPFIX=true: kopie van de lader zonder CONTEXT_FLOATING_POINT (Wine-bug: SetThreadContext zet MXCSR op 0)
; - RG_JVS_BOARD=true: standaard JVS-bord achter de pipe (scripts/launch-direct.py)

[Game]
Name = Music GunGun 2
Profile = MusicGunGun2
Type = OpenParrot
EmulationProfile = MusicGunGun2
Executable = Game.exe
ProfileRevision = 2

[Launch]
Mode = direct
; De gewone game.exe vraagt hardcoded 1360x768 (0x401776/0x401780) en die modus biedt Xwayland niet: "Direct3D-apparaat
; opsommen mislukt". De dump heeft zelf een HD-build (Patch/HD/game.exe, alleen die 4 bytes anders: 1920x1080); in de view
; wordt game.exe daarheen gelinkt, op de NAS verandert niets (2026-10-15).
ViewLinks = game.exe -> Patch/HD/game.exe
; Wine 11 heeft een 32-bits libXi nodig (XInput2) om de muis in het schermvullende venster vast te leggen. SteamOS heeft geen lib32-libxi:
; zonder blijft de berichtenlus van de game vol met WM_WINE_CLIPCURSOR en blijft het venster wit (JVS stil na 7 pakketten, gemeten 2026-10-21).
XInput2 = true

; JVS-bord van de daemon over de pipe (munt, START, test, service) plus de tp-shm-indeling voor trekkers en richten. Met het
; vaste bord van rg-direct (geen invoer) bleef de game in het kalibratiescherm van de testmodus.
[Input]
Route = jvs
Board = SegaGun2P
JvsTransport = pipe
Layout = MusicGunGun2Pipe
Note = JVS-bord van de daemon (SegaGun2P) over de pipe plus tp-shm MusicGunGun2Pipe; gemeten 2026-10-15: munt, START, schieten, score

; Bediening voor de knoppen-uitleg bij de eerste start (docs/per-game-patches.md, "Bediening per game"); labels uit het
; TeknoParrot-profiel (GameProfiles/<P>.xml), "Not confirmed yet" = de werking is nog niet gemeten.
[Controls]
trigger = Shoot | Fires the gun.

[Status]
Status = working
Note = WORKING via dubbelklik in de app (2026-10-15): HD-build van de dump via ViewLinks (1360x768 bestaat niet in Xwayland), JVS-bord van de daemon; attract, munt, START, trainingskeuze, nummers met score, hiscore-invoer; 5,5 min gespeeld.
NoteEN = WORKING via double-click in the app (2026-10-15): the dump's HD build via ViewLinks (1360x768 does not exist in Xwayland), the daemon's JVS board; attract, coin, START, training choice, songs with score, hiscore entry; played 5.5 min. RE-MEASURED 2026-10-21 (headless session, mouse gun): the start stalled on a white window (JVS silent after 7 packets) because the host has no 32-bit libXi and Wine 11 then loops on WM_WINE_CLIPCURSOR; with [Launch] XInput2 = true the attract, coin, START, player and music selection and a scoring song (000100) work again.
Findings = findings/MusicGunGun2.md

; Profiel uit TeknoParrot-sjabloon GameProfiles/MusicGunGun2.xml, revisie 2 (scripts/import-tp-profiles.py; opnieuw importeren in plaats van met de hand wijzigen)
