Module = Game.exe
Offset = 0x137C70
Action = jmp-returns-true
Source = OpenParrot TypeX2Generic.cpp (GPL-3.0), regel 2112
Reason = Upstream zet op deze plek een JMP naar een functie die altijd 1 teruggeeft (ReturnsTrue), zonder commentaar: het doel van deze aanpassing is dus niet vastgelegd. De Category (loader) is een voorlopige keuze omdat de kern dit toepast. De OpenParrot-kern past dit zelf al toe (AppliedBy = core). Alleen documentatie: RavenGun past dit niet toe. Er staan geen originele bytes in de bron, dus Find is leeg.
