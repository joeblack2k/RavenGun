;
; dropin.ini - wat er in de view van Lethal Enforcers 3 komt (docs/dropins.md). Kandidaat zonder TeknoParrot,
; docs/research/konami/README.md.
;
; iob.dll en gunio.dll zijn onze eigen Konami-I/O-bibliotheken (tools/rg-konami/, gebouwd met tools/rg-konami/build.sh --le3 <deze
; map>): zelfde exports als die van Konami, invoer uit het bordbeeld TeknoParrot_JvsState van rg-jvsbridge. Ze vervangen in de view
; de symlinks naar Konami's DLL's op de NAS (die blijven onaangeroerd).
;
; SAVE/io.sav is de geweerkalibratie die bij de ruwe waarden van onze gunio.dll hoort (middelpunt 127, schalen 2,5 en 1,875, met de
; controlegetallen van de game; gemaakt door le3_maak_iosav in tools/rg-konami/konami_logic.h). SAVE is in de view een koppeling
; naar de NAS; de drop-in-motor maakt die map eerst lokaal (de andere .sav-bestanden blijven koppelingen naar de NAS, zoals nu). Elke
; start zet deze io.sav terug: een kalibratie in het testmenu geldt dus maar voor een run (en is met dit bord ook niet nodig).
;
; RG_KONAMI_LOG=rg-konami.log: een paar regels per DLL plus de eerste invoer, naast de DLL in de view (nooit op de NAS). Het bewijs dat
; ONZE DLL's laden en dat de knoppen en het richtpunt aankomen.

[iob.dll]
To = .
DllOverride = native
Env = RG_KONAMI_LOG=rg-konami.log;RG_KONAMI_VENSTER=1

[gunio.dll]
To = .
DllOverride = native

[SAVE/io.sav]
To = .
