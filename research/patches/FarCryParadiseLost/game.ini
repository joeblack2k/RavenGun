; KANDIDAAT zonder TeknoParrot (niet actief; de actieve staat in patches/FarCryParadiseLost/game.ini en blijft op de TeknoParrot-kern tot dit
; op de tv gelukt is). Verschil met die: [Loader] Core = none (geen lader en geen kern: Wine start Farcry_R.exe zelf), de drop-in uit
; docs/research/losse/FarCryParadiseLost.dropin.ini (onze Usbioextreme.dll, kalibratie 1..255, venstermodus in systemcfg), en [Config]
; Windowed/CustomResolution doen niets meer (die las de kern). Activeren: de secties daaruit in dropin/dropin.ini en de [Loader]-sectie hieronder
; in game.ini. Uitleg: docs/research/losse/FarCryParadiseLost.md.
; Oorspronkelijke kop: voorbereid in pass 1 (docs/goal-90-native.md): profiel uit het TeknoParrot-sjabloon, herkenning gemeten aan de NAS-map
; "Far Cry Paradise Lost" (alleen gelezen), invoerroute gekozen naar het EmulationProfile.

[Game]
Name = Far Cry Paradise Lost
Profile = FarCryParadiseLost
Executable = Farcry_R.exe
Type = TeknoParrot
EmulationProfile = FarCry
ProfileRevision = 14

[Launch]
Mode = direct
; Zoals Runme.bat van de kast (subst W: . / w: / Farcry_r.exe): WinMain vergelijkt _getdrive() met 'W' (0x401c89) en de exe opent
; w:\arcade_*.txt. Gemeten 2026-10-15: met W: blijft hij wel nog hangen voor het D3D-apparaat (60% CPU); open.
Drives = W=.
Exe = W:\Farcry_R.exe

[Loader]
; Geen OpenParrot-lader en geen kern: de TeknoParrot-kern deed voor deze game (a) de USB-IO (nu onze Usbioextreme.dll), (b) venstermodus
; (nu r_Fullscreen = "0" in de drop-in) en (c) mogelijk de dongle (niet vastgesteld, zie het onderzoeksstuk).
Core = none

[Wine]
; Direct3D 9 via DXVK; het spel vraagt exclusief schermvullend (diagnose 2026-10-14)
Prefix = ravengun-test-dxvk
DllOverrides = d3d9=n,b
Runner = wrapper

[Display]
; Gemeten 2026-10-15 met de meetdraad van rg-compat (RG_COMPAT_SAMPLE): onder gamescope hangt de hoofddraad in UpdateWindow
; (NtUserRedrawWindow) direct na CreateWindow/ShowWindow; zonder gamescope in ChangeDisplaySettings (naar 800x600). Zonder
; gamescope en met CustomResolution 1920x1080 ([Config]) komt hij door beide heen en maakt hij het D3D9-apparaat (DXVK, 1920x1080
; schermvullend). Daarna geen Present (geen DXVK-HUD): de hoofddraad draait zijn berichtenlus (PeekMessage) en tekent niets.
; Vermoeden (niet gemeten): de game wacht op zijn dongle (HASP: HASPDOSDRV, P_DongleCheck, IncorrectDongle) of zijn USB-IO (CUSBIO).
; Ook met de d3dx9_32 van Microsoft blijft het zo; die staat er daarom niet in.
; 2026-10-17: in gamescope met Windowed = 1 ([Config]) komt hij wel in beeld (attracttekst).
Gamescope = true

[Input]
Route = tp-shm
Layout = FarCryPipe
Note = voorbereid, niet gestart: tp-shm, indeling FarCryPipe

; Bediening voor de knoppen-uitleg bij de eerste start (docs/per-game-patches.md, "Bediening per game"); labels uit het
; TeknoParrot-profiel (GameProfiles/<P>.xml), "Not confirmed yet" = de werking is nog niet gemeten.
[Controls]
trigger = Shoot | Fires the gun.
grenade = Grenade | Throws a grenade. Not confirmed yet.

[Status]
Status = working
Note = WERKT (2026-10-17, gespeeld in muismodus, 5,5 min: 'PULL TRIGGER TO START', kaartkeuze, uitleg van het geweer, in het spel met score). Start via dubbelklik (2026-10-17): in gamescope met Windowed = 1 de attracttekst (PULL TRIGGER TO START, FREE PLAY) op een zwarte achtergrond. Eerder (zonder gamescope) liep de berichtenlus zonder Present. Achtergrond en spelen nog niet gemeten.
NoteEN = WORKING (2026-10-17, played in mouse mode for 5.5 min: pull trigger to start, map select, gun tutorial, in the game with score). Starts by double-click (2026-10-17): under gamescope with Windowed = 1 the attract text shows (pull trigger to start, free play) on a black background. Play not measured.


