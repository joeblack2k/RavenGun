[Launch]
Mode = direct

[Display]
Gamescope = true
GamescopePath = /usr/bin/gamescope

[Input]
; Op order van de eigenaar uit de app gehaald (purge, commit ccd52fe); het tp-shm-profiel 'GoGoStrike'
; bestaat niet meer in packaging/tp-shm-profiles.json, dus geen Route/Layout meer -- een game die we niet
; meer meeleveren hoort geen indeling te beloven. Zonder Route valt hij terug op de standaardroute (evdev)
; en doet hij niet meer mee in de routelijst.
; LET OP: alleen 'Layout' weghalen zou fout zijn: routes.cpp eist een Layout bij Route = tp-shm, dus dan
; werd deze game een routemelding in plaats van een geldige game.

; Klasse (statische meting 2026-10-12, zie patches/ELF-LADER-SPEC.md): ONGEPAKT en met
; LD_LIBRARY_PATH=<ElfLdr2/libs> LINK-COMPLEET -- ldd meldt nul ontbrekende bibliotheken.
; Dat maakt deze game de goedkoopste echte proef van de hele familie; nog niet gedaan.

[Status]
Status = playable
Note = Werkt: bowling met de Move als trackball (richting en zwaai bepalen de worp), start (toets 1) en trekker (klik). Het beeld is 4:3 met zwarte randen (gamescope). Het credit-getal staat vreemd in beeld maar de game is gratis te spelen.
NoteEN = Works: bowling with the Move as trackball (direction and swing set the throw), start (key 1) and trigger (click). 4:3 picture with black bars (gamescope).
Findings = findings/GoGoStrike.md

