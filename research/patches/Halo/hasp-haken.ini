# RavenGun — adreslijst voor de HASP-inline-hook, per game.
#
# Dit bestand hoort in de PATCHES-repo, niet in de lader-repo: de hook is generiek, deze
# getallen zijn van deze ene game-versie. De hook leest het via RAVENGUN_HASP_ELF_ADRESLIJST,
# of anders als `hasp-haken.ini` naast de hookbibliotheek. Zonder dit bestand verandert er
# niets: dan blijft de naam-route (dynsym) de enige weg, en dat is de standaard.
#
# WAAROM DIT BESTAAT
# ------------------
# De HASP-cliënt van Halo zit STATISCH in `game`; zijn namen zijn weg. Gemeten: `game` heeft
# 220 dynsym-symbolen, nul daarvan met `hasp_`, en de byte-sequentie `hasp_login` komt nul keer
# in het bestand voor. De naam-route vindt hier dus niets, hoeveel geluk het recept ook heeft.
# Daarom noemt deze lijst de ingangspunten met hun adres.
#
# WAAR DE ADRESSEN VANDAAN KOMEN (gemeten, niet gegokt)
# ----------------------------------------------------
# Uit halo.so van TeknoParrot. `initialize()` op 0x569f roept zeven keer `flh_inline_hook` aan,
# en schrijft de retourwaarde meteen in de bijbehorende `real_hasp_*`-gleuf. De disassembly
# (`objdump -d --disassemble=initialize halo.so`) geeft per aanroep:
#
#     mov edi,0xb2e1aa / call flh_inline_hook / mov [rip+..],rax   # -> real_hasp_encrypt
#     mov edi,0xb2d630 / call flh_inline_hook / mov [rip+..],rax   # -> real_hasp_login
#     mov edi,0xb2dd48 / call flh_inline_hook / mov [rip+..],rax   # -> real_hasp_logout
#     mov edi,0xb2fd63 / call flh_inline_hook / mov [rip+..],rax   # -> real_hasp_read
#     mov edi,0xb2fe60 / call flh_inline_hook / mov [rip+..],rax   # -> real_hasp_write
#     mov edi,0xb2e391 / call flh_inline_hook / mov [rip+..],rax   # -> real_hasp_free
#     mov edi,0xb2f5ac / call flh_inline_hook / mov [rip+..],rax   # -> real_hasp_get_sessioninfo
#
# De naam bij elk adres is dus afgelezen uit de gleuf waar de retourwaarde in gaat.
#
# WAT ER NIET IN STAAT, EN WAAROM
# -------------------------------
# `hasp_login_scope`, `hasp_decrypt`, `hasp_get_size` en `hasp_get_info` staan er niet in:
# halo.so haakt die vier niet aan, dus voor deze game-versie is er geen gemeten adres. De hook
# meldt ze na het aanhaken apart als "niet aangehaakt", zodat het gat zichtbaar blijft in
# plaats van stil te blijven.
#
# DE TWEE CONTROLES
# -----------------
# `grootte` en `ingang` zijn versiecontroles. Kloppen ze niet met het beeld, dan keurt de hook
# de HELE lijst af en patch hij niets — een adres uit een andere build is een crash die niemand
# terugvindt. Daarbovenop keurt hij elk adres apart: het moet in een uitvoerbaar PT_LOAD-segment
# vallen, binnen p_filesz, en de bytes op dat adres moeten een herkenbare functieprologue zijn.
# Dat laatste vangt ook een adres af dat al door een andere hook (halo.so) is gepatcht.

game    = Halo
arch    = x86_64
basis   = absoluut
grootte = 33554432
ingang  = 0x414600

hasp_encrypt         = 0xb2e1aa
hasp_login           = 0xb2d630
hasp_logout          = 0xb2dd48
hasp_read            = 0xb2fd63
hasp_write           = 0xb2fe60
hasp_free            = 0xb2e391
hasp_get_sessioninfo = 0xb2f5ac
