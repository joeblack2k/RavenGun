;
; Drop-ins van Halo Fireteam Raven (docs/dropins.md).
;
; Twee bibliotheken en de donglegegevens:
;   ravengun-hasp-x64.so        de HASP-emulator (hasp/src/, gebouwd met scripts/build-hasp.sh)
;   libravengun-hasphook-x64.so de inline-hook voor de statisch gelinkte hasp-aanroepen
;   ravengun-hasp/Halo/         de dongle-beschrijving + de geheugenimages
;
; De launcher zet elk bestand hieronder in de view van de game en zet de omgevingsvariabelen.
; LET OP: elk bestand in deze map moet een EIGEN sectie hebben, anders wordt het niet gekopieerd.
;
; `Audit = false` op beide bibliotheken is GEMETEN werk (2026-10-11; zie patches/Halo/README.md):
;
;   * Preload = true zet het pad in LD_AUDIT van de Wine-start (launch-direct.py, dropin_plan()).
;     LD_AUDIT wordt door glibc van het Wine-proces gelezen, maar BudgieLoader is een
;     Cygwin-programma dat de game-ELF IN ZIJN EIGEN PROCES laadt: de auditbibliotheek komt dus in
;     het proces van de Cygwin-lader terecht, niet in een schoon spelproces.
;   * libravengun-hasphook-x64.so sterft daar. De lader loopt tot
;     "Warning aborting symbol parsing due to invalid name ptr", de hook meldt nog
;     "[ravengun-hasphook] spelbeeld op 0x00400000" en dan is de lader weg met exitcode 1.
;     De game komt nooit aan zijn eigen code toe. Losse proeven (probe2.sh, P1/P5/P6 tegenover
;     P0/P2/P3/P4/P7): alleen deze hook in LD_AUDIT is fataal; de emulator alleen niet.
;   * Met Audit = false gaat dezelfde start door naar "SubSystem Detection" en draait de game zijn
;     eigen code (cmgr_init, cmgr_thread_main, mo_mode_loop_thread, Cpmgui, Gun 0 Cal) en zet hij
;     zijn venster "TeknoParrot (ElfLoader64) - HALO Fireteam Raven" van 1920x1080 op.
;   * De emulator is geen auditbibliotheek: glibc weigert hem met "undefined symbol: la_version".
;     Zonder de hook wordt hij toch nooit aangesproken, dus hij hoort hier ook niet in LD_AUDIT.
;
; Preload blijft true: het pad hoort in RG_DROPIN_PRELOAD, dat de native route
; (scripts/play-native.sh, packaging/native-games.json) en een eigen lader in LD_PRELOAD van het
; echte spelproces zetten. Die route leest deze dropin.ini niet, dus deze vlag raakt hem niet.
;
; Het pad naar de donglegegevens is RELATIEF: de bibliotheek draait in het spelproces, en de
; werkmap daarvan is de view. Zo hoeft er geen Z:\-pad in te staan.

[ravengun-hasp-x64.so]
To = .
Preload = true
Audit = false
Env = RAVENGUN_HASP_DIR=ravengun-hasp;RAVENGUN_HASP_GAME=Halo

[libravengun-hasphook-x64.so]
To = .
Preload = true
Audit = false
Env = RAVENGUN_HASP_ELF_LOG=hasphook.log

; De 32-bits hook staat hier ook omdat scripts/build-hasphook.sh BEIDE architecturen in elke game van
; zijn GAMES-lijst legt (JurassicPark GalagaAssault Halo Terminator). Halo is 64-bits -- het
; `game`-bestand is een x86-64 ELF -- dus alleen de x64-hook hierboven zou ooit geladen worden.
; Deze 32-bits versie krijgt daarom GEEN Preload: zonder Preload wordt het bestand wel in de view
; gezet, maar nergens in geladen. Een 32-bits ELF in het 64-bits spelproces zetten is fataal
; (ELFCLASS64; docs/dropins.md, "Preload = true"). De sectie is verplicht: een bestand zonder sectie
; wordt niet uitgerold (docs/dropins.md).
;
; Opruimen mag: haal libravengun-hasphook.so uit dropin/ en deze sectie weg, dan blijft er precies
; over wat Halo nodig heeft.
[libravengun-hasphook.so]
To = .

[ravengun-hasp/Halo/dongle.json]
To = .

[ravengun-hasp/Halo/memory/00000000000000001111111111110100]
To = .

[ravengun-hasp/Halo/memory/00000000000000001111111111110101]
To = .

[ravengun-hasp/Halo/memory/fff4]
To = .

; ----------------------------------------------------------------------------------------------------------------------------
; dropin/fmod/ (native route, geluid): zet hier je EIGEN FMOD Studio 1.10 voor Linux neer, 64-bits:
;   libfmod.so.10 en libfmodstudio.so.10   (bijvoorbeeld uit lib64/ van Celeste in je Steam-bibliotheek; gemeten: 1.10.14 laadt
;                                           alle banks van Halo)
; Liefst in de gebruikerslaag: ~/.local/share/ravengun/patches/Halo/dropin/fmod/ (blijft staan bij een herinstallatie). Die gaat
; voor deze map. RavenGun levert geen FMOD mee en zet die bestanden niet in git (propriëtair; ieder levert zijn eigen).
; De native route leest dropin.ini niet: tools/fmod-bridge zoekt de bestanden zelf (RG_FMOD_NATIVE_DIRS in packaging/native-games.json).
; Zonder deze bestanden: de Windows-FMOD van een TeknoParrot-installatie onder Wine, en anders speelt Halo stil.
