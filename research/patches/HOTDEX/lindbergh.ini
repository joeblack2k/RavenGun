# Instellingen van de Lindbergh-laag (lindbergh-loader) voor The House of the Dead EX, op de Lindbergh-route van RavenGun (docs/lindbergh.md).
# De engine zet zelf, bij elke start: [Display] WIDTH, HEIGHT en FULLSCREEN (uit het profiel in packaging/native-games.json),
# [Emulation] EMULATE_JVS en [Paths] JVS_PATH (JVS naar het bord van de daemon) en, waar nodig, [Paths] LIBCG_PATH.
# Eigen wijzigingen: een lindbergh.ini in de gebruikerslaag van patches/<Game>/ gaat voor dit bestand.
# Commentaar alleen op eigen regels: de INI-lezer van lindbergh-loader kent geen commentaar achter een waarde.

[Display]
KEEP_ASPECT_RATIO = true
HIDE_CURSOR = true

[Input]
# Muis en toetsenbord van het venster; de echte invoer komt over JVS van de daemon.
INPUT_MODE = 1

[Emulation]
REGION = EX
# Munten komen van de daemon (coin1, coin2); none = de instelling van de game zelf.
FREEPLAY = none

[Graphics]
# Mesa zink meldt GL_VENDOR 'Mesa'; zonder deze regel herkent de laag de GPU niet. 2 = AMD: de patches van het
# Mesa-pad blijven aan, met zink en met gewone radeonsi.
GPU_VENDOR = 2

[System]
DEBUG_MSGS = false
