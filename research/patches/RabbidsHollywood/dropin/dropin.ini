;
; dropin.ini - wat er in de view van Rabbids Hollywood komt (docs/dropins.md,
; docs/geen-dongle-in-de-loader.md).
;
; Dit is de Matrix/SBK-donglelaag als drop-in: onze eigen matrix64.dll beantwoordt de dongle-controle
; in de DLL zelf, en leest zijn eigen gegevens uit matrix/matrix.ini ernaast. De launcher kopieert
; bestanden en zet omgevingsvariabelen; hij weet niet wat een dongle is.
;
; CONTRACT (docs/dropins.md): dest = view + To + sectienaam. De sectienaam is het pad onder dropin/,
; dus met To = . komt `matrix/matrix.ini` in <view>/matrix/matrix.ini. Zet dat pad NIET ook in To,
; want dan staat het er dubbel in en vindt de bibliotheek haar gegevens nooit.
;
; To = Game_Data/Plugins, niet '.' (de hoofdmap van de game). Gemeten met WINEDEBUG=+loaddll: de game
; laadt weliswaar beide exemplaren, maar de aanroepen uit MatrixDLLCSharp.MatrixWrapper komen uit
; Game_Data/Plugins/matrix64.dll. Met onze DLL alleen in de hoofdmap sloot de game zich na ongeveer
; een minuut nog steeds af; met onze DLL in Game_Data/Plugins bleef hij draaien (docs/matrix-layer.md,
; "Metingen"). Game_Data is in de view een koppeling naar de NAS; de drop-in-motor maakt die map eerst
; lokaal (dropin_materialiseer in scripts/launch-direct.py), zodat er nooit naar de NAS geschreven
; wordt.
;
; De gegevensmap staat NAAST de bibliotheek (Game_Data/Plugins/matrix/), niet in de hoofdmap: de
; bibliotheek zoekt `matrix.ini` in RAVENGUN_MATRIX_DIR en anders naast zichzelf, en dit is de revisie
; die in de view gemeten is (docs/matrix-layer.md, "Metingen", de definitieve revisie).
;
; RAVENGUN_MATRIX_DLL=1 zet de Matrix-patches van de RavenGun-plugin (plugins/unity/src/rabbids/) uit,
; zodat de DLL het alleen doet. Zonder die variabele wint de patch en wordt de DLL nooit aangeroepen;
; de patch blijft dus de terugval voor zolang de drop-in niet geleverd kan worden.
;
; RAVENGUN_MATRIX_LOG=matrix.log laat de bibliotheek haar antwoorden opschrijven. Dat is het enige
; bewijs dat ONZE dll werkelijk is aangeroepen en niet het origineel: het bestand komt in de werkmap
; van de game (de view) terecht, dus nooit op de NAS. Regels: "gegevensmap gevonden",
; "matrix.ini gelezen, poort", "matrix.ini gelezen, aantal", "Init_MatrixAPI -> 0",
; "Dongle_Count -> aantal, poort", "Dongle_ReadSerNr -> 69420, poort".
;
; matrix64.dll komt uit matrix/out/ (scripts/build-matrix.sh): wij hebben hem zelf gebouwd, het is geen
; kopie van een bestand van TeknoParrot. Deze game is 64-bits ([Game] Is64Bit = true) en importeert
; matrix64.dll; matrix32.dll hoort hier NIET -- een bestand zonder eigen sectie wordt niet uitgerold.

[matrix64.dll]
To = Game_Data/Plugins
DllOverride = native
Env = RAVENGUN_MATRIX_DIR=matrix;RAVENGUN_MATRIX_GAME=RabbidsHollywood;RAVENGUN_MATRIX_DLL=1;RAVENGUN_MATRIX_LOG=matrix.log

[matrix/matrix.ini]
To = Game_Data/Plugins

[ravengun-hasp/RabbidsHollywood/dongle.json]
To = .
