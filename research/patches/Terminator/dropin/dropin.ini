; Drop-in van Terminator Salvation (docs/dropins.md).
;
; Bijgewerkt na de bench van 2026-10-13. Eerder stond hier "GEEN inline-hook, voorlopig INERT": dat
; klopte voor de dynsym-route (game heeft 0 hasp_-symbolen) maar niet voor de ADRES-route. De
; HASP-cliënt zit STATISCH in `game`; hasp-haken.ini (hier naast de hook) geeft de adressen van de
; tien hasp_*-functies, en de hook haakt ze aan zodra de lader de echte code heeft geschreven.
;
; WAT DEZE DROP-IN DOET
;   libravengun-hasphook.so   haakt hasp_login/read/write/encrypt/decrypt/... in `game` aan (adreslijst:
;                             hasp-haken.ini in dezelfde map; de game-ELF vindt de hook via de opdrachtregel)
;   ravengun-hasp.so          de emulator waar de hook naar doorverwijst (RAVENGUN_HASP_ELF_LIB)
;   ravengun-hasp/Terminator/ de donglebeschrijving + geheugenbestanden (fileid 0xFFF2 en 0xFFF0)
;   hasp/ (van de game zelf)  de ANTWOORDTAFEL voor hasp_encrypt/hasp_decrypt; het veld crypto_table in
;                             dongle.json wijst ernaar. NIET gekopieerd: runtime-data van de game.
;
; LET OP: elk bestand dat de game nodig heeft moet een EIGEN sectie hebben, anders wordt het niet
; gekopieerd (docs/dropins.md).

[libravengun-hasphook.so]
To = .
Preload = true
Audit = false
Env = RAVENGUN_HASP_DIR=ravengun-hasp;RAVENGUN_HASP_GAME=Terminator;RAVENGUN_HASP_ELF_LIB=./ravengun-hasp.so;RAVENGUN_HASP_ELF_LOG=hasphook.log;RAVENGUN_HASP_VERBOSE=1

[hasp-haken.ini]
To = .

; De emulatorbibliotheek staat in de drop-in. GEEN Preload: glibc eist van een bibliotheek in LD_AUDIT
; dat hij `la_version` exporteert, en ravengun-hasp.so doet dat niet. De hook laadt hem zelf (dlmopen).
[ravengun-hasp.so]
To = .

[ravengun-hasp/Terminator/dongle.json]
To = .

[ravengun-hasp/Terminator/memory/00000000000000001111111111110010]
To = .

[ravengun-hasp/Terminator/memory/00000000000000001111111111110000]
To = .
