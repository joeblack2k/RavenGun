[Game]
Name = Aliens Extermination
Profile = AliensExtermination
Executable = aliens.exe;aliens dehasped.exe
Type = TeknoParrot
EmulationProfile = AliensExtermination
ProfileRevision = 14

[Launch]
; de attract-films zijn DivX; de game levert de codec zelf mee (eenmalig per prefix, stil)
Install = divx60 (install for videos to work).exe
InstallArgs = /S
; de game laadt zijn shaders uit C:\PC\ALIENS\SHADERS\%s (vast pad in de exe); de TP-kern leidde dat om
Drives = C:\PC\ALIENS=.
Mode = direct
; "aliens dehasped.exe" heeft zijn HASP-emulatie achter het einde van .text (SizeOfRawData 0x55DB6, 573 bytes code tot de bladzijde).
; Windows mapt die bladzijde mee, Wine zet hem op nul: page fault op 0x456DF1 (lezen van 0xFFFFFFF1). PeFillPages maakt in de view een
; lokale kopie met secties tot hun bladzijde (CRC32 van de kop gelijk); met een kop zonder die CRC stopte de kern met exitcode 1337.
PeFillPages = true

; KANDIDAAT ZONDER TeknoParrot (docs/research/losse/AliensExtermination.md). Samen met de map AliensExtermination.dropin/ (dropin.ini
; en rg-aliens-hook.dll) naar patches/AliensExtermination/ verhuizen; niet los: zonder de drop-in komt er geen invoer.
[Loader]
; Onze eigen OpenParrot-lader en -kern (third_party/openparrot, scripts/build-openparrot.sh). De kern kent de game niet (generieke
; route, patch 0003) en haakt dus niets; alle invoer doet de drop-in rg-aliens-hook.dll (Preload = true).
Build = ravengun
Core = ravengun

[Display]
Gamescope = true
; Zonder de kern die 1920x1080 afdwong draait de game zijn eigen venster van 800x600 (glutInitWindowSize 0x320 x 0x258 in de exe):
; gamescope zet dat met pillarbox op de tv, dus de aim-ruimte van de lichtgeweren hoort op dat 4:3-deel te liggen. Staat het beeld bij
; de eerste proef toch beeldvullend 16:9, haal deze regel dan weg.
AimAspect = 4:3

; Pass 1 (docs/goal-90-native.md): Global VR, EmulationProfile AliensExtermination. Er is geen tp-shm-indeling of JVS/HID-bord voor dit
; profiel (de bescherming is een HASP4-dongle plus een USB-HID-controle, zie BESCHERMING-STATUS.md): de route is de dichtstbijzijnde,
; geen gemeten keuze. Engine-werk nodig voor een eigen indeling.
[Input]
Route = tp-shm
Layout = AliensExtermination
Note = tp-shm, indeling AliensExtermination (TeknoParrotUi AliensExterminationPipe; special = granaat, vlam = extra knop 1). Zonder TeknoParrot leest rg-aliens-hook.dll dit geheugen en geeft de game joyGetPosEx (richten, trekker, special, vlam) en GetAsyncKeyState (munt, start, test, select, volume).

; Bediening voor de knoppen-uitleg bij de eerste start (docs/per-game-patches.md, "Bediening per game"); labels uit het
; TeknoParrot-profiel (GameProfiles/<P>.xml), "Not confirmed yet" = de werking is nog niet gemeten.
[Controls]
trigger = Shoot | Fires the pulse rifle.
grenade = Special | Your special attack.
aux1 = Flame | Fires the flamethrower.

[Status]
Status = working
Note = WERKT (2026-10-17, gespeeld in muismodus, 5,5 min: highscores, PRESS START, missiekeuze (schietend gekozen), in het spel mikken en schieten (body count)). Start via dubbelklik (2026-10-17): PeFillPages (de HASP-emulatie achter .text, die Wine wiste), gamescope met Windowed = 1 en 1920x1080: opstartscherm (VERSION 1.0.3 US), logo's van Global VR en PlayMechanix, attract met FREE PLAY / PRESS START. Open: "I/O ERROR: no GVRIO card found" en "no Aliens guns found" op het opstartscherm; invoer nog niet gemeten.
NoteEN = WORKING (2026-10-17, played in mouse mode for 5.5 min: high scores, press start, mission select by shooting, aiming and shooting in the game). Starts by double-click (2026-10-17): PeFillPages (the HASP emulation behind .text that Wine cleared), gamescope with Windowed = 1 at 1920x1080: boot screen, Global VR and PlayMechanix logos, attract with free play / press start. Open: the boot screen reports no GVRIO card and no Aliens guns; input not measured yet.

; Profiel uit TeknoParrot-sjabloon GameProfiles/AliensExtermination.xml, revisie 14 (scripts/import-tp-profiles.py; opnieuw importeren in plaats van met de hand wijzigen)
[Identify]
; aliens.exe staat niet in de map; DATA/aliens dehasped.exe is het spelbestand (byte-identiek aan de .original, BESCHERMING-STATUS.md)
Path = DATA/aliens dehasped.exe
Size = 89698304
Sha256 = 71244646710b5dc73a9aa07af185cb400593266d6b546000e33bea312d1eeaee

