; Standaard voor games met de TeknoParrot-kern (Type = TeknoParrot): de standaardroute van de lader.
; Games die dit niet willen, zetten in hun eigen game.ini RemoteThread = 1 (of een andere waarde) of PostStartMs/EntryPointMs.
; Een lege waarde in een game.ini (RemoteThread =) haalt de sleutel weg: de lader zet dan zelf TP_REMOTETHREAD=1.
; De lader komt uit de eigen build (scripts/build-openparrot.sh, openbare OpenParrot-bron); de kern blijft die van TeknoParrot.
; Terug naar de lader uit de runtime: [Loader] Build = teknoparrot in de game.ini of de gebruikerslaag.
[Loader]
RemoteThread = off
Build = ravengun
