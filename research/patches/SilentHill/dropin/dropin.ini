; Drop-in van Silent Hill: The Arcade (docs/dropins.md). Uitleg en metingen: ../ATTRACT-RUN.md.
;
; shaiolib.dll          ONZE vervanger van Konami's IO-bibliotheek (bron: ../shaiolib_rg.c, bouw: ../build-shaiolib.sh).
;                       Het origineel praat met twee seriele borden (COM1 geweren, COM2 knoppen/munten/beveiligingsstekker);
;                       zonder die borden blijft het spel op "LOW CONTROL ERROR 5-1500" staan. De vervanger exporteert dezelfde
;                       52 namen, zegt dat de borden er zijn, en beantwoordt de beveiligingscontrole voor EEN modelcode
;                       (RG_SHAIO_MODEL, standaard GNGHLAAA). Hij levert nog GEEN invoer: geen knoppen, munten of geweren.
;                       Hij schrijft rg-shaiolib.log naast zichzelf (laadbewijs, eerste aanroep per functie, tellers).
; rg-shaiolib.patches   geheugenpatches voor deze ene build van KSHG.exe, door shaiolib.dll bij het laden toegepast en alleen
;                       als de verwachte bytes er staan. In het geheugen, omdat het spel zijn eigen exe op schijf controleert.
;
; De view moet de map Data/TestDat, Data/acdata en de taalmappen lokaal hebben (het spel schrijft daar); zie
; ../bewijs-attract-20261013/harness/sh-view.sh.
[shaiolib.dll]
To = .

[rg-shaiolib.patches]
To = .
