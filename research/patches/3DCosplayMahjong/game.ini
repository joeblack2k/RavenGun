; 3D Cosplay Mahjong. Stond vroeger als vaste uitzondering in scripts/launch-direct.py: TeknoParrotUi start dit profiel met een
; Japanse landinstelling.
[Game]
Name = 3D Cosplay Mahjong
Profile = 3DCosplayMahjong
Type = TeknoParrot
EmulationProfile = TaitoTypeXGeneric
ProfileRevision = 5

[Env]
LANG = ja_JP.UTF-8
LC_ALL = ja_JP.UTF-8

[Display]
GamescopeCompatibility = RequireWindowed

[Status]
Status = untested
Note = Nog nooit gestart en niet te plannen: het spel staat niet op de NAS, dus er is geen gamemap, geen bestandsevidence en geen startmeting (--plan stopt met rc=4, "game niet gevonden"). Het profiel noemt geen dongle, maar dat is niet aan het spel gemeten.
NoteEN = Never started and impossible to plan: the game is not on the NAS, so there is no game map, no file evidence and no start measurement (--plan stops with rc=4, "game not found"). The profile names no dongle, but that was not measured against the game.

; Profiel uit TeknoParrot-sjabloon GameProfiles/3DCosplayMahjong.xml, revisie 5 (scripts/import-tp-profiles.py; opnieuw importeren in plaats van met de hand wijzigen)
[Config]
General/Input API = DirectInput
General/Windowed = 1

[ConfigType]
General/Input API = Dropdown
General/Windowed = Bool

[ConfigOptions]
General/Input API = DirectInput|XInput
