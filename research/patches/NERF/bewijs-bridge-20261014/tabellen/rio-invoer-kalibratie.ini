# NERF Arcade, native route: table for a CALIBRATION session only (operator menu -> CALIBRATION -> GUN CALIBRATION).
# Same as rio-invoer.ini except that Player 2's lightgun is fed from the daemon's PLAYER 1 sources, because the daemon only
# builds a Player-2 state when a second lightgun exists, and its test pattern drives Player 1 only:
#   - P2 lightgun channels 21/22 follow the P1 aim bytes (12/13): one test-pattern point aims both players.
#   - P2's press (id 8) comes from p1.start (bit 6, daemon key 1); P1's press (id 7) from p1.trigger (bit 7) only.
#     Separate buttons, so one press cannot advance both players' calibration steps at once.
# Use: the four calibration points are aimed with `ravengunctl test-pattern point`; P1 presses with
# `ravengunctl output-button trigger tap`, P2 presses with `ravengunctl key 1 tap`. The game stores what it reads in its
# own prefs ("P1/P2 Gun Min/Max X/Y"). For play, use rio-invoer.ini.

bibliotheek naam=librio.so
proces      naam=Nerf.x86_64
beeld       bits=8

functie naam=RIO_Connected  rol=verbonden  sig=488b0579fc210083
functie naam=RIO_SW_Count   rol=schakelaar sig=8d47dc83f8277738
functie naam=RIO_ADC_Val    rol=adc        sig=89ff488d04bf488d
functie naam=RIO_ADC_Val_Ex rol=adc_ex     sig=8d47ed83f8037740

schakelaar bit=7  id=7     # p1.trigger -> id 7 (P1 press)
schakelaar bit=6  id=8     # p1.start (key 1) -> id 8 (P2 press, calibration only)
schakelaar bit=0  id=3     # test
schakelaar bit=4  id=5     # volume_up
schakelaar bit=5  id=6     # volume_down (menu cursor down, measured)

kanaal bron=12 ch=19 min=0 max=4095 inverteer=nee   # p1.x -> P1 X
kanaal bron=13 ch=20 min=0 max=4095 inverteer=ja    # p1.y -> P1 Y
kanaal bron=12 ch=21 min=0 max=4095 inverteer=nee   # p1.x -> P2 X (calibration only)
kanaal bron=13 ch=22 min=0 max=4095 inverteer=ja    # p1.y -> P2 Y (calibration only)
