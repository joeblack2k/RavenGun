;
; Drop-in van Operation G.H.O.S.T. (docs/dropins.md, docs/geen-dongle-in-de-loader.md).
;
; De donglebeschrijving van deze game staat in ravengun-hasp/OG/. `To = .` betekent: de hoofdmap van
; de game, en de sectienaam is het pad onder dropin/ -- dus het bestand komt op
; view/ravengun-hasp/OG/dongle.json, de plek waar de laag hem zoekt
; (RAVENGUN_HASP_DIR=ravengun-hasp + RAVENGUN_HASP_GAME=OG). Zet het pad NIET ook in `To`, dan komt
; het er dubbel in te staan en vindt de laag hem nooit (docs/dropins.md).
;
; Er staat hier geen bibliotheek en dat is geen omissie: het soort `region` is gegevens zonder
; binary. De regio- en printplaatwaarde is de software-emulatie van dongle en PIC die de
; TeknoParrot-kern zelf doet (findings/12_aanpassingen_en_koppelingen.md paragraaf 7), en de
; 32-bits kern kent de regiokeys DongleRegion en PcbRegion niet. Waarom er (nog) geen
; regio-bibliotheek is staat in docs/region-layer.md paragraaf 6 en in README.md.

[ravengun-hasp/OG/dongle.json]
To = .

; SPDX-License-Identifier: GPL-3.0-or-later
;
; Drop-in voor Operation G.H.O.S.T. (RingWide): de kastapparaten van een Sega Ring-kast (\\.\columba = DMI, \\.\mxsram = backup-SRAM).
; rg-amhw.dll: tools/rg-amhw/rg_amhw.cpp, bouwen met tools/dev/build-amhw.sh. De gebruikerslaag mag naast de meegeleverde dropin.ini staan:
; de secties worden samengevoegd (docs/dropins.md).
;
; Controle dat hij geladen is: rg-direct --plan OG toont rg-amhw.dll bij dropin_lines met TP_PRELOAD_DLL; na de start staat
; rg-amhw.log naast de exe met als eerste regel "rg-amhw geladen in ...", daarna "importtabel: KERNEL32.dll!CreateFileW omgezet".

[rg-amhw.dll]
To = .
Preload = true
; Een Windows-PE-DLL, geen ELF: niet in LD_AUDIT (docs/dropins.md, "Audit = false").
Audit = false
; OEM-tekenreeks 3 uit de DMI-tabel = platform-id (AAM RingWide, AAL RingEdge, AAL2 RingEdge 2) en de systeemfabrikant.
Env = RG_AMHW_OEM=AAM;RG_AMHW_VENDOR=Supermicro
