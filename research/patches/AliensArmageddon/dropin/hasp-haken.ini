# RavenGun — adreslijst voor de generieke HASP-inline-hook, game: Aliens Armageddon
#
# De HASP-HL-cliënt zit STATISCH en gestript in `game` (0 hasp_-symbolen in de dynsym). De adressen komen uit een anker in
# dezelfde spelmap: het programma `patch`, dat dezelfde cliënt bevat en 20 hasp_-symbolen exporteert. find-hasp-adressen.py
# (in patches/AliensArmageddon/) zoekt elke ankerfunctie in `game` met jokers op rel32 en absolute adressen. GEMETEN
# 2026-10-15: login, logout, read, write, encrypt, decrypt, get_size, get_sessioninfo, get_rtc en de legacy-functies hebben
# elk precies EEN treffer, en ALLE treffers liggen op dezelfde verschuiving t.o.v. het anker (+0x226130): het is dezelfde
# kopie van de bibliotheek. hasp_free (22 bytes, 18 treffers) volgt uit diezelfde verschuiving en is een van de treffers.
# De game roept vanuit zijn eigen code precies login, logout, read, write, encrypt, decrypt, get_sessioninfo en free aan.
# `grootte` en `ingang` zijn de versiecontrole: klopt het beeld niet, dan keurt de hook de hele lijst af.
# Ook gevonden (zelfde verschuiving), maar niet door de hook gebruikt en daarom niet actief: hasp_cleanup=0x084434c8, hasp_enable_trace=0x084434d8, hasp_get_rtc=0x084443d0, hasp_legacy_decrypt=0x084437f8, hasp_legacy_encrypt=0x084436e8, hasp_legacy_set_idletime=0x08443b2c, hasp_legacy_set_rtc=0x08443908, hasp_update=0x08443c54
game    = AliensArmageddon
arch    = i386
basis   = absoluut
grootte = 9149556
ingang  = 0x805ce80
hasp_decrypt         = 0x084435f8
hasp_encrypt         = 0x0844350c
hasp_get_sessioninfo = 0x08443f00
hasp_get_size        = 0x08444310
hasp_login           = 0x08443380
hasp_logout          = 0x08443420
hasp_read            = 0x08444178
hasp_write           = 0x08444244
hasp_free            = 0x08443c3c
