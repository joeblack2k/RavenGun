;
; Drop-ins van House of the Dead: Scarlet Dawn zonder TeknoParrot (docs/dropins.md, docs/research/namco/README.md).
;
; rg-allsio.dll (tools/rg-allsio, tools/dev/build-allsio.sh) bootst het Sega ALLS USB-IO-bord na dat amdaemon.exe via HID zoekt, en voedt
; het uit de besturingspijp TeknoParrotPipe (het AllsUsbIo-rapport van onze daemon). De lader laadt hem via TP_PRELOAD_DLL in elk proces van
; het spel; in het spel zelf (Hodzero-Win64-Shipping.exe) doet hij niets, alleen in amdaemon.exe. Logboek: rg-allsio.log naast de DLL
; (de map van Hodzero-Win64-Shipping.exe in de view). Omgeving (optioneel, [Env] in game.ini): RG_ALLSIO_PIPE, RG_ALLSIO_PERIOD_MS, RG_ALLSIO_OFF=1.
;
; Uitzetten: haal de sectie weg (dan is er geen USB-IO-bord en start het spel zonder invoer van de daemon).

[rg-allsio.dll]
To = .
Preload = true
