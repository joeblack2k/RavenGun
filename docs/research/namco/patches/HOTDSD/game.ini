; Gegenereerd door scripts/migrate-game-settings.py (docs/per-game-patches.md). Sleutels die het script afleidt uit de oude bronnen worden bij
; elke run opnieuw gezet; handwerk in andere sleutels blijft staan.
;
; Uit het oude UserProfiles/HOTDSD.env:
; HOTDSD (twee exe): via TeknoParrotUi met de wine-prefix-wrapper; RG_UNSET_REMOTETHREAD haalt TP_REMOTETHREAD weg (standaardroute van de lader)

[Game]
Name = House of the Dead: Scarlet Dawn
Profile = HOTDSD
Type = TeknoParrot
EmulationProfile = ALLSHOTDSD
Executable = Hodzero-Win64-Shipping.exe
Executable2 = amdaemon.exe
Is64Bit = true
ProfileRevision = 21
HasTwoExecutables = true
LaunchSecondExecutableFirst = true

[Launch]
Arguments = -UNATTENDED
; Zonder TeknoParrotUi: rg-direct start amdaemon.exe en het spel (twee exe's); de daemon levert alle invoer (2026-10-14).
Mode = direct
; Het platform-id dat amdaemon.exe uit het register leest (HKLM\System\SEGA\SystemProperty\Static\PlatformId; zie
; data/platform.reg en docs/research/namco/README.md, HOTD Scarlet Dawn).
Registry = data/platform.reg

[Loader]
; KANDIDAAT zonder TeknoParrot (eigenaar-besluit 2026-10-17: RavenGun mag de platformgegevens van amdaemon zelf leveren): onze eigen
; OpenParrot-kern (generieke route, schijfletter-omleiding .\TeknoParrot\<L>\ uit patch 0004) in beide processen.
Core = ravengun
; De standaardroute van de lader voor een eigen kern (RemoteThread = off uit _defaults/TeknoParrot.ini), zoals bij de andere games op onze kern.

[Wine]
Prefix = shared
Runner = wrapper

[Input]
; Trekkers en richten via het gedeelde geheugen (indeling HOTDSDPipe); START, subtrekker, controllerkeuze, test en munt via het
; ALLS USB-IO-rapport op \\.\pipe\TeknoParrotPipe (packaging/control-pipe-profiles.json, docs/gamepad.md / docs/architecture.md).
Route = tp-shm
Layout = HOTDSDPipe
ControlPipe = AllsUsbIo
Note = zonder TeknoParrotUi (2026-10-14): rg-direct plant de twee exe's (amdaemon.exe eerst, 5 s wachten); de daemon schrijft trekkers en richten in het gedeelde geheugen (HOTDSDPipe) en het 64-byte ALLS USB-IO-rapport voor START, subtrekker (granaat), controllerkeuze (aux1), test (toets 0/F2) en munt (toets 5); rg-direct stroomt het rapport elke 15 ms naar \\.\pipe\TeknoParrotPipe (een tweede rg-jvsbridge). UserProfiles/HOTDSD.env levert nog RG_WINEPREFIX en RG_UNSET_REMOTETHREAD=1 (wrappers/wine-prefix). Vrij spel (FreePlay=1).

[Env]
RG_UNSET_REMOTETHREAD = 1
; Synthetische benchidentiteit; alleen de daemon-API, niet de gedeelde Wine-computernaam.
RG_ALLSIO_MAIN_ID = RAVENGUN0000001

; Voor de directe start met twee exe's (open punt): eerst amdaemon.exe (ExecutableName2, LaunchSecondExecutableFirst),
; 5 seconden wachten (DAEMON_WAIT_SECONDS uit StartApp.bat), dan Hodzero-Win64-Shipping.exe. AMDaemon/config.json heeft
; error.auto_reset = true: een herstart na een fout is gewoon gedrag.
; Bediening voor de knoppen-uitleg bij de eerste start (docs/per-game-patches.md, "Bediening per game"); labels uit het
; TeknoParrot-profiel (GameProfiles/<P>.xml), "Not confirmed yet" = de werking is nog niet gemeten.
[Controls]
trigger = Trigger | Fires the gun.
grenade = Sub-trigger | The second trigger of the gun. Used by the game; exact function not confirmed yet.
aux1 = Controller select | Selects the controller. Used by the game; exact function not confirmed yet.

[Status]
Status = unknown
Note = KANDIDAAT zonder TeknoParrot-kern: gemeten 2026-10-17 21:48, wit beeld en fout 4105. OSVersion en main-id-fouten verholpen; amDongleInit -16 en amHmInit -5 blijven. USB-IO-initialisatie niet bewezen; zie docs/research/namco/README.md. Stand op de gesloten kern: WERKT zonder TeknoParrotUi (2026-10-14): een dubbelklik in RavenGun start amdaemon.exe en het spel via rg-direct (twee exe's, de gesloten kern). Alle invoer komt van de daemon: trekkers en richten via het gedeelde geheugen (HOTDSDPipe), START, subtrekker, controllerkeuze, test en munt via het ALLS USB-IO-rapport op TeknoParrotPipe (besturingspipe AllsUsbIo). Gemeten op de tv (testpatroon en trekker van de daemon): START -> titel -> MODE SELECT -> STORY MODE -> ITEMS -> in het level, CONTINUE, GAME OVER en ranglijst; 8:44 min aaneen. Een eerdere run stopte na ~3 min met exitcode 3 terwijl mijn muisinjectie op het bureaublad klikte (oorzaak niet vastgesteld). Nog niet gespeeld met de echte Move; subtrekker en controllerkeuze niet apart gecontroleerd.
NoteEN = CANDIDATE without the TeknoParrot core: tested 2026-10-17 21:48, white display and error 4105. OSVersion and main-ID errors resolved; amDongleInit -16 and amHmInit -5 remain. USB-IO initialization is not proven. See docs/research/namco/README.md. State on the closed core: WORKING without TeknoParrotUi (2026-10-14): a double-click in RavenGun starts amdaemon.exe and the game through rg-direct (two executables, the closed core). All input comes from the daemon: triggers and aim through the shared memory (HOTDSDPipe), START, sub-trigger, controller select, test and coin through the ALLS USB-IO report on TeknoParrotPipe (control pipe AllsUsbIo). Measured on the TV (the daemon's test pattern and trigger): START -> title -> MODE SELECT -> STORY MODE -> ITEMS -> in the level, CONTINUE, GAME OVER and ranking; 8:44 min continuous. An earlier run stopped after ~3 min with exit code 3 while my mouse injection was clicking on the desktop (cause not established). Not yet played with the real Move; sub-trigger and controller select not checked separately.
Findings = findings/HOTDScarletDawn.md

