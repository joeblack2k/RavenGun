; Drop-in van RavenGun voor Mario Kart Arcade GP DX (Namco ES3, 32-bits PE onder Wine).
;
; rg-mfcam.dll   de Media Foundation-camera van RavenGun (tools/rg-mfcam/rg_mfcam.cpp; bouwen: scripts/build-mfcam.sh)
;
; WAAROM
; ------
; Het spel maakt een spelersfoto met de camera van de kast en zoekt die via Media Foundation (MF.dll!MFEnumDeviceSources, daarna
; MFCreateSourceReaderFromMediaSource). Wine kent daar geen videocamera's: MFEnumDeviceSources geeft er 0 (gemeten in mf.dll van
; proton-11.0-2). Deze DLL zet die ene invoer in de importtabel van MK_AGP3_FINAL.exe om en biedt de camera van de daemon aan
; (het beeld staat in /dev/shm/ravengun_Camera zolang de daemon de camera voor deze game aan heeft: [Camera] Use = game).
; Zonder dat bestand roept hij gewoon de oorspronkelijke functie aan: dan is alles zoals zonder drop-in.
;
; HOE JE CONTROLEERT DAT HIJ GELADEN IS
; -------------------------------------
;   1. rg-direct --plan MarioKartDX: bij dropin_lines staat rg-mfcam.dll met TP_PRELOAD_DLL;
;   2. in de view staat na de start rg-mfcam.log met als eerste regel "rg-mfcam geladen in ...MK_AGP3_FINAL.exe" en daarna
;      "importtabel: MF.dll!MFEnumDeviceSources omgezet". Zonder dat logboek is de DLL niet geladen;
;   3. vraagt het spel om een camera, dan staat er "MFEnumDeviceSources #1 (VIDCAP): 1 camera", "ActivateObject", "Start: ..."
;      en "beeld 1 geleverd".

[rg-mfcam.dll]
To = .
Preload = true
; Een Windows-PE-DLL, geen ELF: niet in LD_AUDIT (docs/dropins.md, "Audit = false").
Audit = false
; JVS over COM3 (DERDE TAAK in rg_mfcam.cpp, zonder de gesloten kern): het spel opent `COM3` (MK_AGP3_FINAL.exe, CreateFileA op 0x8ac1f2);
; RG_JVS_COMPORT zet de omleiding naar de pipe \\.\pipe\TeknoParrot_JVS aan (de brug rg-jvsbridge maakt hem, de daemon is het bord MKDX).
; In rg-mfcam.log: "JVS-omleiding aan: COM3 -> ..." en bij het openen "JVS: CreateFileA(COM3) -> pipe ..., handvat ...".
; Eigen ShareK-object (VIERDE TAAK in rg_mfcam.cpp, tools/rg-mfcam/sharek_fake.h): zonder dit geeft CoCreateInstance voor de ShareK-klasse
; {ccc44b2a-...} (ipccl.dll, op de echte kast met RegAsm geregistreerd) 0x80040154 en valt het spel na ~15 s op 0x47E95E (toegangsfout op de
; lege interface in de catch-afhandelaar 0x47E8F8). Met de TeknoParrot-kern (Online play) blijft dit vanzelf uit: de DLL controleert dat zelf.
; In rg-mfcam.log: "importtabel: ole32.dll!CoCreateInstance omgezet" en "ShareK: CoCreateInstance({CCC44B2A-...}) -> eigen object".
; Aanvullende schijfletter-herleiding (ZESDE TAAK in rg_mfcam.cpp, tools/rg-mfcam/drive_fix.h): de kern (patch 0004) herleidt F:/x alleen voor
; CreateFile/CreateDirectory; het spel hernoemt (CRT rename), zoekt (FindFirstFile) en controleert (GetFileAttributesW, _waccess_s) ook. Zonder
; dit blijven er alleen *.bin.tmp over en begint elke start met lege instellingen. Alleen F (G: blijft met rust: ShareK dan uit).
; In rg-mfcam.log: "schijfletter: rename(F:/system/... => ...) -> .\TeknoParrot\F\system/... = 0".
; Stalldump (meetgereedschap, standaard uit): RG_STALL_DUMP=20,45,90 achter de andere Env-waarden zetten.
; Banapass-kaartlezer (ZEVENDE TAAK in rg_mfcam.cpp, tools/rg-mfcam/bngrw_fake.h): het spel gebruikt de echte bngrw.dll (COM4/COM2), de TP-kern
; vervangt die; onze kern niet. RG_BNGRW=trace logt elke aanroep en callback van de echte bibliotheek (bngrw: ...), RG_BNGRW=fake geeft zelf antwoord
; (twee lezers zonder kaart). Eerst trace, dan fake proberen.
; Schijfletters zoals TeknoParrot (ZESDE/ACHTSTE TAAK): RG_DRIVE_FIXUP=F past de F:/-tekenreeksen van het spel in het geheugen aan ("F:/playdata/" ->
; "./Fplaydata/", zelfde lengte; TP doet dat ook en het spel logt het zelf), dus de bestanden komen in de view-wortel (FTestMode, Fsystem, ...) en zijn
; dezelfde als onder TP. RG_MSGTRACE=1 volgt de berichtenlus en de vensters van het spel (rg-mfcam.log: "PeekMessageW #1: binnen/terug", "vensters van deze draad").
; Venstermodus zoals TeknoParrot Windowed=1 (NEGENDE TAAK in rg_mfcam.cpp, tools/rg-mfcam/window_mode.h): het spel (DXUT, D3D10) zet zelf volledig
; scherm als standaard (0x4057AD); DXVK wisselt dan van modus ("Setting display mode: 1368x768@60") en de eerste PeekMessageW keert niet terug (zwart).
; Onder TP staat die regel er niet. RG_WINDOWED=1 zet de standaard op venster; in rg-mfcam.log: "venstermodus aan: mov [ebx+0x30],1 -> 0 op VA 0x4057ad".
; Het STR-bord (stuur/krachtterugkoppeling, TIENDE TAAK in rg_mfcam.cpp, tools/rg-mfcam/str_board.h): het spel praat met dat bord over \\.\COM1
; (19200 8N1) en geeft E22-12 "STR PCB 通信エラー" als het bord geen "C01" meldt. RG_STR_COMPORT=COM1 maakt er een eigen bord van (verbonden, geen fout,
; krachtterugkoppeling genegeerd). In rg-mfcam.log: "STR-bord: CreateFileA(\\.\COM1, ...) -> eigen bord" en "STR-bord: status C01 gestuurd".
; De kaartlezer is de stap erna (0x602E8C): RG_BNGRW=fake (twee lezers zonder kaart) in plaats van trace.
Env = RG_JVS_COMPORT=COM3;RG_SHAREK_FAKE=1;RG_DRIVE_FIXUP=F;RG_BNGRW=fake;RG_WINDOWED=1;RG_STR_COMPORT=COM1
