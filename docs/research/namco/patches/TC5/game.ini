; Gegenereerd door scripts/migrate-game-settings.py (docs/per-game-patches.md). Sleutels die het script afleidt uit de oude bronnen worden bij
; elke run opnieuw gezet; handwerk in andere sleutels blijft staan.

[Game]
Name = Time Crisis 5
Profile = TC5
Type = TeknoParrot
EmulationProfile = TimeCrisis5
Executable = RSLauncher.exe
Is64Bit = true
ProfileRevision = 19

[Launch]
Mode = direct
WorkingDirectory = .

; KANDIDAAT zonder TeknoParrot (docs/research/namco/README.md, Time Crisis 5): onze eigen OpenParrot-lader en -kern (generieke route; de
; schijfletter-omleiding .\TeknoParrot\<L>\ geldt voor de nbamsavdat-bestanden van RSLauncher.exe). bngrw.dll en iDmacDrv64.dll zijn geen
; eis van het spel (geen van beide exe's importeert ze). Het USIO-bord komt uit dropin/winusb.dll. Terug naar de gesloten kern:
; Build = teknoparrot en Core = teknoparrot (en dan de [winusb.dll]-sectie uit dropin/dropin.ini weg).
[Loader]
Build = ravengun
Core = ravengun

[Input]
Route = tp-shm
Layout = TimeCrisis5
CoinKeys = lshift,t
Note = de game leest zijn munt uit het toetsenbord (Shift+T); aim, trekker en pedalen komen via tp-shm

; Bediening voor de knoppen-uitleg bij de eerste start (docs/per-game-patches.md, "Bediening per game"); labels uit het
; TeknoParrot-profiel (GameProfiles/<P>.xml), "Not confirmed yet" = de werking is nog niet gemeten.
[Controls]
trigger = Gun trigger | Fires the gun.
reload = Gun button | The button on the gun. Used by the game; exact function not confirmed yet.
grenade = Left pedal | Pedal; in Time Crisis it takes cover. Not confirmed yet.
aux1 = Right pedal | Pedal; in Time Crisis it takes cover. Not confirmed yet.

[Status]
Status = playable
Note = KANDIDAAT zonder TeknoParrot-kern (nog niet op de tv gemeten; richten en trekker via SendInput in winusb.dll is een gok). Stand op de gesloten kern: speelbaar via de IO-brug (tp-shm): richten, trekker en linker pedaal (middenknop) werken; munt = Move-knop voor toets 5 (de daemon geeft de game daarvoor Shift+T). Schiet in het menu om '1-player solo' te kiezen. Rechter pedaal nog niet apart gecontroleerd.
NoteEN = CANDIDATE without the TeknoParrot core (not measured on the TV yet; aim and trigger through SendInput in winusb.dll is a guess). State on the closed core: playable through the I/O bridge (shared memory): aiming, trigger and left pedal (middle button) work; coin = the Move button for key 5 (the engine sends Shift+T to the game). Shoot '1-player solo' in the menu. The right pedal has not been checked on its own yet.

