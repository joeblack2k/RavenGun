; KANDIDAAT, niet actief: Let's Go Island (RingWide, LGI_RingW_F_safe.exe) zonder de gesloten TeknoParrot-kern.
; Achtergrond, bewijs en de test: docs/research/segajvs/README.md.
;
; Dit is een overlay voor de gebruikerslaag (docs/per-game-patches.md): per sleutel wint hij van patches/LGI/game.ini.
; Proberen:   mkdir -p ~/.local/share/ravengun/patches/LGI && cp LGI.game.ini ~/.local/share/ravengun/patches/LGI/game.ini
; Terugdraaien: dat bestand weghalen. Pas na een geslaagde test van 5 minuten (attract, START, schieten) gaan de regels hieronder
; in patches/LGI/game.ini zelf.
;
; Wat hij doet: de eigen OpenParrot-lader en de eigen OpenParrot-kern (Core = ravengun), JVS via rg-jvsbridge naar het bord van de
; daemon (ongewijzigd, [Input] van game.ini), geen bestand uit de TeknoParrot-runtime in de opdrachtregel. De COM4-omleiding naar de
; JVS-pipe doet onze kern zelf (OpenParrot Functions/Ring_amLib/amJvs.cpp).
; Gemeten op onze kern (patches/EIGEN-KERN.md): het spel start, leeft na 25 s en de JVS-pipe antwoordt. Niet gemeten: attract, START, schieten.
[Loader]
Core = ravengun
