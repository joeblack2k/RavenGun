;
; KANDIDAAT, niet actief: Dream Raiders (RingWide, Game.exe) zonder de gesloten TeknoParrot-kern.
; Achtergrond, bewijs en de test: docs/research/segajvs/README.md.
;
; Dit is een overlay voor de gebruikerslaag (docs/per-game-patches.md): per sleutel wint hij van patches/SDR/game.ini.
; Proberen:   mkdir -p ~/.local/share/ravengun/patches/SDR && cp SDR.game.ini ~/.local/share/ravengun/patches/SDR/game.ini
; Terugdraaien: dat bestand weghalen. Pas na een geslaagde test van 5 minuten (attract, START, schieten) gaan de regels hieronder
; in patches/SDR/game.ini zelf.
;
; Wat hij doet: [Launch] AmDaemon = true laat rg-direct de AM-daemon spelen (poorten 40100-40115, elk verzoek met antwoord in het
; logboek: 'AM-daemon :...'); [AmDaemon] zet per sleutel het antwoord (de standaard staat in amdaemon.cpp). Verder: de eigen
; OpenParrot-lader en -kern (Core = ravengun), JVS via rg-jvsbridge naar het bord van de
; daemon (ongewijzigd, [Input] van game.ini), geen bestand uit de TeknoParrot-runtime in de opdrachtregel. De COM4-omleiding naar de
; JVS-pipe doet onze kern zelf (OpenParrot Functions/Ring_amLib/amJvs.cpp).
; Niet op onze kern gemeten.
[Loader]
Core = ravengun

[Launch]
AmDaemon = true

[AmDaemon]
; keychip.appboot.gameid: van deze game onbekend (geen *_Table.dat, geen gameid.txt); de standaard SBUH staat in de code. Zie het logboek.
