;
; KANDIDAAT, niet actief: SEGA Golden Gun (RingWide) zonder de gesloten TeknoParrot-kern (docs/research/segajvs/README.md).
;
; Overlay voor de gebruikerslaag (docs/per-game-patches.md): per sleutel wint hij van patches/GG/game.ini.
; Testrecept: docs/research/segajvs/README.md, "Testrecept". Samen met dropin/dropin.ini en rg-amhw.dll (tools/dev/build-amhw.sh).

[Loader]
Core = ravengun

[Launch]
AmDaemon = true

[AmDaemon]
; keychip.appboot.platformid wordt door de game nergens teruggelezen; het DMI-platform (OEM-tekenreeks) staat in dropin/dropin.ini.
keychip.appboot.platformid = AAM
; het vierletterige spel-id: MACtbl/*_Table.dat of gameid.txt in de spelmap
keychip.appboot.gameid = SBVE
; de regio van deze game staat niet in [Game] DongleRegion maar in [Config]: EXPORT
keychip.appboot.region = 04
