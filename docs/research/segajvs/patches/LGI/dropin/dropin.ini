;
; Drop-in voor Let's Go Island (RingWide): de kastapparaten van een Sega Ring-kast (\\.\columba = DMI, \\.\mxsram = backup-SRAM).
; rg-amhw.dll: tools/rg-amhw/rg_amhw.cpp, bouwen met tools/dev/build-amhw.sh. De gebruikerslaag mag naast de meegeleverde dropin.ini staan:
; de secties worden samengevoegd (docs/dropins.md).
;
; Controle dat hij geladen is: rg-direct --plan LGI toont rg-amhw.dll bij dropin_lines met TP_PRELOAD_DLL; na de start staat
; rg-amhw.log naast de exe met als eerste regel "rg-amhw geladen in ...", daarna "importtabel: KERNEL32.dll!CreateFileW omgezet".

[rg-amhw.dll]
To = .
Preload = true
; Een Windows-PE-DLL, geen ELF: niet in LD_AUDIT (docs/dropins.md, "Audit = false").
Audit = false
; OEM-tekenreeks 3 uit de DMI-tabel = platform-id (AAM RingWide, AAL RingEdge, AAL2 RingEdge 2) en de systeemfabrikant.
; Dipschakelaar 0 aan = standaardkast (STD) zonder bewegende passagiersstoel (README, "Meting 17"): invoerpoort 0 bit 0 laag. Uit (FF) is een DX-kast: dan zoekt de game
; een stoelbord op COM2/COM3 en stopt met `halt!` (BaseModule.cpp 149).
Env = RG_AMHW_OEM=AAM;RG_AMHW_VENDOR=Supermicro;RG_AMHW_DIPIN=FE,FF
