;
; KANDIDAAT, niet actief: Transformers: Human Alliance (RingEdge 2) zonder de gesloten TeknoParrot-kern (docs/research/segajvs/README.md).
;
; Overlay voor de gebruikerslaag (docs/per-game-patches.md): per sleutel wint hij van patches/Transformers/game.ini.
; Testrecept: docs/research/segajvs/README.md, "Testrecept". Samen met dropin/dropin.ini en rg-amhw.dll (tools/dev/build-amhw.sh).

[Loader]
Core = ravengun

[Launch]
AmDaemon = true

[AmDaemon]
; keychip.appboot.platformid wordt door de game nergens teruggelezen; het DMI-platform (OEM-tekenreeks) staat in dropin/dropin.ini.
keychip.appboot.platformid = AAL
; het vierletterige spel-id: de naam van <id>_Table.dat in de exe (strings); rg-amhw maakt die tabel als hij op de NAS ontbreekt
keychip.appboot.gameid = SBYR
; de regio van deze game staat niet in [Game] DongleRegion maar in [Config]: USA
keychip.appboot.region = 02
