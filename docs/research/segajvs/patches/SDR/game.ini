;
; KANDIDAAT, niet actief: Dream Raiders (RingWide) zonder de gesloten TeknoParrot-kern (docs/research/segajvs/README.md).
;
; Overlay voor de gebruikerslaag (docs/per-game-patches.md): per sleutel wint hij van patches/SDR/game.ini.
; Testrecept: docs/research/segajvs/README.md, "Testrecept". Samen met dropin/dropin.ini en rg-amhw.dll (tools/dev/build-amhw.sh).

[Loader]
Core = ravengun

[Launch]
AmDaemon = true
; SDR draait nu rechtstreeks van de NAS (View = off); een drop-in heeft een lokale view nodig. Leeg = automatisch.
View =
; Game.exe 0x4019C0: GetFileAttributesA(".\data") != 0x10 -> SetCurrentDirectoryA("..\"). Een gelinkte map is 0x410 onder Proton; zonder dit stapt de game uit de view
; (GAME.INI en .\data\... niet te vinden, zwart beeld). README, "Meting 18". Terugval: RG_AMHW_NOREPARSE=1 in dropin/dropin.ini.
ViewRealDirs = Data

[AmDaemon]
; keychip.appboot.platformid wordt door de game nergens teruggelezen; het DMI-platform (OEM-tekenreeks) staat in dropin/dropin.ini.
keychip.appboot.platformid = AAM
; het vierletterige spel-id: de naam van <id>_Table.dat in de exe (strings); rg-amhw maakt die tabel als hij op de NAS ontbreekt
keychip.appboot.gameid = SBXM
