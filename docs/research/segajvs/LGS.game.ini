;
; KANDIDAAT, niet actief: Let's Go Safari (RingWide, GameSampR_RingWide.exe, stuurwiel) zonder de gesloten TeknoParrot-kern.
; Achtergrond, bewijs en de test: docs/research/segajvs/README.md.
;
; Dit is een overlay voor de gebruikerslaag (docs/per-game-patches.md): per sleutel wint hij van patches/LGS/game.ini.
; Proberen:   mkdir -p ~/.local/share/ravengun/patches/LGS && cp LGS.game.ini ~/.local/share/ravengun/patches/LGS/game.ini
; Terugdraaien: dat bestand weghalen. Pas na een geslaagde test van 5 minuten (attract, START, schieten) gaan de regels hieronder
; in patches/LGS/game.ini zelf.
;
; Wat hij doet: de eigen OpenParrot-lader en de eigen OpenParrot-kern (Core = ravengun), JVS via rg-jvsbridge naar het bord van de
; daemon (ongewijzigd, [Input] van game.ini), geen bestand uit de TeknoParrot-runtime in de opdrachtregel. De COM4-omleiding naar de
; JVS-pipe doet onze kern zelf (OpenParrot Functions/Ring_amLib/amJvs.cpp).
; Het zwaarste geval: zonder kern hangt het spel in zijn init op de AM-daemon (docs/decisions.md, 'IO-brug stap 3'). Hier beslist de test of de AM-daemon echt nodig is.
[Loader]
Core = ravengun
