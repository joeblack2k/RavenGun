# RavenGun: Lindbergh-games met CRI-geluid (librnalindbergh_jr.so, ALSA direct) openen het vaste apparaat "plughw:0, 0"
# (kaart 0, apparaat 0 van de arcadekast). Hier is kaart 0 een HDMI-kaart zonder apparaat 0, dus snd_pcm_open geeft ENOENT en het
# spel blijft stil. Dit bestand (ALSA_CONFIG_PATH=/rg/alsa.conf) leidt elke hw/plughw/default-naam naar PipeWire/PulseAudio.
# Gemeten in de sandbox van de native route met een 32-bit proefprogramma: zonder dit bestand -2 (ENOENT), met dit bestand 0 en een
# stroom "ALSA plug-in" van 2 of 6 kanalen in pactl list sink-inputs.
pcm.plughw {
    @args [ CARD DEV ]
    @args.CARD { type string default 0 }
    @args.DEV { type string default 0 }
    type plug
    slave.pcm "pulse"
}
pcm.hw {
    @args [ CARD DEV SUBDEV ]
    @args.CARD { type string default 0 }
    @args.DEV { type string default 0 }
    @args.SUBDEV { type string default 0 }
    type plug
    slave.pcm "pulse"
}
pcm.pulse { type pulse }
pcm.default { type plug slave.pcm "pulse" }
pcm.sysdefault { type plug slave.pcm "pulse" }
pcm.front { type plug slave.pcm "pulse" }
pcm.surround40 { type plug slave.pcm "pulse" }
pcm.surround51 { type plug slave.pcm "pulse" }
pcm.surround71 { type plug slave.pcm "pulse" }
ctl.pulse { type pulse }
ctl.default { type pulse }
