; KANDIDAAT, NIET AFGEMAAKT: Lost Land Adventure zonder TeknoParrot (docs/research/losse/LostLandAdventure.md).
; De shipped patches/LostLandAdventure/game.ini blijft op de TeknoParrot-kern tot de open punten (gun peripheral, dongle, ALL.Net) zijn opgelost.
; Verschil met de shipped versie: alleen [Loader] Core = none, plus de drop-in patches/LostLandAdventure/dropin/ (secties uit LostLandAdventure.dropin.ini in dropin.ini; was: hernoemen naar
; dropin/) met onze wajvio.dll. De shm-bits die de DLL leest staan in LostLandAdventure.tp-shm-profile.json.
[Game]
Name = Lost Land Adventure
Profile = LostLandAdventure
Executable = RSLauncher.exe
Type = TeknoParrot
EmulationProfile = LostLandAdventures
Is64Bit = true
ProfileRevision = 28

[Launch]
Mode = direct
WorkingDirectory = .
; RSLauncher.exe importeert mfc100u.dll (Visual C++ 2010 MFC, 64 bits); uit Steam's vcredist via scripts/setup-redist.sh
NativeDlls = mfc100u

[Loader]
; Core = none: geen lader en geen kern, Wine start RSLauncher.exe zelf. De generieke OpenParrot-route doet voor deze game niets (geen
; GameID, dus geen hooks); de TeknoParrot-kern was hier alleen nodig voor wat wij vervangen of nog moeten vervangen: de seriele
; JVS-poort (nu wajvio.dll), de HASP-hooks en het gun peripheral.
Core = none

[Input]
Route = tp-shm
Layout = LostLandAdventures
Note = tp-shm, indeling LostLandAdventures: trekkers en richten (bits 0/1, assen 12..24) voor het gun peripheral van de game-exe; service, munt, test, start en testmenu (bits 2..9) voor onze wajvio.dll

[Controls]
trigger = Shoot | Fires the gun.

[Status]
Status = untested
Note = KANDIDAAT zonder TeknoParrot-kern (Core = none) met eigen wajvio.dll. Niet gemeten. Bekend open: gun peripheral, dongle-gegevens, ALL.Net, taal.
NoteEN = CANDIDATE without the TeknoParrot core (Core = none) with our own wajvio.dll. Not measured. Open: gun peripheral, dongle data, ALL.Net, language.

[Identify]
Path = RSLauncher.exe

[Config]
General/Input API = RawInput
General/FreePlay = 0
General/Windowed = 1
General/Borderless Fullscreen = 0
General/Show Cursor = 0
General/Dome Crosshair Correction = 0
General/Use Relative Input = 0
General/Player 1 Relative Sensitivity = 8
General/Player 2 Relative Sensitivity = 8
Arguments/Text Language = English
Arguments/Voice Language = English

[ConfigType]
General/Input API = Dropdown
General/FreePlay = Bool
General/Windowed = Bool
General/Borderless Fullscreen = Bool
General/Show Cursor = Bool
General/Dome Crosshair Correction = Bool
General/Use Relative Input = Bool
General/Player 1 Relative Sensitivity = Slider
General/Player 2 Relative Sensitivity = Slider
Arguments/Text Language = Dropdown
Arguments/Voice Language = Dropdown

[ConfigOptions]
General/Input API = DirectInput|XInput|RawInput
Arguments/Text Language = English|Japanese
Arguments/Voice Language = English|Japanese
