; KANDIDAAT (niet actief: de engine leest alleen patches/<Game>/dropin/, niet deze map). Activeren = deze map hernoemen naar
; dropin/ en de [Loader]-sectie uit docs/research/losse/LostLandAdventure.game.ini overnemen. Zie
; docs/research/losse/LostLandAdventure.md voor wat er nog ontbreekt voordat de game zonder TeknoParrot speelt.
;
; wajvio.dll: RavenGun's vervanging voor Namco's WinArc-JVS-bibliotheek (tools/rg-lostland/, gebouwd met
; tools/rg-lostland/build.sh). RSLauncher.exe importeert hem op naam uit zijn eigen map; het bestand in de view is een symlink
; naar de NAS en wordt door de drop-in-motor vervangen (zoals bij de hasp-DLL's van Time Crisis 5).
[wajvio.dll]
To = .
DllOverride = native
; Het logboek komt naast RSLauncher.exe in de view: zonder rg-wajvio.log is de DLL niet geladen.
Env = RG_WAJV_LOG=Z:\home\deck\.local\share\ravengun\runtime\views\LostLandAdventure\rg-wajvio.log
