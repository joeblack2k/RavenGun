; Drop-in-kandidaat van RavenGun voor Aliens Extermination (Global VR, 32-bit PE onder Wine), ZONDER TeknoParrot.
; Staat bewust NIET in patches/AliensExtermination/dropin/: zolang de game op de gesloten kern staat, zou deze haak naast de
; haken van die kern in joyGetPosEx en GetAsyncKeyState zitten. Verhuis deze map naar patches/AliensExtermination/dropin/ op
; hetzelfde moment als docs/research/losse/AliensExtermination.game.ini naar patches/AliensExtermination/game.ini.
;
; rg-aliens-hook.dll (tools/rg-aliens/, bouwen: tools/rg-aliens/build.sh) wordt door onze eigen OpenParrot-lader in het spelproces
; geladen (TP_PRELOAD_DLL, Preload = true) en zet twee plekken in de importtabel van de game om: winmm!joyGetPosEx (richten en
; wapenknoppen van speler 1 en 2) en user32!GetAsyncKeyState (munt, start, test, select, volume). De invoer komt uit het gedeelde
; geheugen TeknoParrot_JvsState (tp-shm-indeling AliensExtermination), dat de daemon schrijft. Zie AliensExtermination.md.
;
; Het logboek (RG_ALIENS_LOG) is het laadbewijs: zonder die regels is de DLL niet in het spelproces geweest.
; Het pad is het Wine-pad naar de view van de game; de hoofdmap van de game is hier DATA (Executable = DATA/aliens dehasped.exe).

[rg-aliens-hook.dll]
To = .
Preload = true
; Een Windows-PE-DLL, geen ELF: nooit in LD_AUDIT (zelfde reden als de haak van Luigi's Mansion).
Audit = false
Env = RG_ALIENS_LOG=Z:\home\deck\.local\share\ravengun\runtime\views\AliensExtermination\DATA\rg-aliens-hook.log
