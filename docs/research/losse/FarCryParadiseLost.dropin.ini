; KANDIDAAT, nog niet actief (de launcher leest alleen dropin/dropin.ini). Activeren: dit bestand hernoemen naar dropin.ini en de [Loader]-
; regels uit docs/research/losse/FarCryParadiseLost.game.ini in game.ini zetten; ze horen bij elkaar. Zolang game.ini op de TeknoParrot-kern
; staat (nu), moet dropin.ini NIET bestaan: de kern en onze Usbioextreme.dll kennen elkaar niet, en de kalibratie hieronder (1..255)
; past niet bij de assen die de kern aanlevert.
;
; Far Cry: Paradise Lost zonder TeknoParrot. Wat het origineel doet en waarom dit zo is: docs/research/losse/FarCryParadiseLost.md.
;
; Usbioextreme.dll      ONZE vervanger (bron tools/rg-farcry/, bouw tools/rg-farcry/build.sh) van de USB-HID-bibliotheek van het IO-bord.
;                       Zelfde 29 namen en ordinalen. Hij meldt een bord en vult het record (assen, knoppen, muntteller) uit het bordbeeld
;                       van de daemon (tp-shm, indeling FarCryPipe). De game laadt hem uit zijn eigen map op naam; geen DllOverride nodig.
;                       Logboek: rg-usbio.log naast de DLL (laadbewijs, bordbeeldwijzigingen, de eerste assen).
;                       Omgeving (optioneel): RG_USBIO_OPS=TSUD (welke bedienknop op welk bit; niet gemeten welke welke is),
;                       RG_USBIO_INVERT=x|y|xy (as omdraaien; niet gemeten of de game dezelfde richting verwacht als het bordbeeld).
; Arcade_Calibration.txt  min en max per as (X1 Y1 X2 Y2) in dezelfde eenheid als de ruwe assen. Het origineel van de kast zegt 0..2000 (de
;                       eenheid van m_arcadeAxisResolution); onze assen zijn bytes, 1..255.
; systemcfg.lua, Systemcfgoverride.lua   r_Fullscreen = "0": de game draait als venster 1920x1080 (gamescope maakt hem schermvullend). Dat deed
;                       de TeknoParrot-kern met [Config] Windowed = 1; zonder kern hing de game in UpdateWindow/ChangeDisplaySettings (gemeten
;                       2026-10-15, zie game.ini). Beide bestanden, omdat niet gemeten is welke de ander overschrijft.

