; Silent Scope: Bone Eater (Konami, 64 bits, TeknoMacaw). Een geweer met scope; de scope komt bij ons als overlay op hetzelfde scherm.
[Game]
Name = Silent Scope: Bone Eater
Profile = SilentScopeBoneEater
Executable = arkndd.dll
Type = TeknoMacaw
EmulationProfile = KonamiAcio
Is64Bit = true
ProfileRevision = 17
Patreon = false

[Launch]
Mode = direct
; DXVK: met wined3d bleef het zwart (2026-10-17)
Dxvk = true
; Wine's GdipPrivateAddMemoryFont neemt geen TrueType-collectie aan; het spel stopte met "No font loaded or no font families data
; in font file" (WindowsFont.cpp). De drie collecties die gamendd.dll via GDI+ laadt worden in de view face 0 als losse font.
ViewRealDirs = data/font
ViewTtcAsTtf = data/font/df_heiseigothic_w5.ttc, data/font/df_heiseigothic_w7.ttc, data/font/df_sougei_w5.ttc


; KANDIDAAT (niet in patches/ gezet): zonder TeknoMacaw64.exe. Zie docs/research/losse/SilentScopeBoneEater.md.
; Vraagt de launcher-wijziging docs/research/losse/SilentScopeBoneEater.launcher.patch ([Loader] Exe = een drop-in als lader) en
; de drop-in docs/research/losse/SilentScopeBoneEater.dropin.ini naar patches/SilentScopeBoneEater/dropin/dropin.ini
; (de gebouwde rg-macaw.exe en libacio.dll staan al in die map; zonder dropin.ini zijn ze inert).
[Loader]
Exe = rg-macaw.exe

[Display]
Gamescope = true

[Input]
Route = tp-shm
Layout = KonamiAcio

; Bediening voor de knoppen-uitleg bij de eerste start (docs/per-game-patches.md, "Bediening per game"); labels uit het
; TeknoParrot-profiel (GameProfiles/<P>.xml), "Not confirmed yet" = de werking is nog niet gemeten.
[Controls]
trigger = Gun button | The gun button of the rifle.
grenade = Scope | Zooms the scope in and out.
aux1 = Side button | The side button of the rifle. Used by the game; exact function not confirmed yet.

[Status]
Status = untested
Note = Start via dubbelklik (2026-10-17): TeknoMacaw64 met DXVK in gamescope, regio Asia: WARNING-scherm in het Engels, daarna de attract (ranglijst, FREE PLAY). Het beeld is staand (de kast heeft een staand scherm), midden in 16:9. Nodig: DXVK (met wined3d zwart) en ViewTtcAsTtf (Wine's GDI+ neemt geen .ttc aan). Invoer (KonamiAcio) nog niet gemeten. Speelproef 2026-10-17 (muismodus): START opent de moduskeuze (NORMAL START); of de trekker aankomt is nog niet zeker.
NoteEN = Starts by double-click (2026-10-17): TeknoMacaw64 with DXVK in gamescope, region Asia: English warning, then the attract (ranking, free play). Portrait picture centred in 16:9 (the cabinet has a portrait screen). Input not measured yet. Play test 2026-10-17 (mouse mode): start opens the mode select; whether the trigger arrives is not clear yet.

