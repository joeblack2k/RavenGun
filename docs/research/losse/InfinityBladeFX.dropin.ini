; Toe te voegen aan patches/InfinityBladeFX/dropin/dropin.ini op het moment dat de kandidaat-game.ini
; (docs/research/losse/InfinityBladeFX.game.ini) de meegeleverde vervangt. rg-kaboom.dll staat al (inert, zonder sectie) in
; patches/InfinityBladeFX/dropin/ en wordt gebouwd met tools/rg-kaboom/build.sh.
;
; SwordGame.exe praat met \\.\COM9 (57600 baud, eigen pakketprotocol); de DLL legt de kernel32-ingangen van de hoofdmodule om en
; beantwoordt de pakketten zelf. De munt komt uit het gedeelde geheugen TeknoParrot_JvsState (indeling TimeCrisis5, bit 0x08 op
; offset 8). Preload = true: de OpenParrot-lader laadt hem na de kern (TP_PRELOAD_DLL), dus alleen met [Loader] Build = ravengun.
; Audit = false: een Windows-DLL hoort niet in LD_AUDIT. Het logboek komt in de map van de exe (de lokale view, nooit de NAS).
[rg-kaboom.dll]
To = .
Preload = true
Audit = false
Env = RG_KABOOM_PORT=9;RG_KABOOM_LOG=rg-kaboom.log
