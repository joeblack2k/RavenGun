; Voorbereid in pass 1 (docs/goal-90-native.md): profiel uit het TeknoParrot-sjabloon, herkenning gemeten aan de NAS-map "Pull The Trigger"
; (alleen gelezen), invoerroute gekozen naar het EmulationProfile. Niet gestart.

[Game]
Name = Pull The Trigger
Profile = PullTheTrigger
Executable = PTW.exe
Type = TeknoParrot
EmulationProfile = RawThrillsGUN
ProfileRevision = 5
Patreon = true

[Launch]
Mode = direct

; KANDIDAAT zonder TeknoParrot (docs/research/losse/PullTheTrigger.md). Wat dit anders doet dan de meegeleverde game.ini:
;  - [Loader] Core = none: Wine start PTW.exe zelf; geen OpenParrotLoader en geen TeknoParrot.dll.
;  - de drop-in WkWin32.dll (patches/PullTheTrigger/candidate/dropin/, regels in PullTheTrigger.dropin.ini) is de WibuKey-doos:
;    de stub in PTW.exe krijgt de platte importtabel terug (tools/rg-ptt, zelf uit het spelbestand opgebouwd, geen sleutel nodig).
;  - de drop-in wsc32.dll (tools/rg-ptt/rg_ptt_wsc32.c) is de seriele laag: poort 0 (geheugenkaartlezer, leeg) en poort 1 (geweerbord:
;    aim, trekker, herladen uit het gedeelde geheugen, tp-shm RawThrillsGUN). Geen COM-poort nodig. correctionV2.txt (drop-in) is de
;    kalibratie die daarbij hoort. Logboek: rg-wsc32.log naast PTW.exe (laadbewijs per onderdeel).

[Wine]
Prefix = ravengun-test-dxvk
Runner = wrapper

[Loader]
Core = none

[Display]
Gamescope = true
GamescopePath = /usr/bin/gamescope

[Input]
Route = tp-shm
Layout = RawThrillsGUN
Note = tp-shm, indeling RawThrillsGUN. Zonder kern leest onze wsc32.dll (drop-in) het gedeelde geheugen en speelt het geweerbord op de seriele poort na: aim (X-pakket), trekker (F), herladen (d). Munt en start zijn geen pakketten (zie PullTheTrigger.md, open punten)

; Bediening voor de knoppen-uitleg bij de eerste start (docs/per-game-patches.md, "Bediening per game"); labels uit het
; TeknoParrot-profiel (GameProfiles/<P>.xml), "Not confirmed yet" = de werking is nog niet gemeten.
[Controls]
trigger = Shoot | Fires the gun.
reload = Reload | Reloads your gun.

[Status]
Status = working
Note = WERKT (2026-10-15): dubbelklik in RavenGun, rg-direct zonder TeknoParrotUi. 5,5 min gespeeld in muismodus: munt (5), schieten om te starten, herladen (PULL BACK/RELEASE), hoofdstukken en bonuskeuze. Het vroegere zwarte beeld kwam niet terug.
NoteEN = WORKING (2026-10-15): double-click in RavenGun, rg-direct without TeknoParrotUi. Played 5.5 min in mouse mode: coin (5), shoot to start, reload (PULL BACK/RELEASE), chapters and bonus select. The earlier black screen did not come back.


