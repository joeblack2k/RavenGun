; KANDIDAAT-drop-in voor Silent Scope: Bone Eater zonder TeknoMacaw64.exe (naar patches/SilentScopeBoneEater/dropin/dropin.ini
; zetten als [Loader] Exe = rg-macaw.exe aan staat). Bron en bouw: tools/rg-macaw/ (build.sh), uitleg: SilentScopeBoneEater.md.
;
; LET OP: To is relatief aan de MAP VAN HET SPEL (modules/, waar arkndd.dll staat), niet aan de hoofdmap van de view. To = modules
; zet het bestand dus in modules/modules/ en het spel laadt dan stilletjes het ORIGINELE libacio.dll van de NAS (gemeten 2026-10-17: wit
; venster, "MiCmd: COM Port 1 Open Error"). Gebruik To = . voor beide bestanden.
;
; rg-macaw.exe  onze lader (avs_boot, ea3, dll_entry_init/main); komt in modules/, [Loader] Exe wijst ernaar (hij zet zijn eigen werkmap
;               op de map boven modules/ en schrijft daar rg-macaw.log).
; libacio.dll   vervanger van Konami's libacio.dll (bmpu/nddb/icca), leest tp-shm (KonamiAcio). Hij vervangt modules/libacio.dll
;               in de view; de NAS blijft ongemoeid.
; Controle: build/rg-direct --plan SilentScopeBoneEater: bij dropin_files staat per bestand de dest (.../modules/libacio.dll, NIET
; .../modules/modules/libacio.dll). In rg-macaw.log hoort "libacio.dll: ONZE vervanger geladen" te staan.

[rg-macaw.exe]
To = .

[libacio.dll]
To = .
; RG_ACIO_LOG: laadbewijs en de eerste statusblokken (relatief aan de hoofdmap van de view, waar rg-macaw zijn werkmap zet).
; RG_ACIO_SCOPE_L4 / RG_ACIO_NDDB_SCOPE: waar de scopeknop in de bytes komt (niet gemeten; zie het .md), zonder herbouwen te wisselen.
Env = RG_ACIO_LOG=rg-libacio.log
