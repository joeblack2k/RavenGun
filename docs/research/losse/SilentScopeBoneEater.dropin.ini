; KANDIDAAT-drop-in voor Silent Scope: Bone Eater zonder TeknoMacaw64.exe (naar patches/SilentScopeBoneEater/dropin/dropin.ini
; zetten als [Loader] Exe = rg-macaw.exe aan staat). Bron en bouw: tools/rg-macaw/ (build.sh), uitleg: SilentScopeBoneEater.md.
;
; rg-macaw.exe  onze lader (avs_boot, ea3, dll_entry_init/main); komt in de hoofdmap van de view, [Loader] Exe wijst ernaar.
; libacio.dll   vervanger van Konami's libacio.dll (bmpu/nddb/icca), leest tp-shm (KonamiAcio). Hij vervangt modules\libacio.dll
;               in de view; de NAS blijft ongemoeid.
; Controle: build/rg-direct --plan SilentScopeBoneEater: bij dropin_files staat per bestand de dest.

[rg-macaw.exe]
To = .

[libacio.dll]
To = modules
; RG_ACIO_LOG: laadbewijs en de eerste statusblokken (relatief aan de hoofdmap van de view, waar rg-macaw zijn werkmap zet).
; RG_ACIO_SCOPE_L4 / RG_ACIO_NDDB_SCOPE: waar de scopeknop in de bytes komt (niet gemeten; zie het .md), zonder herbouwen te wisselen.
Env = RG_ACIO_LOG=rg-libacio.log
