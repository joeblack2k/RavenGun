;
; rg-dinput8.ini voor Bug Busters (BBPC.exe, sha256 12c7b86b...). Naast dinput8.dll in de view (dropin.ini). Indeling:
; tools/rg-dinput8/rg_dinput8_kern.h. Alles hieronder is gelezen in BBPC.exe (docs/research/wartran/README.md, "Bug Busters").
;
; Bordbeeld (indeling WartranTroopers, packaging/tp-shm-profiles.json): bitveld op offset 8 -- 0 test, 1 service, 2 munt 1, 3 munt 2,
; per speler start/trekker/herladen op 6/7/8 en 11/12/13; richtpunt P1X/P1Y/P2X/P2Y op offset 12..15, links/boven = 0.

spelers = 2

; De game leest c_dfDIJoystick2: lX/lY absoluut, rgbButtons[0] = sproeien (0x411386), rgbButtons[1] = herladen (0x4113ba).
p1.x = 12
p1.y = 13
p1.knop0 = 7
p1.knop1 = 8
p2.x = 14
p2.y = 15
p2.knop0 = 12
p2.knop1 = 13

; De game zet DIPROP_RANGE -1000..1000 (0x41070e) maar rekent het beeld uit X -1000..100 en Y -800..1000 (0x410c51: x = (lX+1000) *
; 640 / 1100, y = (lY+800) * 480 / 1800). X <= -1000 of Y <= -800 is buiten beeld (0x4108e5); daarom begint het beeld een eenheid
; daarboven, en buiten beeld geeft precies -1000 / -800 (met de trekker buiten beeld zet de game 0x4638C8 en tekent hij iets extra's,
; 0x410cc4 / 0x4275fc; wat precies is niet gemeten).
as.x = -999 100
as.y = -799 1000
buiten.x = -1000
buiten.y = -800

; Het I/O-bord van de kast (een seriele regel per signaal, 0x43be99; in deze build wordt de seriele poort nooit geopend) zette deze
; dwords; de game zelf verwerkt ze elke beeldstap (0x40a872) en zet ze terug. Test: in het spel het testmenu, in het testmenu verder
; (0x49E870); service: in het testmenu kiezen (0x49732C); start speler 1/2 (0x49E880 / 0x49EA84, ook de knoppen van het testmenu).
vlag.0x49E870 = 0
vlag.0x49732C = 1
vlag.0x49E880 = 6
vlag.0x49EA84 = 11

; Munt: het bord telde elke munt op bij de credits (0x460C1C += 1, 0x43bfb2); munten per spel komen uit config\buster.cfg.
teller.0x460C1C = 2, 3

; Venstermodus: init van DirectDraw met vlag schermvullend = 1 (0x40a03e: push 1; call 0x401145) wordt 0: de eigen vensterroute van
; de game (DDSCL_NORMAL, geen ChangeDisplaySettings). Dat is wat Windowed = 1 onder TeknoParrot gaf (gamescope: beeld; 0: zwart).
patch.0x40A03F = 01 -> 00
; De controle op een cd-rom met volumelabel "BBPC" (0x409e30, lus in 0x409f32): jz -> jnz, precies de ene byte waarin
; BBPC_standalone.exe op de NAS van BBPC.exe verschilt (bestandsoffset 0x9F46).
patch.0x409F46 = 74 -> 75
