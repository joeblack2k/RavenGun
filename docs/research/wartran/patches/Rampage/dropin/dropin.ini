;
; dropin.ini - wat er in de view van Rampage komt (docs/dropins.md,
; docs/geen-dongle-in-de-loader.md).
;
; Onze eigen matrix64.dll beantwoordt de Matrix/SBK-dongle-controle van deze game en leest zijn eigen
; gegevens uit matrix/matrix.ini ernaast. De launcher kopieert bestanden en zet omgevingsvariabelen;
; hij weet niet wat een dongle is.
;
; CONTRACT (docs/dropins.md): dest = view + To + sectienaam. De sectienaam is het pad onder dropin/.
;
; To = Game_Data/Plugins, net als bij Rabbids Hollywood en Tomb Raider: dezelfde Unity-versie en
; dezelfde MatrixDLLCSharp-wrapper laden `matrix64.dll` daar vandaan (findings/Rampage.md: "de game
; laadt Game_Data/Plugins/matrix64.dll"). De game heeft het bestand ook in zijn hoofdmap staan; de
; aanroepen komen uit Game_Data/Plugins. De drop-in-motor maakt die map eerst lokaal als ze in de view
; een koppeling naar de NAS is, zodat er nooit naar de NAS geschreven wordt.
;
; De gegevensmap staat NAAST de bibliotheek (Game_Data/Plugins/matrix/): de bibliotheek zoekt
; `matrix.ini` in RAVENGUN_MATRIX_DIR en anders naast zichzelf.
;
; GEEN RAVENGUN_MATRIX_DLL: die variabele zet alleen de Matrix-patches van plugins/unity/src/rabbids/
; uit, en die plugin hoort bij Rabbids Hollywood. Deze game draait via de tp-shm-route en heeft geen
; Matrix-patch in de plugin.
;
; RAVENGUN_MATRIX_LOG=matrix.log laat de bibliotheek haar antwoorden opschrijven (in de werkmap van de
; game, dus in de view en nooit op de NAS). Dat is het bewijs dat ONZE dll is aangeroepen en niet het
; origineel.
;
; matrix64.dll komt uit matrix/out/ (scripts/build-matrix.sh): zelf gebouwd, geen kopie van een
; bestand van TeknoParrot. Deze game is 64-bits ([Game] Is64Bit = true) en importeert matrix64.dll;
; matrix32.dll hoort hier NIET -- een bestand zonder eigen sectie wordt niet uitgerold.
;
; LET OP: de drop-in-motor rolt een drop-in ALTIJD uit, niet alleen als er een dongle gekozen is
; (docs/geen-dongle-in-de-loader.md). Deze game is vandaag speelbaar zonder dongle; met deze drop-in
; krijgt hij er een. Dat is nog niet in het spel gemeten -- zie README.md.

[matrix64.dll]
To = Game_Data/Plugins
DllOverride = native
Env = RAVENGUN_MATRIX_DIR=matrix;RAVENGUN_MATRIX_GAME=Rampage;RAVENGUN_MATRIX_LOG=matrix.log

[matrix/matrix.ini]
To = Game_Data/Plugins

[ravengun-hasp/Rampage/dongle.json]
To = .

; Het I/O-bord (2026-10-17): onze eigen KaboomAdrioFxPlusFourFeeders64.dll (rg-adrio, tools/rg-adrio/, gebouwd met
; tools/dev/build-adrio.sh --out <deze map>) op de plaats van die van Adrenaline; de game laadt hem uit Game_Data/Plugins
; (P/Invoke "KaboomAdrioFxPlusFourFeeders64"). rg-adrio.ini ernaast zegt welke bit van het bordbeeld welke ingang van het bord is.
; RG_KABOOM_LOG schrijft het logboek van de DLL naast de DLL (Game_Data/Plugins/rg-adrio.log in de view, een lokale map, nooit de
; NAS): het bewijs dat ONZE DLL laadt, met de tabel die hij gebruikt.
[KaboomAdrioFxPlusFourFeeders64.dll]
To = Game_Data/Plugins
Env = RG_KABOOM_LOG=rg-adrio.log

[rg-adrio.ini]
To = Game_Data/Plugins
