;
; rg-kaboom.ini: welke bit van het bordbeeld van RavenGun (het 32-bits bitveld op offset 8, indeling WartranTroopers uit
; packaging/tp-shm-profiles.json) welke ingang van het Kaboom/Adrio-bord is. Naast de DLL in de view (patches/<Game>/dropin/,
; To = de map van KaboomAdrioFxPlusFourFeeders64.dll). Een bron is aan als een van zijn bits aan staat. Een naam die er niet staat
; is nooit aan. Een bestand met een fout wordt in zijn geheel afgekeurd: dan komt er GEEN invoer (het logboek zegt waarom).
;
; De tabel van Rampage; gelijk aan de ingebouwde standaard en aan tools/rg-kaboom/rg-kaboom.voorbeeld.ini (tests/kaboom_test.sh
; controleert die twee, en dat elke meegeleverde patches/*/dropin/rg-kaboom.ini geldig is).
;
; Bits van het bordbeeld: 0 test, 1 service, 2 munt 1, 3 munt 2, 4 menu omhoog, 5 menu omlaag, dan per speler vijf bits vanaf
; 6 / 11 / 16 / 21: start, trekker, herladen, granaat, aux1.
;
; Rampage (het WartranTroopers-profiel van de game): Test Menu = test, Test Select = service; P1 COINS = bit 5, P1 UP/DOWN/LEFT/RIGHT
; = bit 7..10, P1 ATTACK = bit 4; P2 COINS = bit 2, P2 UP/DOWN/LEFT/RIGHT = bit 12..15, P2 ATTACK = bit 22; P3 COINS = bit 3,
; P3 UP/DOWN/LEFT/RIGHT = bit 17..20, P3 ATTACK = bit 23. Het bedieningspaneel van het bord is ook de aanvalsknop:
; omlaag = aanval speler 1, kies = aanval speler 2, omhoog = aanval speler 3 (OnAdrioKeyboardEvent in de game). De game heeft geen
; startknop; de start van een speler (bit 6 / 11 / 16) telt als zijn aanval.

toets.enter = 0
toets.omlaag = 4, 6
toets.kies = 1, 22, 11
toets.omhoog = 23, 16

p1.omhoog = 7
p1.omlaag = 8
p1.links = 9
p1.rechts = 10
p2.omhoog = 12
p2.omlaag = 13
p2.links = 14
p2.rechts = 15
p3.omhoog = 17
p3.omlaag = 18
p3.links = 19
p3.rechts = 20

munt1 = 5
munt2 = 2
munt3 = 3
