; Voorgestelde [Controls]-secties per game (docs/per-game-patches.md, "Bediening per game"). Dit is een VOORSTEL: het hoort in
; patches/<Game>/game.ini (de patches-repo), niet in deze repo. Elk blok hieronder: kopieer de regels onder "[Controls]" naar het
; game.ini van die game. Formaat: <signaal> = Label | Uitleg. Signalen: trigger (T-knop, alleen uitleg), offscreen (buiten beeld
; richten, alleen uitleg), reload, grenade, aux1, aux2 (toewijsbaar: de gebruiker kiest een Move-knop), start, coin (niet gebruikt:
; Select/Start van de Move geven die al).
;
; Bron: de ButtonName-lijsten in de TeknoParrot-profielen (GameProfiles/<P>.xml, op de NAS) en de inventaris van de coordinator.
; Afwijkingen van die inventaris, gecontroleerd tegen de XML:
;  - De WartranTroopers-indeling (tp-shm-profiles.json) heeft per speler vier knoppen (trigger/reload/grenade/aux1), maar de games
;    gebruiken ze niet allemaal. Volgens de XML hebben Halo trigger+reload+grenade (geen aux1), WildWestShootout trigger+reload en
;    BugBusters trigger+reload; AfterDark, Coopers9, ElevatorActionInvasion en RaccoonRampage hebben alleen een trekker en
;    Gashaaaan/Gashaaaan2 alleen "Throw". Een knop vragen die de game niet gebruikt is verwarrend, dus die staan hier niet.
;  - Een game met alleen een trekker krijgt wel een [Controls] (trigger), maar controls_need_setup() is dan onwaar: niets om te kiezen.
;  - Lindbergh (HOTD4, 2Spicy, Primevil, Rambo, GSEVO): reload staat als toewijsbaar signaal EN als uitleg "offscreen" (buiten het beeld
;    richten herlaadt ook); de XML heeft bij alle vijf een eigen Reload.
;  - Niet opgenomen: PigsMightFly, de overgeslagen games, de niet-lightgun-games uit de opdracht (MarioKartDX, LGS, Rampage,
;    TankTankTank, GoGoStrike, SegaGameShell, 3DCosplayMahjong, TNXK0O~C, _template, AAA, InfinityBladeFX), TombRaider/RabbidsHollywood
;    (Unity-route, andere invoer) en de games zonder gemeten indeling (AliensArmageddon, WalkingDead, GhostBusters, MenInBlack).
; "Nog niet bevestigd" in een uitleg = het label komt uit de naam in het TeknoParrot-profiel, de werking is niet gemeten.

