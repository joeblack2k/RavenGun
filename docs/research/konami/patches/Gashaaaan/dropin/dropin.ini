;
; dropin.ini - wat er in de view van Gashaaaan!!!! komt (docs/dropins.md). Kandidaat zonder TeknoParrot,
; docs/research/konami/README.md.
;
; iob.dll en ballio.dll zijn onze eigen Konami-bibliotheken (tools/rg-konami/, gebouwd met tools/rg-konami/build.sh --gsh <deze
; map>): zelfde exports als die van Konami in bin/, invoer uit het bordbeeld TeknoParrot_JvsState van rg-jvsbridge. iob.dll: TEST,
; SERVICE, munten, START P1..P4, balautomaten zonder hardware. ballio.dll: een worp (trekker) van speler N wordt een balinslag op
; het richtpunt van speler N. Ze komen naast ballshooting.exe (bin/, de map van de exe) in plaats van de symlinks naar de NAS.
;
; RG_KONAMI_LOG=rg-konami.log: het logboek van beide DLL's naast de DLL (bin/rg-konami.log in de view, nooit op de NAS).

[iob.dll]
To = .
DllOverride = native
Env = RG_KONAMI_LOG=rg-konami.log

[ballio.dll]
To = .
DllOverride = native

; BALLS.INI (proef 11, 2026-10-17): het origineel zegt NVRAM_DIR F:\, RAW_DIR E:\ en ROMFILE D:\TYPE.BIN (system.dll zet ze met
; util.dll load_inifile in de omgeving; 0x10001e90 mount NVRAM_DIR als /dev/nvram en RAW_DIR als /dev/raw, soft_config.dll leest
; ROMFILE). De prefix heeft geen D:, E: of F:. Onder de kern van TeknoParrot schreef de game zijn NVRAM in bin\NVRAM (info.bin + 0..3)
; en maakte hij bin\RAW en bin\LOG aan: de kern leidde de schijfletters om. Wij geven dezelfde mappen als relatieve paden (werkmap =
; bin), zodat de NVRAM van de route met de kern blijft gelden. GEGOKT: dat AVS een relatief pad als bron van /dev/nvram aanneemt.
[BALLS.INI]
To = .
