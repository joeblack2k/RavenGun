[Launch]
; Zonder TeknoParrotUi (rg-direct). De films (.m1v via DirectShow) gaan via de 32-bits GStreamer uit Proton (docs/gst32.md);
; zonder crashte de game bij de eerste film (bench 2026-10-15: met Gst32 speelt de attract-film en start het spel).
Mode = direct
Gst32 = true
; Zonder kern (proef 11, 2026-10-17: "SYSTEM DATA1 CHECK ERROR 2-1005-0001"): de game werkt met vaste schijfpaden die de kern van
; TeknoParrot omleidde (docs/research/konami/README.md, "Proef 11"):
;   D:\D22\...  de installatiemap: films (D:\D22\DATA\movies\*.m1v), D:\D22\DATA\DATA.a en de bestandscontrole SYSTEM DATA1
;               (game.exe 0x536a90: CRC van D:\D22\{DATA\check.a, game.exe, iob.dll, gunio.dll, pmds.dll, msvcr71.dll} tegen
;               DATA\check.cc en DATA\check\*.cc in check.a; DATA2 = D:\D22\DATA\testmode.a);
;   F:\SAVE\ en E:\SAVE\  de twee kopieen van de .sav-bestanden (0x520020 schrijft, 0x5202d0 leest: eerst F:, dan E:), dus ook io.sav.
; D:, E: en F: worden de view (alleen voor deze run). D22 in de view bevat links naar de ORIGINELEN op de NAS (origineel:): de controle
; ziet Konami's iob.dll en gunio.dll, de game zelf laadt de onze uit zijn eigen map.
; Proef 13 (tv 2026-10-17 23:48): met D22/DATA als link naar de hele DATA-map 150 s zwart, geen enkele aanroep van iob.dll. Het
; enige wat D: daar veranderde: de films (D:\D22\DATA\movies\*.m1v, game.exe 0x523ea2) bestaan nu, en zonder D: (proef 11) sloeg de
; game ze over en kwam hij tot de opstartcontrole. Daarom nu ALLEEN de bestanden die SYSTEM DATA1/DATA2 lezen (check.a, check.cc,
; testmode.a) en GEEN movies: dezelfde toestand als proef 11 voor de films. D:\D22\DATA\DATA.a leest alleen ROM CHECK in het
; testmenu (tabel 0x64d938). Eerst de oude map weghalen (alleen links): rm -r <view>/D22 -- anders wordt de oude link D22/DATA
; bij het materialiseren een map met ALLE inhoud van DATA, ook movies.
; Proef 16 (2026-10-18 08:40-08:43, drie starts): alle drie in de hoofdlus en alle drie na ~10 s gestopt via de __except van de
; CRT-opstart (game.exe 0x54a501, terugkeeradres 54a513 in de afsluitregel): een crash, kort na SYSTEM DATA1. Zonder films crasht hij
; dus; het zwart van proef 13 (met films) was hetzelfde als de wisselende hang voor de hoofdlus van proef 14/15 (zonder films), niet
; de films. Daarom de films (en data.a voor ROM CHECK) weer erbij, als links IN de bestaande lokale map D22/DATA (geen rm nodig).
Drives = D=.; E=.; F=.
ViewLinks = D22/game.exe -> origineel:game.exe, D22/iob.dll -> origineel:iob.dll, D22/gunio.dll -> origineel:gunio.dll, D22/pmds.dll -> origineel:pmds.dll, D22/msvcr71.dll -> origineel:msvcr71.dll, D22/DATA/check.a -> origineel:DATA/check.a, D22/DATA/check.cc -> origineel:DATA/check.cc, D22/DATA/testmode.a -> origineel:DATA/testmode.a, D22/DATA/movies -> origineel:DATA/movies, D22/DATA/data.a -> origineel:DATA/data.a

[Loader]
; Zonder TeknoParrot (kandidaat 2026-10-17, docs/research/konami/README.md): geen lader en geen kern, Wine start game.exe zelf in
; zijn eigen map. De game praat met zijn I/O-bord en zijn geweerbord via Konami's iob.dll en gunio.dll (seriele poorten); de
; gesloten kern nam dat over. Nu doen onze eigen iob.dll en gunio.dll met dezelfde exports dat (tools/rg-konami/, dropin/): test,
; service, munt, start/trekker/option per speler en het richtpunt uit het bordbeeld. dropin/SAVE/io.sav is de geweerkalibratie die
; bij onze ruwe waarden hoort (de io.sav op de NAS heeft middelpunt 0 en schaal 192: daarmee is richten met echte ruwe waarden
; onmogelijk). [Status] hieronder is die van de route met de kern van TeknoParrot.
Core = none

; Proef 8 (tv 2026-10-17 18:14): zonder gamescope 90 s zwart beeld, geen enkele regel van onze DLL's (toen nog geen laadregel in
; DllMain, en de game kwam niet aan zijn I/O-code toe). Zelfde patroon als Rampage op deze route: zonder lader start Wine de game
; zelf en krijgt het exclusieve D3D-venster de voorgrond niet. Daarom nu in gamescope. De Japanse locale ([Env] LANG/LC_ALL voor
; UseLocaleEmulator) is weer weg: niet aangetoond nodig (alle bestandsnamen zijn ASCII) en een variabele minder.
[Display]
Gamescope = true

[Wine]
GStreamerPlugins = ~/.local/share/ravengun/tools/gst-extra/plugins

[Input]
Route = tp-shm
Layout = WartranTroopers
Note = tp-shm, indeling WartranTroopers; films via [Launch] Gst32

