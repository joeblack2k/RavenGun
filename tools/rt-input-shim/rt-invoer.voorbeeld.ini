# rt-invoer.ini -- de tabel van de invoerhulp (librg_rt_input.so) voor EEN game.
#
# De invoerhulp leest het bordbeeld van de daemon (64 bytes; een 32-bits bitveld met de schakelaars en knoppen, en een byte per
# as) en zet de waarden in het geheugen van de game, op de plek waar de game ze zelf leest. WAT waarheen gaat staat hier, niet in
# de hulp. Dit bestand hoort per game in de patchmap (patches/<Game>/rt-invoer.ini). De hulp vindt het via RG_RT_TABLE=<pad>, of
# als `rt-invoer.ini` naast de bibliotheek. Zonder tabel doet de hulp wat hij altijd deed (de ingebouwde standaard: precies de
# regels `build`, `tabel`, `beeld` en `schakelaar` hieronder).
#
# Een regel per ding: `soort sleutel=waarde ...`. Alles na # of ; is commentaar. Een tabel die niet klopt wordt in zijn geheel
# afgekeurd (met de reden op stderr) en dan komt er GEEN invoer: liever niets dan schrijven op een verkeerde plek.
#
# De indeling van het bordbeeld waar dit voorbeeld bij hoort (packaging/tp-shm-profiles.json, profiel WartranTroopers):
#   bitveld op offset 8:  bit 0 test, 1 service, 2 munt 1, 3 munt 2, 4 volume omhoog, 5 volume omlaag,
#                         en per speler vijf bits: start, trekker, herladen, granaat, aux
#                         (speler 1: 6..10, speler 2: 11..15, speler 3: 16..20, speler 4: 21..25)
#   assen op offset 12..19: p1.x, p1.y, p2.x, p2.y, p3.x, p3.y, p4.x, p4.y -- een byte per as, links en boven is 0;
#                         binnen het scherm 2..253, en 0, 1, 254 of 255 betekent dat de speler BUITEN beeld mikt.

# --- voor welke build deze tabel geldt: de bytes op dit adres moeten kloppen, anders doet de hulp niets -------------------
build       getter=0x61e890 signatuur=85ff0f88d0050000

# --- de schakelaartabel van de game: adres = basis + eerste + bord*per_bord + k*per_schakelaar ----------------------------
tabel       basis=0x180ae80 eerste=0xaea0 per_bord=0x2200 per_schakelaar=0x50
beeld       bits=8

# --- schakelaars: bit uit het beeld -> schakelaar k van een bord. puls = hoe lang de indruk staat, in ms -------------------
# k: 0 = start, 1 = volume omhoog, 2 = volume omlaag, 3 = service, 4 = diag (test), 5..8 = munt.
schakelaar  bit=6  bord=0 k=0 puls=300     # start speler 1
schakelaar  bit=11 bord=1 k=0 puls=300     # start speler 2
schakelaar  bit=16 bord=2 k=0 puls=300     # start speler 3
schakelaar  bit=21 bord=3 k=0 puls=300     # start speler 4
schakelaar  bit=0  bord=0 k=4 puls=300     # test -> diag, op elk bord
schakelaar  bit=0  bord=1 k=4 puls=300
schakelaar  bit=0  bord=2 k=4 puls=300
schakelaar  bit=0  bord=3 k=4 puls=300
schakelaar  bit=1  bord=0 k=3 puls=300     # service
schakelaar  bit=2  bord=0 k=5 puls=14      # munt 1: een indruk telt per beeld, dus kort
schakelaar  bit=3  bord=1 k=5 puls=14      # munt 2
schakelaar  bit=4  bord=0 k=1 puls=300     # volume omhoog
schakelaar  bit=5  bord=0 k=2 puls=300     # volume omlaag

# --- de geweerknoppen: NOG NIET INGEVULD -----------------------------------------------------------------------------------
# Waar de game de trekker, herladen, granaat en aux leest is nog niet vastgesteld. Er zijn twee vormen, en welke het is hangt
# van de game af:
#
#   1. een schakelaar in dezelfde tabel, met puls=0 (een knop: ingedrukt zolang de bit in het beeld staat):
#        schakelaar  bit=7  bord=0 k=9  puls=0     # trekker speler 1
#        schakelaar  bit=8  bord=0 k=10 puls=0     # herladen speler 1
#
#   2. een bit in een woord ergens in het geheugen van de game (de bit volgt het niveau; de andere bits blijven staan):
#        bit  bit=7 adres=0x0000000 breedte=4 doelbit=0     # trekker speler 1
#        bit  bit=8 adres=0x0000000 breedte=4 doelbit=1     # herladen speler 1   (inverteer=ja keert hem om)

# --- de assen: NOG NIET INGEVULD -------------------------------------------------------------------------------------------
# Een asbyte uit het beeld (bron = de offset, 12..19) -> een waarde op een adres in de game.
#   soort      u8, u16, u32, i32 of f32 (standaard u8)
#   min, max   het bereik in de game (standaard 0 en 255)
#   inverteer  ja of nee (standaard nee)
#   marge      binnen het scherm blijft de waarde tussen min+marge en max-marge (standaard 0)
#   bron_marge welke bytes in het beeld "buiten beeld" betekenen: < bron_marge of > 255-bron_marge (standaard 2)
# De rekenregel is die van de IO-brug (src/ravengun/iobridge/tp_shm.cpp): eerst afronden, dan inverteren, dan klemmen op de
# marge -- behalve als de speler buiten beeld mikt: dan blijft de uiterste waarde staan.
#
#        as  bron=12 adres=0x0000000 soort=u8 min=0 max=255 inverteer=nee marge=2     # speler 1, x
#        as  bron=13 adres=0x0000000 soort=u8 min=0 max=255 inverteer=nee marge=2     # speler 1, y

# --- Een game die zijn geweren in een eigen laag houdt (zie patches/Halo/LEZING-GEWEERLAAG.md) ---------------------------
# Een vaste waarde die de hulp vasthoudt, bv. "er is een geweer voor speler 1":
#zet     adres=0x1234500 breedte=4 waarde=1
# Een knop die de game als overgangsteller leest (een telling die omloopt; bit 0 = ingedrukt):
#teller  bit=7 adres=0x1234510 breedte=4 modulo=16
# Een as die de game als kommagetal leest: na de rekenregel maal schaal plus plus; buiten beeld een vaste waarde:
#as      bron=12 adres=0x1234520 soort=f32 marge=2 schaal=0.00392156862745098 plus=0 buiten=-1
