;
; rg-unis.ini: welke bit van het bordbeeld van RavenGun (het 32-bits bitveld op offset 8, indeling WartranTroopers uit
; packaging/tp-shm-profiles.json) welke ingang van het UNIS-bord is. Naast de DLL in de view (dropin.ini: To = ESGame/Plugins of
; RSGame/Plugins). Een bron is aan als een van zijn bits aan staat. Een sleutel die er niet staat houdt de ingebouwde standaard van de
; game (game = uit de naam van de exe). Een bestand met een fout wordt in zijn geheel afgekeurd (het logboek zegt waarom).
;
; Bits van het bordbeeld: 0 test, 1 service, 2 munt 1, 3 munt 2, 4 menu omhoog (F4), 5 menu omlaag (F5), dan per speler vijf bits
; vanaf 6 / 11 / 16 / 21: start, trekker, herladen, granaat, aux1.
;
; Namen: test service enter up down start1..start4 trig1..trig4 coin1..coin4
; Overig: game = eai|rr   usbio = 0..255   aim.mode = column|full   aim.out = BREEDTExHOOGTE
;
; Dit voorbeeld is precies de ingebouwde standaard van Raccoon Rampage (tests/unis_test.sh controleert alleen dat het geldig is).

game = rr
usbio = 1
test = 0
service = 1
enter = 4
trig1 = 7
trig2 = 12
trig3 = 17
trig4 = 22
coin1 = 6, 2
coin2 = 11, 3
coin3 = 16
coin4 = 21
aim.mode = full
aim.out = 1920x1080
